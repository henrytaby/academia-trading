— el sello de entrada (el CIERRE fuera del nivel): el documento fue verificado por la autoridad competente — la subasta completa de un período votó y decidió. Paso 3 — la puerta de embarque (el retesteo que se sostiene): hasta los pasajeros con sello pueden no subir; la puerta confirma que el vuelo REALMENTE despega con ellos dentro. El falso rompimiento es el pasajero con pasaporte falso bien hecho: pasa el primer filtro con apariencia impecable y cae en el segundo o en el tercero. El retail entra en el paso 1 (\"¡ya rompió!\"); el programa exige los tres filtros — y por eso su lista de pasajeros es más corta, pero vuela.\n\n## Cómo se hace: el protocolo con números y un caso completo\n\n**Caso cerrado (EUR/USD, ilustrativo con mecánica real).** Resistencia marcada en zona 1,0850–1,0856 (dos reacciones previas, origen expansivo, H4). El precio sube desde 1,0790:\n\n- **Martes, vela H4 #1:** toca 1,0852 y cierra en 1,0845 → toque sin cierre fuera: **no hay nada que decidir todavía**. (El principiante compra el toque; el programa no.)\n- **Martes, vela H4 #2:** atraviesa y cierra en **1,0861** — 5 pips más allá del borde de zona, con cuerpo pleno: **paso 2 cumplido**. Ahora, y solo ahora, existe un estado de \"rotura por confirmar\".\n- **Miércoles–jueves:** el precio retrocede (throwback) hasta 1,0854, toca la zona rota desde arriba y cierra la vela de reacción en 1,0866 con mecha inferior sobre la zona: **paso 3 cumplido** — la resistencia rota se sostuvo como soporte.\n- **Entrada:** en el retesteo, ~1,0858 (cuando la reacción es visible). **SL estructural:** bajo el mínimo del retroceso y de la zona, 1,0844 (14 pips). **TP:** siguiente resistencia, 1,0902 (44 pips). R:B = 44/14 ≈ **3,1** — sobra al mínimo del programa (1:2). **Lote:** con riesgo 1 % de 2 000 $ = 20 $: $20/(14 \\times 10) = 0{,}14$ lotes (Paso 5 de la receta).\n\nCompara el \"antes\": quien compró el toque de 1,0852 el martes entró 6 pips mejor... con un SL por debajo del nivel obvio (1,0843 — dentro del depósito de stops), expuesto al throwback que tocó 1,0854 (¡lo habría sacado con el primer respiro!) y sin saber si la rotura era real. El protocolo te cuesta 6 pips de precio y te compra: cierre confirmado + retesteo sostenido + SL en estructura + R:B verificado. Ese intercambio es positivo por definición estadística.\n\n**Y el caso del falso, visto con el mismo protocolo:** vela que atraviesa 1,0852 y **cierra en 1,0848** (dentro de la zona) → paso 2 no cumplido → no hay rotura, no hay entrada, no hay decisión: el nivel sigue siendo resistencia y el falso acaba de filtrarte a ti. La disciplina del paso 2 es lo único que separa tu cuenta de esa trampa — sin saber NADA de análisis adicional.\n\n## Error común\n\nEl primero: **anticipar el paso 2** — comprar la rotura intra-vela \"para no perder el tren\". Es la apuesta más popular del retail y su matrícula: sin cierre, la rotura es una hipótesis en curso de subasta; el tren que se pierde por esperar el cierre suele volver al andén (retesteo) — y el que no vuelve, no era tu setup (el mercado \"sin retroceso\" se persigue cero veces en formación). El segundo: **cerrar el paso 3 por impaciencia** — la confirmación no tiene plazo fijo, pero tampoco es eterna: si tras el cierre fuera el precio NO retestea y se aleja más de ~1R del nivel, la ventana del setup cerró (el retesteo lejano ya no es retesteo, es otro nivel). El tercero: **el espejo vicioso** — usar el protocolo para justificar entradas en cualquier lado (\"si cierro fuera ya está\"): el protocolo opera SOLO sobre zonas con calidad del gradiente de la Lección 3.3 (frescas, pocos toques, origen expansivo, H4/D1). Confirmación sobre zona basura es confirmación de ruido.\n\n## Conexión cuantitativa\n\nEl protocolo ataca tu $P_w$ por la puerta más barata del programa. Cada filtro elimina una familia de fallos con costo conocido: el paso 2 elimina las barridas intra-vela (M2.3), el paso 3 elimina las roturas sin seguimiento. El trade-off es matemático y favorable: pierdes pips de entrada (un costo pequeño y fijo) y ganas probabilidad (multiplicativa sobre cada operación futura). Además ordena tus términos: SL en la estructura del retesteo (no en el nivel obvio), TP en la zona siguiente (no en \"un número\"), y el R:B se calcula con datos — como en el caso: 3,1 con lote 0,14 y riesgo 20 $. En M5, este protocolo será la base de lectura de la estructura (BOS: ruptura de estructura confirmada); en M9, cada operación de tu journal llevará el campo \"¿entré con protocolo de 3 pasos?\" — porque será una de las variables con mayor correlación con tus rachas de error. El falso rompimiento, por su parte, pasará de pesadilla a instrumento: pero primero, deja que te filtre.\n\n---\n\n## 🎯 Puntos clave\n\n1. Protocolo: **ruptura → cierre fuera del nivel → confirmación por retesteo que se sostiene**. Tres filtros, ninguna excepción.\n2. El toque intra-vela no decide nada: puede ser una barrida (M2.3). El **cierre** es el acuerdo de la subasta completa.\n3. **Polaridad:** el nivel roto y confirmado cambia de bando (resistencia→soporte y viceversa) — por eso el retesteo es la entrada con mejor estadística.\n4. El retorno tiene nombre (pullback/throwback) y función (digestión + llenado institucional); la expansión sin retesteo no se persigue.\n5. El **falso rompimiento** es mecanismo de recolección, no mala suerte: no sobrevive a los pasos 2–3, y más adelante será setup del lado contrario.\n6. El protocolo opera solo sobre zonas de calidad (Lección 3.3): confirmación sobre zona basura = ruido confirmado.\n\n## 🔄 Autoevaluación rápida\n\n1. La vela H4 atraviesa tu resistencia (zona 1,0850–1,0856), toca 1,0858 y cierra en 1,0852. ¿Qué paso del protocolo se cumplió y cuál falta? ¿Qué HACES exactamente?\n2. ¿Por qué el retesteo da entradas con mejor estadística que la rotura directa? Explica con polaridad y con quién está comprando/vendiendo en cada caso.\n3. El precio cierra fuera de tu nivel, pero en las siguientes 6 velas H4 se aleja 60 pips sin volver. ¿Qué paso no llegó y qué decide el protocolo? ¿Qué NUNCA haces en formación?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Paso 1 cumplido (ruptura intra-vela hasta 1,0858). Paso 2 NO: el cierre en 1,0852 quedó DENTRO de la zona (1,0850–1,0856) — la vela no cerró decididamente más allá del nivel. Acción correcta: **nada** — no hay rotura, no hay entrada; el nivel sigue siendo resistencia y observas la siguiente vela. Este patrón exacto es el candidato a falso rompimiento (barrida + cierre dentro): tu protocolo acaba de filtrarte.\n2. En la rotura directa compras contra los vendedores que aún defienden el nivel, sin saber si el cierre sobrevivirá (tu probabilidad incluye a todos los falsos). En el retesteo post-confirmación: (a) el cierre fuera ya ocurrió — el filtro 2 está descontado; (b) por polaridad, en la zona rota hay compradores nuevos (los que esperaban el retesteo) y cubrimiento de vendedores atrapados: el bando a tu favor está documentado por el propio mercado; (c) tu SL va tras la estructura del retesteo (menos expuesto a barridas que el nivel obvio original). Pagas pips de precio y cobras probabilidad: intercambio positivo por definición.\n3. No llegó el paso 3 (confirmación) — y con 60 pips de alejamiento (~4R desde el nivel en el ejemplo de la lección), la ventana del retesteo cerró: lo que vuelve ahora ya no es retesteo, es otra zona. Decisión del protocolo: **setup no ejecutado** — se anota en el journal como \"oportunidad válida no capturada\" y se espera el siguiente nivel; se acepta como costo estructural del filtro. Nunca se persigue la expansión pura (\"entrar ahora porque ya subió\"): sin paso 3 no hay entrada del programa — perseguir es pagar el peor precio sin ninguno de los filtros que justifican el riesgo.\n\n</details>\n"},{"i":24,"g":"🧱 M3 · Anatomía del Gráfico","t":"3.5 · Patrones elementales","f":"docs/02-modulos/mod-03-anatomia-del-grafico/leccion-3-5.md","md":"# Lección 3.5 · Patrones elementales\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 45–60 min de estudio |\n| 🧱 Módulo | [M3 · Anatomía del Gráfico](README.md) |\n| ⬅️ Anterior | [Lección 3.4 · Confirmación en 3 pasos](leccion-3-4.md) |\n| ➡️ Siguiente | [Lección 3.6 · Rangos vs tendencias](leccion-3-6.md) |\n\n---\n\n## Por qué importa\n\nLos patrones de velas y de figura son la parte más famosa del análisis técnico — y también la más maltratada: el retail los usa como oráculos (\"doble techo = cae seguro\") sin contexto ni estadística. Este módulo te los da en su versión honesta: **no son señales independientes, son la firma visual de los procesos que ya estudiaste** — el agotamiento de urgencia, la distribución, la digestión de una rotura. Esta lección arma tu catálogo de bolsillo: qué patrones existen, qué proceso describen, dónde SÍ valen (contexto + zona + marco) y con qué fiabilidad honesta hay que tratarlos. El aporte propio del programa aquí es el **catálogo con fiabilidad evidenciada**: cada patrón con su etiqueta de confiabilidad, porque operar patrones \"porque lo dice el libro\" es exactamente el tipo de fe sin estadística que este programa existe para eliminar.\n\n## Concepto\n\n**Los patrones son lenguaje, no oráculo.** Cada uno narra un estado de la subasta (M2) en un momento del ciclo (M3.2). Se organizan en dos familias:\n\n**Familia 1 — patrones de vela (1–3 velas): la huella fina de la urgencia.**\n\n| Patrón | Qué se ve | Qué proceso narra | Fiabilidad honesta |\n|---|---|---|---|\n| **Envolvente** (*engulfing*) | Una vela envuelve por completo el cuerpo de la anterior en sentido contrario | Reemplazo total del bando: la urgencia nueva devoró la vieja | Media-alta EN zona, baja en el vacío |\n| **Martillo** (*hammer*) | Mecha inferior larga (≥ 2× cuerpo), cuerpo arriba | La venta fue a buscar liquidez abajo y fue absorbida (barrida fallida, M2.3) | Media en demanda; alta con confirmación de cierre siguiente |\n| **Estrella fugaz** (*shooting star*) | El espejo del martillo arriba | Compra rechazada en el extremo: distribución intradía | Media en resistencia |\n| **Doji** | Apertura ≈ cierre, cuerpo casi nulo | Empate de la subasta: el veredicto se posterga | Señal de *pausa*, nunca de dirección |\n\nRegla transversal: **ningún patrón de vela se opera sin contexto** (zona del gradiente de M3.3 + marco D1/H4 + régimen). El mismo martillo es material de entrada en demanda fresca y ruido de madrugada.\n\n**Familia 2 — patrones de figura (decenas de velas): la forma del ciclo.**\n\n| Patrón | Qué se ve | Qué proceso narra | Contexto de validez |\n|---|---|---|---|\n| **Doble techo/suelo** (*double top/bottom*) | Dos intentos fallidos en la misma zona con un valle/cima intermedio | Distribución/acumulación en la zona: la oferta/demanda consumió dos asaltos | Fuerte cuando el segundo techo NO supera el primero y la rotura del cuello (valle intermedio) se confirma en cierre |\n| **Triángulo** (*triangle*) | Mínimos ascendentes contra máximos planos (ascendente), o convergencia simétrica | Compresión: un bando compra cada excursión abajo antes que antes | Ruptura esperable pero dirección no garantizada; el simétrico se opera SOLO con confirmación (M3.4) |\n| **Cuña** (*wedge*) | Impulso que pierde amplitud (máximos ascendentes cada vez más suaves) | La urgencia se agota a medida que sube: el motor pierde combustible | Clásico de fin de markup; el colapso suele venir tras la rotura de la diagonal interna |\n| **Rango/bandera** (*range/flag*) | Consolidación post-impulso | Digestión de la expansión antes de la siguiente pierna | El contexto de mayor fiabilidad del catálogo cuando el impulso previo es sano |\n\n**La fiabilidad honesta — el número que nadie te da.** Las estadísticas publicadas de patrones varían enormemente con el período, el marco y la definición; cualquier cifra universal es sospechosa. El programa adopta la regla del catálogo propio: **los patrones se juzgan por (1) el proceso que narran encajando con el ciclo actual, (2) su ubicación en zona de calidad, (3) la confirmación del protocolo M3.4** — y su fiabilidad REAL se mide en TU journal (M9), no en el libro. Como referencia formativa *(snapshot de la literatura técnica, no garantía)*: los patrones de continuación bien ubicados rinden mejor que los de reversión aislados, y todos rinden mejor con confirmación que sin ella. El dato duro del programa: **sin confirmación de cierre, la mayoría de las roturas de figura falla en el primer intento** — por eso el catálogo entero se opera con el protocolo de 3 pasos, sin excepción.\n\n## Analogía\n\nLos patrones son el **lenguaje corporal del mercado**. Los de vela son gestos: un martillo en demanda es el jugador que tropieza feo y se levanta inmediatamente — la caída no lo quebró; un doji es el empate a gritos en la subasta. Los de figura son posturas sostenidas: el doble techo es el boxeador que ataca dos veces el mismo punto y las dos veces es devuelto — dos asaltos consumidos en la misma zona; el triángulo es la respiración contenida antes del sprint; la cuña es el corredor cuyas zancadas se acortan — el cansancio se ve antes de la caída. Y como en el lenguaje corporal: un gesto aislado miente tanto como habla (\"cruzó los brazos\": ¿aburrimiento, frío, defensa?); solo la frase completa — gesto + lugar + momento — comunica algo operable. El chartista que opera patrones sin contexto es quien toma un estornudo por un resfriado.\n\n## Cómo se hace: auditar un patrón con el checklist de 5 preguntas, con caso cerrado\n\nAntes de considerar operable CUALQUIER patrón, cinco preguntas en orden:\n\n1. **¿Qué proceso narra y encaja con el ciclo actual?** (un doble techo en fin de markup: encaja; el mismo en mitad de un markup joven: probablemente es solo pausa).\n2. **¿Está EN una zona de calidad?** (M3.3: fresca, pocos toques, origen expansivo, H4/D1).\n3. **¿El marco es el de tu análisis?** (el patrón de M15 no existe para tu operativa H4/D1).\n4. **¿El volumen/energía acompaña?** (expansión con energía en la dirección del patrón; rotura con velas de cuerpo pleno).\n5. **¿El protocolo de 3 pasos se cumple en la rotura que el patrón propone?** (cierre fuera + retesteo sostenido).\n\n**Caso cerrado (US30, ilustrativo).** Impulso alcista de 3 semanas (markup sano, HH/HL). En las últimas dos semanas el índice toca 44 200, retrocede a 43 950, vuelve a 44 180 (no supera el primer techo) y cae hacia 44 050 — el \"cuello\" de la figura. Checklist: (1) doble techo narrando distribución → encaja con fin de markup (la amplitud de los impulsos venía acortándose: síntoma de cuña interna); (2) los techos están en zona de resistencia semanal 44 150–44 250, fresca, 2 toques; (3) marco H4 ✓; (4) los rebotes a los techos con velas de cuerpo decreciente (urgencia compradora decayendo) y la caída del cuello con cuerpo pleno; (5) rotura del cuello 44 050 → cierre H4 en 43 980 → retesteo a 44 040 que se sostiene → entrada 44 030, SL sobre el segundo techo 44 240 (210 puntos), TP siguiente soporte 43 380 (650 puntos): R:B ≈ 3,1. Lote: con riesgo 1 % de 2 000 $ = 20 $ y 1 $/punto por contrato *(especificación del bróker — verifícala siempre, Lección 2.5)*: $20/210 \\approx 0{,}09$ contratos.\n\nNota del caso: el patrón NUNCA fue la señal por sí solo — fueron el ciclo (fin de markup), la zona (resistencia semanal) y el protocolo (cierre + retesteo) los que lo convirtieron en setup. El doble techo fue la etiqueta de la frase completa, no la frase.\n\n## Error común\n\nEl primero y más caro: **operar la etiqueta sin el proceso** — \"doble techo = vendo\" al primer techo, sin zona ni protocolo: es vender resistencia en un markup sano, exactamente el error de ciclo de la Lección 3.2. El segundo: **patrones en micro-marco** — buscar cuñas y banderas en M5 porque \"hay más oportunidades\": más oportunidades de pagar el impuesto del ruido (Lección 1.4); el catálogo de esta lección existe en tu marco H4/D1 y punto. El tercero: **las cifras de fiabilidad de catálogo como verdad** — \"este patrón acierta 80 %\": los números publicados son *(snapshot)* de otros períodos y definiciones; tu fiabilidad real se construye en TU journal con N ≥ 100. El catálogo del programa te da el vocabulario y el filtro; la estadística la fabricas tú.\n\n## Conexión cuantitativa\n\nUn patrón, operado con contexto y protocolo, no cambia tu fórmula — cambia sus entradas: $P_w$ (patrones en zona fresca + confirmación filtran los falsos arranques que destruyen el WR), $W$ (los patrones de figura con objetivo en la proyección de la figura dan $W$ medible, no estimado a ojo) y $L$ (el SL va tras la estructura del patrón: sobre el segundo techo, bajo el suelo de la bandera — estructura, no número redondo). El check que ataría todo: antes de operar cualquier patrón, escribe las tres cifras (R:B del caso, lote resultante, y en qué zona está) — si no puedes escribirlas, el patrón es una ilusión decorativa. En M5 (estructura institucional), el catálogo de esta lección quedará como subconjunto: los mismos procesos con nombres de liquidez (barridas, BOS, CHoCH) — primero aprendiste a verlos como figuras; pronto los leerás como intenciones.\n\n---\n\n## 🎯 Puntos clave\n\n1. Los patrones son la **firma visual de procesos** (agotamiento, distribución, digestión) — lenguaje con contexto, nunca oráculo aislado.\n2. Vela: envolvente, martillo, estrella, doji — narran urgencia y rechazo en 1–3 velas; solo valen EN zona y marco de análisis.\n3. Figura: doble techo/suelo, triángulo, cuña, rango/bandera — narran el ciclo; el de continuación bien ubicado rinde más que el de reversión aislado *(snapshot)*.\n4. Checklist de 5 preguntas antes de operar cualquier patrón: proceso↔ciclo, zona de calidad, marco correcto, energía acompaña, protocolo de 3 pasos en la rotura.\n5. Sin confirmación de cierre, la mayoría de las roturas de figura falla en el primer intento — el catálogo entero se opera con confirmación, sin excepciones.\n6. Las cifras de fiabilidad del libro son *(snapshot)*: tu fiabilidad real se mide en tu journal con N ≥ 100.\n\n## 🔄 Autoevaluación rápida\n\n1. Un doji aparece en medio de un rango H4, sin zonas cerca, a las 22:00 Bolivia. ¿Qué significa y qué se hace con él? Compara con el mismo doji sobre una resistencia semanal tras markup largo.\n2. ¿Por qué el doble techo solo se considera confirmado cuando rompe el \"cuello\" (el valle intermedio) con cierre fuera? ¿Qué podría ser si solo mira los dos techos?\n3. Tu colega asegura: \"la cuña bajista acierta el 85 % de las veces según el libro que leí\". Desmonta la cifra y dale el protocolo del programa.\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Doji en rango vacío, fuera de sesión líquida: empate de una subasta sin nada en juego alrededor — ruido con forma de señal: **se ignora**. El mismo doji sobre resistencia semanal tras markup largo (fin de markup posible, M3.2): narrativa real de agotamiento — pero tampoco se opera por sí solo: se convierte en vigilia (\"probable distribución en esta zona\") y se espera que el precio lo demuestre con la rotura del soporte cercano con cierre decidido (+ retesteo, M3.4). El patrón abre la hipótesis; el protocolo la confirma.\n2. Porque los dos techos sin rotura del cuello son solo \"dos intentos fallidos\": pueden ser pausa de markup, consolidación antes de continuar, o el segundo intento de una acumulación que luego rompe arriba. El cuello es la línea donde la oferta/demanda intermedia está decidiendo: su rotura con CIERRE fuera + retesteo sostenido (protocolo) es lo que demuestra que el bando vendedor tomó el control y lo sostiene — el proceso, no la etiqueta. Mirar solo los techos es apostar a la reversión sin confirmación: la estadística de las primeras roturas fallidas juega en contra.\n3. Desmontaje: (a) la cifra viene de una muestra, período y definición que no son los tuyos — es *(snapshot)* de otro contexto, no ley; (b) sin saber cómo contaron \"acierto\" (¿cierre fuera? ¿objetivo X pips? ¿con confirmación?), el número no es comparable con nada; (c) aunque el 85 % fuera real para SU muestra, tu $P_w$ depende de zona, marco y protocolo — los tuyos, no los del libro. Protocolo del programa: el patrón requiere checklist de 5 preguntas (ciclo, zona, marco, energía, confirmación), R:B ≥ 1:2 con SL estructural, y la fiabilidad se estima en TU journal con N ≥ 100 — el libro te da el vocabulario; la estadística es tuya.\n\n</details>\n"},{"i":25,"g":"🧱 M3 · Anatomía del Gráfico","t":"3.6 · Rangos vs tendencias","f":"docs/02-modulos/mod-03-anatomia-del-grafico/leccion-3-6.md","md":"# Lección 3.6 · Rangos vs tendencias\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 40–50 min de estudio |\n| 🧱 Módulo | [M3 · Anatomía del Gráfico](README.md) |\n| ⬅️ Anterior | [Lección 3.5 · Patrones elementales](leccion-3-5.md) |\n| ➡️ Siguiente | — (cierra el módulo; vuelve al [README](README.md) para laboratorio, misión y quiz) |\n\n---\n\n## Por qué importa\n\nCierra el módulo la lección que decide TODO lo anterior: antes de buscar setup, hay que saber en qué régimen está el mercado — porque los mismos movimientos que alimentan un sistema de tendencia matan a un sistema de rango, y al revés. La proporción aproximada duele: el mercado pasa la mayor parte del tiempo en rango *(aproximación, ~70 % en la literatura)* — es decir, la mayoría del tiempo, la respuesta correcta a \"¿qué opero?\" es \"nada todavía\". Y el asesino silencioso de cuentas de principiante tiene nombre: el **whipsaw** (el vaivén), la secuencia de falsas roturas de rango que cobra 1R a cada comprador de rompimiento hasta vaciarlos. Esta lección te enseña a clasificar el régimen ANTES de buscar setups, a sobrevivir al rango y a entender por qué \"hacer nada\" es la posición más rentable del catálogo.\n\n## Concepto\n\n**El régimen** (*market regime*) es el estado estructural del mercado en tu marco de análisis: **tendencia** (secuencia HH/HL o LL/LH sostenida — M3.2), **rango** (precio oscilando entre dos zonas sin progresión direccional) o **transición** (uno transformándose en el otro). No es decoración: es el permiso operativo. Cada sistema pertenece a un régimen:\n\n| | Sistema de continuación/tendencia | Sistema de rango/reversión |\n|---|---|---|\n| Hábitat | Markup/markdown con impulsos sanos | Rango estable con bordes respetados |\n| Alimenta su $P_w$ con | Expansión (desequilibrio, M2.2) | Equilibrio entre bandos |\n| Muere en | Rango (whipsaw en los bordes) | Expansión (la rotura real que no respeta el borde) |\n| Síntoma de que está fuera de hábitat | Serie de falsos arranques + retrocesos que se comen el impulso | Roturas de borde que NO vuelven |\n\n**Por qué el rango domina el tiempo.** El precio es una subasta que busca equilibrio (M2.2): la mayoría de las horas, ningún bando tiene urgencia dominante sostenida — el equilibrio es el estado natural y la expansión es el evento. De ahí la aproximación de la literatura (~70 % del tiempo en rango *(aproximación — varía por instrumento, marco y período)*): si tu sistema solo prospera en tendencia y no distingue el régimen, tu sistema está fuera de su clima ~7 de cada 10 unidades de tiempo.\n\n**El whipsaw, el asesino silencioso.** El rango maduro tiene bordes obvios (todo el mundo los ve — M2.3). El vaivén típico: rotura del borde → attract de compradores tardíos → giro → barrida de sus stops → retorno al interior → y de nuevo. Cada ciclo cobra: 1R a quien compró la rotura, 1R a quien compró el giro, otra vez a quien re-compró la siguiente rotura. El whipsaw no es mala suerte: es la forma del rango de recolectar a los impacientes. Tres defensas del programa: (1) **clasificar el régimen antes de buscar setups** — en rango, la rotura anticipada NO existe como setup; (2) **operar el interior del rango solo con reversión en bordes confirmados** (rechazo con vela de contexto en la zona, M3.3+M3.5) y nunca en el centro (el centro del rango no tiene borde: ahí el precio no \"reacciona\", camina); (3) **esperar la rotura madura** — cierre fuera + retesteo sostenido (M3.4) — aceptando que la mayoría de roturas primeras NO pasarán el filtro, y que eso es el filtro trabajando a tu favor.\n\n**Cómo clasificar el régimen en la práctica — el test de las 3 marcas:**\n\n1. **Estructura:** ¿los últimos swings H4/D1 hacen HH/HL (tendencia alcista), LL/LH (bajista) o solapan sin progresión (rango)?\n2. **Recorrido relativo:** ¿las últimas 3–5 expansiones rompen zonas con cierre y siguen (tendencia), o vuelven al interior del mismo corredor (rango)?\n3. **Velocidad y cuerpo:** ¿velas de cuerpo pleno en la dirección dominante con retrocesos finos (tendencia) o alternancia de cuerpos pequeños sin dirección clara (rango)?\n\nDos de tres señales iguales → régimen clasificado. Señales mezcladas → **transición** — el régimen más peligroso y el más honesto de nombrar: en transición, el protocolo del programa es reducir o eliminar la operativa (el Setup que nace en transición hereda la incertidumbre de ambos regímenes).\n\n**Visual — el clasificador de régimen, de las 3 marcas a la conducta:**\n\n```mermaid\nflowchart TD\n    S[\"🔎 Test de 3 marcas en tu marco H4/D1\"] --> M1[\"1 · ESTRUCTURA<br/>HH/HL · LL/LH · solapamiento\"]\n    M1 --> M2[\"2 · RECORRIDO RELATIVO<br/>las expansiones rompen zonas y siguen<br/>o vuelven al corredor\"]\n    M2 --> M3[\"3 · VELOCIDAD Y CUERPO<br/>cuerpos plenos con retrocesos finos<br/>o alternancia indecisa\"]\n    M3 --> T{\"¿2 de 3 marcas apuntan<br/>al mismo régimen?\"}\n    T -- \"Tendencia\" --> TEND[\"🚀 TENDENCIA<br/>continuación en retrocesos con confirmación<br/>cortos por estirado: PROHIBIDOS\"]\n    T -- \"Rango\" --> RAN[\"🎯 RANGO<br/>reversión solo en bordes con rechazo confirmado<br/>nada en el centro · roturas anticipadas: NO\"]\n    T -- \"Mezcladas\" --> TRA[\"⏸️ TRANSICIÓN<br/>operativa reducida o cero<br/>esperar a que el mercado decida\"]\n```\n\n## Analogía\n\nEl rango es un **trampolín con paredes elásticas** y la tendencia es la **puerta abierta**. En el rango, el precio rebota entre dos paredes que todo el mundo ve: cada rebote deja a una camada de compradores de la rotura atrapada en el borde, y la pared — como toda zona muy visitada (M3.3) — se gasta un poco más con cada choque. El whipsaw es la sucesión de rebotes falsos justo antes de que la pared ceda: los últimos que compran \"la rotura\" compran el peor precio de todo el ciclo. La tendencia es lo contrario: la pared rompió y el precio camina — ahí los retrocesos son andenes para subir, no paredes. El arte del clasificador: saber si estás en la sala con paredes elásticas (reversión en bordes, nada de roturas anticipadas) o en la puerta abierta (continuación en retrocesos). Y la transición es el momento en que la pared tiembla: puede ceder o aguantar — el profesional deja de apostar hasta que la física del cuarto se decide.\n\n## Cómo se hace: el régimen en tu análisis diario, con caso cerrado\n\nEl Paso 3 de tu [receta de primera operación](../../03-recursos/laboratorio/receta-primera-operacion.md) — \"¿tendencia o rango?\" — ahora tiene método completo:\n\n**Caso A — rango (EUR/USD, ilustrativo):** H4 muestra 8 sesiones entre 1,0820 y 1,0870: swings que solapan, expansiones que vuelven, cuerpos alternados. Test de 3 marcas: estructura sin progresión ✓, recorridos que vuelven ✓, cuerpos indecisos ✓ → **rango confirmado**. Reglas del día: bordes 1,0820/1,0870 operables SOLO con rechazo confirmado en zona (vela de contexto + M3.4 para la salida si se rompe); centro del rango (1,0840–1,0850): tierra de nadie — no hay setups ahí porque no hay bordes cerca; roturas anticipadas: prohibidas. Si el borde rompe con cierre H4 fuera → suspende la lógica de rango y abre el protocolo de rotura (M3.4): el régimen puede estar cambiando.\n\n**Caso B — tendencia (XAU/USD, ilustrativo):** H4 acumula HH/HL limpios desde 3 940: cada retroceso respeta el mínimo anterior y retoma. Test: estructura ascendente ✓, expansiones que rompen zonas y siguen ✓, cuerpos plenos con retrocesos finos ✓ → **tendencia alcista confirmada**. Reglas del día: buscar largos en retrocesos a demanda con protocolo de confirmación; cortos \"porque está estirado\": prohibidos (Lección 3.2 — la duración no es argumento); la invalidación del sesgo: la ruptura de estructura (precio hace LL bajo el último HL con cierre decidido).\n\n**Caso C — transición (ambos, ilustrativo):** el rango de 1,0820–1,0870 rompe arriba con cierre en 1,0881, PERO el retesteo no llega y al día siguiente el precio vuelve a 1,0865 con vela de cuerpo grande bajista. Marcas mezcladas: la estructura empezó a romper (alcista) pero el comportamiento del retorno es de rango (bajista) → **transición**: el protocolo dice operativa reducida o cero, y esperar que el mercado decida (nueva rotura con confirmación, o rechazo que restaura el rango). El costo de esperar: cero. El costo de no esperar: 1R por intento, repetido.\n\n## Error común\n\nEl primero: **buscar setups primero y el régimen después** — el orden de la receta existe porque el régimen es el permiso: operar rupturas en rango y reversión en tendencia es ejecutar el sistema correcto en el clima equivocado, la forma más frecuente de \"un buen sistema que no funciona\". El segundo: **el sesgo de tendencia** — la creencia de que \"siempre hay una tendencia por capturar\" y que no operar en rango es perder tiempo: con ~70 % del tiempo en rango *(aproximación)*, el que fuerza tendencia opera mayoritariamente fuera de su hábitat; el que respeta el rango convierte el 70 % del tiempo en observación barata y el 30 % en operativa con clima a favor. El tercero: **el whipsaw como demanda de \"mejores señales\"** — tras 3 falsas roturas, la respuesta del principiante es buscar el indicador que \"filtre mejor\"; la respuesta del programa es clasificar el régimen y respetar el protocolo: el problema no era la señal, era el clima.\n\n## Conexión cuantitativa\n\nEl régimen es el multiplicador invisible de tu ecuación: no aparece en $E = (P_w \\times W) - (P_l \\times L)$ pero decide cuánto vale cada término. Operar tu sistema fuera de hábitat reduce $P_w$ sin que ningún parámetro técnico cambie — y lo hace en rachas (el rango cobra por corrida, no por trade), que es exactamente el patrón que en el M9 hará parecer \"que el sistema se rompió\" cuando lo que pasó es que el clima cambió. Por eso la misión de este módulo (bitácora de 20 niveles) exige anotar el régimen de cada nivel, y por eso en M9 tu journal llevará el campo \"régimen al entrar\": separar tu estadística por régimen es la auditoría que distingue \"sistema malo\" de \"sistema bueno en mal clima\" — la diferencia entre tirar un sistema funcional y ajustar su calendario de uso. El régimen es, en resumen, la variable que convierte tu técnica en negocio: la técnica elige el setup; el régimen decide si ese setup tiene derecho a existir hoy.\n\n---\n\n## 🎯 Puntos clave\n\n1. Tres regímenes: **tendencia, rango, transición** — clasificar ANTES de buscar setups (el permiso operativo).\n2. El rango domina el tiempo (~70 % *(aproximación)*): la mayoría del tiempo la respuesta correcta es observar; forzar tendencia es operar fuera de hábitat.\n3. El **whipsaw** es el mecanismo de cobro del rango: falsas roturas + barridas de bordes obvios — no es mala suerte, es diseño de recolección (M2.3).\n4. En rango: reversión solo en bordes con rechazo confirmado; nada en el centro; roturas anticipadas prohibidas. En tendencia: continuación en retrocesos con protocolo; cortos \"por estirado\" prohibidos.\n5. Test de 3 marcas (estructura, recorrido relativo, velocidad/cuerpo): 2 de 3 clasifican; mezcladas = **transición** → operativa reducida o cero.\n6. Cada sistema tiene hábitat: tu $P_w$ vive en el régimen correcto y muere fuera — el journal (M9) auditará tu estadística POR régimen.\n\n## 🔄 Autoevaluación rápida\n\n1. EUR/USD H4: 3 roturas del borde superior de un rango en 10 días, todas devueltas al interior. ¿Qué fenómeno es, a quién está cobrando y cuál es tu conducta con la cuarta rotura?\n2. Aplica el test de 3 marcas a: \"XAU/USD hace HH/HL desde hace 12 sesiones, las últimas 3 expansiones rompieron zonas con cierre y siguieron, cuerpos plenos al alza con retrocesos finos\". ¿Clasificación y reglas del día?\n3. ¿Por qué \"no operar en rango\" no es perder tiempo sino la posición con mejor esperanza del catálogo, dado el ~70 % *(aproximación)*?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Es el **whipsaw**: el rango maduro cobrando a los compradores de cada rotura (atracción de tardíos + barrida de sus stops + retorno). Conducta con la cuarta rotura: la trata con MÁS escepticismo, no menos — roturas anticipadas prohibidas; solo interesa si cumple el protocolo completo (cierre H4 decidido fuera + retesteo que se sostiene, M3.4), porque tras dos fallas el borde está más consumido y la probabilidad de la rotura real aumenta, pero SOLO se opera con el filtro completo — y el falso confirmado (vuelta decidida al interior) es en sí el rechazo de borde operable del lado contrario.\n2. Estructura: HH/HL sostenidos → tendencia ✓. Recorrido: expansiones que rompen zonas con cierre y continúan → tendencia ✓. Velocidad/cuerpo: cuerpos plenos con retrocesos finos → tendencia ✓. Clasificación: **tendencia alcista** (3/3). Reglas del día: largos en retrocesos a demanda con confirmación; invalidación del sesgo = ruptura de estructura (LL bajo el último HL con cierre decidido); cortos \"porque está estirado\" prohibidos — la duración no es argumento (M3.2).\n3. Porque en rango tu sistema de tendencia está fuera de hábitat: su $P_w$ cae (falsas roturas) y el cobro llega en rachas (whipsaw) — operar ahí es comprar varianza sin esperanza. Con ~70 % del tiempo en rango *(aproximación)*, la \"no posición\" del rango es la que preserva el capital y la estadística para el ~30 % con clima a favor: esperanza de la cartera = Σ(E por régimen × frecuencia) — y el término negativo de operar en rango se elimina gratis, sin tocar el sistema. Además cada día de observación documentada (misión) suma el reconocimiento de régimen que sostendrá todo el programa.\n\n</details>\n"},{"i":26,"g":"🧱 M4 · Plataforma y Primera Ejecución","t":"M4 · Hub del módulo","f":"docs/02-modulos/mod-04-plataforma-y-primera-ejecucion/README.md","md":"# Módulo 4 · Plataforma y Primera Ejecución\n\n> [!WARNING]\n> **Contenido educativo.** La mayoría de los traders minoristas pierde dinero (estudios de reguladores estiman entre 70 % y 90 %). Nada en este repositorio constituye asesoría financiera.\n\n| Campo | Detalle |\n|---|---|\n| 🧱 Nivel | 1 · Fundamentos |\n| 📦 Módulo | 4 de 12 (FIT-12) |\n| 🔬 Trazabilidad | 003 · M1.6, M4.3–4.4 · 004 · M5.1–5.5 · **Aporte propio:** protocolo de demo ordenado y el stop como ley desde el día uno |\n| ⏱️ Duración estimada | 4,5 h de teoría + 5–7 h de laboratorio/misión/quiz |\n| 📋 Estado | 🟢 Publicado (Sprint 4) |\n\n---\n\n## 🎯 Objetivo del Módulo\n\nDominar la **herramienta** y ejecutar tus **primeras órdenes en demo con control total de la mecánica** — no de la estrategia: eso se construye en N2. Al terminar este módulo tendrás un layout de trabajo fijo con alertas (M4.1), sabrás qué garantiza y qué no cada tipo de orden y montarás OCO completas sin dudar (M4.2), conocerás tu factura de costos al céntimo — spread, comisión, slippage, swap (M4.3) —, ejecutarás largos y cortos entendiendo la asimetría del riesgo (M4.4), operarás en una demo configurada como laboratorio honesto y no como casino (M4.5), y habrás convertido el Stop Loss en ley operativa: definido antes de entrar, colocado por estructura, jamás movido en contra (M4.6). Este módulo existe porque es el cierre del Nivel 1: de entender el negocio y leer el precio pasas a **tocar la herramienta** — y la certificación del nivel exige mecánica impecable, no predicciones acertadas.\n\n## 📚 Lecciones\n\n| # | Lección | Esencia | Tiempo |\n|---|---|---|---|\n| 4.1 | [TradingView profesional](leccion-4-1.md) | Layout multitemporal D1/H4/H1/M15, watchlist de 5, alertas que invierten el flujo, Bar Replay como simulador; atajos esenciales; 29 h/año devueltas por una plantilla | 35–45 min |\n| 4.2 | [Tipos de órdenes](leccion-4-2.md) | Market / Limit / Stop / Stop-Limit / OCO: qué garantiza cada una y qué no; TP=limit y SL=stop explican el viaje asimétrico; stop-limit prohibido como SL | 45–60 min |\n| 4.3 | [El costo real de operar](leccion-4-3.md) | Las 4 cabinas del peaje: spread, comisión, slippage, swap (triple los miércoles); ≈ 2,6 pips ≈ 0,09R por operación tipo; E_neto = E_bruto − c | 45–60 min |\n| 4.4 | [Largos y cortos](leccion-4-4.md) | Mecánica del short en 5 pasos; borrow fee y swap; el squeeze como cascada sin techo; suben en escalera, caen en ascensor; SL de ley absoluta en cortos | 40–50 min |\n| 4.5 | [Cuenta demo](leccion-4-5.md) | Qué simula (mecánica) y qué no (psicología, slippage real); configuración realista no negociable; lectura del panel; el circuito demo → demo-forward → real micro | 40–50 min |\n| 4.6 | [El Stop Loss como ley](leccion-4-6.md) | El SL marca la invalidación, no el dolor; 3 propiedades de la ley; orden sagrado estructura → SL → lote; checklist 6/6; sin SL no existe ni la fórmula de E | 45–60 min |\n\n> [!TIP]\n> **Cómo estudiar este módulo:** dile a tu agente *\"Siguiente lección\"* y sigue el protocolo de sesión de estudio (§ 5.3 de `agents.md`). Este módulo se estudia **con la plataforma abierta**: cada lección termina pidiéndote tocar la herramienta — la teoría sin dedos no certifica mecánica.\n>\n> **Puente con la [Receta de tu Primera Operación](../../03-recursos/laboratorio/receta-primera-operacion.md):** con M4, la receta ejecuta sus **pasos 3–11**: definición de setup, cálculo de posición, OCO frontal, ejecución, gestión, cierre, journal y checklist 6/6. Tu objetivo sigue siendo la **primera operación PROCESADA** — el primer dólar real sigue reservado para F4 (veto CRO del temario v1.1).\n\n## 🧪 Laboratorio · Las 4 órdenes en demo\n\n**Materiales:** cuenta demo configurada según la [Lección 4.5](leccion-4-5.md) (capital = tu plan real, riesgo 1 %) + layout de la [Lección 4.1](leccion-4-1.md).\n\n**Procedimiento paso a paso** (cada orden se registra con captura ANTES de enviarla y DESPUÉS de cerrarla):\n\n1. **Orden market** — en el solapamiento Londres–NY, abre y cierra una posición mínima (0,01 lotes) EUR/USD en la misma vela. Anota: precio pedido vs precio ejecutado (la diferencia es spread + slippage vivo, [Lección 2.1](../mod-02-motor-del-precio/leccion-2-1.md) y [4.3](leccion-4-3.md)).\n2. **Orden limit de entrada** — coloca un buy limit en el borde de una zona real de tu marcado (protocolo M3.3). Si no se llena en 24 h, muévela o retírala: anota la decisión. Si se llena, el paso 3 la recibe.\n3. **OCO completa** — sobre la posición del paso 2 (o una nueva): SL por estructura tras el swing (con respiración) + TP por estructura con R:B ≥ 1:2, montados como paquete y **verificados en el panel antes de la sesión**.\n4. **Orden stop de entrada (ruptura)** — coloca un buy stop 2 pips sobre una resistencia con ruptura ya confirmada en 3 pasos ([Lección 3.4](../mod-03-anatomia-del-grafico/leccion-3-4.md)), SL y TP por estructura. Observa qué hace la orden al tocar el nivel.\n5. **Informe de laboratorio:** para cada orden: tipo elegido, qué garantizaba, qué riesgo de ejecución asumía y qué aprendiste del resultado — guardado en `journal/laboratorio-m4.md`.\n\n**Entregable:** las 4 capturas + informe. El objetivo NO es ganar pips: es que tus manos sepan montar cada tipo sin consultar nada — la cabina de la [Lección 4.1](leccion-4-1.md) operada de memoria.\n\n## 🎯 Misión\n\n> [!IMPORTANT] Misión M-4 · 10 Operaciones Demo Procesadas\n> **Objetivo:** certificar tu mecánica de ejecución: 10 operaciones demo completas donde lo evaluado no es acertar, sino **procesar impecablemente** — SL puesto antes de entrar en el 100 %, lote calculado desde el SL, OCO verificada y journal completo.\n> **Entregable:** `journal/operaciones-demo-m4.md` (o la plantilla v0 CSV ampliada) con las 10 filas + capturas (gráfico al entrar con SL visible + panel al cerrar) + el análisis final.\n> **Criterio de aceptación (por fila):** setup definido por escrito · SL colocado por estructura y montado ANTES de la entrada · lote desde el SL (riesgo ≤ 1 %, redondeo a la baja) · TP con R:B ≥ 1:2 · OCO verificada · fila del journal completa al cerrar. **Cero operaciones sin SL — una sola violación invalida la fila.**\n> **Etiqueta en journal:** `mision-4-demo` · **Tiempo estimado:** 10 operaciones en 2–3 semanas (ritmo natural: máximo 1–2 por día; la velocidad no es la métrica).\n> **Regla de oro:** la entrada puede ser simple (rechazo de zona confirmado, por ejemplo) — la sofisticación del setup no puntúa; la mecánica 6/6 sí. Esta misión certifica que el [checklist de la Lección 4.6](leccion-4-6.md) ya vive en tus dedos.\n\n**Formato de fila (copiar por operación):**\n\n```text\n#N — fecha — instrumento — dirección (long/short)\nOrden: [limit/stop + precio] — Lote: [calculado desde el SL] — Riesgo real: [$ y %]\nSL: [precio — por qué estructura] — TP: [precio — R:B resultante]\nOCO verificada: [sí — captura] — Resultado: [+/-R y $] — Costos observados: [$]\nChecklist: [6/6] — Nota (1 línea): qué demostró esta operación sobre tu mecánica\n```\n\n## ✅ Evaluación / Criterio de Graduación — 🏆 Evaluación Nivel 1\n\nEl M4 no cierra un módulo: cierra **el Nivel 1 completo**. Criterio del SYLLABUS:\n\n- **Misión M-4 completa:** 10/10 operaciones con checklist 6/6 — **cero violaciones de SL** (el criterio \"sin violaciones\" es absoluto).\n- **Examen teórico integrador N1:** [30 preguntas sobre M1–M4](../../03-recursos/evaluaciones/examen-n1.md) — **≥ 24/30 (80 %)** para aprobar.\n- **Checklist de ejecución sin violaciones:** revisión del journal con el agente: las 10 operaciones + el laboratorio muestran mecánica consistente (misma rutina, mismo checklist, sin improvisaciones de órdenes).\n- **Entrevista socrática:** 5 preguntas abiertas del examen N1 respondidas en vivo con el agente (defensa de razonamiento, no memorización).\n\nAl aprobar todo: **N1 🏆 certificado** en el README raíz, y se abre N2 (M5 · Estructura de Mercado y Liquidez) — donde el precio desnudo de M3 se descodifica con la lógica institucional, y tu demo pasa a operar un sistema v1.0.\n\n## 📝 Quiz de Graduación\n\n1. Market, limit y stop: ¿qué garantiza cada una y qué no? Asigna un uso del programa a cada una.\n2. ¿Por qué el TP se monta como limit y el SL como stop? ¿Qué fenómeno de la Lección 2.1 explica el viaje asimétrico?\n3. Tu compañero monta el SL como stop-limit \"para no pagar slippage\". Descríbelo el escenario exacto en que su protección no lo protege.\n4. Lista los 4 costos de operación. ¿Cuáles pagas en TODA operación y cuáles solo en algunas? ¿Por qué \"cuenta sin comisiones\" es una frase de marketing?\n5. Cálculo: tu sistema tiene E bruto +0,20R, costo todo incluido 0,09R y opera 40 veces al mes con R = 20 $. ¿Cuál es tu E neto mensual en $ y qué porcentaje de la ventaja bruta se comió el peaje?\n6. Enumera la mecánica del short en 5 pasos y explica por qué su riesgo sin SL es ilimitado mientras el del long está acotado.\n7. Describe el short squeeze como bucle de 3 pasos. ¿Qué conducta del programa te saca del bucle antes de entrar?\n8. Un estudiante practica en demo con 100 000 $ virtuales y lotes de 1.00. ¿Qué dos capacidades está entrenando mal y qué configuración exige el programa?\n9. Calcula el margen usado de 0,10 lotes EUR/USD a 1,0900 con apalancamiento 1:30. Si tu margen libre se encoge operación tras operación, ¿qué te está diciendo el panel?\n10. Enuncia las 3 propiedades de la ley del SL y explica por qué el lote se calcula DESPUÉS del SL — ¿qué deformación introduce invertir el orden?\n\n<details>\n<summary>Ver clave de respuestas</summary>\n\n1. **Market:** garantiza ejecución, no precio (urgencia/emergencia). **Limit:** garantiza precio, no ejecución (entrada en zona + TP). **Stop:** al tocar el nivel dispara market — ejecuta casi seguro, precio no garantizado (SL + entradas por ruptura).\n2. El TP es limit porque cobrar exige que el precio **llegue** (nadie te ejecuta la ganancia con urgencia); el SL es stop porque salir de emergencia exige **participación garantizada** al tocar el nivel. El viaje asimétrico sale del spread de la [Lección 2.1](../mod-02-motor-del-precio/leccion-2-1.md): con TP de 60 y SL de 30, el bid debe recorrer 62 hacia arriba y solo 28 hacia abajo.\n3. Un gap (o requote violento) atraviesa su nivel sin operaciones a su precio: la limit que dispara el stop-limit queda fuera de mercado y **no se llena** — posición abierta sin protección mientras el precio corre. Ejemplo: SL en 1,0794, gap de 20 pips → su limit no llena y pierde 20+ pips extra mientras tanto. El stop simple habría ejecutado a mercado con ~1 pip de slippage.\n4. **Siempre:** spread (+ comisión si la cuenta la cobra). **Condicionales:** slippage (noticias/gaps) y swap (posiciones overnight). \"Sin comisiones\" es marketing porque la comisión vive escondida en el spread más ancho: el costo correcto se compara todo incluido ([Lección 4.3](leccion-4-3.md)).\n5. E neto = (0,20 − 0,09) × 40 × 20 $ = **+88 $/mes**. Ventaja bruta: 0,20 × 40 × 20 = 160 $ → el peaje se comió **45 %** de la ventaja bruta (0,09/0,20). El negocio real se planifica con E neto.\n6. (1) Pedir prestadas → (2) vender → (3) esperar la caída → (4) recomprar más barato → (5) devolver; ganancia = venta − recompra − costos. El long sin SL pierde como máximo hasta precio 0 (acotado); el short debe recomprar para devolver y **el precio de recompra no tiene techo** → pérdida ilimitada.\n7. (1) Subida → cortos en pérdida; (2) cortos cierran = recompra obligada = demanda compradora → sube más; (3) la subida liquida más cortos → más recompra: bucle sin techo. Conducta: SL montado antes de entrar y respetado (sales a −1R sin formar parte de la cascada).\n8. Entrena mal: (a) el **tamaño** (jamás operará 1.00 con 2 000 $ reales — su mecánica de riesgo no se automatiza) y (b) la **frecuencia/seriedad** (operar como videojuego sin journal). El programa exige: capital del plan real, riesgo 1 %, apalancamiento real, lote micro resultante (0,05–0,06 en EUR/USD).\n9. Nominal = 0,10 × 100 000 × 1,0900 = 10 900 $; a 1:30 → **≈ 363 $** de margen usado. Margen libre que se encoge sostenidamente = el tamaño de tus posiciones está comiéndose tu colchón: sobredimensionamiento — la señal del panel antes de cualquier margen call.\n10. Las 3 propiedades: **definido antes de entrar** · **colocado por estructura** (tras el swing/zona con respiración) · **nunca se aleja del precio**. El lote se calcula después porque el SL es la entrada del cálculo (lote = riesgo $ ÷ (SL pips × valor pip)): invertir el orden significa \"elegir\" el stop para que quepa la apuesta deseada — deformar el análisis en favor del deseo, la definición operativa de apostar.\n\n</details>\n\n## 📖 Glosario del Módulo\n\n| Término | Inglés | Definición |\n|---|---|---|\n| Orden market | *market order* | Ejecuta ya al mejor precio disponible: garantiza ejecución, no precio |\n| Orden limit | *limit order* | Ejecuta solo a tu precio o mejor: garantiza precio, no ejecución |\n| Orden stop | *stop order* | Dormida hasta que el precio toca el nivel; dispara market: SL y rupturas |\n| Stop-limit | *stop-limit order* | Al tocar el nivel dispara una limit: puede no llenarse — prohibido como SL |\n| OCO | *one-cancels-other* | Dos órdenes emparejadas (SL+TP): una ejecuta, la otra se cancela |\n| Slippage | *slippage* | Diferencia entre el precio pedido y el obtenido; intermitente, concentrado en noticias/gaps |\n| Comisión | *commission* | Cargo fijo por operación en cuentas raw/ECN; en las standard vive escondida en el spread |\n| Swap | *swap / rollover* | Interés diario por posición overnight (diferencial de tasas); triple los miércoles |\n| Cuenta raw/ECN | *raw/ECN account* | Spread mínimo + comisión fija; se compara todo incluido, nunca partida aislada |\n| Margen | *margin* | Garantía retenida por la posición: nominal ÷ apalancamiento |\n| Margen libre | *free margin* | Capital − margen usado − pérdidas flotantes; si se encoge, sobredimensionas |\n| Apalancamiento | *leverage* | Multiplicador del nominal por cada $ de garantía; agranda el error, no el riesgo planeado |\n| P/L flotante | *floating P/L* | Resultado si cerraras ahora: papel hasta que cierras |\n| P/L realizado | *realized P/L* | Resultado definitivo al cerrar: el único que entra al journal |\n| Posición corta | *short position* | Vender prestado para recomprar más barato; riesgo sin techo si no hay SL |\n| Borrow fee | *borrow fee* | Interés anual por el préstamo de acciones en corto; entra en E como costo |\n| Short squeeze | *short squeeze* | Cascada de recompras obligadas de cortos perdedores que acelera la subida |\n| Gap risk | *gap risk* | Salto de precio que se salta tu nivel: exige tamaño menor en cortos y fines de semana |\n| Breakeven | *break-even* | Mover el SL al precio de entrada cuando el trade avanza: gestión opcional (M8) |\n| Layout | *layout* | Plantilla de gráficos fijos (D1/H4/H1/M15) que abre tu rutina idéntica cada día |\n| Watchlist | *watchlist* | Lista vigilada de ≤ 5 instrumentos: concentración por decisión de negocio |\n| Alerta | *price alert* | Aviso cuando el precio toca tu nivel: el precio te busca a ti |\n| SL mental | *mental stop* | Stop sin orden en el bróker: no es SL — la ley exige la orden montada |\n\n## 🔗 Referencias\n\n- [SYLLABUS.md § 5 — N1, Módulo 4](../../01-syllabus/SYLLABUS.md)\n- [analisis_cursos.md](../../00-analisis/analisis_cursos.md) — aporte propio del módulo: protocolo de demo ordenado y stop como ley desde el día uno\n- [La Receta de tu Primera Operación](../../03-recursos/laboratorio/receta-primera-operacion.md) — sus pasos 3–11 se ejecutan con este módulo\n- [Examen integrador N1](../../03-recursos/evaluaciones/examen-n1.md) — evaluación 🏆 del Nivel 1\n- [Módulo 3 · Anatomía del Gráfico](../mod-03-anatomia-del-grafico/README.md) — anterior\n- Módulo 5 · Estructura de Mercado y Liquidez — siguiente (N2; se publica en el Sprint 5)\n"},{"i":27,"g":"🧱 M4 · Plataforma y Primera Ejecución","t":"4.1 · TradingView profesional","f":"docs/02-modulos/mod-04-plataforma-y-primera-ejecucion/leccion-4-1.md","md":"# Lección 4.1 · TradingView profesional\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 35–45 min de estudio + 30 min de configuración |\n| 🧱 Módulo | [M4 · Plataforma y Primera Ejecución](README.md) |\n| ⬅️ Anterior | — (primera lección del módulo) |\n| ➡️ Siguiente | [Lección 4.2 · Tipos de órdenes](leccion-4-2.md) |\n\n---\n\n## Por qué importa\n\nLa plataforma es tu oficina: es donde ocurre todo lo que los 11 módulos anteriores han preparado. Y como toda oficina, el tiempo que pierdes buscando las herramientas es tiempo de trabajo perdido — pero en trading el problema es peor, porque la búsqueda casi siempre ocurre cuando el mercado se está moviendo. Un trader que no sabe montar un layout, fijar una alerta o retroceder el histórico pierde capacidades que el programa da por sentadas: el laboratorio de M3 usó Bar Replay y la [Receta de tu Primera Operación](../../03-recursos/laboratorio/receta-primera-operacion.md) asume que sabes leer un panel de cotización. Este módulo arranca con la herramienta porque la ejecución disciplinada empieza con una plataforma que se comporta de la misma manera cada día: mismo layout, misma watchlist, mismas alertas. La variedad es enemiga de la rutina, y la rutina de ejecución es lo que este módulo construye.\n\n## Concepto\n\nUsaremos TradingView como herramienta de análisis (cuenta gratuita basta para el N1; sin marcas: cualquier plataforma equivalente sirve si tiene las mismas funciones). Las piezas que el programa usa a diario:\n\n1. **El gráfico y sus marcos temporales.** Cada gráfico muestra un instrumento en un marco (D1, H4, H1, M15…). Cambiar de marco NO cambia el mercado: cambia la resolución de la cámara (fractalidad de la [Lección 3.1](../mod-03-anatomia-del-grafico/leccion-3-1.md)).\n2. **Escalas.** Lineal (por defecto) y logarítmica: en la logarítmica, la misma distancia vertical representa el mismo % de movimiento. Para el forex y los marcos intradía del programa, la lineal es suficiente; la logarítmica importa al mirar años de índices.\n3. **Layout multitemporal.** Un mismo instrumento, varios paneles sincronizados (ej. D1 + H4 + H1 + M15). Es la configuración estándar del programa: análisis top-down en una sola pantalla.\n4. **Watchlist.** Tu lista vigilada: los 5 instrumentos del programa (EUR/USD, XAU/USD, US30, y 2 de tu elección). Una watchlist corta y fija es una decisión de negocio (concentración de la [Lección 2.5](../mod-02-motor-del-precio/leccion-2-5.md)), no una limitación.\n5. **Alertas.** Avisos cuando el precio toca un nivel (o un indicador se activa). Eliminan la vigilancia manual: tú defines la zona, la plataforma vigila. Tipos básicos: cruce de precio, cruce de línea/dibujo, y alertas recurrentes.\n6. **Bar Replay.** La máquina del tiempo: reproduce el histórico vela a vela ocultando el futuro. Es el simulador de estudio del programa (laboratorios M3 y M9).\n\n**Atajos esenciales** (los que se usan cada sesión):\n\n| Atajo | Acción | Uso típico |\n|---|---|---|\n| `/` o coma | búsqueda de instrumento | cambiar de activo rápido |\n| Alt + T / Alt + H | línea de tendencia / línea horizontal | marcar zonas (M3.3) |\n| Rectángulo (`R`) | dibujar zona | el marcado estándar del programa |\n| `Alt + R` | reproducir grabación de layout (replay) | practicar sin futuro |\n| Ctrl + Z / Ctrl + Y | deshacer / rehacer dibujos | corregir marcado |\n| Rueda + Shift | zoom horizontal rápido | moverse entre marcos de tiempo visuales |\n| Doble clic en escala | ajustar escala automática | cuando el gráfico \"se sale\" |\n\n*(los atajos exactos pueden variar por versión/idioma — los marcamos como orientativos)*\n\n## Analogía\n\nUna cabina de pilotos no tiene un solo interruptor fuera de sitio: cada palanca está siempre en el mismo lugar, y el piloto la opera sin mirar. Ese entrenamiento no es capricho — en plena turbulencia no hay tiempo de buscar. Tu plataforma es la cabina: cuando el precio llegue a tu zona (y llegará cuando estés lejos o ocupado), necesitas que tus manos sepan qué hacer sin pensar. El trader que cada día reorganiza sus gráficos, cambia de colores y prueba paneles nuevos está reorganizando la cabina en pleno vuelo. La rutina no es aburrimiento: es lo que libera tu atención para el mercado.\n\n## Cómo se hace: montar el layout de trabajo del programa (una vez)\n\nConfiguración estándar, con pasos cerrados. Tiempo: 30 min la primera vez, 0 después.\n\n1. **Abre 4 paneles del mismo instrumento** (ej. EUR/USD): D1 arriba, H4 y H1 al centro, M15 abajo. En TradingView: divide el área en 4 y fija el símbolo sincronizado entre paneles.\n2. **Limpia el gráfico:** quita indicadores de fábrica. Por ahora solo precio (M6 añadirá indicadores con criterio).\n3. **Guarda como plantilla del layout:** nombre `FIT12-trabajo`. Cada sesión se abre en 2 segundos con la misma disposición.\n4. **Crea la watchlist `FIT12`:** EUR/USD, XAU/USD, US30, + 2 instrumentos de tu elección (máximo 5 en total, criterio de la Lección 2.5).\n5. **Marca tus zonas de la semana** (protocolo M3.3) sobre H4/D1 y déjalas dibujadas en el layout: el gráfico debe mostrar tu análisis, no estar vacío.\n6. **Pon 2–3 alertas por instrumento** en los bordes de tus zonas activas (ej. EUR/USD: alerta de cruce en 1,0824). Con alertas puestas, cerrar la plataforma es una decisión válida: la plataforma te avisará.\n7. **Prueba Bar Replay:** abre EUR/USD H1, rebobina 20 días y avanza vela a vela describiendo (en voz alta) régimen, ciclo y zonas — el mismo ejercicio del laboratorio de M3.\n\n**Chequeo de configuración completa:** el layout abre con 4 paneles, la watchlist tiene ≤ 5 instrumentos, hay zonas marcadas y ≥ 2 alertas activas por instrumento principal, y sabes lanzar un Replay sin buscar el botón.\n\n## Error común\n\nEl primer error es **coleccionar en vez de operar**: 12 layouts, 30 indicadores, 4 plataformas instaladas y ninguna rutina. Cada reconfiguración parece progreso pero no deja estadística detrás — es el mismo mecanismo de \"buscar el curso perfecto\" de la [Lección 1.5](../mod-01-negocio-trading/leccion-1-5.md). El segundo error es **no usar alertas y vigilar el gráfico a mano**: además de devorar horas, te expone a decidir en tiempo real bajo emoción — la alerta existe para que el precio te busque a ti, y no al revés. El tercero es **practicar Replay \"viendo el futuro\"**: rebobinar, mirar 3 velas adelante \"para contextualizar\" y luego \"predecir\" es trampa estadística pura — el ejercicio solo vale si el futuro está genuinamente oculto cuando escribes tu predicción. Si te descubres mirando, esa repetición no cuenta.\n\n## Conexión cuantitativa\n\nEl costo de la desorganización es medible. Rutina manual de preparar gráficos: 10 min/día; con layout guardado: 1 min. Diferencia: 9 min × 4 sesiones/semana × 48 semanas ≈ **29 horas al año** — una semana laboral completa gastada en clics que una plantilla hace gratis. Y el costo de vigilar sin alertas: 2 h de pantalla diaria \"por si acaso\" frente a la alternativa de trabajar con el precio como notificación: en un año son **≈ 480 horas** — el equivalente a 12 semanas de estudio del programa completo. La plataforma bien configurada no mejora tu E directamente, pero devuelve el tiempo con el que se construye todo lo demás: análisis, journal, laboratorio. En la [Lección 4.3](leccion-4-3.md) verás el otro costo de la plataforma — el que sí se paga en dinero.\n\n---\n\n## 🎯 Puntos clave\n\n1. La plataforma es tu oficina: la rutina fija (layout, watchlist, alertas) es lo que libera atención para el mercado.\n2. Layout multitemporal estándar del programa: D1 + H4 + H1 + M15 del mismo instrumento, sincronizados.\n3. Watchlist de máximo 5 instrumentos: concentración por decisión de negocio (Lección 2.5), no limitación.\n4. Las alertas invierten el flujo: defines la zona, la plataforma vigila; tú decides con calma cuando suena.\n5. Bar Replay es el simulador oficial: solo cuenta la repetición con el futuro genuinamente oculto.\n6. Una configuración mantenida durante meses produce datos comparables; la reorganización constante produce cero datos.\n\n## 🔄 Autoevaluación rápida\n\n1. ¿Por qué el programa fija una watchlist de 5 instrumentos en vez de dejar libre al estudiante? Conecta con la lección de personalidad de mercados.\n2. Tu compañero dice: \"no pongo alertas porque quiero ver las operaciones en vivo\". ¿Qué dos costos le estás explicando?\n3. ¿Qué convierte una repetición de Bar Replay en repetición válida — y qué la invalida?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Por concentración (Lección 2.5): cada instrumento tiene personalidad distinta (volatilidad, horario, spread, tamaño de rango) y operar 5 bien vence a vigilar 30 a medias. Además fija los datos: con la misma watchlist durante meses, tu journal produce estadística comparable — cada cambio de universo invalida el histórico.\n2. (a) Costo de tiempo: horas de pantalla que el layout + alertas devuelven (≈ 480 h/año en el ejemplo de la lección). (b) Costo de decisión: mirar el precio en vivo invita a intervenir fuera de plan (improvisar entradas, adelantar confirmaciones); la alerta separa la observación (plataforma) de la decisión (tú, con checklist).\n3. Es válida si el futuro está genuinamente oculto cuando escribes tu lectura (régimen, zonas, dirección ANTES de avanzar el replay). La invalida: mirar velas futuras \"para contextualizar\", ajustar el marcado después de ver dónde giró, o rehacer la predicción tras ver el desenlace — curvar la regla tras medir, igual que la regla de oro de la misión M-3.\n\n</details>\n"},{"i":28,"g":"🧱 M4 · Plataforma y Primera Ejecución","t":"4.2 · Tipos de órdenes","f":"docs/02-modulos/mod-04-plataforma-y-primera-ejecucion/leccion-4-2.md","md":"# Lección 4.2 · Tipos de órdenes\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 45–60 min de estudio |\n| 🧱 Módulo | [M4 · Plataforma y Primera Ejecución](README.md) |\n| ⬅️ Anterior | [Lección 4.1 · TradingView profesional](leccion-4-1.md) |\n| ➡️ Siguiente | [Lección 4.3 · El costo real de operar](leccion-4-3.md) |\n\n---\n\n## Por qué importa\n\nTu análisis puede ser impecable y tu gestión de riesgo perfecta — pero lo único que el mercado recibe de ti es una orden, y una orden mal elegida ejecuta algo distinto de lo que tu plan decía. Cada tipo de orden existe para resolver un problema concreto: urgencia (quiero entrar ya), precio (solo a este nivel) o protección (ciérrame si va contra mí). Confundirlos no es un error de novato simpático: es la diferencia entre \"mi SL estaba en 1,0794\" y \"no salí hasta 1,0811 porque usé el tipo equivocado\". El programa estandariza el uso: entradas paciente = *limit*, salidas de emergencia = *stop*, objetivo de ganancia = *limit*, y todo el paquete amarrado en una *OCO*. Al terminar esta lección tendrás que saber decir, para cualquier escenario, qué orden corresponde y qué garantiza (y qué NO garantiza) cada una.\n\n## Concepto\n\nHay 5 tipos que el programa usa (los nombres están en inglés porque así aparecen en todas las plataformas):\n\n1. **Market** (*market order*): ejecuta **ya**, al mejor precio disponible en ese instante. Garantiza ejecución, NO garantiza precio (paga el spread y, si el mercado corre, slippage — [Lección 4.3](leccion-4-3.md)). Uso: entradas cuando tu urgencia es real y salidas de emergencia.\n2. **Limit** (*limit order*): ejecuta **solo a tu precio o mejor**. Garantiza precio, NO garantiza ejecución (si el precio nunca llega, te quedas fuera). Uso: entradas paciente en zona (tu rol maker de la [Lección 2.1](../mod-02-motor-del-precio/leccion-2-1.md)) y salida en el objetivo (TP).\n3. **Stop** (*stop order / stop-market*): está dormida hasta que el precio **toca** tu nivel; al tocarlo, dispara una market. Garantiza participación en el movimiento, no el precio exacto. Uso: **Stop Loss** y entradas por ruptura confirmada.\n4. **Stop-Limit** (*stop-limit order*): al tocar el nivel dispara una *limit* (no una market). Da control de precio pero puede **no ejecutarse** si el precio atraviesa el nivel tan rápido que nadie llena tu limit. Uso: entradas de ruptura en mercados finos; **nunca como SL** (ver error común).\n5. **OCO** (*one-cancels-other*): dos órdenes emparejadas — al ejecutarse una, la plataforma cancela la otra. Es como el bróker implementa SL+TP sobre una posición abierta: toca el TP → cancela el SL; toca el SL → cancela el TP.\n\n**Tabla de garantías** (la que hay que saber de memoria):\n\n| Orden | ¿Garantiza ejecución? | ¿Garantiza precio? | Rol en el programa |\n|---|---|---|---|\n| Market | ✅ sí | ❌ no | salidas de emergencia |\n| Limit | ❌ no | ✅ sí | entrada en zona + TP |\n| Stop | ✅ al tocar el nivel | ❌ no | **SL** + entrada de ruptura |\n| Stop-Limit | ❌ puede quedarse sin llenar | ✅ la limit, sí | entradas de ruptura finas (avanzado) |\n| OCO | ✅ una de las dos | ✅ la que toque | paquete SL+TP de toda posición |\n\n**El detalle que conecta con M2:** tu TP es una *limit* (el precio tiene que **llegar** — nadie te ejecuta la ganancia con urgencia) y tu SL es un *stop* (al tocar, el mercado te saca con urgencia). Por eso el viaje de tu operación es asimétrico ([Lección 2.1](../mod-02-motor-del-precio/leccion-2-1.md)): el objetivo se alcanza con recorrido +spread y el stop se dispara con recorrido −spread.\n\n**Visual — qué orden usar según el problema:**\n\n```mermaid\nflowchart TD\n    P[\"🎯 Tengo una posición o una idea<br/>¿qué problema quiero resolver?\"] --> A[\"Necesito ejecutar YA<br/>(urgencia mía o de emergencia)\"]\n    P --> B[\"Solo me interesa MI precio<br/>(paciencia: la zona debe venir a mí)\"]\n    P --> C[\"Necesito protección automática<br/>(que el bróker me saque sin mí)\"]\n    A --> A1[\"Orden MARKET<br/>✅ ejecución garantizada · ❌ precio no\"]\n    B --> B1[\"Orden LIMIT<br/>✅ precio garantizado · ❌ ejecución no\"]\n    C --> C1[\"Orden STOP → SL<br/>al tocar el nivel, market de salida\"]\n    C1 --> C2[\"📦 Empaquetado con el TP (limit)<br/>= OCO: una ejecuta, la otra se cancela\"]\n```\n\n## Analogía\n\nReservar mesa en un restaurante. La orden **market** es entrar y comer donde haya: garantizado que cenas ya, al precio que pongan. La **limit** es la reserva: \"solo como si hay mesa a las 21:00 en la terraza\" — si no se da, te vas a otra parte (sin cena, pero sin sobrepago). El **stop** es el detector de humos: no analiza, no negocia, no espera tu confirmación — suena y actúa. Y el **stop-limit** es un detector que, al sonar, llama a un cerrajero que además tiene que estar disponible: si la casa arde entera en cinco minutos, el cerrajero no llega y te quedas dentro. Protecciones que pueden no ejecutarse no son protecciones: son promesas.\n\n## Cómo se hace: montar la OCO de la receta con números cerrados\n\nEl caso maestro de la [Receta de tu Primera Operación](../../03-recursos/laboratorio/receta-primera-operacion.md), ahora con nombre de orden para cada pieza:\n\n- **Escenario:** EUR/USD en regímen definido por tu análisis M3; zona de soporte marcada en **1,0820–1,0824** *(ilustrativo)*.\n- **Entrada:** *buy limit* en **1,0824** (el borde superior de la zona: donde el precio suele agotar el impulso vendedor al retestear). Es tu rol maker: esperas al precio.\n- **Stop Loss:** *stop* (de venta) en **1,0794** — 30 pips bajo la entrada, 4 pips tras el mínimo del swing local (colocación por estructura: [Lección 4.6](leccion-4-6.md)).\n- **Take Profit:** *limit* (de venta) en **1,0884** — 60 pips sobre la entrada, en la resistencia opuesta. R:B nominal = 60/30 = **2,0** ✓ (estándar mínimo del programa).\n- **Montaje:** la plataforma toma la posición + SL + TP como paquete OCO. Si el precio sube y toca 1,0884 → tu limit de venta ejecuta la ganancia y el SL se cancela solo. Si cae y toca 1,0794 → el stop te saca con −30 pips (−18 $ con el lote de 0,06 de la receta) y el TP se cancela solo.\n- **Comprobación del viaje (M2.1):** para cobrar el TP el bid debe subir 62 pips desde su punto de partida; para que salte el SL le basta bajar 28. Misma operación, caminos distintos.\n\n**Qué NO montar:** entrada con *market* \"para no perderme el movimiento\" cuando tu plan decía limit en zona — cada cambio de tipo de orden en caliente es una violación del plan, y la misión M-4 lo registra como tal.\n\n## Error común\n\nEl más caro de todos: **usar stop-limit como Stop Loss \"para controlar el slippage\"**. Si el precio atraviesa tu nivel con un gap o en una noticia, la limit que dispara puede quedarse sin llenar — y sigues dentro de una posición que ya no querías tener, sin protección. El SL es la única orden del programa donde la ejecución importa más que el precio: prefieres −30,5 pips reales a una promesa de −30 que puede convertirse en −80. El segundo error es **confundir la dirección de los stops de entrada**: el *buy stop* se pone **por encima** del precio actual (compra en ruptura al alza) y el *sell stop* por debajo — ponerlos al revés ejecuta en el segundo que los colocas. El tercero es **no revisar que la OCO quedó montada**: entrada manual + SL olvidado = la violación número 1 del checklist de la misión M-4 (cero operaciones sin SL).\n\n## Conexión cuantitativa\n\nCada tipo de orden tiene un perfil de riesgo de ejecución distinto, y ese perfil entra directo en la esperanza: $E_{neto} = E_{bruto} - \\text{costos}$. El slippage del SL es un costo que solo existe cuando pierdes: con SL de 30 pips y slippage típico de 1 pip en mercado líquido *(ilustrativo)*, tu pérdida real media es 31 pips — un 3,3 % de R adicional en cada fallo. Pero sin SL (o con un stop-limit que no llena), la cola de pérdidas se abre: la misma operación puede cerrar −60, −100 o más pips cuando llega un dato macro ([Lección 2.6](../mod-02-motor-del-precio/leccion-2-6.md)). Un sistema con E bruto +0,10R y SL fiable sigue teniendo E positivo con el slippage incluido; el mismo sistema sin SL no tiene E **definible** — porque su peor operación no está acotada. La OCO no es una comodidad de la plataforma: es el mecanismo que convierte tu E teórica en la E real que puedes sostener.\n\n---\n\n## 🎯 Puntos clave\n\n1. Market: garantiza ejecución, no precio — urgencia y emergencias. Limit: garantiza precio, no ejecución — paciencia en zonas y TP.\n2. Stop: al tocar el nivel dispara market — el mecanismo del SL y de las entradas por ruptura. Stop-Limit dispara una limit: puede NO ejecutarse — prohibido como SL.\n3. OCO = SL (stop) + TP (limit) emparejados: una ejecuta, la otra se cancela. Toda posición del programa nace con OCO montada.\n4. El viaje asimétrico de M2.1 se explica por los tipos: el TP es limit (el precio tiene que llegar), el SL es stop (el mercado te saca).\n5. Buy stop va por encima del precio, sell stop por debajo — invertirlo ejecuta al instante.\n6. El SL es la única orden donde ejecución > precio: −30,5 reales vence a la promesa de −30 que puede acabar en −80.\n\n## 🔄 Autoevaluación rápida\n\n1. ¿Qué garantiza y qué no garantiza una orden limit? Da un uso de entrada y uno de salida en el programa.\n2. ¿Por qué montar el SL como stop-limit es violar la ley del stop? Descríbelo con un gap de 20 pips.\n3. Tu plan: entrada limit 1,0824, SL 1,0794, TP 1,0884. ¿Qué orden es cada pieza y qué pasa en la plataforma si toca primero el 1,0794?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Limit garantiza **precio** (se ejecuta solo a tu nivel o mejor) y NO garantiza ejecución (si el precio nunca llega, cero fills). Entrada: *buy limit* en el borde de una zona de soporte — rol maker, el precio debe venir a ti. Salida: TP como *limit* de venta en la resistencia opuesta — cobras la ganancia sin urgencia.\n2. El stop-limit, al tocar el nivel, lanza una *limit* que exige un contraparte a ese precio o mejor. Con un gap de 20 pips el mercado ya está 20 pips más allá: tu limit queda fuera de mercado, nadie la llena a tu precio, y la posición sigue abierta mientras el precio corre. El stop simple habría ejecutado a mercado con slippage acotado (~1 pip). Protección que puede no ejecutarse no es protección: es promesa.\n3. Entrada: *buy limit* 1,0824. SL: *stop* de venta 1,0794. TP: *limit* de venta 1,0884. Si el bid baja y toca 1,0794, el stop dispara la venta a mercado (−30 pips nominales, −18 $ con 0,06 lotes) y la OCO cancela automáticamente el TP de 1,0884: la operación queda cerrada y limpia en el historial.\n\n</details>\n"},{"i":29,"g":"🧱 M4 · Plataforma y Primera Ejecución","t":"4.3 · El costo real de operar","f":"docs/02-modulos/mod-04-plataforma-y-primera-ejecucion/leccion-4-3.md","md":"# Lección 4.3 · El costo real de operar\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 45–60 min de estudio |\n| 🧱 Módulo | [M4 · Plataforma y Primera Ejecución](README.md) |\n| ⬅️ Anterior | [Lección 4.2 · Tipos de órdenes](leccion-4-2.md) |\n| ➡️ Siguiente | [Lección 4.4 · Largos y cortos](leccion-4-4.md) |\n\n---\n\n## Por qué importa\n\nLa [Lección 2.1](../mod-02-motor-del-precio/leccion-2-1.md) te enseñó el spread como peaje. El peaje completo tiene cuatro cabinas: **spread, comisión, slippage y swap** — y la mayoría de los principiantes solo ve la primera. El resultado es el clásico sistema \"rentable en papel y perdedor en la cuenta\": la esperanza que calculaste era bruta, pero la que cobra el bróker es neta. Los costos no negocian contigo, no descansan cuando pierdes y se aplican **a todas las operaciones — incluidas las malas**. Un sistema que opera 20 veces al mes con un costo de 0,10R por operación paga 2R al mes solo en peajes: si su ventaja bruta es 0,15R por operación, el costo se come dos tercios. Esta lección pone número a cada cabilla del peaje, porque el primer trabajo de un negocio es conocer su estructura de costos al céntimo ([Lección 1.6](../mod-01-negocio-trading/leccion-1-6.md)).\n\n## Concepto\n\nLos cuatro costos de toda operativa, en orden de visibilidad:\n\n1. **Spread** (*spread*): la diferencia bid-ask que pagas en cada ida y vuelta ([Lección 2.1](../mod-02-motor-del-precio/leccion-2-1.md)). Se paga **siempre**, en cada operación. Varía por horario y por instrumento (mínimo en el solapamiento Londres–NY, [Lección 2.4](../mod-02-motor-del-precio/leccion-2-4.md)).\n2. **Comisión** (*commission*): cargo fijo del bróker por operación, típico de cuentas *raw/ECN*: p. ej. **7 $ por lote ida y vuelta** *(ilustrativo)*. Las cuentas *standard* dicen \"sin comisión\" pero cobran spreads más anchos: **nadie opera gratis** — el costo está en el precio o en la factura, nunca en ninguno.\n3. **Slippage** (*slippage*): diferencia entre el precio que pediste y el que obtuviste. Ocurre cuando el mercado se mueve entre tu clic y la ejecución: noticias, aperturas, gaps. Es intermitente pero concentrado: cero slippage en 95 % de las operaciones y 3–10 pips en la que coincide con un dato macro *(ilustrativo)*.\n4. **Swap / rollover** (*swap / overnight fee*): interés diario por mantener la posición abierta **overnight**, derivado del diferencial de tasas entre las dos divisas. Puede ser negativo o positivo según la dirección y el par. Los **miércoles se cobra triple** (por el fin de semana que viene: el mercado liquida el interés de sábado y domingo ese día). En oro y CFDs de índices existe también, generalmente negativo en ambos sentidos.\n\n**Visual — anatomía del costo de una operación** (1 lote estándar EUR/USD, 1 noche en el mercado *(todas las cifras ilustrativas, tu bróker manda)*):\n\n```mermaid\nflowchart LR\n    T[\"💱 1 operación completa<br/>long EUR/USD · 1 lote · 1 noche\"] --> S[\"Spread ida y vuelta<br/>≈ 20 $\"]\n    T --> C[\"Comisión (cuenta raw)<br/>≈ 7 $\"]\n    T --> SL[\"Slippage esperado<br/>≈ 5 $\"]\n    T --> SW[\"Swap 1 noche<br/>≈ 7 $\"]\n    S --> TOT[\"🧾 Total ≈ 39 $<br/>≈ 0,12R con SL de 32 pips\"]\n    C --> TOT\n    SL --> TOT\n    SW --> TOT\n```\n\n## Analogía\n\nImportar mercancía para tu tienda. El costo real no es lo que pagas al fabricante: es fabricante **+ flete + aduana + almacén + mermas**. Un importador que presupuesta solo el precio del fabricante quiebra con pedidos \"rentables en papel\". En trading: fabricante = precio de entrada; flete y aduana = spread y comisión (los pagas en cada envío, sí o sí); mermas = slippage (no siempre ocurre, pero cuando el puerto está caótico, muerde); almacén = swap — pagas por cada noche que la mercancía duerme en el depósito, y algunos miércoles te cobran el fin de semana entero de golpe. El negocio se planifica con el costo total, nunca con el precio de catálogo.\n\n## Cómo se hace: el costo completo de tu operación tipo, en números cerrados\n\nTu operación estándar del programa (lote **0,06**, SL **30 pips**, TP **60 pips** — la receta). Con 0,06 lotes, cada pip vale 0,6 $ (0,06 × 10 $/pip). El truco de claridad: los costos en **pips** no dependen del tamaño — 2 pips de spread son 2 pips con 0,06 o con 5 lotes; solo el ticket en $ escala:\n\n| Costo | Cálculo | En $ (0,06 lote) | Pips equiv. |\n|---|---|---:|---:|\n| Spread (2 pips) | 2 × 0,6 $/pip | 1,20 $ | 2,0 |\n| Comisión (cuenta standard: 0) | — | 0 $ | 0,0 |\n| Slippage medio esperado | 0,5 × 0,6 $/pip | 0,30 $ | 0,5 |\n| Swap (1 noche, long EUR/USD) *(ilustrativo)* | 0,06 × (−7 $) | 0,42 $ | 0,07 |\n| **Total** | | **≈ 1,92 $** | **≈ 2,6** |\n\nCon cuenta *raw* (spread 0,8 pips + comisión 7 $/lote round-turn × 0,06 = 0,42 $): spread 0,48 $ + 0,42 $ + slippage 0,30 $ + swap 0,42 $ ≈ **1,62 $** — más barata en este caso; la comparación correcta siempre es **todo incluido**, nunca una partida aislada.\n\n**El peso relativo — la métrica que sí importa** (en pips, tamaño-invariante):\n\n- Contra el **TP** (60 pips): 2,6/60 = **4,3 % del objetivo**.\n- Contra el **SL** (30 pips): 2,6/30 ≈ **0,09R de costo por operación** — este es el $c$ que entra en la fórmula de E.\n- Con un TP de 10 pips (scalping), los mismos 2,6 pips serían **26 % del objetivo** — la razón matemática por la que el programa prohíbe scalping hasta tener estadística propia ([Lección 1.4](../mod-01-negocio-trading/leccion-1-4.md)).\n\n**Y la factura mensual** *(números cerrados, en tu tamaño real)*: 20 operaciones/mes × 1,92 $ ≈ **38 $/mes de peajes** — el 4,3 % de cada objetivo, cobrado 20 veces. La escala no lo cura: en R el peaje es igual (0,09R) con 2 000 $ o con 200 000 $, porque el costo vive en los pips y tu ventaja también. Con E bruto +0,20R, el peaje se queda el **43 % de tu ventaja bruta** (0,09/0,20) — y por eso el programa primero valida mecánica en demo (N1) y construye ventaja medida en N2-N3 con $E_{neto}$ sobre TU journal: este cálculo honesto, con tus propios números, es la entrega central de M9.\n\n## Error común\n\n**(1) Comparar brókers solo por el spread** — el bróker \"más barato\" con spread 1,2 + comisión 7 $/lote pierde frente a uno de 2,0 sin comisión en operaciones cortas, y gana en operativa larga: el costo correcto se compara como **todo incluido**. **(2) Ignorar el swap en planes de swing** — \"mantengo hasta que gane\" también paga almacén: 15 noches de −0,42 $ no arruinan, pero 15 noches en un par con swap duro sí deforman el R:B real de una operación planeada a 3 noches. **(3) Medir slippage en demo** — muchas demos ejecutan al precio exacto siempre: la demo mide tu mecánica, no el costo real ([Lección 4.5](leccion-4-5.md) detalla qué simula y qué no). **(4) Sobreoperar porque cada peaje \"es pequeño\"** — 20 operaciones/mes ≈ 38 $ de costo; 60 operaciones/mes ≈ 115 $: el costo escala **linealmente con la actividad**, y la ventaja no. La actividad sin ventaja adicional es regalar peaje.\n\n## Conexión cuantitativa\n\nLa fórmula del programa queda así: $E_{neto} = E_{bruto} - c$ donde $c$ = costo todo incluido por operación (en R). Con $c \\approx 0{,}09R$ (recién calculado): un sistema con $E_{bruto} = +0{,}20R$ queda en $E_{neto} = +0{,}11R$ — la mitad de tu ventaja es del peaje. Y el punto de inflexión: $E_{neto} > 0$ exige $E_{bruto} > c$; si tu E bruto es 0,08R, **el peaje te deja en negativo aunque el sistema \"funcione\"**. Dos palancas de negocio que ya controlas: (1) **horario** — operar solo en solapamiento puede recortar el spread 40–70 % *(ilustrativo)*: $c$ baja sin tocar el sistema; (2) **frecuencia** — cada operación extra paga peaje completo, así que filtrar setups mediocres no solo sube tu WR: baja tu factura de costos. En el examen N1 este cálculo aparece con números.\n\n---\n\n## 🎯 Puntos clave\n\n1. Cuatro cabinas de peaje: spread (siempre), comisión (según cuenta), slippage (intermitente pero concentrado), swap (por cada noche).\n2. \"Sin comisión\" significa comisión escondida en el spread: el costo total es lo comparable, nunca una partida aislada.\n3. El swap cobra triple los miércoles (liquida el fin de semana) y puede ser positivo en shorts de pares con diferencial favorable.\n4. El peso del peaje se mide en pips contra el objetivo: 2,6 pips sobre un TP de 60 = 4,3 %; sobre un TP de 10 = 26 % — por eso el scalping está vetado sin estadística.\n5. $E_{neto} = E_{bruto} - c$: un sistema con E bruto menor que su costo pierde dinero \"funcionando\".\n6. El costo escala lineal con la frecuencia; la ventaja no — sobreoperar es regalar peaje.\n\n## 🔄 Autoevaluación rápida\n\n1. Lista los 4 costos y clasifícalos: ¿cuáles se pagan en TODA operación y cuáles solo en algunas?\n2. Cuenta ECN: spread 0,8 pips + 7 $/lote de comisión. Cuenta standard: spread 2,0 pips sin comisión. Con 1 lote EUR/USD y TP de 25 pips, ¿cuál es más barata todo incluido? (1 pip = 10 $).\n3. Tu plan original era swing de 3 noches, pero el trade no avanza y lo sostienes 12 noches. ¿Qué costo deformó tu R:B y por qué el miércoles importa?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Siempre: **spread** (cada ida y vuelta) y **comisión** si tu cuenta la cobra (si no, está en el s
