s-NY (**08:00–12:00 hora Bolivia**, aprox. 12:00–16:00 UTC) **sin enviar ninguna orden**:\n   - ¿Cuándo se mueve más: al inicio, a mitad, al cierre?\n   - ¿Qué pasa con el spread justo antes de la apertura de Londres (~09:00 Bolivia) y alrededor de las 09:30 ET (datos de EE. UU.)?\n   - ¿Cómo es el mercado a las 14:00 Bolivia (últimas horas de Londres)?\n3. Repite al día siguiente. Anota tus 3 observaciones principales en el journal.\n\n**Verificación del paso:** 2 sesiones observadas con notas. Ya conoces el \"clima\" de tu carretera.\n\n> 🟢 **Fin de la etapa de familiarización.** Los pasos 3–11 se ejecutan cuando llegues al Módulo 4. Todo lo que sigue ocurre en DEMO.\n\n### Paso 3 · Análisis mínima del día (15 min, con lo aprendido en M2–M3)\n\nResponde por escrito, antes de mirar el botón de comprar:\n\n1. **Régimen:** ¿el mercado está en tendencia o en rango en H4/D1? (M3: rangos vs tendencias)\n2. **Zonas:** ¿dónde están las 1–2 zonas de soporte/resistencia más relevantes cerca del precio?\n3. **Dirección tentativa:** ¿compro en retroceso a soporte en tendencia alcista, vendo en retroceso a resistencia en tendencia bajista, o **no hay setup y hoy no se opera**?\n\n> \"No hay setup\" es una respuesta válida y frecuente. En la receta no se fuerza la operación: se documenta la decisión.\n\n### Paso 4 · Definir el setup por escrito (antes de tocar la plataforma)\n\nTres líneas en el journal, obligatorias:\n\n```text\nSetup M-4 #1 — EUR/USD H1 — 2026-XX-XX\nEntrada:  limit en 1.0850 (retroceso a zona de demanda H4)\nInvalidación:  SL en 1.0820 (bajo el mínimo del swing) → 30 pips de riesgo\nObjetivo:  TP en 1.0910 (resistencia previa) → 60 pips → R:B = 1:2\n```\n\nSi no puedes escribir estas tres líneas con precisión, no hay operación — hay impulso. La invalidación se elige por **estructura** (mínimo/máximo del swing, M3), no por \"cuánto puedo soportar perder\".\n\n### Paso 5 · Calcular el tamaño de la posición (la fórmula que protege el capital)\n\nEl riesgo por operación en demo (y después en real micro) = **1 % del saldo**. El lote sale de la fórmula:\n\n$$\\text{lote} = \\frac{\\text{riesgo en \\$}}{\\text{SL en pips} \\times \\text{valor del pip por lote}}$$\n\nValores de pip del EUR/USD (convención estándar): 1 lote estándar (100 000 unidades) = 10 $/pip · 0,1 lote = 1 $/pip · 0,01 lote (micro) = 0,10 $/pip.\n\n**Ejemplo con números cerrados:** saldo demo 2 000 $ → riesgo 1 % = 20 $ → SL de 30 pips:\n\n$$\\text{lote} = \\frac{20}{30 \\times 10} = 0{,}066 \\Rightarrow \\text{redondear hacia abajo: } 0{,}06 \\text{ lotes}$$\n\nVerificación: 0,06 lotes × 30 pips × 10 $/pip/lote = 18 $ de riesgo real (0,9 % ✓). **Siempre se redondea hacia abajo**: el redondeo hacia arriba sube el riesgo sin decírtelo.\n\n### Paso 6 · Colocar SL y TP ANTES de entrar (orden OCO)\n\nUna **OCO** (*One Cancels the Other*) vincula tres órdenes: la entrada y sus dos salidas automáticas. Si el TP se ejecuta, el SL se cancela solo; y viceversa. Configura en la ventana de orden:\n\n- **Stop Loss:** 1.0820 (tu invalidación del Paso 4) — el broker ejecuta solo si el precio llega.\n- **Take Profit:** 1.0910 (tu objetivo del Paso 4).\n\nEl SL **nunca** se coloca \"después, cuando baje la emoción\". La receta lo prohíbe porque el mercado no espera tu valentía: entre el momento en que abres sin SL y el momento en que lo colocas, un dato macro puede haberte cobrado el mes.\n\n### Paso 7 · Ejecutar la entrada\n\n- **Limit** (en 1.0850): el sistema compra solo si el precio baja a tu zona. Es la entrada del setup planificado — la que usa esta receta.\n- **Market** (ahora): compra al precio bid/ask vigente. Solo si tu setup contemplaba entrada inmediata.\n\nEnvía la orden OCO completa y verifica en el panel de posiciones: entrada activa, SL visible, TP visible. **Si algo de los tres falta, corrige o cancela.**\n\n### Paso 8 · Gestionar (la parte más difícil: no hacer nada)\n\nReglas de gestión de la receta:\n\n1. **No muevas el SL** para \"darle aire\" (eso rompe el riesgo definido) ni lo acerques por pánico.\n2. **No muevas el TP** por codicia (\"va más lejos, quito el objetivo\").\n3. **No agregues posición** a una que va ganando (promedio al alza = el ADN de la martingala).\n4. Lo único permitido: observar, y cerrar manualmente SOLO si tu plan de M8 lo contempla (gestión por estructura). En esta primera receta: **no toques nada**.\n\n### Paso 9 · El cierre\n\nTres finales posibles, todos correctos:\n\n- **Toca el TP** → +60 pips (2R). El sistema hizo su trabajo.\n- **Toca el SL** → −30 pips (−1R). **Pérdida ≠ Error** (Lección 1.6): un SL tocado dentro del plan es una operación bien hecha que salió mal, como debe salir el 55-60 % de las veces con un R:B 1:2 sano.\n- **Toca tu regla de tiempo** (si el plan la define) → cierre manual documentado.\n\n### Paso 10 · Registrar en el journal (5 min, inmediato al cierre)\n\nCampos mínimos (la plantilla v0 del repo ya los trae en CSV):\n\n```text\nFecha/hora · Instrumento · Dirección (long/short) · Tipo de orden · Lote\nEntrada · SL · TP · Resultado (pips y $ / R) · ¿SL puesto antes de entrar? Sí/No\nSetup (texto de 1 línea) · Captura de pantalla · Estado emocional pre/post (1-10)\nError detectado (si lo hay) · Lección (1 línea)\n```\n\n### Paso 11 · Revisión con checklist: ¿fue PROCESADA?\n\nMarca cada casilla con honestidad radical:\n\n- [ ] Tenía análisis escrito ANTES de la entrada (Paso 3)\n- [ ] Entrada, invalidación y objetivo estaban definidos por escrito (Paso 4)\n- [ ] El tamaño salió de la fórmula, no de la intuición (Paso 5)\n- [ ] SL y TP estaban colocados antes de que la entrada se activara (Paso 6)\n- [ ] No toqué el SL, el TP ni agregué posición durante la operación (Paso 8)\n- [ ] El registro en journal está completo (Paso 10)\n\n**6/6 = operación PROCESADA.** Ese es el hito. Da igual si tocó TP o SL: una operación perdedora 6/6 es una victoria de proceso; una ganadora 3/6 es una bomba de tiempo que reforzó un mal hábito. Cuando acumules 10 operaciones demo procesadas, habrás completado la misión del Módulo 4 — y la mecánica ya no será tu enemiga.\n\n---\n\n## 🌶️ Fichas de variación por mercado\n\nLa receta maestra NO se repite para cada mercado: cambian solo estos parámetros. Todo lo demás (los 12 pasos) es idéntico.\n\n### Ficha · XAU/USD (oro)\n\n| Parámetro | EUR/USD (maestra) | XAU/USD | Por qué importa |\n|---|---|---|---|\n| Unidad | 1 lote = 100 000 € | 1 lote = 100 onzas | El cálculo de tamaño cambia de fórmula |\n| Valor de movimiento | 10 $/pip por lote estándar | 100 $ por cada 1 $ de movimiento del oro (lote estándar); 0,01 lote = 1 oz ≈ 1 $ por cada 1 $ | Un error de lote en oro pesa 10× más |\n| Spread típico | ~1–2 pips *(ilustrativo)* | ~0,20–0,40 $ *(ilustrativo — varía por bróker y sesión)* | El costo fijo por operación es mayor |\n| Volatilidad | Moderada | Alta: recorridos diarios de decenas de dólares *(ilustrativo)* | Los SL \"de forex\" se quedan cortos; SL por estructura más amplios → lote más pequeño |\n| Sesión preferente | Londres–NY | Nueva York (datos de EE. UU.) | El oro reacciona a tasas y DXY, que se mueven en horario de EE. UU. |\n| Drivers | Flujo entre economías | Tasas reales de EE. UU. (inversas), DXY (inverso), apetito de riesgo | El análisis del contexto difiere (M2.6) |\n\n**Ejemplo de tamaño en oro (números cerrados):** saldo 2 000 $ → riesgo 1 % = 20 $ → SL de 4,00 $ por onza → posición = 20/4 = 5 onzas = 0,05 lotes. Verificación: 0,05 × 100 oz × 4 $ = 20 $ ✓.\n\n### Ficha · Índices US30 / NAS100 (CFD)\n\n| Parámetro | EUR/USD (maestra) | Índices CFD | Por qué importa |\n|---|---|---|---|\n| Horario | 24/5 | Sesión de cash + sesión extendida; **gaps** de apertura | Una posición mantenida overnight puede abrir mañana muy lejos del cierre de hoy |\n| Gap de apertura | Casi nulo | Frecuente y de tamaño variable | El SL puede ejecutarse con *slippage* peor que el precio del stop |\n| Valor del tick | Estandarizado en pips | **Varía por bróker** — lee la especificación del contrato antes de calcular nada | Calcular el lote con el valor equivocado rompe todo el riesgo |\n| Spread típico | ~1–2 pips *(ilustrativo)* | Varios puntos, variable por sesión *(ilustrativo)* | El costo relativo sube en horas muertas |\n| Sesión preferente | Londres–NY | Apertura de NY (09:30 ET) y últimas 2 h | Donde se concentra el volumen y la señal |\n| Drivers | Flujo entre economías | Tasas, ganancias corporativas, apetito de riesgo | Contexto macro distinto (M2.6) |\n\n**Regla de oro para índices:** antes de la primera operación, abre la pestaña \"Especificaciones del contrato\" en tu plataforma y anota: valor del tick, tamaño del contrato, horarios y margen. Sin esos 4 datos, el Paso 5 no se puede calcular — y no se opera.\n\n---\n\n## 💵 ¿Y mi primer dólar?\n\nEs la pregunta correcta hecha en el momento equivocado. Aquí está el plan honesto del programa:\n\n| Etapa | Qué ganas | Qué significa |\n|---|---|---|\n| Demo (M4) | Tus primeros \"dólares simulados\" | **Evidencia de proceso**: la mecánica funciona bajo tus manos. No es ingreso; es ensayo |\n| Demo forward (M9) | Estadística propia: N ≥ 100 operaciones del mismo sistema | **Evidencia de esperanza**: tu E estimado, después de costos, con datos tuyos |\n| Real micro (Fase 4) | **Tu primer dólar real** | La consecuencia estadística de A y B, con riesgo 0,25–0,5 % y dinero quemable |\n\nEl primer dólar real de un profesional llega pequeño, tarde y sin drama — porque llegó autorizado por la estadística, no perseguido por la necesidad. El del 70-90 % llega primero, grande y con drama, y suele ser el último. La diferencia entre ambos no es el mercado: es **el orden de las etapas**. Esta receta te pone en el orden correcto desde el paso 0.\n\n---\n\n## 🧾 Checklist imprimible (versión de bolsillo)\n\n```text\nRECETA DE OPERACIÓN — [instrumento] — [fecha]\n□ 0-2  Demo lista · plataforma conocida · sesiones observadas\n□ 3    Régimen + zonas + dirección escritos (o \"no hay setup\")\n□ 4    Entrada / SL (invalidación) / TP escritos ANTES\n□ 5    Lote calculado con fórmula (riesgo 1 %, redondeo hacia abajo)\n□ 6    OCO colocada: SL y TP ANTES de que la entrada se active\n□ 7    Orden enviada y verificada en panel (entrada + SL + TP visibles)\n□ 8    Nada tocado durante la operación\n□ 9    Cierre: TP / SL / regla de tiempo — documentado\n□ 10   Journal completo (campos, captura, emoción pre/post)\n□ 11   6/6 checklist PROCESADA — sí / no → por qué\n```\n\n## 🔗 Conexiones del programa\n\n- **Antes de ejecutar los pasos 3–11:** [M2 · El Motor del Precio](../../02-modulos/mod-02-motor-del-precio/README.md) (sesiones y calendario macro) y [M3 · Anatomía del Gráfico](../../02-modulos/mod-03-anatomia-del-grafico/README.md) (zonas, estructura, régimen).\n- **Durante la ejecución:** [M4 · Plataforma y Primera Ejecución](../../02-modulos/mod-04-plataforma-y-primera-ejecucion/README.md) — la misión de 10 operaciones demo es exactamente \"10 recetas procesadas\".\n- **Después:** [M8 · Gestión del Riesgo](../../02-modulos/mod-08-gestion-del-riesgo/README.md) profesionaliza el Paso 5 (tamaño dinámico, correlación de cartera) y el M9 convierte el Paso 10 en tu base de datos de validación.\n"},{"i":5,"g":"🧱 M1 · El Trading como Negocio","t":"M1 · Hub del módulo","f":"docs/02-modulos/mod-01-negocio-trading/README.md","md":"# Módulo 1 · El Trading como Negocio y Ciencia\n\n> [!WARNING]\n> **Contenido educativo.** La mayoría de los traders minoristas pierde dinero (estudios de reguladores estiman entre 70 % y 90 %). El trading conlleva riesgo de pérdida total del capital. Nada en este repositorio constituye asesoría financiera.\n\n| Campo | Detalle |\n|---|---|\n| 🧱 Nivel | 1 · Fundamentos |\n| 📦 Módulo | 1 de 12 (FIT-12) |\n| 🔬 Trazabilidad | 003 · M1.1–1.4, M7.5 · 004 · M1.1, M10 · **Aporte propio:** mapa de 3 dimensiones (estilos × mercados × vehículos), contrato anti-ludopatía, presupuesto de expectativas |\n| ⏱️ Duración estimada | 3,5–4,5 h de teoría + 2–3 h de laboratorio/misión/quiz |\n| 📋 Estado | 🟢 Publicado (Sprint 1) |\n\n---\n\n## 🎯 Objetivo del Módulo\n\nInstalar la mentalidad correcta **antes de tocar un gráfico**. Al terminar este módulo sabrás qué es el trading como negocio (y qué no es), habrás desmontado las cinco mentiras estructurales de la industria, dominarás el mapa completo estilos × mercados × vehículos para elegir tu coordenada, podrás calcular la esperanza matemática de cualquier sistema con números cerrados, y habrás fijado por escrito tus expectativas, tu presupuesto y tus límites en la Carta de Expectativas. Este módulo existe primero porque todo lo que sigue presupone un operador que piensa como comerciante y no como apostador — la técnica sin este cimiento es una sierra en manos de quien no sabe lo que corta.\n\n## 📚 Lecciones\n\n| # | Lección | Esencia | Tiempo |\n|---|---|---|---|\n| 1.1 | [Qué es realmente el trading](leccion-1-1.md) | Especulación como negocio: capital de inventario, costos por venta, esperanza como único KPI de salud | 30–40 min |\n| 1.2 | [Las 5 mentiras de la industria](leccion-1-2.md) | Desmontaje de las promesas estructurales + protocolo de auditoría de 4 filtros | 30–40 min |\n| 1.3 | [El mapa completo: 3 dimensiones](leccion-1-3.md) | 5 estilos × 6 mercados × 5 vehículos; método de 4 pasos para elegir TU coordenada | 45–60 min |\n| 1.4 | [La esperanza matemática](leccion-1-4.md) | $E = (P_w \\times W) - (P_l \\times L)$: por qué el Win Rate engaña, costos, ruido y fractalidad | 45–60 min |\n| 1.5 | [La curva de aprendizaje real](leccion-1-5.md) | Analogía médica, 4 fases de competencia, por qué 12 meses es el mínimo estadístico | 30–40 min |\n| 1.6 | [Expectativas y presupuesto](leccion-1-6.md) | Costo real de formarse, rangos honestos, dinero quemable, doble carril, presupuesto de expectativas | 30–40 min |\n\n> [!TIP]\n> **Cómo estudiar este módulo:** dile a tu agente *\"Siguiente lección\"* y sigue el protocolo de sesión de estudio (§ 5.3 de `agents.md`): repaso activo → lección → quiz rápido → misión. Cada lección termina con autoevaluación: intenta responder ANTES de abrir las respuestas.\n\n## 🧪 Laboratorio · Auditoría Personal\n\n**Materiales:** una semana real de tu vida como muestra, hoja de cálculo o papel, calculadora, y una hora de honestidad sin testigos. No se necesita plataforma ni dinero.\n\n**Procedimiento paso a paso:**\n\n1. **Audita tu tiempo (7 días).** Registra los bloques de tiempo concentrado REALMENTE disponibles de una semana normal: hora de inicio, hora de fin y nivel de concentración (alto/medio/bajo). No cuentes tiempo \"que te gustaría tener\": cuenta el que hay. Incluye tu huso horario y anota qué hora es en Nueva York y Londres en cada bloque (lo necesitarás desde el Módulo 2).\n2. **Audita tu capital con el test del sueño.** Escribe tu capital total y aplícale el test de la Lección 1.6: ¿su pérdida TOTAL te dejaría durmiendo tranquilo? El número que sobrevive al test es tu **capital quemable**; el resto queda fuera del trading por definición. Define además tu **matrícula máxima** (5–10 % del quemable *(heurística)*) y tu **runway**: cuántos meses de vida paga tu Carril A sin tocar capital de trading.\n3. **Aplica el test de tolerancia.** Responde por escrito, sin adornos: ¿puedes ver una posición en −1R sin cerrarla antes de tiempo? ¿Puedes pasar un fin de semana con posición abierta sin mirar el gráfico cada hora? ¿Cuántas horas seguidas de pantalla te agotan? Tus respuestas eliminan estilos con la misma fuerza que tu agenda.\n4. **Cruza el mapa y elige tu coordenada tentativa.** Con horas + capital + tolerancia, recorre el método de 4 pasos de la Lección 1.3 y fija UNA coordenada: estilo × mercado × vehículo (en demo). Escribe la justificación en tres frases: por qué encaja con tu vida y qué estilos descartaste por qué motivo.\n5. **Escribe tus tres cifras límite.** Riesgo por operación para cuando llegues a real micro (0,25–0,5 % del capital), matrícula máxima de formación, y horas semanales comprometidas. Estas tres cifras pasarán a tu Carta de Expectativas.\n\n**Entregable:** la tabla de auditoría completa (horas, capital, tolerancia) + coordenada tentativa justificada + tres cifras límite, guardada en `journal/` como `auditoria-personal-m1.md`. Este documento es insumo directo del Plan de Trading del Módulo 12.\n\n## 🎯 Misión\n\n> [!IMPORTANT] Misión M-1 · Carta de Expectativas y Contrato Anti-Ludopatía\n> **Objetivo:** fijar por escrito, antes de tocar cualquier gráfico, qué esperas, qué te comprometes a NO hacer y con qué dinero operas — el \"cálculo de caja\" del negocio que estás abriendo.\n> **Entregable:** `journal/carta-expectativas-m1.md` con las cuatro secciones de abajo + el contrato firmado (nombre y fecha).\n> **Criterio de aceptación:** (1) expectativas con rangos y plazos, no deseos; (2) cinco prohibiciones concretas y verificables, no vagas; (3) cifras cerradas de capital quemable, matrícula máxima y riesgo por operación; (4) contrato completo con firma y fecha.\n> **Etiqueta en journal:** `mision-1-carta` · **Tiempo estimado:** 60–90 min.\n\n**Sección 1 — Qué espero (honesto).** Tus expectativas para los próximos 12 meses en rangos verificables: horas que invertirás, qué esperarás de ti mismo en ejecución (no en dinero), qué hitos del programa (módulos, evaluaciones, backtest de 100 operaciones) planeas cruzar y en qué orden. Referencia honesta de techo: 15–30 % anual es territorio de elite profesional *(heurística)* — tu objetivo del año 1 es sobrevivir con proceso documentado.\n\n**Sección 2 — Qué me comprometo a NO hacer.** Cinco prohibiciones concretas, redactadas por ti, verificables por un tercero. Ejemplos del formato correcto: *\"No abriré posición alguna sin Stop Loss colocado en la misma orden\"* · *\"No arriesgaré más de 0,5 % de la cuenta en una sola operación durante la formación\"* · *\"No operaré en los 30 minutos alrededor de publicaciones macro de alto impacto\"* · *\"No intentaré ninguna cuenta de fondeo antes de 12 meses de consistencia documentada en journal\"*. Formato incorrecto: *\"seré disciplinado\"* (no verificable).\n\n**Sección 3 — Con qué dinero.** Las tres cifras de tu auditoría: capital quemable (con el test del sueño aplicado y su resultado), matrícula máxima de formación, riesgo por operación. Una línea que lo amarra todo: *\"Este dinero puede quemarse por completo y mi vida seguirá igual.\"*\n\n**Sección 4 — Contrato anti-ludopatía.** Copia íntegra, con tu firma y fecha:\n\n```text\nCONTRATO ANTI-LUDOPATÍA — Academia de Trading FIT-12\n\n1. Opero solo con dinero quemable: jamás dinero de supervivencia,\n   de terceros, ni prestado.\n2. Jamás operaré para recuperar una pérdida. Una posición nueva\n   se justifica por su setup, nunca por el saldo del día.\n3. Toda posición llevará Stop Loss definido ANTES de entrar,\n   en la misma orden.\n4. No cambiaré el tamaño de riesgo por estado de ánimo: fijo en\n   formación, modificado solo por escrito y con el sistema callado.\n5. Registraré TODAS las operaciones en el journal, incluidas las\n   vergonzosas. Lo que no se registra no existe.\n6. No ocultaré pérdidas — a nadie ni a mí mismo.\n7. Si pierdo la matrícula máxima de formación: PARO, vuelvo a demo\n   y no recargo el capital. El límite existe para respetarse.\n8. No operaré sin dormir, enfermo, alcoholizado o bajo un estrés\n   que no pueda nombrar en voz alta.\n9. El trading no es mi plan A de ingresos hasta que 12 meses de\n   datos en journal digan lo contrario.\n10. Solo puedo romper este contrato por escrito, explicando por qué,\n    aceptando que probablemente estoy en tilt.\n\nFirma: ____________________  Fecha: ____________\n```\n\n## ✅ Evaluación / Criterio de Graduación\n\n| Requisito | Umbral |\n|---|---|\n| Carta de Expectativas completa (4 secciones + contrato firmado) | 100 % de las secciones con criterios de aceptación cumplidos |\n| Auditoría personal entregada en `journal/` | Tabla completa + coordenada justificada + 3 cifras límite |\n| Quiz de graduación (abajo) | ≥ 8 de 10 aciertos |\n\nEl quiz se rinde con el agente (él te hace las preguntas una a una y corrige con la rúbrica), o en autoestudio con las respuestas ocultas. Falló una pregunta de riesgo — la 10 — se repasa la Lección 1.6 completa antes de reintentar, aunque el total sea ≥ 8.\n\n### Quiz de graduación · 10 preguntas\n\n1. Un sistema gana 45 % de las veces; su ganancia media es de 200 y su pérdida media de 100. ¿Cuál es su esperanza por operación?\n   A) +35 · B) −35 · C) +45 · D) +90\n2. ¿Cuál de estos sistemas es rentable? A) WR 90 %, gana 20, pierde 190 · B) WR 40 %, gana 150, pierde 90 · C) WR 60 %, gana 40, pierde 100 · D) Todos los anteriores pierden dinero\n3. Con un Risk:Reward de 1:2, ¿qué Win Rate mínimo necesita un sistema para no perder dinero? A) 50 % · B) 40 % · C) 33,3 % · D) 25 %\n4. Dos sistemas idénticos excepto que uno opera un spread de 1 pip sobre movimientos típicos de 8 pips y el otro sobre movimientos de 40 pips. ¿Qué diferencia estructural espera entre ellos?\n5. La esperanza de un sistema debe calcularse… A) antes de costos · B) después de costos · C) solo en demo · D) solo con operaciones ganadoras\n6. Clasifica en las 3 dimensiones: \"mantengo compras de XAU/USD abiertas 6 días, operadas vía CFD\". Estilo / Mercado / Vehículo.\n7. Un estudiante con empleo de oficina de 40 h/semana (9:00–18:00), 8–10 h libres en noches y fines de semana, huso horario alejado de Nueva York. ¿Qué coordenada es la más coherente? A) Scalping de índices en la apertura de NY · B) Day trading de cripto en horario laboral · C) Swing en H4/D1 sobre Forex o índices · D) Position trading de bonos con revisión intradía\n8. \"CFD, futuros, opciones, spot, ETF\" son las opciones de qué dimensión del mapa? ¿Y qué decide su elección correcta?\n9. La \"regla anti-nomadeo\" del programa dice… A) cambiar de mercado cada mes para diversificar · B) mínimo 3 meses en una coordenada antes de juzgarla, y cambios solo con datos del journal · C) operar varios estilos a la vez · D) cambiar de estilo tras 5 pérdidas seguidas\n10. Dinero quemable es… A) el saldo total de tu cuenta bancaria · B) dinero prestado con intención de devolverlo con ganancias · C) aquel cuya pérdida TOTAL no cambia tu vida ni la de quien depende de ti · D) el capital que \"probablemente\" no necesites este mes\n\n<details>\n<summary>🔑 Clave de respuestas (no abrir antes de responder)</summary>\n\n1. **A** — $E = 0{,}45 \\times 200 - 0{,}55 \\times 100 = 90 - 55 = +35$.\n2. **B** — $E_B = 0{,}40 \\times 150 - 0{,}60 \\times 90 = 60 - 54 = +6$ por operación, con solo 4 de cada 10 aciertos. El A tiene $E = 18 - 19 = -1$ (acierta el 90 % y pierde); el C tiene $E = 0{,}60 \\times 40 - 0{,}40 \\times 100 = 24 - 40 = -16$. La lección entera de la Lección 1.4 está en esta pregunta.\n3. **C** — $WR_{equilibrio} = \\frac{1}{1+2} = 33{,}3\\%$.\n4. El primero paga un impuesto de costo relativo de $1/8 = 12{,}5\\%$ por operación contra $1/40 = 2{,}5\\%$ del segundo: cinco veces más. Operar marcos de tiempo bajos exige que el sistema genere mucha más esperanza bruta para dejar la misma esperanza neta — es el problema estructural del scalping (ruido + costos relativos + frecuencia de decisiones).\n5. **B** — después de costos: spread y comisión se pagan en cada operación, ganadora o perdedora; la esperanza bruta es una ilusión contable.\n6. Swing trading · Mercado de commodities (oro, XAU/USD) · Vehículo CFD.\n7. **C** — sus ventanas reales (noches y fines de semana) y su horario laboral eliminan el intradía de sesión americana; la estructura de H4/D1 con revisión diaria corta encaja exactamente en sus bloques.\n8. La dimensión **vehículo**; la elección correcta la decide conjuntamente el tamaño del capital (tamaño mínimo de contrato), la estructura de costos y el perfil de riesgo del estilo — nunca se elige el vehículo sin el tamaño de posición (Módulo 8).\n9. **B** — una coordenada, mínimo tres meses, cambios solo justificados con datos del journal: cada cambio reinicia la curva de aprendizaje.\n10. **C** — la definición del test del sueño. B es su antítesis (dinero prestado para trading = capital de supervivencia disfrazado). D es la trampa clásica del \"casi quemable\".\n\n</details>\n\n## 📖 Glosario del Módulo\n\n| Término | Inglés | Definición |\n|---|---|---|\n| Especulación | *speculation* | Compra/venta de activos para capturar diferencias de precio en plazos cortos, asumiendo riesgo deliberado |\n| Inversión | *investing* | Adquisición de activos por años para capturar su crecimiento subyacente |\n| Horizonte temporal | *time horizon* | Duración prevista de una posición o estrategia |\n| Liquidez | *liquidity* | Facilidad de comprar/vender tamaño sin mover el precio |\n| Proveedor de liquidez | *liquidity provider* | Agente cuyas órdenes pasivas permiten ejecutar las órdenes ajenas |\n| Spread | *spread* | Diferencia entre precio de compra y de venta; costo fijo por operación |\n| Esperanza matemática | *expected value* | Resultado medio esperado por operación: $E = (P_w \\times W) - (P_l \\times L)$ |\n| Win Rate | *win rate* | Porcentaje de operaciones ganadoras sobre el total |\n| Ratio riesgo-beneficio | *Risk:Reward (R:B)* | Relación entre la pérdida media y la ganancia media de un sistema |\n| R (unidad de riesgo) | *risk unit* | Cantidad arriesgada en una operación; las ganancias se miden en múltiplos de R |\n| Varianza | *variance* | Dispersión de resultados alrededor de la esperanza; explica rachas sin cambiar E |\n| Martingala | *martingale* | Gestión que dobla el tamaño tras pérdidas: WR alto aparente y ruina casi segura |\n| Fractalidad (autosimilar) | *self-similarity* | Las mismas formaciones aparecen en todo marco temporal, pero no idénticas ni al mismo costo |\n| Ruido | *noise* | Fluctuación de precio sin información; domina los marcos de tiempo bajos |\n| Position trading | *position trading* | Estilo con posiciones de semanas a meses |\n| Swing trading | *swing trading* | Estilo con posiciones de días a dos semanas |\n| Day trading | *day trading* | Estilo que abre y cierra dentro del mismo día, sin riesgo overnight |\n| Scalping | *scalping* | Estilo de segundos a minutos, máxima frecuencia y costo de transacción crítico |\n| Algo trading | *algorithmic trading* | Ejecución de reglas por software; el oficio es auditar la máquina |\n| Nomadeo | *strategy hopping* | Cambiar de coordenada (estilo/mercado) sin datos: reinicia la curva de aprendizaje |\n| Riesgo overnight | *overnight risk* | Exposición a gaps y eventos con la posición abierta fuera de sesión |\n| Spot | *spot* | Compra/venta al contado, sin apalancamiento estructural |\n| CFD | *contract for difference* | Derivado que replica la diferencia de precio; apalancado, sin vencimiento |\n| Futuros | *futures* | Contrato estandarizado con vencimiento y tamaño fijo, operado en bolsa |\n| Opciones | *options* | Derecho (no obligación) de comprar/vender a precio pactado; asimetría estructural |\n| ETF | *exchange-traded fund* | Fondo cotizado réplica de un activo o índice; vehículo de inversión pasiva |\n| Prop firm | *funded trading firm* | Empresa que alquila capital tras una evaluación de pago; vive mayormente de cuotas |\n| Screen time | *screen time* | Horas deliberadas de observación registrada que fabrican el reconocimiento de patrones |\n| Régimen de mercado | *market regime* | Estado del mercado (tendencia, rango, volatilidad alta/baja) que cambia el comportamiento de todo sistema |\n| Racha | *streak* | Secuencia de resultados iguales consecutivos; esperable por varianza |\n| Backtesting | *backtesting* | Validación de un sistema sobre histórico a ciegas; mínimo estadístico N ≥ 100 |\n| Drawdown | *drawdown* | Caída desde el pico de la curva de capital hasta su punto más bajo |\n| Capital quemable | *risk capital* | Dinero cuya pérdida total no cambia tu vida ni la de quien depende de ti |\n| Matrícula de mercado | — | Pérdidas presupuestadas de la fase de formación en real micro |\n| Runway | *runway* | Meses de vida que tu Carril A paga sin tocar el capital de trading |\n| Ruina del jugador | *gambler's ruin* | Probabilidad de caer a cero por tamaño excesivo, aun con esperanza positiva |\n| Cuenta demo | *demo account* | Cuenta de práctica con dinero ficticio y precios reales |\n| Tilt | *tilt* | Estado emocional que degrada la ejecución; origen de la mayoría de las catástrofes |\n\n## 🔗 Referencias\n\n- [SYLLABUS.md § 5 · Módulo 1](../../01-syllabus/SYLLABUS.md)\n- [analisis_cursos.md — insumos 003/004 y vacíos cubiertos](../../00-analisis/analisis_cursos.md)\n- [agents.md — protocolo de sesión de estudio § 5.3](../../../agents.md)\n- Siguiente módulo: M2 · El Motor del Precio — se construye en el Sprint 2 una vez aprobado este módulo (sin enlace hasta existir)\n"},{"i":6,"g":"🧱 M1 · El Trading como Negocio","t":"1.1 · Qué es realmente el trading","f":"docs/02-modulos/mod-01-negocio-trading/leccion-1-1.md","md":"# Lección 1.1 · Qué es realmente el trading\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 30–40 min de estudio |\n| 🧱 Módulo | [M1 · El Trading como Negocio y Ciencia](README.md) |\n| ➡️ Siguiente | [Lección 1.2 · Las 5 mentiras de la industria](leccion-1-2.md) |\n\n---\n\n## Por qué importa\n\nLa mayoría de las personas llega al trading con el modelo mental de una lotería: pones dinero, aciertas o no, y si \"estás inspirado\" ganas mucho. Ese modelo es, por sí solo, la primera causa de cuentas destruidas, porque decide el tamaño de tus posiciones, tu paciencia y tu reacción ante la pérdida. Antes de tocar un gráfico necesitas reemplazarlo por el modelo correcto: el trading es un **negocio de compra y venta** con reglas, costos fijos e inventario. Todo lo que aprenderás en los 11 módulos restantes presupone que ya piensas como comerciante, no como apostador. Esta lección instala ese cambio de sombrero, y es la base sobre la que se apoya el contrato de expectativas que firmarás al final del módulo.\n\n## Concepto\n\nEl trading es **especulación** (*speculation*): la compra y venta de activos financieros para capturar diferencias de precio en plazos que van de segundos a meses, asumiendo el riesgo de mercado de forma deliberada y regulada. Se diferencia de la **inversión** (*investing*) en tres ejes: el horizonte temporal (*time horizon*) —días o semanas contra años—, la fuente del retorno —desequilibrios de precio a corto plazo contra el crecimiento subyacente del activo— y el análisis dominante —lectura estadística del precio y del flujo de órdenes contra el análisis fundamental de largo plazo. Ninguna de las dos actividades es \"mejor\": son negocios distintos, con horas de trabajo distintas y con perfiles psicológicos distintos.\n\nHay una segunda definición, más honesta y menos romántica: al abrir una posición, el minorista se convierte en un **proveedor de liquidez** (*liquidity provider*) en miniatura. Tu orden de compra permite que un fondo institucional venda tamaño sin desplazar el precio en exceso, y tu orden de venta hace el trabajo inverso. Esa intermediación tiene un valor real para el mercado — los bancos y *market makers* cobran por ejercerla profesionalmente —, y tu única forma de cobrarla como minorista es capturar más de lo que los costos de transacción (*spread*, comisiones) te quitan por ejercerla. Si tu operativa no produce esperanza matemática positiva **después de costos**, tu negocio está vendiendo su servicio a pérdida, indefinidamente.\n\nY la tercera definición, la que gobierna todo este programa: el trading es un **negocio** con inventario (tu capital), producto (operaciones ejecutadas según un sistema), costos fijos y variables (spread, comisión, herramientas, tu tiempo) y un único indicador de salud: la esperanza matemática por operación. Las tiendas que ignoran sus costos quiebran aunque vendan mucho; los traders que ignoran los suyos hacen exactamente lo mismo, solo que más rápido.\n\n## Analogía\n\nImagina una tienda de barrio de repuestos. El tendero compra inventario a 10 y lo vende a 13: su margen es 3 por unidad, y de ahí paga alquiler, luz y su propio sueldo. Tres reglas de su negocio se traducen directamente al trading. Primera: **no se enamora del inventario** — si un artículo no se vende, lo liquida con descuento para recuperar caja y comprar lo que sí rota; el trader que \"ama\" su posición perdedora es el tendero que deja pudrir la mercancía. Segunda: **conoce su costo fijo por venta** — el *spread* y la comisión son tu alquiler y tu luz, y se pagan en cada operación, ganadora o perdedora. Tercera: **protege el capital de re-compra** — si gasta la caja, la tienda cierra aunque tuviera buenos proveedores; tu capital es tu caja, y por eso este programa repite hasta el cansancio: preservación antes que ganancia.\n\n## Cómo se hace: distinguir inversión de trading en la práctica\n\nAntes de tu primera operación (que ocurrirá en el Módulo 4, en demo) debes poder clasificar cualquier actividad financiera en la columna correcta. Usa esta tabla como filtro:\n\n| Dimensión | Inversión | Trading |\n|---|---|---|\n| Horizonte típico | Años (5–20) | Segundos a semanas |\n| Fuente del retorno | Crecimiento del activo (beneficios, dividendo) | Desequilibrios de oferta/demanda de corto plazo |\n| Herramienta dominante | Análisis fundamental, asignación por clases de activos | Análisis técnico, estadística, lectura de flujo |\n| Riesgo por decisión | Difuso y lento (el mercado cae 30 % en un año malo) | Definido y rápido (el *Stop Loss* acota la pérdida antes de entrar) |\n| Métrica de éxito | Patrimonio total a largo plazo | Esperanza matemática por operación, ejecución del proceso |\n| Tiempo semanal | Minutos al mes | Horas al día o a la semana, según estilo |\n\nEjemplo con números cerrados *(ilustrativo)* de la misma persona haciendo cada cosa con 5 000:\n\n- **Como inversora:** compra un ETF de índice por 5 000, aporta 100 al mes, no mira la cotización más de una vez al mes y planea mantenerlo 10 años. Su peor escenario razonable es un ciclo bajista prolongado, no una cuenta a cero.\n- **Como trader:** en una cuenta de 5 000, arriesga 50 (el 1 %) por operación, coloca el *Stop Loss* a 20 pips y el objetivo a 40 pips, y cierra la posición en 2–3 días. Su pérdida máxima **por idea** está definida antes de entrar: 50, ni un centavo más si respeta su propia regla.\n\nLa misma cifra de partida, dos negocios completamente distintos. El error clásico del principiante es hacer el segundo creyendo que hace el primero: entra con mentalidad de inversor (\"a largo plazo recupera\") sobre posiciones apalancadas de corto plazo. Ese híbrido no existe como estrategia: es simplemente no haber decidido qué negocio se tiene.\n\n## Error común\n\nEl más frecuente es definir el trading como \"adivinar la dirección del precio\". El trabajo real no es acertar: es **ejecutar un proceso con esperanza matemática positiva** repetidas veces, con riesgo controlado. Un trader puede acertar 9 de 10 operaciones y perder dinero, y puede acertar solo 4 de 10 y ser rentable — la Lección 1.4 demuestra ambos casos con números. El segundo error, casi tan grave, es creer que el trading es \"ingreso pasivo\": es un oficio activo con horas de análisis, registro y revisión, y quien lo venda como pasivo te está vendiendo otra cosa (la Lección 1.2 desmonta esa promesa). El antídoto para ambos errores es el mismo: define de qué negocio participas, con qué costos y con qué indicador de salud — y acepta que ese indicador es la ecuación, no tu sensación de acierto.\n\n## Conexión cuantitativa\n\nComo proveedor de liquidez en miniatura, tu compensación esperada por operación es exactamente la esperanza matemática:\n\n$$E = (P_w \\times W) - (P_l \\times L)$$\n\ndonde $P_w$ es la probabilidad de ganar, $W$ la ganancia media, $P_l = 1 - P_w$ y $L$ la pérdida media. El negocio completo se lee desde aquí: cada operación es una \"venta\" que deja $E$ en la caja **antes** de descontar spread y comisión; si $E \\le 0$ después de costos, la tienda pierde dinero en cada cliente que atiende. No existe volumen, disciplina ni motivación que compense una esperanza negativa: solo cambia la velocidad a la que se pierde. Por eso este módulo no contiene ni un solo indicador técnico todavía: primero el modelo de negocio, después la técnica.\n\n---\n\n## 🎯 Puntos clave\n\n1. Trading = especulación organizada como negocio: comprar/vender para capturar diferencias de precio, con capital como inventario.\n2. No es inversión: horizonte, fuente de retorno y análisis son distintos — decidir cuál de los dos negocios tienes es obligatorio antes de operar.\n3. Tu rol de mercado: proveedor de liquidez en miniatura; cobras esa función solo si tu esperanza supera los costos de transacción.\n4. Tu indicador de salud único no es el acierto, es $E$ por operación después de costos.\n5. Regla del negocio: preservación del capital antes que ganancia — sin caja no hay re-compra.\n\n## 🔄 Autoevaluación rápida\n\n1. Un amigo te dice: \"compré acciones de una tecnológica apalancado 20:1 porque a largo plazo siempre sube\". ¿Qué error de modelo está cometiendo?\n2. ¿Por qué el spread es análogo al alquiler de la tienda, y qué implica eso para un sistema que gana muy poquito por operación?\n3. ¿Puede un trader con 40 % de aciertos ser rentable? ¿Qué falta saber antes de responder?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Mezcla los dos negocios: usa análisis de largo plazo (\"siempre sube\") sobre un vehículo apalancado de corto plazo, donde el riesgo por decisión es rápido y definido. Con apalancamiento 20:1, una caída del 5 % liquida la cuenta mucho antes de que \"largo plazo\" llegue a pasar.\n2. El spread se paga en cada operación, como el alquiler se paga cada mes, ganando o perdiendo. Un sistema con margen bruto minúsculo por operación puede ser rentable en papel y perderlo todo en costos: la esperanza debe calcularse después de descontarlos.\n3. Sí puede — y la pregunta correcta no es el porcentaje de aciertos sino la relación entre ganancia media y pérdida media. Con 40 % de aciertos y ratio 1:2 ya hay beneficio (Lección 1.4). El *Win Rate* aislado no dice nada.\n\n</details>\n"},{"i":7,"g":"🧱 M1 · El Trading como Negocio","t":"1.2 · Las 5 mentiras de la industria","f":"docs/02-modulos/mod-01-negocio-trading/leccion-1-2.md","md":"# Lección 1.2 · Las 5 mentiras de la industria\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 30–40 min de estudio |\n| 🧱 Módulo | [M1 · El Trading como Negocio y Ciencia](README.md) |\n| ⬅️ Anterior | [Lección 1.1 · Qué es realmente el trading](leccion-1-1.md) |\n| ➡️ Siguiente | [Lección 1.3 · El mapa completo: 3 dimensiones](leccion-1-3.md) |\n\n---\n\n## Por qué importa\n\nLa industria que vende formación, señales y fondeo tiene un problema estructural: **el resultado deseado (riqueza rápida) vende muchísimo mejor que el producto real (un oficio de años)**. Por eso su marketing empaqueta mentiras concretas, medias verdades y testimonios seleccionados. Tú vas a cruzar ese marketing durante toda tu carrera — en anuncios, en redes, en la boca de otros principiantes — y cada mentira que interiorices se convierte después en un comportamiento concreto que destruye cuentas: sobretamaño, abandono de la rutina, urgencia por operar en real. Esta lección funciona como vacuna: desmonta las cinco promesas más repetidas y te entrega un protocolo de auditoría para evaluar cualquier oferta futura. El objetivo no es volverte cínico (\"todo es estafa\" es también un error); es volverte selectivo.\n\n## Concepto\n\nEstas son las cinco mentiras estructurales del marketing del trading, cada una con la realidad que la contradice y el comportamiento letal que induce:\n\n**Mentira 1 — \"Ganarás mucho y rápido.\"** La realidad: los estudios de reguladores estiman que entre el 70 % y el 90 % de las cuentas minoristas pierde dinero. Quienes llegan a ser rentables lo consiguen después de años de formación deliberada, y su rendimiento sostenido se parece más al de un negocio bien gestionado que al de una lotería ganada. El comportamiento que induce: operar tamaños grandes para \"acelerar\", que multiplica la velocidad de pérdida exactamente cuando menos habilidad tienes.\n\n**Mentira 2 — \"Playa, portátil y libertad financiera.\"** La realidad: la libertad, si llega, es el resultado final de la consistencia — no la condición inicial. El oficio real tiene rutina de horarios, revisión semanal de operaciones, registro contable y sesiones de análisis. El swing trader revisa el mercado todos los días aunque solo opere dos veces por semana; el day trader tiene una ventana fija de trabajo de varias horas. El comportamiento que induce: tratar el trading como hobby sin KPIs ni horarios, abandonando justo lo que lo vuelve un negocio.\n\n**Mentira 3 — \"Con una hora al día es suficiente.\"** La realidad: para operar *position trading* a largo plazo puede bastar poco tiempo de seguimiento — pero **aprender** exige mucho más: backtesting manual, revisión de operaciones, estudio. La intuición que ves en los traders expertos es reconocimiento de patrones comprimido, fabricado con cientos de horas de pantalla (*screen time*) deliberada y registrada. El comportamiento que induce: saltarse la fase de práctica profunda y llegar a la operativa real con \"conocimiento de video\" en lugar de repeticiones propias.\n\n**Mentira 4 — \"Serás rentable en 3 meses.\"** La realidad: el consenso honesto de la formación seria sitúa la consistencia a 12 meses o más de trabajo estructurado, y con una proporción alta de estudiantes que nunca la alcanzan. Tres meses ni siquiera alcanzan para atravesar un cambio de régimen de mercado completo. El comportamiento que induce: pasar a dinero real (o a un challenge de fondeo) a los tres meses \"porque ya lo domino\", financiando con fees y pérdidas una licencia que aún no existe.\n\n**Mentira 5 — \"El fondeo te da el capital.\"** La realidad: las **prop firms** (*funded trading firms*) viven mayoritariamente de las cuotas de evaluación, no de la exitosa operativa de sus fondeados — los datos divulgados por la propia industria indican que alrededor del 92 % de los desafíos fracasa y que la fracción que logra fondeo sostenido ronda el 0,07 % *(snapshot: cifras divulgadas por directivos de FTMO y datos filtrados de My Forex Funds; verifica el estado actual antes de decidir)*. Usarlas como herramienta de capitalización **después** de la consistencia puede tener sentido; usarlas como plan A de ingresos es comprar un boleto de lotería con esperanza fuertemente negativa. El comportamiento que induce: pagar cuotas repetidas de evaluación como si fueran una inversión, cuando son el producto que el negocio vende.\n\n## Analogía\n\nLa fiebre del oro: en 1849, miles partieron a California convencidos de la riqueza rápida. Los que casi nunca fallaron no eran los buscadores: eran los que les vendían palas, pantalones resistentes y pasaje — un ingreso garantizado por la esperanza ajena. La industria del trading tiene la misma estructura: academias, vendedores de señales, influencers con coches alquilados y prop firms cobran por adelantado, sin importar si tú encuentras oro. Esto no significa que no exista oro — existe, y algunos lo encuentran con método —, significa que **tu P&L no es el modelo de negocio de quien te vende la pala**. Cuando evalúes cualquier oferta, pregunta primero: ¿esta persona gana si yo gano, o gana si compro?\n\n## Cómo se hace: protocolo de auditoría de promesas\n\nAnte cualquier curso, señal, mentor o fondeo, aplica los cuatro filtros en orden. Si falla dos o más, descártalo:\n\n1. **¿Vende proceso o vende resultados?** Contenido legítimo enseña metodología verificable (reglas, criterios, gestión de riesgo); humo muestra resultados, coches y testimonios. Una cuenta rentable se puede demostrar con registro auditado de operaciones (por ejemplo, verificadores públicos de curva de capital); las capturas sueltas de pantalla no prueban nada.\n2. **¿El ingreso del vendedor depende de tu éxito o de tu cuota?** Mentoría con participación en resultados reales es rara pero existe; la academia que cuela 500 alumnos por promoción a 300 cada uno — 150 000 por cohorte *(ilustrativo)* — es un negocio de matrícula, no de traders graduados. Ambos pueden ser honestos, pero solo el segundo necesita que tú *creas* en la mentira 1.\n3. **¿Puedes verificar las cifras?** \"Rentabilidad del 97 % de nuestros alumnos\" sin datos auditables es marketing. Busca: muestra de operaciones con fecha y hora, drawdown publicado, verificación de terceros. Si no hay drawdown, no hay honestidad: toda curva real tiene caídas.\n4. **¿Promete plazos o rentabilidades concretas?** \"Rentable en 3 meses\", \"10 % mensual garantizado\": descarte automático. Nadie serio puede prometer un resultado que depende de un mercado que nadie controla — y quien lo promete está violando la mentira 4 con tu dinero.\n\nRegistra tu veredicto por escrito aunque sea para ti mismo: la práctica de auditar antes de creer es exactamente el músculo que usarás después para auditar tus propios resultados en el journal (Módulo 9).\n\n## Error común\n\nEl primero es pensar \"a mí no me van a engañar\": el ego es el vector de entrada favorito del marketing, porque las mentiras están diseñadas para halagar tu inteligencia (\"esto es lo que los ricos no quieren que sepas\"). El segundo es el extremo opuesto: concluir que \"todo es estafa\" y no formarse nunca — un error igual de costoso, porque la autodidaxia pura sin brújula suele terminar en la pérdida de matrícula de mercado (Lección 1.5) sin haber aprendido el oficio. El punto de equilibrio es el protocolo de arriba: auditador escéptico con cursos verificables, no creyente ni nihilista.\n\n## Conexión cuantitativa\n\nCada mentira empuja una variable de la ecuación $E = (P_w \\times W) - (P_l \\times L)$ en la dirección equivocada. La mentira 1 (ganarás mucho) infla el tamaño por operación — no cambia $E$ por trade pero multiplica la varianza y la velocidad de ruina. La 2 y la 3 (libertad, una hora al día) recortan las horas de práctica que construirían el $P_w$ real del sistema. La 4 (rentable en 3 meses) te hace cobrar $E$ con dinero real cuando todavía es negativa. La 5 (el fondeo te da capital) añade una esperanza negativa adicional — la cuota de evaluación — sobre un sistema aún no validado: pagas por cobrar tu propia E negativa. La vacuna cuantitativa es siempre la misma pregunta: ¿qué evidencia numérica, verificable y después de costos, respalda esta promesa?\n\n---\n\n## 🎯 Puntos clave\n\n1. El marketing vende el deseo (riqueza rápida) porque el producto real (oficio de años) es más difícil de vender.\n2. Las 5 mentiras: ganarás mucho y rápido · playa y libertad · una hora al día · rentable en 3 meses · el fondeo te da capital.\n3. Cada mentira induce un comportamiento destructivo concreto: sobretamaño, abandono de rutina, práctica superficial, salto a real prematuro, cuotas de fondeo en bucle.\n4. Modelo de negocio de la industria: la mayoría cobra por adelantado; tu P&L no es su ingresos — pregunta siempre de dónde viene el sueldo del vendedor.\n5. Protocolo de 4 filtros: proceso vs resultados · dependencia de ingresos · verificabilidad · promesas de plazo/rentabilidad.\n\n## 🔄 Autoevaluación rápida\n\n1. Una academia muestra 20 capturas de operaciones ganadoras y ninguna perdedora. ¿Qué filtro falla y qué pregunta exacta harías?\n2. ¿Por qué \"el 92 % de desafíos fracasa\" no convierte a las prop firms en estafas por sí mismo? ¿Qué las distinguiría de una estafa?\n3. ¿Qué mentira está operando cuando alguien paga su tercera cuota de evaluación seguida \"porque esta vez sí sale\"?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Fallan los filtros 1 y 3: vende resultados en lugar de proceso y no hay verificación posible. La pregunta exacta: \"enseñame el registro completo auditado de las últimas 200 operaciones, incluidas las perdedoras y el drawdown máximo de la curva\".\n2. La estadística es honesta si se publica; el problema es de esperanza y de uso: pagar repetidamente evaluaciones con un sistema no validado tiene esperanza negativa para ti aunque el negocio de la firma sea legal. La estafa se distingue por engaño (promesas de éxito, costos ocultos, condiciones que cambian sin aviso), no por la dificultad del reto en sí.\n3. La mentira 4 (\"rentable rápido\") combinada con la 5 (\"el fondeo da capital\"): trata la cuota como inversión en lugar de lo que es — el producto que el negocio vende. La respuesta estadística correcta sería: 12 meses de consistencia documentada antes de intentar una evaluación (Lección 1.5 y Módulo 11).\n\n</details>\n"},{"i":8,"g":"🧱 M1 · El Trading como Negocio","t":"1.3 · El mapa completo: 3 dimensiones","f":"docs/02-modulos/mod-01-negocio-trading/leccion-1-3.md","md":"# Lección 1.3 · El mapa completo: 3 dimensiones\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 45–60 min de estudio |\n| 🧱 Módulo | [M1 · El Trading como Negocio y Ciencia](README.md) |\n| ⬅️ Anterior | [Lección 1.2 · Las 5 mentiras de la industria](leccion-1-2.md) |\n| ➡️ Siguiente | [Lección 1.4 · La esperanza matemática](leccion-1-4.md) |\n\n---\n\n## Por qué importa\n\n\"Trader\" no es una profesión única: es un espacio de cientos de oficios distintos. Cuando alguien dice \"soy trader\", todavía no ha dicho casi nada — falta saber qué estilo maneja, en qué mercado y con qué vehículo. El principiante que elige sin mapa no elige: **adopta el estilo que le mostró la última publicidad** (normalmente scalping de cripto con apalancamiento, porque es lo más espectacular de filmar), sin preguntarse si su vida, su capital y su huso horario lo permiten. Esta lección te entrega el mapa completo — estilos × mercados × vehículos — y un método para elegir **una** coordenada provisional que sí encaje con tu realidad. Esa coordenada se afinará en el laboratorio de este módulo y se convertirá en decisión firme dentro de tu Plan de Trading (Módulo 12).\n\n## Concepto\n\nLa actividad de trading se describe con tres dimensiones independientes. La primera es el **estilo**, definido por el tiempo que mantienes posiciones y, en consecuencia, por el ritmo de vida que exige. La segunda es el **mercado** — el universo de activos donde operas, cada uno con su horario, liquidez y personalidad. La tercera es el **vehículo** — el instrumento concreto con el que tomas exposición al precio: el mismo activo puede operarse de cinco formas distintas, con apalancamientos, costos y perfiles de riesgo muy diferentes.\n\n```mermaid\ngraph LR\n    A[\"¿Cuántas horas reales<br/>tengo por semana?\"] --> D\n    B[\"¿Qué capital es<br/>realmente quemable?\"] --> D\n    C[\"¿Qué tolerancia tengo<br/>al estrés y a la espera?\"] --> D\n    D[\"TU COORDENADA<br/>estilo × mercado × vehículo\"] --> E[\"Un solo estilo · un solo mercado<br/>hasta dominar el oficio\"]\n```\n\nLa aritmética del mapa: 5 estilos × 6 mercados × 5 vehículos = **150 coordenadas base**; al multiplicar por enfoques técnicos y variantes de gestión, el espacio práctico se acerca al millar. La cifra que usamos como lema en este programa: de unas 720 combinaciones posibles, **719 son incorrectas para ti** *(heurística)* — no porque sean inválidas en abstracto, sino porque no encajan con TU vida. Tu trabajo no es probarlas todas: es encontrar la tuya y explotarla en profundidad. El nomadeo entre coordenadas (cambiar de estilo o mercado cada pocas semanas) reinicia la curva de aprendizaje cada vez y es una de las causas más comunes de abandono — el Módulo 12 lo formaliza como la \"regla anti-719-combinaciones\".\n\n### Dimensión 1 — Los 5 estilos\n\n| Estilo | Posiciones abiertas | Decisiones por semana | Tiempo de trabajo típico | Riesgo *overnight* | Perfil de vida compatible |\n|---|---|---|---|---|---|\n| **Position** (semanas–meses) | 1–5 | 1–3 | 1–3 h/semana + revisión dominical | Alto (fin de semanas, gaps) | Quien tiene empleo exigente y quiere análisis profundo sin pantallas diarias |\n| **Swing** (días–2 semanas) | 2–8 | 3–10 | 30–60 min/día + 2 h de revisión semanal | Alto | Empleo + trading: revisa temprano o tarde, opera la estructura de H4/D1 |\n| **Day** (horas, cierra todo) | 3–10 al día de sesión | 15–40 | 15–25 h/semana en ventana fija | Nulo | Jornada parcial o completa dedicada; disciplina de horario de bolsa |\n| **Scalp** (segundos–minutos) | Decenas al día | 50–200 | 25–40 h/semana de máxima concentración | Nulo | Tiempo completo, tolerancia alta al estrés, costos de transacción críticos |\n| **Algo / automatizado** | Según diseño | Ejecuta software | 20+ h de desarrollo inicial, luego supervisión | Según diseño | Perfil programador-estadístico; auditar el sistema es el oficio |\n\n> [!TIP]\n> Las analogías de oficio del programa: el **position trader** es el agricultor (siembra y confía en la estación); el **swing trader** es el arquitecto (diseña, visita la obra cada día); el **day trader** es el mesero de turno (intensidad por horas, nada queda para mañana); el **scalper** es el cirujano (segundos de ejecución perfecta, años de entrenamiento); el **algo trader** es el ingeniero de procesos (construye la máquina y la vigila).\n\n### Dimensión 2 — Los 6 mercados\n\n| Mercado | Horario | Liquidez | Volatilidad típica | Notas para la formación |\n|---|---|---|---|---|\n| **Forex** (divisas) | 24/5 | Altísima en pares *majors* | Media | Pocos pares dominantes (EUR/USD, GBP/USD, USD/JPY); el recomendado para formación en demo |\n| **Cripto** | 24/7 | Alta pero fragmentada entre exchanges | Alta | Fines de semana con banca cerrada y baja liquidez: cuidado con movimientos extremos |\n| **Acciones** | Por sesión de bolsa | Alta en grandes compañías | Variada | Menos apalancamiento natural; exige seleccionar entre miles de títulos |\n| **Índices** (US30, US100, US500…) | Derivados casi 24/5 | Muy alta | Alta | Comportamiento \"macro\" limpio, sin riesgo de empresa individual |\n| **Commodities** (oro, petróleo…) | Por sesión con pausas | Media-alta | Alta en metales y energía | El oro (XAU/USD) opera casi 24/5 y es de los más seguidos |\n| **Bonos** | Por sesión | Altísima en futuros de deuda | Baja-media | El mercado que fija el costo del dinero; clave para entender macro (Módulo 2) |\n\n### Dimensión 3 — Los 5 vehículos\n\n| Vehículo | Apalancamiento típico | Costos principales | Vencimiento | Cuándo se usa en FIT-12 |\n|---|---|---|---|---|\n| **Spot** (contado) | Natural (1:1) | Spread/comisión | No | Base conceptual del precio; referencia de todo lo demás |\n| **CFD** | Alto (limitado según regulador) | Spread + *swap* nocturno | No | Vehículo de práctica en demo para N1–N2: operación fraccionaria y SL nativo |\n| **Futuros** | Alto (vía margen) | Comisión + *tick* mínimo | Sí (*rollover*) | Profesional: tamaño estandarizado; se cubre en M11 |\n| **Opciones** | Apalancamiento no lineal | Prima + spreads de *strike* | Sí | Instrumento avanzado con asimetría estructural: después del programa base |\n| **ETF** | 1:1 | Comisión baja | No | Vehículo de inversión pasiva, no de trading activo (recuerda la Lección 1.1) |\n\n> [!WARNING]\n> El vehículo amplifica o amortigua el riesgo del estilo. Un sistema perfectamente válido en demo con CFD puede volverse inviable con futuros por el tamaño mínimo de contrato, o letal con apalancamiento excesivo. Vehículo y riesgo se eligen juntos (Módulo 8).\n\n## Analogía\n\nPiensa en medicina: nadie es \"médico\" genérico — se eluye pediatría, cardiología o traumatología tras años de ruta, y el médico rural que intenta cubrirlo todo termina refiriendo cada caso difícil al especialista. El trading funciona igual: el scalper de índices en apertura de Nueva York y el position trader de divisas en gráfico mensual comparten vocabulario, pero casi nada del oficio diario — horarios, herramientas, frecuencia de decisiones, tipo de estrés. Por eso cambiar de coordenada cada mes no es \"explorar\": es reiniciar la residencia médica una y otra vez, pagando la matrícula cada vez.\n\n## Cómo se hace: elegir tu coordenada en 4 pasos\n\n**Paso 1 — Audita tus horas reales.** No las que te gustaría tener: las que hay. Durante una semana normal, anota cuántos bloques de tiempo concentrado tienes y a qué horas del día (con tu huso horario real). Una ventana de 90 minutos concentrados a una hora fija vale más que cinco horas dispersas.\n\n**Paso 2 — Audita tu capital y define el quemable.** Según la Lección 1.6 (la lees después, pero aplica el principio ya): solo es capital de trading aquel cuya pérdida total no cambia tu vida. El tamaño del quemable condiciona el vehículo: con capital de formación pequeño, los CFD en demo primero y en micro-lotes después son la ruta realista; los futuros exigen tamaño de contrato que probablemente no encaje aún.\n\n**Paso 3 — Audita tu tolerancia con honestidad.** Dos preguntas diagnósticas: ¿puedes mirar una posición perdiendo 1R (tu riesgo definido) sin cerrarla antes de tiempo? ¿Puedes no mirar el gráfico un fin de semana sabiendo que hay posición abierta? Si la segunda te genera ansiedad insomne, el riesgo *overnight* del swing es un precio real que debes contar.\n\n**Paso 4 — Cruza y elige UNA coordenada tentativa.** Ejemplo con números cerrados *(ilustrativo)*: estudiante con empleo de oficina de 40 h/semana (9:00–18:00, huso horario alejado de Nueva York), 8–10 h reales libres repartidas en noches y fin de semana, capital quemable de 1 000, tolerancia media al estrés. El cruce elimina: scalping (no hay ventanas de concentración compatibles), day trading de sesión americana (cae dentro de su jornada laboral). El resultado natural: **swing trading** en gráficos H4/D1 sobre **Forex majors o índices**, vía **CFD en demo**, con 30–60 min de revisión diaria y 2 h de revisión dominical. Nada impide migrar más adelante — pero con criterio cumplido, no con aburrimiento.\n\n## Error común\n\nEl error rey es elegir por adrenalina o por publicidad: el scalping de cripto en directo parece un deporte extremo y seduce exactamente a quien menos horas y tolerancia tiene — la combinación de más ruido, más costos relativos y más decisiones por hora es la peor posible para un principiante (la Lección 1.4 cuantifica el problema del ruido). El segundo error es el nomadeo: tres semanas de swing, un mes de scalping, dos de opciones… cada cambio reinicia a cero el reconocimiento de patrones del mercado concreto y la estadística propia. Regla del programa: **mínimo tres meses en una coordenada antes de juzgarla, y ningún cambio sin datos del journal que lo justifiquen.** El tercer error es confundir el vehículo con el estilo: operar \"day\" con CFD no te hace más seguro que con futuros si el apalancamiento efectivo es igual — el riesgo lo fija tu tamaño, no la etiqueta del instrumento.\n\n## Conexión cuantitativa\n\nLa coordenada determina dos variables que entran directo en la ecuación del negocio: la **frecuencia** de operaciones y el **costo por operación**. La esperanza total del negocio es $E_{negocio} = N \\times E_{por\\ operación}$, donde $N$ es el número de operaciones del período. El scalping multiplica $N$ por decenas al día — y también multiplica el pago de spread y el número de decisiones donde puedes errar; el position trading lo divide a pocas al mes, pero hace que cada operación pese mucho más y exija paciencia estadística para juzgar el sistema (habrá meses sin señal). Por eso no existe \"el mejor estilo\" en abstracto: existe el estilo cuya frecuencia, costos y exigencias de tiempo encajan con tu vida y con tu capacidad actual de mantener $E_{por\\ operación} > 0$ después de costos. Elegir la coordenada es, literalmente, diseñar la estructura de costos y de frecuencia de tu negocio antes de fabricar el producto.\n\n---\n\n## 🎯 Puntos clave\n\n1. El mapa tiene 3 dimensiones independientes: estilo (tiempo de exposición) × mercado (universo de activos) × vehículo (instrumento con el que tomas exposición).\n2. De ~720 combinaciones, 719 son incorrectas para ti *(heurística)*: tu vida — horas, capital quemable, tolerancia, huso horario — selecciona la coordenada, no la publicidad.\n3. Empleo + horario rígido apunta naturalmente a swing en H4/D1; tiempo completo y alta tolerancia habilitan day/scalp; programación habilita algo.\n4. El vehículo amplifica o amortigua el riesgo: se elige junto con el tamaño de posición, nunca por separado.\n5. Regla anti-nomadeo: una coordenada, mínimo tres meses, cambios solo con datos del journal que lo justifiquen.\n\n## 🔄 Autoevaluación rápida\n\n1. Clasifica en las 3 dimensiones: \"mantengo compras de EUR/USD por 5–8 días usando CFD\". ¿Estilo, mercado, vehículo?\n2. Un amigo trabaja de noche y descansa de día, tiene 25 h/semana libres y alta tolerancia al estrés. ¿Qué coordenada exploraría y cuál descartaría de entrada?\n3. ¿Por qué el scalping es estructuralmente el estilo más hostil para un principiante, independiente de su talento?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Swing trading · mercado Forex · vehículo CFD. La duración de días define el estilo; el par define el mercado; el instrumento, el vehículo.\n2. Sus ventanas nocturnas pueden coincidir con la sesión de Asia o el cierre de EE. UU.: day trading de índices o Forex en esas sesiones es coherente. Descartaría position trading solo si su objetivo declarado es la actividad intensiva — aunque con 25 h de tolerancia alta, day/scalp de sesión nocturna es la exploración razonable.\n3. Combina la mayor frecuencia de decisiones (más oportunidades de errar) con el mayor costo relativo de transacción (spread fijo contra movimientos pequeños — Lección 1.4) y la mayor exigencia de ejecución psicológica. El talento no modifica la estructura de costos.\n\n</details>\n"},{"i":9,"g":"🧱 M1 · El Trading como Negocio","t":"1.4 · La esperanza matemática","f":"docs/02-modulos/mod-01-negocio-trading/leccion-1-4.md","md":"# Lección 1.4 · La esperanza matemática\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 45–60 min de estudio (lleva calculadora o hoja de cálculo) |\n| 🧱 Módulo | [M1 · El Trading como Negocio y Ciencia](README.md) |\n| ⬅️ Anterior | [Lección 1.3 · El mapa completo: 3 dimensiones](leccion-1-3.md) |\n| ➡️ Siguiente | [Lección 1.5 · La curva de aprendizaje real](leccion-1-5.md) |\n\n---\n\n## Por qué importa\n\nSi este programa tuviera una sola lección, sería esta. La esperanza matemática es el criterio que separa el negocio del juego: un sistema se opera si y solo si su esperanza por operación, **calculada después de costos**, es positiva. La mayoría de los principiantes evalúa su trading por el *Win Rate* — cuántas operaciones acierta — y esa métrica, sola, no distingue un negocio rentable de una ruina elegante. Aquí aprenderás la ecuación que gobierna todo el programa, a calcularla con números cerrados, y por qué la estructura del mercado (fractal y ruidosa) cobra un impuesto especial a quien opera en marcos de tiempo muy bajos.\n\n## Concepto\n\nLa esperanza matemática (*expected value*) de un sistema es el resultado medio **esperado por operación**, ponderando cada resultado por su probabilidad:\n\n$$E = (P_w \\times W) - (P_l \\times L)$$\n\ndonde $P_w$ es la probabilidad de ganar, $W$ es la ganancia media por operación ganadora, $P_l = 1 - P_w$, y $L$ es la pérdida media por operación perdedora. Si $E > 0$ (después de costos), el sistema hace dinero en promedio y la varianza decide solo el camino; si $E < 0$, el sistema pierde en promedio y ninguna racha de suerte cambia el destino, solo lo aplaza. El **Win Rate** (*P_w* en porcentaje) y el ratio **riesgo-beneficio** (*Risk:Reward*, $W/L$) son las dos ruedas del mismo carro: nunca se interpreta una sin la otra.\n\nTres consecuencias inmediatas que conviene memorizar:\n\n1. **El Win Rate engaña.** Un 90 % de aciertos puede ser un sistema perdedor; un 40 % puede ser una máquina de dinero. El número que importa es el producto, no el porcentaje.\n2. **Existe un umbral de equilibrio para cada ratio.** Para un Risk:Reward de 1:2, el sistema empataría con apenas 33,3 % de aciertos; todo lo superior a eso es beneficio. Fórmula general: $WR_{equilibrio} = \\frac{1}{1 + R}$, donde $R = W/L$.\n3. **La esperanza se cobra a largo plazo.** $E$ es un promedio: una mala semana no lo invalida y una buena no lo confirma. Se necesitan muchas operaciones (el Módulo 9 fija N ≥ 100 como mínimo estadístico) para estimarlo con confianza.\n\n## Analogía\n\nPiensa en cómo gana un casino con la ruleta europea. En cada apuesta a un número, el jugador gana 35 veces lo apostado con probabilidad 1/37, y pierde lo apostado con probabilidad 36/37. La esperanza del jugador: $E = \\frac{1}{37} \\times 35 - \\frac{36}{37} \\times 1 = -\\frac{1}{37} \\approx -0{,}027$ — pierde 2,7 céntimos por cada euro apostado, siempre, en promedio. El casino no acierta más que el jugador en ninguna tirada individual: simplemente **es la casa** — la ventaja matemática está de su lado y deja que la ley de los grandes números haga el trabajo con miles de apuestas. El trader profesional es el jugador que consiguió sentarse del otro lado de la mesa: no acierta más que el aficionado en cada operación concreta; tiene una ventaja pequeña ($E > 0$), la repite muchas veces con tamaño controlado y deja que el promedio trabaje. Y la analogía tiene una segunda lectura, incómoda pero necesaria: las **opciones binarias** son la ruleta disfrazada de plataforma de trading — con pago típico del 85 % del apostado en un resultado esencialmente binario a 50/50, la esperanza es $E = 0{,}5 \\times 0{,}85 - 0{,}5 \\times 1 = -0{,}075$ por unidad: pierdes 7,5 centavos por cada dólar, siempre *(ilustrativo: supuesto de pago 85 % y probabilidad 50 %; el diseño garantiza esperanza negativa para el cliente en cualquier escenario realista)*.\n\n## Cómo se hace: calcular la esperanza con números cerrados\n\n**Sistema A** — \"acierta poco, gana grande\": $P_w = 40\\%$, $W = 200$, $L = 100$:\n\n$$E_A = 0{,}40 \\times 200 - 0{,}60 \\times 100 = 80 - 60 = +20 \\text{ por operación}$$\n\n**Sistema B** — \"acierta casi siempre\": $P_w = 90\\%$, $W = 20$, $L = 190$:\n\n$$E_B = 0{,}90 \\times 20 - 0{,}10 \\times 190 = 18 - 19 = -1 \\text{ por operación}$$\n\nEl sistema B acierta 9 de cada 10 operaciones **y pierde dinero**. El sistema A falla más de la mitad de sus operaciones **y gana 20 por trade**. Si ambos operan 100 veces: A acumula +2 000; B acumula −100. La disciplina de B es irrelevante: su diseño tiene esperanza negativa.\n\n**El mismo cálculo en unidades R.** Define $R$ = la cantidad que arriesgas en una operación (tu pérdida si toca el *Stop Loss*). Todo se simplifica: una ganancia de \"2R\" significa el doble de lo arriesgado. Sistema C: $P_w = 45\\%$, ganancia media 1,8R, pérdida media 1R:\n\n$$E_C = 0{,}45 \\times 1{,}8 - 0{,}55 \\times 1 = 0{,}81 - 0{,}55 = +0{,}26R \\text{ por operación}$$\n\nEn 100 operaciones: +26R. Arriesgando el 1 % del capital por operación, el sistema C rinde ≈ +26 % en el período (aproximación lineal, antes de compuestos y drawdowns). Es el formato que usarás en TODO el programa: medir en R hace comparables sistemas de cualquier tamaño de cuenta.\n\n**Tabla de consulta rápida** — esperanza en unidades R según Win Rate y Risk:Reward:\n\n| Win Rate ↓ \\ R:B → | 1:1 | 1:2 | 1:3 |\n|---|---|---|---|\n| **30 %** | −0,40R | −0,10R | **+0,20R** |\n| **40 %** | −0,20R | **+0,20R** | +0,60R |\n| **50 %** | 0,00R | +0,50R | +1,00R |\n| **60 %** | +0,20R | +0,80R | +1,40R |\n\nLa diagonal de equilibrio: con 1:1 necesitas 50 % de aciertos; con 1:2, solo 33,3 %; con 1:3, solo 25 %. Por eso el programa exige Risk:Reward mínimo 1:2 en sus protocolos: te da margen estadístico para equivocarte con frecuencia y aun así ganar.\n\n**Y el paso que casi todos olvidan — descontar los costos.** La esperanza real es después de spread y comisión. Si el sistema C paga en promedio 0,08R de costos por operación (ida y vuelta), su esperanza neta es $0{,}26 - 0{,}08 = +0{,}18R$ *(ilustrativo)*. Un sistema con +0,05R bruto en el mismo mercado queda en −0,03R neto: **rentable en el papel, perdedor en la cuenta**. Cuanto más pequeña la ganancia típica por operación, más devora el costo fijo — esto conecta directo con el problema del ruido que sigue.\n\n### Fractalidad, ruido y el impuesto de los marcos de tiempo bajos\n\nEl mercado es **fractal autosimilar** (*fractal, self-similar*): las mismas formaciones cualitativas (impulsos, correcciones, rangos) aparecen en el gráfico de 1 minuto y en el mensual. Pero autosimilar **no significa idéntico**: al bajar de marco temporal, el movimiento medio de cada evento se encoge mientras que el spread se mantiene fijo, y el ruido (*noise* — fluctuación aleatoria sin información) gana peso relativo contra la señal. Ejemplo con números cerrados *(ilustrativo)*: con un spread de 1 pip, un setup típico de H1 que se mueve 40 pips paga un impuesto de $1/40 = 2{,}5\\%$ de su recorrido; el mismo patrón visual en M1, moviéndose 8 pips, paga $1/8 = 12{,}5\\%$ — cinco veces más. A ello se suma que más operaciones por día significan más decisiones, más riesgo de error de ejecución y más desgaste psicológico. Esta es la razón estructural por la que el programa forma en marcos H4/D1 y desaconseja el scalping hasta tener estadística propia sólida: el impuesto del ruido se paga en esperanza, y se paga siempre.\n\n## Error común\n\nEl error clásico es **rendir culto al Win Rate**: mover el *Stop Loss* para \"no perder\" esta operación convierte pérdidas pequeñas y frecuentes en pérdidas catastróficas y raras — eleva el WR aparente mientras hunde $L$ hacia valores que aniquilan $E$ (es el ADN de la martingala, la gestión que dobla la apuesta tras cada pérdida: ganador casi siempre hasta el día que existe). El segundo error es juzgar sistemas con pocas operaciones: con 10 trades, la varianza domina — un sistema de $E = +0{,}3R$ puede mostrar rachas de 6 pérdidas seguidas sin haberse \"estropeado\" (la Lección 1.6 lo cuantifica). El antídoto operativo: toda evaluación de sistema se hace con N ≥ 100 operaciones registradas, sobre el journal, después de costos — no sobre la memoria de las últimas dos semanas.\n\n## Conexión cuantitativa\n\nEsta lección **es** la conexión cuantitativa: la ecuación del encabezado es el norte del programa entero. Cada decisión técnica que aprenderás después (dónde colocar el stop, cuándo cerrar, qué mercado operar) y cada decisión de gestión (qué tamaño por operación, cuántas posiciones simultáneas) no son más que formas de mover $P_w$, $W$, $L$ o la frecuencia $N$ — y solo tienen sentido en la medida en que mejoren $E_{negocio} = N \\times E_{por\\ operación}$ después de costos. Cuando en el Módulo 7 diseñes tu Sistema v1.0, no se te preguntará \"¿te gusta el setup?\": se te preguntará por su esperanza estimada y por la evidencia que la respalda.\n\n---\n\n## 🎯 Puntos clave\n\n1. $E = (P_w \\times W) - (P_l \\times L)$: el resultado medio esperado por operación; único criterio de operatividad de un sistema.\n2. El Win Rate aislado no dice nada: 90 % de aciertos puede perder dinero; 40 % puede enriquecer.\n3. Umbral de equilibrio: $WR_{equilibrio} = \\frac{1}{1+R}$ — con R:B 1:2 basta acertar 33,3 %; por eso el programa exige mínimo 1:2.\n4. La esperanza válida es **después de costos**: spread y comisión son el alquiler del negocio y se pagan en cada operación.\n5. El mercado es fractal autosimilar pero no idéntico: en marcos bajos el ruido y los costos relativos crecen — el scalping paga el impuesto más alto.\n6. Se estima con N ≥ 100 operaciones: con menos datos, hablas con la varianza, no con el sistema.\n\n## 🔄 Autoevaluación rápida\n\n1. Sistema D: WR 55 %, ganancia media 80, pérdida media 100. Calcula $E$ e interpreta el resultado en una frase.\n2. ¿Qué Win Rate mínimo necesita un sistema con R:B 1:3 para no perder dinero? Muéstralo con la fórmula.\n3. Tu amigo presume: \"nuevo bot, 30 operaciones seguidas ganadoras, cero pérdidas\". Da dos explicaciones estadísticamente razonables que no requieren magia.\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. $E_D = 0{,}55 \\times 80 - 0{,}45 \\times 100 = 44 - 45 = -1$ por operación. Un sistema que acierta la mayoría de las veces y pierde dinero en promedio: la pérdida media supera la ganancia media — el caso clásico del WR alto mal diseñado (o de stops muy lejanos y objetivos muy cortos).\n2. $WR_{equilibrio} = \\frac{1}{1+3} = 25\\%$. Aciertos por encima de 25 % con pérdidas de 1R y ganancias de 3R producen esperanza positiva.\n3. (a) Objetivo cercano y stop lejísimos o inexistente: la probabilidad de cada acierto es altísima (p. ej. ≈ 95 % si el objetivo está a pocos pips y la pérdida latente a cientos), y con 95 % por operación, 30 aciertos seguidos tiene ≈ 21 % de probabilidad (cálculo propio) — perfectamente esperable antes del día catastrófico. (b) Varianza pura en muestra pequeña: con un WR real del 85 %, la probabilidad de 30 ganancias seguidas es $0{,}85^{30} \\approx 0{,}8\\%$ — raro, pero con miles de bots vendidos, a alguno le ocurre y ese es el que se fotografía; además 30 operaciones están muy por debajo del N mínimo para concluir algo. En ambos casos: pide las 200 operaciones siguientes con drawdown incluido.\n\n</details>\n"},{"i":10,"g":"🧱 M1 · El Trading como Negocio","t":"1.5 · La curva de aprendizaje real","f":"docs/02-modulos/mod-01-negocio-trading/leccion-1-5.md","md":"# Lección 1.5 · La curva de aprendizaje real\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 30–40 min de estudio |\n| 🧱 Módulo | [M1 · El Trading como Negocio y Ciencia](README.md) |\n| ⬅️ Anterior | [Lección 1.4 · La esperanza matemática](leccion-1-4.md) |\n| ➡️ Siguiente | [Lección 1.6 · Expectativas y presupuesto](leccion-1-6.md) |\n\n---\n\n## Por qué importa\n\nLa diferencia entre el trader que sobrevive y el que abandona rara vez es técnica: es de **calendario esperado**. Quien cree que en tres meses será rentable interpreta cada mes perdedor como fracaso definitivo y reacciona haciendo lo que destruye cuentas — cambiar de sistema, sobreoperar, subir el tamaño. Quien sabe que la curva real se mide en años interpreta el mismo mes perdedor como datos de entrenamiento y sigue ejecutando el proceso. Esta lección te entrega la forma real de la curva: las cuatro fases de competencia, la analogía médica que pone el plazo en perspectiva, y el porqué estadístico de que 12 meses sea la prueba mínima de consistencia en este programa. Fijar expectativas de plazo es, literalmente, una decisión de gestión de riesgo.\n\n## Concepto\n\n**La analogía médica.** A nadie se le ocurre dejar que un recién graduado opere un corazón: entre universidad (5–7 años) y residencia quirúrgica (4–6 más), un cirujano acumula 12–17 años de formación supervisada antes de la autonomía total. El trading no tiene colegio, ni residencia, ni licencia: el único examinador disponible es el mercado mismo — y cobra la matrícula en pérdidas *(heurística de los cursos de referencia; el punto no es la cifra exacta sino la magnitud del oficio)*. Cada hora de estudio y cada operación de práctica que te ahorras \"porque ya lo entiendes\" la cobra después el mercado, con intereses.\n\n**Las cuatro fases de la competencia.** La escalera clásica del aprendizaje aplica al trading con precisión incómoda:\n\n| Fase | Nombre | Qué pasa | Riesgo dominante |\n|---|---|---|---|\n| 1 | Inconsciencia incompetente | No sabe que no sabe. Opera grande, confiado, guiado por suertes iniciales. | Máximo: es la fase que quema cuentas en semanas |\n| 2 | Consciencia incompetente | Sabe qué no sabe. Estudia con humildad, pierde menos o nada en demo, sufre más. | Desánimo: el \"valle de la decepción\" donde abandona la mayoría |\n| 3 | Consciencia competente | Opera con reglas explícitas; cada decisión es lenta, deliberada y fatigosa. | Autocomplacencia: confundir una racha con maestría |\n| 4 | Inconsciencia competente | La ejecución correcta está interiorizada; el sistema se ejecuta casi sin esfuerzo consciente. | Dejar de auditar: la competencia automática se pudre sin journal |\n\nEl \"valle de la decepción\" entre las fases 1 y 3 merece nombre propio porque es donde este programa pierde o salva estudiantes: tras los primeros meses de estudio honesto, el progreso se vuelve invisible justo cuando el conocimiento real está creciendo más rápido. La única forma de cruzarlo es medir el proceso (porcentaje de operaciones conforme al plan) en lugar del resultado (dinero de la semana).\n\n**Por qué 12 meses es la prueba mínima de consistencia.** Tres razones independientes que se suman. Primera, los **regímenes de mercado** (*market regimes*): el mismo sistema se comporta distinto en tendencia, en rango y en alta o baja volatilidad; un trimestre solo te muestra un clima, y un sistema \"ganador de tendencia\" puede ser una máquina de perder cuando el clima cambia — necesitas atravesar al menos un cambio de régimen completo para conocer tu sistema. Segunda, la **significancia estadística**: como viste en la Lección 1.4, estimar la esperanza con confianza exige N ≥ 100 operaciones reales del sistema, y un swing trader disciplinado necesita meses para acumularlas. Tercera, la **varianza de rachas** (*streak variance*): un sistema perfectamente sano con 40 % de aciertos produce rachas de 8–10 pérdidas seguidas de forma natural, y solo un historial largo te enseña a distinguir racha normal de sistema roto. Menos de 12 meses de datos no separa suerte de oficio — no es pesimismo, es aritmética.\n\n## Analogía\n\nAprender trading es como aprender un idioma **y** un deporte a la vez. El idioma: vocabulario (soportes, BOS, liquidez) y gramática (la estructura del precio) se estudian leyendo — y en pocos meses puedes leer frases enteras. El deporte: la ejecución bajo presión (entrar cuando el gráfico se mueve contra tu análisis, aceptar la pérdida, esperar sin tocar nada) solo se entrena con repeticiones reales registradas — igual que nadie desarrolla el remate de voleibol leyendo biomecánica. Por eso este programa no tiene \"capítulos\" sino módulos con laboratorios y misiones: cada uno te obliga a las repeticiones. El error del autodidacta clásico es quedarse forever en el idioma (consumiendo contenido, cambiando de profesor cada mes) sin pagar las repeticiones del deporte.\n\n## Cómo se hace: la línea de tiempo honesta con criterios de avance\n\nEl programa estructura la formación en cuatro fases con **criterios de avance verificables** — el calendario es orientativo, el criterio manda: no se sube de fase por fecha, sino por desempeño demostrado *(heurística: los rangos reflejan la práctica de la formación seria, no una ley)*.\n\n| Fase | Qué haces | Duración orientativa | Criterio para avanzar | Dinero en riesgo |\n|---|---|---|---|---|\n| **F1 · Formación** | Módulos 1–4 de FIT-12: conceptos + demo + plataforma | 1–2 meses | Examen Nivel 1 ≥ 80 % + journal al día | Cero: solo demo |\n| **F2 · Validación estadística** | Módulos 5–9: construyes el Sistema v1.0 y lo backtesteas a ciegas | 2–4 meses | N ≥ 100 backtests registrados con $E > 0$ después de costos | Cero: backtest sobre histórico |\n| **F3 · Demo forward** | Módulo 10: operas el sistema en demo en tiempo real con journal completo | 2–3 meses | ≥ 90 % de operaciones conformes al plan + 10 sesiones documentadas | Cero: demo forward |\n| **F4 · Real micro** | Módulos 11–12: dinero real en tamaño micro (0,25–0,5 % de riesgo por operación) | 3+ meses | 3 meses sin violar un solo freno de riesgo | Micro: real, tamaño mínimo |\n\nEl diseño tiene una lógica exacta: **el dinero real entra solo cuando ya tienes evidencia estadística de que $E > 0$ y evidencia conductual de que ejecutas el plan**. Cada fase compra la evidencia de la siguiente; saltarte una fase no acelera el camino — solo compra la matrícula del mercado a precio completo. La fase F4 empieza en micro porque el dinero real cambia la respuesta emocional del cuerpo aunque el tamaño sea pequeño: es el \"simulacro con temperatura\", el paso intermedio honesto entre el demo y
