pread). Solo en algunas: **slippage** (noticias, gaps, aperturas) y **swap** (solo si la posición pasa la noche).\n2. ECN: 0,8 × 10 = 8 $ de spread + 7 $ de comisión = **15 $**. Standard: 2,0 × 10 = **20 $**. La ECN es más barata (15 vs 20 $) en este caso — con TPs más cortos la ventaja ECN crece y con operativa muy larga el spread domina. La comparación correcta es todo incluido por operación, no el titular del marketing.\n3. El **swap**: 9 noches extra de almacén que el plan no presupuestó (y el triple del miércoles dentro de esas 9). Tu R:B se planeó con 3 noches de costo y ahora carga 12: si el swap es −0,42 $/noche en tu tamaño, son ≈ −3,8 $ extra (≈ 0,2R más de costo); en pares de swap duro o lotes mayores, el \"trade que se demoró\" puede pasar de +2R planeados a +1,4R reales. Regla: el costo de cada noche extra debe caber en el plan — si no cabe, el plan era otro.\n\n</details>\n"},{"i":30,"g":"🧱 M4 · Plataforma y Primera Ejecución","t":"4.4 · Largos y cortos","f":"docs/02-modulos/mod-04-plataforma-y-primera-ejecucion/leccion-4-4.md","md":"# Lección 4.4 · Largos y cortos\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 40–50 min de estudio |\n| 🧱 Módulo | [M4 · Plataforma y Primera Ejecución](README.md) |\n| ⬅️ Anterior | [Lección 4.3 · El costo real de operar](leccion-4-3.md) |\n| ➡️ Siguiente | [Lección 4.5 · Cuenta demo](leccion-4-5.md) |\n\n---\n\n## Por qué importa\n\nEl retail opera casi siempre en largo porque \"vender algo que no tienes\" suena a truco. Pero si tu análisis dice \"caída confirmada en 3 pasos\" ([Lección 3.4](../mod-03-anatomia-del-grafico/leccion-3-4.md)) y solo sabes comprar, pierdes la mitad de las oportunidades de tu propio sistema. Y hay una segunda razón, más profunda: la mecánica del corto explica fenómenos que te van a golpear incluso sin operar cortos — los *short squeeze* que revientan gráficos, los *borrow fees* que erosionan posiciones, y la asimetría estructural de los mercados: **suben en escalera y caen en ascensor**. Entender el corto es entender por qué las caídas son más violentas que las subidas, y por qué tu SL deja de ser recomendación y se convierte en estructura portante el día que vendes.\n\n## Concepto\n\n**Long (largo):** comprar barato → vender caro. Dos pasos en orden natural: compras 100 unidades a 50, vendes a 60: +1 000 (menos costos). Tu pérdida máxima teórica es el precio llegando a cero: acotada.\n\n**Short (corto):** ganar con la caída invirtiendo el orden. En acciones/CFDs de acciones la mecánica literal es: (1) **pedir prestadas** las acciones al bróker (las presta otro cliente o el inventario del propio bróker); (2) **venderlas** al precio actual; (3) esperar la caída; (4) **recomprarlas** más baratas; (5) **devolverlas** al prestamista. La ganancia = precio de venta − precio de recompra − costos. En forex y CFDs de índices/oro no hay préstamo visible: el botón \"vender\" abre la posición directamente — pero el mecanismo económico es el mismo, y en forex además siempre estás vendiendo una divisa **comprando otra**: tu short de EUR/USD es un long de USD ([Lección 2.6](../mod-02-motor-del-precio/leccion-2-6.md): el DXY te afecta).\n\n**Costos propios del corto:**\n\n- **Borrow fee** (acciones/CFDs acciones): interés anual por el préstamo, típico 0,5–3 % *(ilustrativo)*; en acciones *hard-to-borrow* puede ser brutal. Se prorratea por día de posición.\n- **Swap en corto forex:** puede ser **positivo** si vendes la divisa de tasa alta contra la de tasa baja — el único \"alquiler\" que a veces te paga a ti.\n\n**Short squeeze:** cuando el precio sube en lugar de caer, los cortos pierden y muchos cierran (compran para recomprar). Su recompra **es la compra que sube más el precio**, que liquida más cortos, que recompra más… una cascada sin techo. Caso público: GameStop, enero 2021 — con más de la flotante vendida en corto, el precio multiplicó en días y fondos que vendían corto cerraron pérdidas multimillonarias al recomprar.\n\n**La asimetría estructural:** las subidas se construyen con acumulación paciente (fragmentos, [Lección 3.2](../mod-03-anatomia-del-grafico/leccion-3-2.md)) — escalera. Las caídas se aceleran con miedo, que es urgencia pura (takers en masa, [Lección 2.1](../mod-02-motor-del-precio/leccion-2-1.md)) — ascensor. Implicación práctica: las piernas bajistas suelen ser más rápidas y profundas que las alcistas; el corto tiene ventaja de velocidad y desventaja de costos + riesgo de squeeze.\n\n**Visual — la mecánica del short, paso a paso** (100 acciones a 50 $):\n\n```mermaid\nsequenceDiagram\n    participant T as Tú (corto)\n    participant B as Bróker\n    participant M as Mercado\n    T->>B: 1. Pido prestadas 100 acciones\n    B-->>T: 2. Te las presto (quedan como garantía)\n    T->>M: 3. Vendo las 100 a 50 $ → +5 000 $\n    Note over M: ... el precio cae a 40 $ ...\n    T->>M: 4. Recompro 100 a 40 $ → −4 000 $\n    T->>B: 5. Devuelvo las 100 acciones\n    B-->>T: Préstamo cerrado · Ganancia: +1 000 $ − borrow fee\n```\n\n## Analogía\n\nTu primo y las entradas del concierto. Él no tiene entradas, pero le prometes 10 al precio de hoy (70 $) para el fin de semana — te las consigue de un amigo del trabajo (le \"pides prestadas\" con su permiso). Ya vendiste lo que no tenías: cobraste 700 $. El viernes las consigues a 50 $, las entregas, y ganaste 200 $ sin haber tenido nunca entradas propias. Ahora el mal escenario: el grupo anuncia que será su último concierto, el precio se dispara a 150 $, y TU promesa sigue en pie. Cada comprador ansioso que empuja el precio arriba es alguien cerrando su propia promesa corta — y tú debes recomprar a 150 y perder 800. No hay techo para cuánto puede subir: la promesa corta pierde mientras el precio suba. Eso es un squeeze: primos por todo el estadio comprando desesperados.\n\n## Cómo se hace: el mismo trade en los dos sentidos, con números cerrados\n\nMisma idea técnica (retesteo confirmado en zona, protocolo M3.4), ejecutada en los dos sentidos sobre EUR/USD, lote 0,06, riesgo 18 $ *(cifras ilustrativas)*:\n\n- **Long:** buy limit 1,0824 → SL 1,0794 (30 pips) → TP 1,0884 (60 pips). Cobro si sube: +60 pips = +36 $ bruto (60 × 0,6 $/pip).\n- **Short:** sell limit 1,0860 (borde inferior de la resistencia) → SL 1,0890 (30 pips sobre la entrada, tras el máximo del swing) → TP 1,0800 (60 pips bajo). Cobro si baja: +60 pips = +36 $ bruto.\n- **Costos diferenciales:** si cada lado se sostiene 2 noches: long paga swap −0,84 $ (2 × −0,42); short **cobra** +0,36 $ (2 × +0,18) *(ilustrativo, según diferencial de tasas)*. El corto parte con 1,20 $ de ventaja de costos en este par — hasta que llega un squeeze.\n- **El riesgo que NO es simétrico:** tu long pierde como máximo 30 pips planeados y, sin SL, como mucho hasta el precio 0 (≈ −6 500 $: el nominal completo de 0,06 lotes). Tu short sin SL no tiene techo de pérdida: el precio puede subir 200 pips o 2 000. **Por eso en cortos el SL no es negociable ni un pip** — y en acciones cortadas con gaps, el plan usa tamaño reducido: mismo R monetario, no mismo tamaño nominal (el gap de apertura puede saltarse cualquier stop — [Lección 2.4](../mod-02-motor-del-precio/leccion-2-4.md): los gaps del fin de semana).\n\n**El borrow fee con números:** cortas 100 acciones a 50 $ (posición de 5 000 $), borrow 2 % anual *(ilustrativo)* → 100 $/año ≈ 0,28 $/día. 10 días de posición: 2,78 $ — pequeño, pero se suma y en *hard-to-borrow* (10–50 % anual) convierte un trade de 3 semanas en un empate.\n\n## Error común\n\n**(1) Cortar sin SL \"porque el techo es lo que ponga\"** — es exactamente al revés: el corto es el único escenario donde tu pérdida es ilimitada por diseño; la ley del stop ([Lección 4.6](leccion-4-6.md)) se escribe primero para los cortos. **(2) Pelear contra un squeeze** — \"ya tiene que caer, está sobreextendido\": la presión de los cortos atrapados no lee tu análisis; cada pip de subida es órdenes de recompra obligada. El protocolo: SL puesto desde el inicio y respetado; reentrar más tarde, si el régimen lo vuelve a permitir, es otra decisión sin bagaje. **(3) Olvidar que en forex el corto es un long cruzado** — vendes EUR/USD y el USD se debilita por un dato macro: pierdes aunque \"el EUR no hizo nada\". La cadena DXY de la Lección 2.6 es tu contexto obligado antes de cualquier corto de major. **(4) Ignorar que el 95 % del material del retail está pensado para largos** *(heurística)* — tus ejemplos mentales de \"comprar bajo\" te empujan a anticipar fondos en caídas rápidas: el ascensor no se agarra con las manos.\n\n## Conexión cuantitativa\n\nOperar ambos lados duplica el universo de setups que tu sistema puede estadísticamente medir — mismo E, más muestras, menos dependencia del régimen alcista de tu instrumento favorito. Pero los dos lados no cuestan lo mismo: $E_{neto}^{short} = E_{bruto} - c - f_{borrow}$ (en acciones) o $+ f_{swap}$ (si el diferencial juega a tu favor en forex). Concretado: un short de acciones con E bruto +0,15R, borrow equivalente a 0,02R por las noches sostenidas y slippage de gap ocasional (+0,01R esperado) queda en +0,12R neto — aún válido; el mismo short en un *hard-to-borrow* con 0,25R de borrow mensual queda en −0,10R: **el costo del préstamo puede por sí solo invalidar un setup técnicamente perfecto**. La regla del programa: antes de un short de acciones, el borrow fee anual se convierte a R y entra en el cálculo; antes de un short de forex, el swap del par entra; y en ambos, el SL es estructural porque la cola derecha no tiene suelo.\n\n---\n\n## 🎯 Puntos clave\n\n1. Short = vender prestado → recomprar barato → devolver. La ganancia vive en la diferencia de recompra.\n2. En forex/CFDs el préstamo es invisible (botón \"vender\"), pero el costo existe: borrow fee en acciones; swap (a veces positivo) en forex.\n3. Todo short de forex es a la vez un long de la otra divisa: la cadena DXY es contexto obligado.\n4. Short squeeze: las recompras obligadas de los cortos perdedores son la gasolina de la subida — cascada sin techo.\n5. Asimetría estructural: suben en escalera (acumulación paciente), caen en ascensor (miedo = urgencia).\n6. En largos tu peor caso sin SL es el precio 0; en cortos no hay techo — el SL en cortos es ley de las leyes.\n\n## 🔄 Autoevaluación rápida\n\n1. Enumera los 5 pasos de la mecánica del short en acciones y di de dónde sale exactamente la ganancia.\n2. ¿Por qué el riesgo de un short sin SL es ilimitado y el de un long sin SL no lo es (aun siendo desastroso)?\n3. Describa el mecanismo del squeeze en 3 pasos y di qué conducta del programa lo neutraliza.\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. (1) Pedir prestadas las acciones al bróker. (2) Venderlas al precio de mercado (cobras el nominal). (3) Esperar la caída. (4) Recomprarlas más baratas. (5) Devolverlas al prestamista. La ganancia = venta − recompra − costos (borrow fee prorrateado + spread/comisión). El bróker cierra el préstamo al devolver: tú nunca fuiste propietario.\n2. El long comprado a 50 $ pierde como máximo hasta el precio 0: −50 $/acción de techo de desastre (durísimo, pero acotado). El corto vendido a 50 $ debe recomprar para devolver las acciones, y el precio de recompra no tiene techo: a 150 $ pierdes 100 $/acción, a 500 $ pierdes 450 $/acción. La pérdida del corto está abierta por arriba — por eso el SL del corto se coloca, se verifica y no se toca jamás.\n3. (1) El precio sube → cortos en pérdida. (2) Parte de los cortos cierra = recompra obligada, que es demanda compradora adicional → sube más. (3) La subida liquida más cortos, que recompran más: bucle de realimentación sin techo hasta que no quedan cortos que liquidar. Lo neutraliza: SL puesto antes de entrar y respetado (sales en tu −1R sin participar en la cascada) + no reentrar en corto \"porque ya está caro\" durante el squeeze.\n\n</details>\n"},{"i":31,"g":"🧱 M4 · Plataforma y Primera Ejecución","t":"4.5 · Cuenta demo","f":"docs/02-modulos/mod-04-plataforma-y-primera-ejecucion/leccion-4-5.md","md":"# Lección 4.5 · Cuenta demo\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 40–50 min de estudio + sesión de configuración |\n| 🧱 Módulo | [M4 · Plataforma y Primera Ejecución](README.md) |\n| ⬅️ Anterior | [Lección 4.4 · Largos y cortos](leccion-4-4.md) |\n| ➡️ Siguiente | [Lección 4.6 · El Stop Loss como ley](leccion-4-6.md) |\n\n---\n\n## Por qué importa\n\nLa demo es tu gimnasio: cuesta 0 $, no expone capital y permite cometer los cientos de errores mecánicos que todo operador necesita cometer — con el único requisito de que los registres. Pero la demo mal configurada enseña vicios caros: quien practica con 100 000 $ virtuales y lotes de 1.00 entrena un tamaño que jamás usará, y quien opera 30 veces al día sin journal entrena reflejos contrarios a su futuro plan. El programa no usa la demo \"para ver si funciona el trading\" — la usa como **laboratorio de mecánica** con protocolo ordenado: mismo capital que tu plan real, mismo riesgo por operación, mismas órdenes que ejecutarías en vivo, y un criterio de salida claro. La honestidad sobre lo que la demo puede y no puede darte es parte de la lección: te da procedimiento, no nervios — y fingir lo contrario es autoengaño.\n\n## Concepto\n\n**Qué es:** una cuenta con dinero virtual conectada a cotizaciones reales (o casi). Montas órdenes, el panel computa P/L, swap y margen igual que una real — pero la factura es ficticia.\n\n**Qué simula bien (por eso la usamos):**\n\n- La **mecánica completa**: tipos de órdenes, OCO, ejecución, pips, lotes, margen, swap.\n- La **lectura del panel** y el flujo de trabajo diario (journal, capturas, checklist).\n- El **comportamiento del precio** — si el bróker es serio, la demo usa el mismo feed que la real.\n\n**Qué NO simula (por eso no nos engañamos):**\n\n- **Slippage real** en noticias y gaps: muchas demos ejecutan al precio exacto siempre ([Lección 4.3](leccion-4-3.md)).\n- **Tu psicología con dinero real:** la pérdida de 18 $ reales duele distinto que la virtual — y fingir que no es así es negar la variable 85/15 del programa ([Lección 1.4](../mod-01-negocio-trading/leccion-1-4.md)).\n- **La fricción de retiros, requotes y stops-out reales** bajo volatilidad extrema.\n\n**La configuración realista del programa (no negociable):**\n\n| Parámetro | Valor | Por qué |\n|---|---|---|\n| Capital virtual | **El de tu plan real** (p. ej. 2 000 $) — no 100 000 $ | entrenar el tamaño que usarás |\n| Riesgo por operación | **1 % = 20 $** (igual que el plan) | la mecánica del riesgo se automática aquí |\n| Apalancamiento | El que usarás de verdad (p. ej. 1:30) | el margen debe doler proporcionalmente |\n| Tipo de cuenta | El mismo que abrirías (standard o raw) | los costos de la [Lección 4.3](leccion-4-3.md) deben verse |\n| Lote típico resultante | 0,05–0,06 en EUR/USD (fórmula de la receta) | micro real, no fantasía |\n\n**Lectura del panel de posiciones** (los campos que debes saber leer antes de operar):\n\n- **P/L flotante:** la ganancia/pérdida *si cerraras ahora* — todavía es tuya solo en papel.\n- **P/L realizado:** el resultado definitivo cuando cierras — el único que entra en tu journal.\n- **Margen usado:** la garantía retenida por tu posición. Con 0,06 lotes EUR/USD a 1,0852 y apalancamiento 1:30: (0,06 × 100 000 × 1,0852) ÷ 30 ≈ **217 $**.\n- **Margen libre:** capital − margen usado − pérdidas flotantes. Si tiende a 0, tu tamaño es demasiado grande — el programa te quiere lejos de esa línea.\n- **Swap acumulado:** el almacén de la [Lección 4.3](leccion-4-3.md) cobrando en tiempo real.\n\n**Visual — el circuito de progresión del programa** (la demo es la primera etapa, no el destino):\n\n```mermaid\nflowchart LR\n    D[\"🏦 Demo N1<br/>mecánica impecable<br/>misión M-4: 10/10 con SL\"] --> F[\"🧪 Demo forward N2-N3<br/>sistema v1.0 + 30 repeticiones<br/>E medido en TU journal\"]\n    F --> R[\"💵 Real micro F4<br/>0,25-0,5% por operación<br/>primer dólar real (veto CRO respetado)\"]\n    D -.->|\"⚠️ NO es un paso opcional<br/>ni una etapa decorativa\"| F\n```\n\n## Analogía\n\nSimulador de vuelo. Ninguna aerolínea sienta a un novato al mando de un 747 con pasajeros: primero cientos de horas de simulador, donde estrellarse es gratis y cada procedimiento se repite hasta el músculo. Pero nadie finge que el simulador vuela: no hay turbulencia emocional, no hay pasajeros detrás, no hay consecuencia. La industria del trading hace lo contrario que la aeronáutica: le dice al novato \"súbete, el dinero te enseña\" — y por eso estudios de reguladores estiman que entre el 70 % y el 90 % pierde. El programa aeronáutico es el del programa: demo primero, protocolo completo, y honestidad sobre lo que el simulador no puede enseñarte — el sudor del pasajero real lo conocerás en F4, con riesgo micro, no antes.\n\n## Cómo se hace: tu sesión de configuración (una vez, 30 minutos)\n\n1. **Abre la demo** con el bróker que hayas preseleccionado en el paso 0 de la [Receta](../../03-recursos/laboratorio/receta-primera-operacion.md) (due diligence sin marcas, regulación verificada).\n2. **Fija capital 2 000 $ y apalancamiento 1:30** *(o tu plan real; más apalancamiento no es \"mejor\": es más margen para cometer errores más grandes)*.\n3. **Carga el layout `FIT12-trabajo`** de la [Lección 4.1](leccion-4-1.md) y la watchlist de 5 instrumentos.\n4. **Verifica el tamaño:** abre la calculadora de lote (o la fórmula: lote = riesgo $ ÷ (SL pips × valor pip)): 20 $ ÷ (30 × 10) = 0,066 → **0,06** en EUR/USD.\n5. **Ejecuta tu primera OCO completa** siguiendo la receta: buy limit 1,0824 + SL 1,0794 + TP 1,0884 *(precios ilustrativos del caso maestro)*.\n6. **Lee el panel:** margen usado ≈ 217 $, margen libre ≈ 1 783 $, P/L flotante en 0.\n7. **Deja la posición trabajar** con SL/TP montados y cierra la plataforma — la OCO vigila por ti.\n8. **Al día siguiente:** revisa el resultado, regístralo en `journal/plantilla_journal_v0.csv` y completa el checklist de 6 puntos de la misión M-4.\n9. **Repite en XAU/USD:** ficha de variación de la receta: riesgo 20 $, SL 4 $ de recorrido → 5 oz = 0,05 lotes (0,05 × 100 oz × 4 $ = 20 $ ✓).\n10. **Confirma el circuito completo:** orden montada → ejecutada → gestionada (o no gestionada: la OCO gestiona) → cerrada → registrada. Ese bucle ES la mecánica que N1 certifica.\n\n## Error común\n\n**(1) La demo casino:** 100 000 $ virtuales, lotes de 1.00, 30 operaciones al día, cero journal. Entrena exactamente lo contrario del plan: tamaño fantasma, frecuencia patológica y memoria sin datos. La primera semana real de esa persona será una descongelación dolorosa — mejor no crear los vicios. **(2) El perfeccionismo demo infinito:** \"aún no estoy listo\" en el mes 8 de demo sin criterio de salida. El programa fija umbrales: misión M-4 (10/10 mecánica impecable) cierra N1, y N2 avanza en demo-forward con sistema — la demo no es un refugio del miedo, es un laboratorio con entregables. **(3) Tomar el P/L flotante como resultado:** el trade \"que ganaba 40 pips y cerró en −30\" no perdió 70 pips porque \"el mercado se lo robó\": sin TP parcial ni gestión planificada (eso llega en M8), el flotante es papel. Lo único real es el precio de cierre. **(4) Cambiar el capital virtual a mitad** \"para probar con más margen\": rompe la comparabilidad de tu estadística — la demo es un experimento con variable única: tu mecánica.\n\n## Conexión cuantitativa\n\nLa demo es donde tu mecánica se vuelve **medible sin costo**: el objetivo de la misión M-4 es 10/10 con SL puesto antes de entrar (100 %, sin excepciones) — un KPI binario que la demo mide perfectamente porque no requiere dinero. El resto de métricas de la demo son provisionales por diseño: WR, E y rachas medidos en demo **no cuentan** como estadística del sistema (N pequeña, sin slippage real, sin psicología) — el programa los invalida explícitamente para que nadie construya confianza sobre arena. La progresión honesta: demo = mecánica (N1) → demo-forward = sistema con muestra (N2-N3, N ≥ 30 repeticiones documentadas) → real micro = psicología con riesgo acotado (F4: 0,25–0,5 %). Cada etapa responde una pregunta distinta; mezclarlas es contestar mal las tres.\n\n---\n\n## 🎯 Puntos clave\n\n1. La demo simula mecánica y flujo de trabajo; NO simula slippage real, fricción ni tu psicología con dinero real.\n2. Configuración realista no negociable: capital del plan real, riesgo 1 %, apalancamiento real, tipo de cuenta real, lotes micro (0,05–0,06).\n3. Panel: P/L flotante es papel; realizado es journal. Margen usado ≈ 217 $ en tu posición tipo 1:30; si el margen libre se encoge, el tamaño sobra.\n4. El circuito del programa: demo (mecánica) → demo-forward (sistema) → real micro (psicología) — cada etapa responde una pregunta distinta.\n5. La demo no da estadística de sistema: WR y E demo se invalidan por N pequeño y costos irreales.\n6. Criterio de salida de la demo: misión M-4 completa — la demo sin entregable es refugio, no laboratorio.\n\n## 🔄 Autoevaluación rápida\n\n1. ¿Qué dos cosas simula bien la demo y qué tres no simula? ¿Por qué esa diferencia define el KPI de la misión M-4?\n2. Calcula el margen usado de 0,10 lotes EUR/USD a 1,0900 con apalancamiento 1:30. ¿Y con 1:100?\n3. Tu amigo lleva 8 meses en demo \"preparándose\" sin misiones ni entregables. ¿Qué le objeta el programa?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Simula bien: mecánica completa (órdenes, OCO, margen, swap) y el flujo de trabajo (journal, checklist). No simula: slippage real en noticias/gaps, tu psicología con dinero real, y fricciones de cuenta real (requotes, stops-out). Por eso el KPI de M-4 es binario de mecánica (10/10 con SL puesto antes de entrar): es lo único que la demo puede medir con validez — WR/E demo quedan invalidados como estadística.\n2. Nominal = 0,10 × 100 000 × 1,0900 = 10 900 $. A 1:30: 10 900 ÷ 30 ≈ **363 $** de margen usado. A 1:100: **109 $**. El margen menor de 1:100 no te hace más rico: solo permite posiciones más grandes — el riesgo real lo define el SL y el lote, no el apalancamiento (la cuenta 1:100 solo facilita el error de tamaño).\n3. La demo sin entregables es refugio, no laboratorio: 8 meses sin misiones no producen mecánica certificada ni datos comparables. El programa fija umbrales de salida (M-4: 10/10; luego N2 con 30 repeticiones documentadas). La objeción correcta: ¿qué pregunta concreta responde hoy tu demo? Si no hay pregunta, hay miedo con excusa técnica — y la progresión del programa existe precisamente para no quedarse atrapado ahí.\n\n</details>\n"},{"i":32,"g":"🧱 M4 · Plataforma y Primera Ejecución","t":"4.6 · El Stop Loss como ley","f":"docs/02-modulos/mod-04-plataforma-y-primera-ejecucion/leccion-4-6.md","md":"# Lección 4.6 · El Stop Loss como ley\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 45–60 min de estudio |\n| 🧱 Módulo | [M4 · Plataforma y Primera Ejecución](README.md) |\n| ⬅️ Anterior | [Lección 4.5 · Cuenta demo](leccion-4-5.md) |\n| ➡️ Siguiente | — (última lección del módulo; sigue el [Examen N1](../../03-recursos/evaluaciones/examen-n1.md)) |\n\n---\n\n## Por qué importa\n\nEsta lección cierra el Nivel 1 con la única regla del programa que no admite contextos, excepciones ni \"solo esta vez\": **toda posición lleva Stop Loss puesto antes de entrar**. El SL es el mecanismo que acota tu peor caso a 1R conocido antes de arriesgar un centavo — y sin él, la esperanza matemática de la [Lección 1.4](../mod-01-negocio-trading/leccion-1-4.md) no existe: no puedes calcular E cuando la cola de pérdidas no tiene suelo. El SL es también lo que convierte la estadística de la industria (70–90 % de cuentas perdedoras) en algo que no te aplica mecánicamente: la mayoría de esas cuentas muere por posiciones sin salida planificada que se convirtieron en \"inversiones a la baja\". Aquí no vamos a \"intentar ponerlo casi siempre\": el checklist de ejecución del programa exige SL montado en el 100 % de las operaciones, y la misión M-4 certifica exactamente eso.\n\n## Concepto\n\n**Definición:** el Stop Loss es una orden stop de cierre a un precio donde tu idea queda **invalidada** — no donde el dolor se vuelve insoportable. La diferencia es estructural: el mercado decide el primer precio (donde el análisis muere), tú solo calculas el lote que cabe.\n\n**Las tres propiedades de la ley:**\n\n1. **Se define ANTES de entrar.** El SL es la entrada de tu cálculo, no su corrección: primero SL, después lote — invirtiendo el orden, \"eliges\" el stop para que quepa la apuesta que ya querías, y eso es deformar el análisis en favor del deseo.\n2. **Va por estructura.** Long: bajo el **mínimo del swing/zona** que sostiene tu entrada; short: sobre el **máximo del swing/zona**. Con margen de respiración: spread + ruido local del marco (2–3 pips en EUR/USD H1 *(ilustrativo)*; escala con el ADR del instrumento, [Lección 2.4](../mod-02-motor-del-precio/leccion-2-4.md)). Un SL dentro del ruido no es protección: es una barrida de stops esperando ocurrir ([Lección 2.3](../mod-02-motor-del-precio/leccion-2-3.md)).\n3. **Nunca se aleja del precio.** El SL se queda, se acerca (breakeven/arrastre, opcional y posterior — M8) o se ejecuta. Moverlo en contra para \"darle aire\" convierte tu −1R planeado en −2R, −3R… y anula el cálculo de ruina de todo el programa.\n\n**SL mental no es SL.** \"Lo llevo en la cabeza\" significa que en el momento crítico — adrenalina, noticia, tick que roza — tu disciplina compita contra la plataforma. La historia de cada cuenta rota tiene esa frase en algún lugar. La ley: la orden está montada en el bróker, verificada en el panel, antes de que la entrada exista.\n\n**La fórmula que amarra todo** (la de la receta): $\\text{lote} = \\dfrac{\\text{riesgo \\$}}{\\text{SL pips} \\times \\text{valor pip}}$. El SL sale de la estructura; el riesgo sale de tu plan (1 %); el lote es el **resultado**, nunca la entrada.\n\n**Visual — protocolo de colocación por estructura (long):**\n\n```mermaid\nflowchart TD\n    I[\"📍 Entrada definida por tu setup<br/>(ej. retesteo confirmado en zona)\"] --> Q{\"¿Dónde queda INVALIDADA la idea?\"}\n    Q -->|\"long\"| SW[\"Mínimo del swing / borde inferior<br/>de la zona que sostiene la entrada\"]\n    SW --> B[\"➕ Margen de respiración:<br/>spread + ruido local (2-3 pips)\"]\n    B --> SL[\"🛡️ SL final → orden stop montada<br/>ANTES de ejecutar la entrada\"]\n    SL --> L[\"🧮 lote = riesgo$ ÷ (SL pips × valor pip)<br/>20$ ÷ (30 × 10) = 0,066 → 0,06\"]\n    L --> RB{\"¿R:B ≥ 1:2 con el TP por estructura?\"}\n    RB -->|No| NO[\"🚫 No hay operación.<br/>Otra zona, otro día.\"]\n    RB -->|Sí| OK[\"✅ OCO completa → journal listo<br/>→ ejecutar → registrar\"]\n```\n\n## Analogía\n\nEl cinturón de seguridad. No lo abrochas porque calculaste que hoy chocabas: lo abrochas porque el choque **no está bajo tu control**, y lo abrochas antes de arrancar — nadie se lo pone en plena curva. El SL es tu cinturón: no implica que tu idea sea mala, implica que el mercado puede invalidarla sin avisar. Y quitarlo en la pérdida es la locura exacta de soltarte el cinturón porque \"el golpe ya viene y el cinturón me aprieta\": el cinturón no causa el golpe — te separa a ti del parabrisas. Por eso SL mental no vale: el cinturón en el maletero (\"lo llevo por si acaso\") no abrocha a nadie.\n\n## Cómo se hace: el caso maestro completo, con números cerrados\n\nLa operación tipo de la receta, ahora vista desde el SL:\n\n1. **Setup:** retesteo confirmado de la zona 1,0820–1,0824 en EUR/USD H4, régimen y protocolo de 3 pasos completos ([Lección 3.4](../mod-03-anatomia-del-grafico/leccion-3-4.md)).\n2. **¿Dónde muere la idea?** Bajo el mínimo del swing local: **1,0798** (el precio perdiendo ese mínimo ya no es \"retesteo que se sostiene\": es rotura fallida).\n3. **Margen de respiración:** mínimo del swing local **1,0798** − 4 pips (spread 2 + ruido local 2) → **SL = 1,0794** = 30 pips bajo la entrada limit de 1,0824. El SL quedó tras la estructura con aire, no en el depósito obvio de stops ([Lección 2.3](../mod-02-motor-del-precio/leccion-2-3.md)).\n4. **Lote desde el SL:** riesgo 1 % de 2 000 $ = 20 $; lote = 20 ÷ (30 × 10) = 0,066 → **0,06** (redondeo SIEMPRE a la baja): riesgo real 18 $ = **0,9 %** ✓.\n5. **TP por estructura:** resistencia opuesta 1,0884 = 60 pips → R:B nominal **2,0** ✓ (mínimo del programa).\n6. **OCO montada y verificada** (mecánica de la [Lección 4.2](leccion-4-2.md)): buy limit 1,0824 + SL 1,0794 + TP 1,0884 — verificada en el panel ANTES de la sesión.\n7. **Journal listo** con la fila de la plantilla esperando datos.\n\n**El checklist de ejecución — 6 de 6 o no hay operación** (la moneda del criterio de graduación):\n\n```text\n□ 1. Setup definido por escrito (qué lo activa y qué lo invalida)\n□ 2. SL colocado por estructura (tras el swing/zona, con respiración)\n□ 3. SL montado en la plataforma ANTES de la entrada\n□ 4. Lote calculado DESDE el SL (riesgo ≤ 1 %, redondeo a la baja)\n□ 5. TP por estructura con R:B ≥ 1:2\n□ 6. OCO completa verificada + fila del journal abierta\n```\n\n## Error común\n\n**(1) El SL en el borde exacto** — el depósito de stops de todo el mundo está 1-2 pips tras el nivel obvio ([Lección 2.3](../mod-02-motor-del-precio/leccion-2-3.md)): tu SL correcto está tras el swing real con respiración, no en la fila. **(2) El SL por tolerancia al dolor** — \"máximo 40 pips porque son 40 $\": el mercado no sabe cuánto toleras; si la estructura pide 28 pips y tu dolor pide 40, el problema es el tamaño (baja el lote), no la estructura. **(3) Quitar el SL cuando \"está a punto de tocar\"** — el instante en que más lo necesitas es el instante en que la adrenalina pide quitarlo; la ley existe para esos 30 segundos. **(4) Moverlo en contra** — \"le doy aire y vuelve\": cada pip de aire extra es deuda de riesgo que tu plan no presupuestó; si toca el SL nuevo, la pérdida ya no es 1R y tu serie de ruina cambió sin que lo autorizaras. **(5) Primero el lote, luego el stop** — invertir la fórmula para \"aprovechar\" un tamaño mayor es poner la apuesta antes que el análisis: es la definición operativa de apostar.\n\n## Conexión cuantitativa\n\nCon SL, tu peor caso por operación es exactamente −1R (más slippage): 10 operaciones fallidas seguidas = −10R = −18 % de una cuenta de 2 000 $ con R = 18 $… desagradable, **sobrevivible y medible**. Sin SL, una sola operación puede costar 5R, 10R o la cuenta: un gap de fin de semana, un FOMC con ventana roja ignorada ([Lección 2.6](../mod-02-motor-del-precio/leccion-2-6.md)), un squeeze en corto ([Lección 4.4](leccion-4-4.md)) — la distribución de pérdidas deja de tener cola acotada y la ruina deja de ser improbabilidad para ser **cuestión de exposición temporal**. Y hay una segunda consecuencia, menos obvia: con SL fiable, tu E es $E = (P_w \\times W) - (P_l \\times 1R)$ con pérdidas exactas — cada estadística del programa (breakeven WR = 1/(1+R:B), tablas de rachas) solo funciona si el lado perdedor vale exactamente 1R. **El SL no es una protección añadida al sistema: es la condición matemática para que exista sistema.**\n\n---\n\n## 🎯 Puntos clave\n\n1. El SL marca el precio donde la idea queda INVALIDADA — no donde el dolor se vuelve insoportable.\n2. Las 3 propiedades de la ley: definido antes de entrar, colocado por estructura (con respiración), nunca se aleja.\n3. SL mental no es SL: la orden está montada y verificada en el bróker, o no hay operación.\n4. El orden sagrado: estructura → SL → lote. El lote es el resultado del cálculo, jamás su entrada.\n5. Checklist 6/6: setup, SL estructural, SL montado antes, lote desde el SL, TP con R:B ≥ 1:2, OCO verificada + journal.\n6. El SL es la condición matemática del sistema: sin pérdidas acotadas a 1R, ni E ni breakeven WR ni gestión de rachas existen.\n\n## 🔄 Autoevaluación rápida\n\n1. ¿Por qué el SL va \"tras el swing con respiración\" y no en el borde exacto de la zona? Conecta con la Lección 2.3.\n2. Tu estructura pide SL de 28 pips; tu presupuesto emocional pide 40. ¿Qué dice la ley del programa y qué ajustas?\n3. Un trade avanza +1R y tu SL sigue en el punto original. Luego retrocede y lo toca: pierdes 1R tras haber estado +1R. ¿Qué violación NO cometiste, qué es opcional hacer en ese estado y en qué módulo se enseña?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. El borde exacto es el depósito de stops de todo el mercado (nivel obvio): las barridas de liquidez de la Lección 2.3 atraviesan esos 1-2 pips, detonan la fila y revierten. Tras el swing real + respiración, tu stop solo salta si la estructura misma cedió — que es exactamente tu definición de idea invalidada. En el borde, sales sin que tu idea haya muerto: pagas el peaje de estar en la fila equivocada.\n2. La ley: el SL lo define la estructura, nunca el dolor. Si la estructura pide 28 pips, el SL va a 28 pips y se ajusta el **tamaño**: lote = 20 $ ÷ (28 × 10) = 0,071 → 0,07 (riesgo real 19,6 $ ≈ 0,98 %). El presupuesto emocional se respeta bajando el lote, jamás deformando el stop — deformar el stop para caber es poner la apuesta antes que el análisis.\n3. NO violaste nada: el SL estaba montado desde antes, no se movió en contra, y ejecutó −1R exacto — eso es la ley funcionando, no un error. Lo opcional en ese estado era **mover el SL a breakeven** (o arrastrarlo) una vez el trade avanzó a favor — gestión de posición activa, que el programa enseña en M8 (Gestión del Riesgo). Antes de M8, dejar el SL original intacto es la conducta correcta por defecto.\n\n</details>\n"},{"i":33,"g":"🏆 Evaluaciones","t":"Examen integrador N1 (M1-M4)","f":"docs/03-recursos/evaluaciones/examen-n1.md","md":"# 🏆 Examen Integrador — Nivel 1 · Fundamentos (M1–M4)\n\n> [!WARNING]\n> **Contenido educativo.** Este examen evalúa comprensión del programa FIT-12. No constituye asesoría financiera.\n\n| Campo | Detalle |\n|---|---|\n| 🧱 Nivel | 1 · Fundamentos — evaluación 🏆 de cierre |\n| 📦 Cubre | M1 (Negocio y Ciencia) · M2 (Motor del Precio) · M3 (Anatomía del Gráfico) · M4 (Plataforma y Primera Ejecución) |\n| 📋 Formato | 30 preguntas cerradas + 5 preguntas socráticas (en vivo con el agente) |\n| 🎯 Aprobado | **≥ 24/30 (80 %)** en el bloque cerrado |\n| 📏 Modalidad | Sin apuntes, sin lecciones abiertas. Clave de respuestas oculta al final |\n| ⏱️ Tiempo sugerido | 90–120 min, en una sola sesión |\n\n---\n\n## Instrucciones\n\n1. **Prepara la sesión:** 90–120 min sin interrupciones, sin lecciones abiertas, sin glosario. El examen mide lo que ya vive en ti, no lo que puedes consultar.\n2. **Responde con tus palabras:** las respuestas de una línea exacta al texto de la lección puntúan igual que una explicación propia correcta — pero en la entrevista socrática lo que se defiende es TU razonamiento.\n3. **Los cálculos con número:** muestra el planteo (fórmula y sustitución). El número final sin procedimiento no acredita comprensión.\n4. **Autocorrección honesta:** corrige con la clave, cuenta tus aciertos y registra el resultado en `journal/evaluaciones.md`. Si quedas en 20–23, revisa los bloques fallidos y repite el examen en 7 días (versión B, orada por el agente). Si quedas por debajo de 20, el N1 no cierra: vuelve a las lecciones señaladas — es el mapa del programa, no un juicio sobre ti.\n5. **Entrega previa:** este examen solo se rinde con la **Misión M-4 completa** (10/10 con cero violaciones de SL) y el **laboratorio M4 entregado** — la teoría se examina después de que la mecánica demostró que existe.\n\n---\n\n## Bloque A · M1 — El Trading como Negocio y Ciencia (7 preguntas)\n\n**A1.** Define trading como negocio frente a la definición de apuesta usando tres diferencias estructurales (no emocionales).\n\n**A2.** La ecuación de esperanza del programa: escríbela y explica qué le pasa a un sistema con E positivo si las pérdidas no están acotadas.\n\n**A3.** Calcula la probabilidad de racha: con WR = 60 %, ¿cuál es la probabilidad de 3 pérdidas seguidas en la próxima tripleta? ¿Y de 5 seguidas con WR = 40 %? *(planteo y número)*\n\n**A4.** ¿Qué mide el R:B de un sistema y por qué el programa exige mínimo 1:2? ¿Qué WR de equilibrio implica 1:2? *(fórmula del breakeven)*\n\n**A5.** Enuncia la regla 85/15 *(heurística)* y di qué implica para el orden de prioridades de tu estudio en N1.\n\n**A6.** La curva de aprendizaje real ([Lección 1.5](../../02-modulos/mod-01-negocio-trading/leccion-1-5.md)): describe sus 3 fases y qué se estudia en cada una.\n\n**A7.** ¿Por qué el programa prohíbe firmar el contrato anti-ludopatía \"por cumplir\"? ¿Qué compromisos concretos incluye (cita 3)?\n\n## Bloque B · M2 — El Motor del Precio (8 preguntas)\n\n**B1.** Bid, ask y spread: defínelos y explica quién cobra el spread y por qué no existe el \"asiento gratis\" en la subasta.\n\n**B2.** Taker vs maker: ¿quién aporta urgencia y quién liquidez? ¿Qué rol juegas al poner la entrada limit de tu receta?\n\n**B3.** Viaje asimétrico: con spread de 2 pips, TP de 60 y SL de 30, calcula los recorridos reales del bid hacia cada objetivo y explica de dónde sale la diferencia.\n\n**B4.** Oferta/demanda: ¿por qué una zona visitada 7 veces es más débil que una fresca? Usa la lógica de órdenes pendientes.\n\n**B5.** Liquidez: describe la anatomía de una barrida de stops en 3 pasos. ¿Qué tipo de orden del retail es la materia prima de la barrida?\n\n**B6.** Sesiones forex: ¿cuál es el solapamiento Londres–NY en hora Bolivia y por qué el programa restringe la operativa a ese tramo? (dos razones).\n\n**B7.** Personalidad de mercados: menciona 3 diferencias operativas entre EUR/USD y XAU/USD que cambien tu cálculo de posición con el mismo riesgo de 20 $.\n\n**B8.** Eventos macro: enuncia la regla de la ventana roja (15/15 y FOMC 30/30) y calcula el costo de ignorarla: SL de 30 pips con slippage de 1,5R en la noticia *(resultado en pips y en $ con lote 0,06)*.\n\n## Bloque C · M3 — Anatomía del Gráfico (8 preguntas)\n\n**C1.** Descompón una vela: ¿qué mide el cuerpo y qué miden las mechas? ¿Por qué el programa evalúa confirmaciones sobre el Close y no sobre toques intra-vela?\n\n**C2.** Los 4 ciclos en orden, una frase por fase, y el nombre de la fase donde el institucional compra sin mover el precio.\n\n**C3.** Dow: ¿qué secuencia define una tendencia alcista sana y qué evento marca su muerte?\n\n**C4.** ¿Por qué zonas y no líneas? Da las dos razones (macroestructura de órdenes + implicancia práctica del marcado).\n\n**C5.** Protocolo de confirmación en 3 pasos: enúncialo completo y di qué mecanismo de la Lección 2.3 filtra el paso 2.\n\n**C6.** Falso rompimiento: ¿qué proceso lo genera y cuál es la única conducta permitida ante él durante tu formación?\n\n**C7.** Test de 3 marcas del régimen: enúncialo y clasifica: \"US30, 9 sesiones solapadas entre dos bordes, roturas intra-vela que siempre vuelven\" — ¿régimen y conducta?\n\n**C8.** Whipsaw: ¿qué es, a quién cobra y qué dos reglas del programa lo neutralizan?\n\n## Bloque D · M4 — Plataforma y Primera Ejecución (7 preguntas)\n\n**D1.** Market, limit, stop: ¿qué garantiza cada una y qué no? Asigna un uso del programa a cada una.\n\n**D2.** ¿Por qué el SL nunca se monta como stop-limit? Descríbelo con un gap de 20 pips sobre un SL en 1,0794.\n\n**D3.** Los 4 costos: clasifícalos en \"toda operación\" vs \"condicionales\" y desmonta el marketing de la \"cuenta sin comisiones\".\n\n**D4.** Cálculo: sistema con E bruto +0,20R, costo todo incluido 0,09R, 40 operaciones/mes, R = 20 $. ¿E neto mensual en $ y porcentaje de la ventaja que se comió el peaje?\n\n**D5.** Mecánica del short: los 5 pasos, de dónde sale la ganancia, y por qué su riesgo sin SL no tiene techo (contrástalo con el peor caso del long).\n\n**D6.** Cálculo de posición completo: riesgo 20 $ (1 % de 2 000 $), SL estructural de 28 pips en EUR/USD. ¿Qué lote resulta (con redondeo del programa) y qué riesgo real? *(fórmula: lote = riesgo $ ÷ (SL pips × valor pip); valor pip 1 lote = 10 $)*\n\n**D7.** Las 3 propiedades de la ley del SL y las 3 casillas del checklist 6/6 que certifican que la ley se cumplió antes de entrar.\n\n---\n\n## 🗣️ Entrevista Socrática (en vivo con el agente — 5 preguntas abiertas)\n\nSe responden en conversación con tu agente después de aprobar el bloque cerrado. No tienen clave: se defienden con razonamiento.\n\n1. **Integración M1→M4:** explica, en tu propia cadena causal, cómo la esperanza matemática de M1 exige el SL de M4. ¿Qué se rompe primero si quitas el SL: la fórmula de E, la gestión de rachas o la ruina? ¿Por qué?\n2. **Caso en vivo:** el agente te muestra un gráfico (Bar Replay ocultando el futuro): régimen (3 marcas), ciclo (4 fases), 2 zonas con gradiente, y qué protocolo aplicarías si el precio llegara a tu zona — con SL, lote y R:B calculados en voz alta.\n3. **El costo propio:** con los 4 costos de la Lección 4.3, estima la factura mensual de tu operativa planificada (20 operaciones) y di qué dos palancas la reducirían sin tocar tu sistema.\n4. **El corto que no quieres:** tu sistema da una señal corta confirmada en tu instrumento principal. ¿Qué tres riesgos específicos del corto verificas antes de ejecutar y cómo los cubre tu checklist 6/6?\n5. **La demo honesta:** ¿qué puede certificar tu demo y qué jamás podrá? Si un amigo te dice \"gané 40 % en demo, ya estoy listo\", ¿qué le responde el programa?\n\n---\n\n## ✅ Checklist de ejecución (criterio \"sin violaciones\" de N1)\n\nRevisión conjunta con el agente sobre el journal de la Misión M-4:\n\n```text\n□ Las 10 operaciones de M-4 tienen SL montado ANTES de la entrada (100 %)\n□ Ningún SL fue movido en contra en ninguna operación (0 casos)\n□ Lote calculado desde el SL en las 10 (riesgo ≤ 1 %, redondeo a la baja)\n□ Toda OCO verificada en panel antes de la sesión (10/10)\n□ Ninguna entrada ejecutada con market \"para no perderme el movimiento\"\n□ Journal completo al cierre de cada operación (10/10 filas)\n```\n\n**Una casilla sin marcar = N1 no cierra.** El examen teórico puede repetirse en 7 días; la mecánica violada debe reconstruirse con la misión desde la fila que falló.\n\n---\n\n## Resultado y registro\n\n| Ítem | Umbral | Tu resultado |\n|---|---|---|\n| Bloque A (M1) | 7 preguntas | __ /7 |\n| Bloque B (M2) | 8 preguntas | __ /8 |\n| Bloque C (M3) | 8 preguntas | __ /8 |\n| Bloque D (M4) | 7 preguntas | __ /7 |\n| **Total cerrado** | **≥ 24/30 (80 %)** | **__ /30** |\n| Entrevista socrática | 5/5 defendidas con razonamiento | __ /5 |\n| Checklist de ejecución | 6/6 casillas | __ /6 |\n\nRegistra la fecha, el resultado y las lecciones falladas en `journal/evaluaciones.md`. N1 🏆 se certifica con los tres umbrales en verde simultáneamente.\n\n---\n\n## <details><summary>🔑 Clave de respuestas — abrir SOLO tras rendir</summary>\n\n### Bloque A · M1\n\n- **A1.** Negocio: horizonte definido, costos presupuestados, pérdida máxima conocida por operación (1R), decisiones por proceso escrito y medible con estadística propia. Apuesta: resultado binario por evento, sin presupuesto de pérdida ni proceso — la ganancia depende del azar, no de una ventaja repetible. Las tres diferencias: proceso vs impulso, riesgo acotado vs riesgo abierto, estadística propia vs esperanza ajena.\n- **A2.** $E = (P_w \\times W) - (P_l \\times L)$. Con pérdidas no acotadas, $L$ no tiene valor conocido: la E deja de ser calculable (cualquier E positiva puede anularla una sola pérdida extrema). Por eso el SL es condición para que exista E.\n- **A3.** $P(3\\text{ pérdidas}) = 0{,}4^3 = 6{,}4\\%$ por tripleta (WR 60 % → prob. pérdida 40 %). $P(5) = 0{,}6^5 = 7{,}8\\%$ (WR 40 % → prob. pérdida 60 %). A lo largo de una serie larga las rachas son **normales**, no anomalías — de ahí las tablas de rachas de la Lección 1.4.\n- **A4.** El R:B compara pérdida media (1R) con ganancia media. Con 1:2, el breakeven es $WR = \\frac{1}{1+2} = 33{,}3\\%$: puedes fallar 2 de cada 3 y empatar. Mínimo 1:2 porque deja el umbral de supervivencia muy por debajo del WR realista de un buen sistema, dando margen a la varianza.\n- **A5.** 85 % psicología + gestión de riesgo / 15 % técnica *(heurística)*. Implica: N1 se invierte en disciplina, mecánica y riesgo desde el día uno; la técnica sofisticada (N2) se construye sobre una conducta ya automatizada — no al revés.\n- **A6.** (1) Fase inconsciente-incompetente: no sabes lo que no sabes — se estudia el mapa completo (dimensiones, industrias, costos). (2) Fase consciente-incompetente: ya ves los errores — se estudia técnica y mecánica con journal. (3) Fase consciente-competente: proceso ejecutado con disciplina — se estudia sistema, validación y escalamiento. La nostalgia de la fase 1 (\"antes ganaba sin saber\") es la trampa clásica.\n- **A7.** Firmar por cumplir anula la función del contrato: es compromiso conductual, no burocracia. Incluye (entre otros): capital solo sobrante, límite de tiempo de pantalla, prohibición de Martingala/doblar, registro obligatorio en journal, SL siempre, pausas tras rachas definidas, y firma con fecha.\n\n### Bloque B · M2\n\n- **B1.** Bid = precio al que te compran (vendes ahí); ask = al que te venden (compras ahí); spread = la distancia: el peaje. Lo cobra el lado maker (proveedor de liquidez) por estar disponible. No hay asiento gratis: taker paga spread en dinero; maker lo paga en operaciones que se le escapan.\n- **B2.** Taker = urgencia: consume el libro y paga el spread. Maker = paciencia: provee liquidez y cobra el spread. Tu entrada limit es rol **maker** (esperas al precio); tu salida por SL es taker inevitable.\n- **B3.** TP: el bid debe subir desde su punto de partida hasta entrada+60+2 = **62 pips** de recorrido. SL: le basta con bajar **28 pips** (30 − 2). La diferencia = 2 × spread: el costo de comprar al ask y que tus salidas se midan sobre el bid.\n- **B4.** Cada visita consume las órdenes pendientes estacionadas en la zona: a la séptima, el almacén está vacío — queda la fama, no la munición. Zona fresca = órdenes intactas = reacción probable. Por eso el gradiente de M3.3 \"más toques = más consumida\".\n- **B5.** (1) El precio se aproxima a un nivel obvio con stops acumulados detrás; (2) lo atraviesa detoning esa fila (stops = órdenes market de venta/compra); (3) el institucional llena tamaño con esa liquidez y el precio revierte. Materia prima: los stops del retail colocados en el borde obvio.\n- **B6.** Solapamiento ≈ **08:00–12:00 hora Bolivia** *(con aviso DST)*. Razones: (1) máximo volumen y profundidad → spreads mínimos (costo, Lección 4.3); (2) los movimientos estructurales del día se concentran ahí → el setup y su confirmación se ven con ruido mínimo.\n- **B7.** Con 20 $ de riesgo: (1) valor del tick/lote distinto (oro: 100 oz/lote → 1 $ de recorrido = 100 $/lote; EUR/USD 10 $/pip/lote) → lotes distintos (0,05 vs 0,06 en los ejemplos de la receta); (2) ADR mayor en oro → SL más ancho en pips → lote aún menor; (3) spread proporcionalmente mayor en oro y ventanas de liquidez distintas → horario y costo por operación cambian.\n- **B8.** Regla: no estar dentro de la ventana — 15 min antes/15 después del dato (FOMC: 30/30), posición cerrada u órdenes fuera. Costo de ignorarla: SL 30 pips + slippage 1,5R (45 pips) = **75 pips ≈ −45 $** con 0,06 lotes (75 pips × 0,6 $/pip) — 2,5R por un fallo de calendario, no de análisis.\n\n### Bloque C · M3\n\n- **C1.** Cuerpo (apertura→cierre): determinación del bando ganador. Mechas: dónde fue rechazada la urgencia. El **Close** es el veredicto: implica que la urgencia sobrevivió al período entero; un toque intra-vela puede ser barrida que revierte — evaluar en cierres filtra barridas.\n- **C2.** Acumulación (compra fragmentada en rango) → markup (expansión con cuerpo) → distribución (venta del inventario al retail en rango alto) → markdown (caída por urgencia). Compran sin mover precio en la **acumulación**.\n- **C3.** HH/HL sucesivos con impulsos y pullbacks que respetan estructura. Muere cuando la secuencia se rompe: falla el HH y aparece un LL con cierre decidido (ruptura de estructura).\n- **C4.** (a) Macroestructura: los grandes fragmentan; el interés vive en un área, no en un píxel. (b) Práctica: el rectángulo define entrada, invalidación (SL tras el cuerpo) y objetivo (borde opuesto) — la línea no permite ninguno de los tres cálculos.\n- **C5.** Ruptura → **cierre fuera del nivel** (en el marco de análisis) → retesteo que se sostiene. El paso 2 filtra la barrida de stops (2.3): el cierre implica que la urgencia sobrevivió al período — las roturas momentáneas quedan fuera.\n- **C6.** La recolección de liquidez: detrás del nivel obvio hay stops/entradas del retail que la rotura detona antes de revertir. Conducta en formación: dejar que el protocolo te filtre a ti — no operar roturas sin los 3 pasos (operar el falso como setup viene después, con estadística propia).\n- **C7.** Test: (1) estructura sin progresión ✓ (2) recorridos que vuelven al corredor ✓ (3) cuerpos pequeños alternados ✓ → **rango confirmado (3/3)**. Conducta: prohibido anticipar roturas de bordes; centro = tierra de nadie; lo operable = rechazo confirmado en bordes.\n- **C8.** Vaivén de roturas falsas de rango que cobra 1R por intento a los compradores de rompimiento. Lo neutralizan: (1) clasificar régimen ANTES de buscar setups (en rango, la rotura anticipada no existe como setup); (2) roturas solo con protocolo de 3 pasos.\n\n### Bloque D · M4\n\n- **D1.** Market: ejecución sí, precio no (urgencia/emergencia). Limit: precio sí, ejecución no (entrada en zona + TP). Stop: al tocar dispara market (SL + rupturas) — participación casi garantizada, precio no.\n- **D2.** Gap de 20 pips: el precio abre 20 pips más allá del nivel → la limit del stop-limit queda fuera de mercado y no llena → posición abierta sin protección mientras corre. El stop simple ejecuta a mercado con slippage acotado (~1 pip). Protección que puede no ejecutarse no es protección.\n- **D3.** Toda operación: spread (+ comisión si existe). Condicionales: slippage (noticias/gaps), swap (overnight). \"Sin comisiones\" = comisión viva escondida en el spread más ancho; solo se compara el costo todo incluido por operación.\n- **D4.** E neto = (0,20 − 0,09) × 40 × 20 $ = **+88 $/mes**. Bruto = 160 $ → el peaje comió **45 %** (0,09/0,20) de la ventaja.\n- **D5.** (1) Pedir prestadas (2) vender (3) esperar (4) recomprar más barato (5) devolver; ganancia = venta − recompra − costos. Long sin SL: techo de pérdida en precio 0 (acotado, aunque desastroso). Short sin SL: recompra sin techo → pérdida ilimitada: por eso el SL del corto es ley de las leyes.\n- **D6.** Lote = 20 ÷ (28 × 10) = 0,0714 → **0,07** (redondeo a la baja). Riesgo real = 0,07 × 28 × 10 = **19,6 $ ≈ 0,98 %** ✓.\n- **D7.** Propiedades: definido antes de entrar · colocado por estructura (con respiración) · nunca se aleja. Casillas del checklist que certifican cumplimiento previo: **#2** (SL por estructura), **#3** (SL montado antes de la entrada) y **#6** (OCO verificada + journal) — con #4 (lote desde el SL) cerrando el orden sagrado.\n\n</details>\n"},{"i":34,"g":"🧰 Recursos y bitácora","t":"Glosario maestro (111 términos)","f":"docs/03-recursos/glosario.md","md":"# 📖 Glosario Vivo — FIT-12\n\n> Glosario incremental: cada módulo añade sus términos al cerrar su sprint.\n> Formato: Término ES (*término EN*) — definición de una línea — módulo de origen.\n\n| Término | Inglés | Definición | Origen |\n|---|---|---|---|\n| Especulación | *speculation* | Compra/venta de activos para capturar diferencias de precio en plazos cortos, asumiendo riesgo deliberado | M1 |\n| Inversión | *investing* | Adquisición de activos por años para capturar su crecimiento subyacente | M1 |\n| Horizonte temporal | *time horizon* | Duración prevista de una posición o estrategia | M1 |\n| Liquidez | *liquidity* | Facilidad de comprar/vender tamaño sin mover el precio | M1 |\n| Proveedor de liquidez | *liquidity provider* | Agente cuyas órdenes pasivas permiten ejecutar las órdenes ajenas | M1 |\n| Spread | *spread* | Diferencia entre precio de compra y de venta; costo fijo por operación | M1 |\n| Esperanza matemática | *expected value* | Resultado medio esperado por operación: $E = (P_w \\times W) - (P_l \\times L)$ | M1 |\n| Win Rate | *win rate* | Porcentaje de operaciones ganadoras sobre el total | M1 |\n| Ratio riesgo-beneficio | *Risk:Reward (R:B)* | Relación entre la pérdida media y la ganancia media de un sistema | M1 |\n| R (unidad de riesgo) | *risk unit* | Cantidad arriesgada en una operación; las ganancias se miden en múltiplos de R | M1 |\n| Varianza | *variance* | Dispersión de resultados alrededor de la esperanza; explica rachas sin cambiar E | M1 |\n| Martingala | *martingale* | Gestión que dobla el tamaño tras pérdidas: WR alto aparente y ruina casi segura | M1 |\n| Fractalidad (autosimilar) | *self-similarity* | Las mismas formaciones aparecen en todo marco temporal, pero no idénticas ni al mismo costo | M1 |\n| Ruido | *noise* | Fluctuación de precio sin información; domina los marcos de tiempo bajos | M1 |\n| Position trading | *position trading* | Estilo con posiciones de semanas a meses | M1 |\n| Swing trading | *swing trading* | Estilo con posiciones de días a dos semanas | M1 |\n| Day trading | *day trading* | Estilo que abre y cierra dentro del mismo día, sin riesgo overnight | M1 |\n| Scalping | *scalping* | Estilo de segundos a minutos, máxima frecuencia y costo de transacción crítico | M1 |\n| Algo trading | *algorithmic trading* | Ejecución de reglas por software; el oficio es auditar la máquina | M1 |\n| Nomadeo | *strategy hopping* | Cambiar de coordenada (estilo/mercado) sin datos: reinicia la curva de aprendizaje | M1 |\n| Riesgo overnight | *overnight risk* | Exposición a gaps y eventos con la posición abierta fuera de sesión | M1 |\n| Spot | *spot* | Compra/venta al contado, sin apalancamiento estructural | M1 |\n| CFD | *contract for difference* | Derivado que replica la diferencia de precio; apalancado, sin vencimiento | M1 |\n| Futuros | *futures* | Contrato estandarizado con vencimiento y tamaño fijo, operado en bolsa | M1 |\n| Opciones | *options* | Derecho (no obligación) de comprar/vender a precio pactado; asimetría estructural | M1 |\n| ETF | *exchange-traded fund* | Fondo cotizado réplica de un activo o índice; vehículo de inversión pasiva | M1 |\n| Prop firm | *funded trading firm* | Empresa que alquila capital tras una evaluación de pago; vive mayormente de cuotas | M1 |\n| Screen time | *screen time* | Horas deliberadas de observación registrada que fabrican el reconocimiento de patrones | M1 |\n| Régimen de mercado | *market regime* | Estado del mercado (tendencia, rango, volatilidad alta/baja) que cambia el comportamiento de todo sistema | M1 |\n| Racha | *streak* | Secuencia de resultados iguales consecutivos; esperable por varianza | M1 |\n| Backtesting | *backtesting* | Validación de un sistema sobre histórico a ciegas; mínimo estadístico N ≥ 100 | M1 |\n| Drawdown | *drawdown* | Caída desde el pico de la curva de capital hasta su punto más bajo | M1 |\n| Capital quemable | *risk capital* | Dinero cuya pérdida total no cambia tu vida ni la de quien depende de ti | M1 |\n| Matrícula de mercado | — | Pérdidas presupuestadas de la fase de formación en real micro | M1 |\n| Runway | *runway* | Meses de vida que tu Carril A paga sin tocar el capital de trading | M1 |\n| Ruina del jugador | *gambler's ruin* | Probabilidad de caer a cero por tamaño excesivo, aun con esperanza positiva | M1 |\n| Cuenta demo | *demo account* | Cuenta de práctica con dinero ficticio y precios reales | M1 |\n| Tilt | *tilt* | Estado emocional que degrada la ejecución; origen de la mayoría de las catástrofes | M1 |\n| Bid | *bid* | Precio al que el mercado te compra (tu salida de un long) | M2 |\n| Ask | *ask/offer* | Precio al que el mercado te vende (tu entrada en un long) | M2 |\n| Spread | *spread* | Diferencia bid-ask; costo fijo por operación cobrado por los proveedores de liquidez | M2 |\n| Libro de órdenes | *order book / DOM* | Fila de órdenes de compra y venta por nivel de precio con sus cantidades | M2 |\n| Taker | *taker* | Participante agresivo con orden market: consume el libro y paga el spread | M2 |\n| Maker | *maker* | Participante pasivo con orden limit: provee liquidez y cobra el spread | M2 |\n| Liquidez | *liquidity* | Capacidad de ejecutar tamaño inmediato sin mover el precio (spread + profundidad) | M2 |\n| Impacto de mercado | *market impact* | Desplazamiento de precio que produce tu propia orden al consumir el libro | M2 |\n| Slippage | *slippage* | Diferencia entre el precio de tu orden/stop y el de ejecución real | M2 |\n| Pip | *pip* | Unidad mínima convencional de movimiento: 0,0001 (pares con yen: 0,01) | M2 |\n| Pipette | *pipette* | Décima de pip (quinta decimal); fuente clásica de errores ×10 en SL/TP | M2 |\n| Lote | *lot* | Tamaño de posición: estándar 100 000 u. (10 $/pip en EUR/USD), mini 0,1, micro 0,01 | M2 |\n| Oferta/demanda residual | *unfilled orders* | Interés que no se llenó en un movimiento previo y espera al retorno del precio | M2 |\n| Desequilibrio | *imbalance* | Estado en que un lado del mercado es más urgente; produce expansión | M2 |\n| Expansión | *expansion* | Salida rápida del precio de un nivel/rango hasta la próxima zona con órdenes | M2 |\n| Barrida de stops | *liquidity sweep / stop hunt* | Rotura breve de un nivel obvio para detonar stops y llenar órdenes grandes antes de revertir | M2 |\n| ADR | *average daily range* | Recorrido medio diario de un instrumento; calibra SL/TP realistas | M2 |\n| Sesiones | *sessions* | Turnos del día forex: Sídney, Tokio, Londres, Nueva York | M2 |\n| Solapamiento | *London–NY overlap* | Tramo Londres+NY (≈ 08:00–12:00 hora Bolivia): máximo volumen, mínimo spread | M2 |\n| Gap | *gap* | Salto de precio sin negociación entre un cierre y la apertura siguiente | M2 |\n| NFP | *non-farm payrolls* | Dato de empleo de EE. UU.; primer viernes del mes, 08:30 ET | M2 |\n| IPC | *CPI* | Inflación al consumidor de EE. UU.; ~mediados de mes, 08:30 ET | M2 |\n| FOMC | *FOMC* | Comité de la Fed: decisión de tasas 14:00 ET + rueda de prensa 14:30 ET | M2 |\n| DXY | *dollar index* | Índice del dólar frente a una cesta (EUR ~58 %); termómetro del apetito por USD | M2 |\n| Ventana roja | *high-impact window* | Perímetro sin posición alrededor de un evento macro: 15/15 min (FOMC 30/30) | M2 |\n| Correlación | *correlation* | Co-movimiento típico entre activos; válida por régimen, no como ley | M2 |\n| Receta de primera operación | — | Guía de 12 pasos del programa (demo → operación procesada → journal); recurso transversal | Recurso |\n| OHLC | *open/high/low/close* | Los cuatro precios de una vela: apertura, máximo, mínimo, cierre | M3 |\n| Cuerpo | *candle body* | Distancia apertura-cierre; mide la determinación del bando ganador | M3 |\n| Mecha | *wick/shadow* | Extensión del cuerpo al máximo/mínimo; mide el viaje rechazado | M3 |\n| Doji | *doji* | Vela con apertura ≈ cierre; empate de la subasta, pausa — nunca señal de dirección | M3 |\n| Martillo | *hammer* | Mecha inferior ≥ 2× cuerpo; venta absorbida abajo — señal solo EN contexto de zona | M3 |\n| Envolvente | *engulfing* | Vela que envuelve el cuerpo de la anterior en sentido contrario; reemplazo de bando | M3 |\n| Ciclo | *market cycle* | Acumulación → markup → distribución → markdown; el mapa de fases de todo mercado | M3 |\n| Impulso | *impulse* | Pierna de expansión en la dirección dominante con energía | M3 |\n| Pullback | *pullback* | Retroceso de una tendencia que respeta la estructura; andén de continuación | M3 |\n| Throwback | *throwback* | Retorno al origen de una rotura para retestear antes de continuar | M3 |\n| HH/HL | *higher high / higher low* | Secuencia de máximos y mínimos ascendentes: firma de tendencia alcista sana | M3 |\n| LL/LH | *lower low / lower high* | Secuencia descendente: firma de tendencia bajista | M3 |\n| Soporte/Resistencia | *support/resistance* | Zona con interés comprador/vendedor pendiente capaz de detener o invertir | M3 |\n| Zona | *zone* | Área (rectángulo con cuerpo) donde el precio reaccionó — la forma correcta de marcar niveles | M3 |\n| Polaridad | *polarity* | El nivel roto y confirmado cambia de bando: soporte↔resistencia | M3 |\n| Retesteo | *retest* | Vuelta del precio a un nivel roto para probarlo antes de continuar; paso 3 del protocolo | M3 |\n| Falso rompimiento | *false breakout* | Rotura sin cierre decidido fuera (o revertida tras lograrlo); mecanismo de recolección de liquidez | M3 |\n| Cuello | *neckline* | Línea de decisión de una figura (valle del doble techo); su rotura confirmada activa el patrón | M3 |\n| Régimen | *market regime* | Estado estructural: tendencia, rango o transición; el permiso operativo de cada sistema | M3 |\n| Transición | *transition* | Régimen mezclado (señales de dos estados); protocolo: operativa reducida o cero | M3 |\n| Whipsaw | *whipsaw* | Vaivén de roturas falsas de rango que cobra 1R por intento a los impacientes | M3 |\n| Bar Replay | *bar replay* | Reproducción vela a vela del histórico para practicar sin ver el futuro | M3 |\n| Orden market | *market order* | Ejecuta ya al mejor precio disponible: garantiza ejecución, no precio | M4 |\n| Orden limit | *limit order* | Ejecuta solo a tu precio o mejor: garantiza precio, no ejecución | M4 |\n| Orden stop | *stop order* | Dormida hasta que el precio toca el nivel; dispara market: SL y rupturas | M4 |\n| Stop-limit | *stop-limit order* | Al tocar el nivel dispara una limit: puede no llenarse — prohibido como SL | M4 |\n| OCO | *one-cancels-other* | Dos órdenes emparejadas (SL+TP): una ejecuta, la otra se cancela | M4 |\n| Slippage | *slippage* | Diferencia entre precio pedido y obtenido; intermitente, concentrado en noticias/gaps | M4 |\n| Comisión | *commission* | Cargo fijo por operación en cuentas raw/ECN; en las standard vive en el spread | M4 |\n| Swap (rollover) | *swap / overnight fee* | Interés diario por posición overnight (diferencial de tasas); triple los miércoles | M4 |\n| Cuenta raw/ECN | *raw/ECN account* | Spread mínimo + comisión fija; se compara todo incluido, nunca partida aislada | M4 |\n| Margen | *margin* | Garantía retenida por la posición: nominal ÷ apalancamiento | M4 |\n| Margen libre | *free margin* | Capital − margen usado − pérdidas flotantes; si se encoge, sobredimensionas | M4 |\n| Apalancamiento | *leverage* | Multiplicador del nominal por cada $ de garantía; agranda el error, no el riesgo planeado | M4 |\n| P/L flotante | *floating P/L* | Resultado si cerraras ahora: papel hasta que cierras | M4 |\n| P/L realizado | *realized P/L* | Resultado definitivo al cerrar: el único que entra al journal | M4 |\n| Posición corta | *short position* | Vender prestado para recomprar más barato; riesgo sin techo si no hay SL | M4 |\n| Borrow fee | *borrow fee* | Interés anual por el préstamo de acciones en corto; entra en E como costo | M4 |\n| Short squeeze | *short squeeze* | Cascada de recompras obligadas de cortos perdedores que acelera la subida | M4 |\n| Gap risk | *gap risk* | Salto de precio que se salta tu nivel: exige tamaño menor en cortos y fines de semana | M4 |\n| Breakeven | *break-even* | Mover el SL al precio de entrada cuando el trade avanza: gestión opcional (M8) | M4 |\n| Layout | *layout* | Plantilla de gráficos fijos (D1/H4/H1/M15) que abre tu rutina idéntica cada día | M4 |\n| Watchlist | *watchlist* | Lista vigilada de ≤ 5 instrumentos: concentración por decisión de negocio | M4 |\n| Alerta | *price alert* | Aviso cuando el precio toca tu nivel: el precio te busca a ti | M4 |\n| SL mental | *mental stop* | Stop sin orden en el bróker: no es SL — la ley exige la orden montada | M4 |\n"},{"i":35,"g":"🧰 Recursos y bitácora","t":"Plantilla estándar de módulo","f":"docs/03-recursos/plantillas/PLANTILLA_MODULO.md","md":"# Plantilla Estándar de Módulo — FIT-12\n\n> **Instrucción:** los agentes copian esta plantilla completa al crear `docs/02-modulos/mod-XX-<slug>/README.md` y la rellenan sin eliminar secciones.\n\n---\n\n```markdown\n# Módulo N · [Título del Módulo]\n\n> [!WARNING]\n> **Contenido educativo.** La mayoría de los traders minoristas pierde dinero (estudios de reguladores estiman entre 70 % y 90 %). Nada aquí constituye asesoría financiera.\n\n| Campo | Detalle |\n|---|---|\n| 🧱 Nivel | [1 Fundamentos / 2 Técnica / 3 Gestión / 4 Profesionalización] |\n| 📦 Módulo | N de 12 (FIT-12) |\n| 🔬 Trazabilidad | 003 · M… · 004 · M… · **Aporte propio:** … |\n| ⏱️ Duración estimada | X h teoría + X h laboratorio |\n| 📋 Estado | [🔵 Borrador / 🟢 Publicado / ✅ Aprobado por estudiante] |\n\n## 🎯 Objetivo del Módulo\n[2-3 frases: qué será capaz de hacer el estudiante al terminar y por qué este módulo existe aquí.]\n\n## 📚 Lecciones\n\n### Lección N.1 · [Título]\n**Por qué importa:** …\n**Concepto:** …\n**Analogía:** …\n**Cómo se hace:** … (ejemplo con números cerrados)\n**Error común:** …\n**Conexión cuantitativa:** … (impacto en E / riesgo / expectativa)\n\n[… repetir para cada lección …]\n\n## 🧪 Laboratorio\n**Materiales:** …\n**Procedimiento paso a paso:** …\n**Entregable:** …\n\n## 🎯 Misión\n> [!IMPORTANT] Misión M-N\n> **Objetivo:** … · **Entregable:** … · **Criterio de aceptación:** …\n> **Etiqueta en journal:** … · **Tiempo estimado:** …\n\n## ✅ Evaluación / Criterio de Graduación\n[Rúbrica objetiva: qué debe cumplirse, umbrales, qué se revisa con el agente.]\n\n## 📖 Glosario del Módulo\n| Término | Inglés | Definición |\n|---|---|---|\n| … | *…* | … |\n\n## 🔗 Referencias\n- [SYLLABUS.md § …](../../01-syllabus/SYLLABUS.md)\n- [analisis_cursos.md § …](../../00-analisis/analisis_cursos.md)\n```\n"},{"i":36,"g":"🧰 Recursos y bitácora","t":"Journal · guía","f":"journal/README.md","md":"# journal/ — Diario de Operativa\n\n> **Estado: reservado (se activa en Sprint 2).** El estudiante registra aquí su operativa demo; los agentes solo leen y auditan según el protocolo de `agents.md` § 5.4.\n> Contenido previsto: plantilla de journal (CSV/Excel), checklist pre-mercado, diario emocional, protocolo de revisión semanal (definidos en Módulo 9).\n"},{"i":37,"g":"🧰 Recursos y bitácora","t":"scripts/core · calculadoras (Sprint 5+)","f":"scripts/core/README.md","md":"# scripts/core/ — Código del Programa\n\n> **Estado: reservado (se activa en Sprint 2+).** Aquí viven las herramientas Python del programa: calculadora de position sizing, métricas de journal (E, Profit Factor, Max DD), generador de reportes.\n> **Regla de arquitectura (agents.md § 2.5):** alta cohesión y bajo acoplamiento — separación estricta entre cálculo, formato y persistencia. Cada script con docstring y test mínimo si es calculable.\n"},{"i":38,"g":"🧰 Recursos y bitácora","t":"worklog · bitácora de construcción","f":"worklog.md","md":"# worklog.md — Bitácora de Construcción (append-only)\n\n---\nTask ID: sprint-0\nAgent: Z.ai (Mentor Trading + Knowledge Architect)\nTask: Análisis forense de los 2 cursos base + estructura del repo + agents.md + SYLLABUS.md\n\nWork Log:\n- Recibidos y analizados `003_trading_completo_2026_guia_completa.html` (TradingLab, 7 módulos, 7h39m) y `004_la_industria_del_trading_guia_completa.html` (Sáenz & Ruiz, 10 módulos, 11h55m)\n- Verificación de datos clave en los HTML fuente (estadísticas de prop firms 92%/0.072%, sesiones por \"Día\", catálogo de estrategias)\n- Emitido informe ATR-001 con: fortalezas/debilidades por curso, comparativa por áreas, insumos adoptados, 9 vacíos curriculares y correcciones técnicas\n- Diseñado el programa FIT-12: 4 niveles × 12 módulos con laboratorios, misiones y evaluaciones por nivel\n- Escrito agents.md v1.0: 5 roles expertos, protocolo pedagógico socrático, workflow de sprints, formatos estándar, checklist de calidad, límites éticos y comandos rápidos\n- Creada la estructura completa del repo con placeholders (mod-01, glosario, journal/, scripts/core/)\n\nStage Summary:\n- Decisiones: enfoque universal (fiscalidad por principios), ES + EN técnico, un sprint por módulo, riesgo con veto del rol Chief Risk Officer, nomenclatura PA/SMC unificada\n- Artefactos: agents.md, README.md, worklog.md, docs/00-analisis/analisis_cursos.md, docs/01-syllabus/SYLLABUS.md, docs/03-recursos/plantillas/PLANTILLA_MODULO.md, docs/03-recursos/glosario.md, docs/02-modulos/mod-01-negocio-trading/README.md, journal/README.md, scripts/core/README.md\n- Siguiente paso: Sprint 1 — construir Módulo 1 completo (6 lecciones + laboratorio + misión + evaluación)\n\n---\nTask ID: sprint-1\nAgent: Z.ai (Mentor Trading + Pedagogical Coach + Knowledge Architect)\nTask: Construcción completa del Módulo 1 · El Trading como Negocio y Ciencia\n\nWork Log:\n- Leídos SYLLABUS.md §5 (definición del M1), PLANTILLA_MODULO.md y el protocolo de sprint §5.2 de agents.md\n- Redactadas las 6 lecciones (`leccion-1-1.md` … `leccion-1-6.md`) con el formato §6.2 completo: por qué importa → concepto → analogía → cómo se hace → error común → conexión cuantitativa, más puntos clave y autoevaluación con respuestas ocultas (`<details>`)\n- Construido el README del módulo como hub: índice de lecciones, laboratorio de auditoría personal (5 pasos), misión M-1 (Carta de Expectativas de 4 secciones + contrato anti-ludopatía de 10 cláusulas), quiz de graduación de 10 preguntas con clave de respuestas, glosario de 38 términos y referencias\n- Actualizado el glosario maestro (`docs/03-recursos/glosario.md`) con los 38 términos de M1\n- Actualizada la tabla de estado del README raíz (M1 → 🟢 Publicado; M2 marcado como Sprint 2 siguiente)\n- Auto-auditoría con checklist §7 de agents.md: corregidos un link roto a mod-02 (aún no existe), un ancla de GitHub imprecisa, la errata \"sensaciación\" y una inconsistencia numérica en la pregunta 2 del quiz (la opción B ahora es rentable con E=+6)\n- Verificación numérica de todos los ejemplos cerrados: E de los sistemas A/B/C/D, breakeven WR=1/(1+R), tabla WR×R:B, 0,6⁹≈1 %, 0,95³⁰≈21 %, 0,85³⁰≈0,8 %, racha de 8 pérdidas ≈80 % en 100 operaciones (aproximación por ventanas)\n\nStage Summary:\n- Artefactos: 6 archivos de lección + README del módulo completo + glosario maestro poblado (38 términos) + README raíz actualizado\n- Deci  (construcción sugerida: Sprint 4, junto con M4)\n- Siguiente paso: si el estudiante aprueba, añadir el recurso al SYLLABUS (referencia en §M4 y §recursos) y construirlo en Sprint 4\n\n---\nTask ID: sprint-1.5\nAgent: Z.ai (Mentor Trading + Chief Risk Officer + Knowledge Architect)\nTask: Integración del recurso \"La Receta de tu Primera Operación\" en el temario + construcción del recurso\n\nWork Log:\n- Recibida la aprobación del temario v1.0 por el estudiante (\"temario aprobado\") y su propuesta de un tutorial tipo receta (\"mi primera operación paso a paso, por mercado, ganar el primer dólar\")\n- Evaluación del panel: idea validada; hueco natural = M4; veto parcial del CRO al marco \"primer dólar\" → objetivo redefinido como \"primera operación PROCESADA\" (SL antes de entrar, registrada, revisada 6/6)\n- SYLLABUS v1.0 → v1.1: añadida la línea de Recurso en §M4, actualizado roadmap (Sprint 1.5 ✅, Sprint 2 🔜) y Registro de Versiones\n- Creado docs/03-recursos/laboratorio/receta-primera-operacion.md: 12 pasos (0-11) con verificaciones por paso, Parte 0 de due diligence de bróker sin marcas, receta maestra EUR/USD sesión Londres-NY con horas Bolivia (UTC-4), fichas de variación XAU/USD e índices, caja \"¿Y mi primer dólar?\" (etapas demo → demo forward → real micro F4), checklist imprimible\n- Números verificados: lote = riesgo$/(SL_pips × valor_pip): 20$/30 pips → 0,066 → 0,06 (18 $ = 0,9 %); oro: 20$/4 $ = 5 oz = 0,05 lotes (0,05 × 100 oz × 4 $ = 20 $ ✓); viaje asimétrico 32 vs 28 pips (2 × spread)\n- Referenciado en README raíz (árbol + Sprint 1.5 + Inicio Rápido)\n\nStage Summary:\n- Artefactos: receta-primera-operacion.md + SYLLABUS v1.1 + README raíz actualizado\n- Decisiones: receta maestra EUR/USD (mercado más líquido para mecánica) con oro como primera variación; pasos 0-2 habilitados desde M2 (familiarización, cero órdenes); pasos 3-11 atados a M4; \"procesada 6/6\" como hito en lugar de dólares\n- Estado: temario aprobado y v1.1 publicada. Siguiente: Sprint 2 (M2 · El Motor del Precio)\n\n---\nTask ID: sprint-2\nAgent: Z.ai (Mentor Trading + Pedagogical Coach + Knowledge Architect)\nTask: Construcción completa del Módulo 2 · El Motor del Precio\n\nWork Log:\n- Leído SYLLABUS §5 M2 (6 lecciones + lab + misión + quiz), PLANTILLA_MODULO y lecciones de M1 para mantener voz/formato §6.2\n- Redactadas las 6 lecciones: 2.1 mecánica de subasta (bid/ask, taker/maker, viaje asimétrico 32/28 pips, spread como % del objetivo), 2.2 oferta y demanda (urgencia vs número, desequilibrio→expansión, oferta/demanda residual, caso melocotones actualizado), 2.3 liquidez (profundidad, barrida de stops con escenario numérico del institucional, SL por estructura), 2.4 forex y sesiones (pares/pips/lotes, 4 sesiones convertidas a Bolivia UTC-4 con aviso DST, ciclo diario, valor de pip en pares JPY ≈ 6,67 $), 2.5 personalidad de mercados (5 dimensiones, tabla comparativa EUR/USD vs XAU/USD vs US30 con mismo riesgo 1 %, concentración vs coleccionismo), 2.6 calendario macro e intermercados (NFP/IPC/FOMC en hora Bolivia, cadena tasas→DXY→oro/acciones/cripto, regla macro de formación ventana roja 15/15 y FOMC 30/30, costo de ignorarla con slippage 1,5R)\n- Construido README del módulo como hub: objetivo, índice con tiempos, puente con la receta (pasos 0-2 habilitados), laboratorio (reloj de sesiones personalizado + mapa macro de 5 eventos), misión M-2 (3 sesiones de observación pura con ficha de 6 campos, regla cero órdenes), quiz de 10 preguntas con clave oculta, glosario del módulo (25 términos), referencias y navegación (M3 como texto, sin enlace roto)\n- Creada journal/plantilla_journal_v0.csv (21 columnas: fechas, instrumento, dirección, orden, lote, entrada, SL, TP, resultados en pips/$/R, SL antes de entrar, setup, emociones pre/post, error, lección, ventana macro, captura) con 2 filas de ejemplo (una TP, una SL)\n- Actualizado glosario maestro: +27 filas (25 términos M2 + recurso receta), total 66 entradas\n- Actualizado README raíz: estados M2 🟢 / M3 🔜 Sprint 3, árbol con laboratorio/ y mod-02, notas de Sprint 1.5 y 2, Inicio Rápido\n- Verificación numérica: 0,05 lotes × 40 pips × 10 $/pip = 20 $; USD/JPY pip ≈ 100 000 × 0,01 / 150 ≈ 6,67 $; spread sobre objetivo 2/20 = 10 % y 2/10 = 20 %; quiz pregunta 7 con respuesta 20 $ consistente\n\nStage Summary:\n- Artefactos: mod-02-motor-del-precio/ completo (README + 6 lecciones) + journal/plantilla_journal_v0.csv + glosario maestro 66 entradas + README raíz\n- Decisiones: horas del curso ancladas a Bolivia UTC-4 con aviso de DST por principios; datos BIS 2022 marcados (snapshot); rangos de ADR/spread marcados (ilustrativo); regla macro de formación (no estar dentro de ventanas rojas) establecida como estándar del programa y referenciada para M8/M9\n- Estado: M1 🟢 M2 🟢. Siguiente: Sprint 3 (M3 · Anatomía del Gráfico) — se inicia a continuación en esta misma sesión\n\n---\nTask ID: sprint-3\nAgent: Z.ai (Mentor Trading + Pedagogical Coach + Knowledge Architect)\nTask: Construcción completa del Módulo 3 · Anatomía del Gráfico\n\nWork Log:\n- Leído SYLLABUS §5 M3 (6 lecciones + lab + misión) y aplicado el formato §6.2 con la voz de M1/M2\n- Redactadas las 6 lecciones: 3.1 velas japonesas (OHLC, cuerpo/mechas/cierre como veredicto, fractalidad literal, lectura en 4 preguntas, descomposición cerrada de una vela D1 de XAU/USD, Dojima/Homma), 3.2 los 4 ciclos (acumulación→markup→distribución→markdown, Dow HH/HL, Weinstein Stages, clasificación en 3 preguntas con caso EUR/USD), 3.3 soportes y resistencias (zonas no líneas, 3 tipos, memoria de mercado, gradiente de fortaleza — muchos toques CONSUMEN, protocolo de marcado de 4 reglas, caso con R:B 1,75 rechazado por debajo de 1:2), 3.4 confirmación en 3 pasos (ruptura→cierre fuera→retesteo, polaridad, throwback, falso rompimiento como mecanismo, caso completo con R:B 3,1 y lote 0,14), 3.5 patrones elementales (catálogo de vela y figura como firmas de procesos, checklist de 5 preguntas, fiabilidad honesta marcada
