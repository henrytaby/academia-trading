 el tamaño pleno.\n\n## Error común\n\nEl más caro es **confundir racha con competencia**: tres semanas ganadoras en demo (o peor, en real) no son habilidad, son varianza — y el cerebro las procesa como certificado definitivo, disparando el salto de fase y el aumento de tamaño exactamente antes de que la varianza regrese a la media. El segundo es medir el progreso en P&L: en formación, el indicador correcto es la **ejecución conforme al plan** — de cada 100 operaciones, ¿cuántas respetaron entrada, stop, objetivo y tamaño definidos? Ese porcentaje sí crece monotónicamente con el estudio; el dinero de la semana, no. El tercero es el calendario rígido a la inversa: creer que \"si a los 12 meses no soy rentable, fracasé\" — el criterio de avance es de desempeño, y la duración real varía por estilo, mercado y horas dedicadas.\n\n## Conexión cuantitativa\n\nLa curva de aprendizaje es una curva de **esperanza evolucionando**: en F1–F2 tu $E$ por operación es negativa o desconocida — por eso el programa te mantiene en demo y backtest, donde una esperanza negativa cuesta tiempo en lugar de dinero. La fase F2 existe para fabricar la evidencia de que $E > 0$ con N ≥ 100 antes de exponer capital; la F3 mide si tu $P_w$ real en vivo coincide con el del backtest (la deriva entre ambos se llama brecha de ejecución, y es pura psicología — Módulo 10). Saltar fases no cambia la esperanza del sistema: cambia quién la paga. Operar real en F1 es cobrar una esperanza negativa con dinero de verdad — la matrícula del mercado a su tarifa máxima, exactamente la que esta curva existe para evitarte.\n\n---\n\n## 🎯 Puntos clave\n\n1. La formación de un oficio de riesgo se mide en años supervisados; el trading sin licencia cobra esa supervisión en forma de pérdidas — matrícula del mercado.\n2. Cuatro fases: inconsciencia incompetente → consciencia incompetente (valle de la decepción) → consciencia competente → inconsciencia competente.\n3. 12 meses es la prueba mínima por tres razones que se suman: regímenes de mercado completos, N ≥ 100 operaciones, y varianza de rachas.\n4. El avance entre fases es por criterio de desempeño, no por calendario; el dinero real entra en micro solo tras E > 0 demostrada y ejecución ≥ 90 % conforme al plan.\n5. En formación, el progreso se mide en porcentaje de ejecución conforme al plan — nunca en el P&L de la semana.\n\n## 🔄 Autoevaluación rápida\n\n1. Ubica a estas tres personas en una fase de la escalera: (a) lleva 2 meses estudiando, opera en demo perdiendo poco y piensa abandonar porque \"no progresa\"; (b) acierta 8 de 10 operaciones desde hace un mes y ya pidió presupuesto para una cuenta de 10 000; (c) ejecuta su plan sin dudar pero dejó de registrar operaciones \"porque ya lo siente\".\n2. ¿Por qué un trimestre ganador no basta para declarar consistencia? Da las dos razones estadísticas.\n3. Tu sistema backtesteado tiene WR 40 %. Aparece una racha de 9 pérdidas seguidas en demo forward. ¿Qué revisas antes de tocar el sistema?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. (a) Fase 2 — consciencia incompetente, cruzando el valle de la decepción: el criterio correcto es medir su ejecución conforme al plan, que probablemente está subiendo aunque el demo no lo refleje en dinero. (b) Fase 1 con riesgo máximo activo: está por saltar a real con evidencia de varianza, no de competencia — la racha de 8 aciertos con WR 40 % real es estadísticamente sospechosa de suerte o de reglas incumplidas (¿cerró antes, movió stops?). (c) Fase 4 en riesgo de pudrimiento: la competencia inconsciente sin auditoría se degrada — el journal es lo que mantiene viva la fase 4.\n2. (a) Un trimestre cabe dentro de un solo régimen de mercado: no sabes si el sistema sobrevive al siguiente clima. (b) N insuficiente: un trimestre de swing disciplinado puede tener 20–40 operaciones, muy por debajo del N ≥ 100 necesario para estimar la esperanza con confianza.\n3. Primero la probabilidad: con WR 40 %, una racha de 9 tiene probabilidad $0{,}6^9 \\approx 1\\%$ en un punto dado, pero dentro de 100+ operaciones es un evento esperable (cálculo propio). Segundo, la ejecución: revisa si las 9 pérdidas fueron \"en plan\" (setup válido, stop respetado, tamaño correcto). Si ambas revisiones están limpias, la racha es varianza y el sistema sigue intacto: no se toca nada.\n\n</details>\n"},{"i":11,"g":"🧱 M1 · El Trading como Negocio","t":"1.6 · Expectativas y presupuesto","f":"docs/02-modulos/mod-01-negocio-trading/leccion-1-6.md","md":"# Lección 1.6 · Expectativas y presupuesto\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 30–40 min de estudio |\n| 🧱 Módulo | [M1 · El Trading como Negocio y Ciencia](README.md) |\n| ⬅️ Anterior | [Lección 1.5 · La curva de aprendizaje real](leccion-1-5.md) |\n| ➡️ Siguiente | [Laboratorio y Misión del módulo](README.md) |\n\n---\n\n## Por qué importa\n\nLas cinco lecciones anteriores construyeron un modelo mental; esta lo convierte en **números y compromisos por escrito**. Sin un presupuesto explícito de tiempo, dinero y dolor, no eres tú quien fija los límites de tu formación: los fija el mercado, al precio más caro posible. Esta lección define el costo real de formarse, los rangos de expectativa honestos, la categoría sagrada del **dinero quemable** y la regla de no financiar la vida con trading durante la formación. Cierra con la construcción de tu presupuesto de expectativas, que alimentará directamente el laboratorio y la Carta de Expectativas de la misión del módulo. Es la lección que separa al estudiante que llega a la fase de consistencia del que abandona con una historia traumática sobre \"eso del trading\".\n\n## Concepto\n\n**El costo real de formarse.** En tiempo: este programa presupone 7–10 h por semana (teoría, práctica y revisión); a lo largo de 12 meses son 400–500 horas de trabajo estructurado *(heurística)* — no son \"contenido consumido\", son repeticiones con registro. En dinero directo: durante N1–N3 prácticamente nada — gráficos y cuentas demo son gratuitos, el journal vive en una hoja de cálculo, y las herramientas de pago se compran cuando el oficio las justifica. En dinero indirecto: la **matrícula del mercado** — las pérdidas inevitables de la fase de real micro, que un programa serio presupuesta (por ejemplo, un 5–10 % del capital de formación como techo de matrícula *(heurística)*) en lugar de dejarlas al azar.\n\n**Qué esperar — rangos honestos.** El objetivo del año 1 no es \"ganar X %\": es **no quedar eliminado y salir con un proceso documentado** — un sistema con esperanza estimada, un journal con cientos de operaciones y una ejecución ≥ 90 % conforme al plan. Como referencia de techo realista, los mejores gestores profesionales del mundo rinden sostenidamente en la zona del 15–30 % anual con drawdowns profundos *(heurística: rango de la industria de gestión; verifícalo contra cualquier registro público de fondos)*. Cuando la publicidad te ofrezca \"10 % mensual\" (≈ 214 % anual compuesto), ya sabes clasificarla: no es un negocio, es la mentira 1 de la Lección 1.2 con cifras. La progresión honesta del principiante consistente es modesta y aburrida — y exactamente por eso es creíble.\n\n**Dinero quemable** (*risk capital*). Definición operativa: aquel dinero cuya pérdida TOTAL y simultánea no cambia tu vida ni la de nadie que dependa de ti. El test es simple y brutal: si lo perdieras todo mañana, ¿dormirías tranquilo esta noche? Si la respuesta es no — porque es el alquiler, la comida, los estudios de alguien, o dinero prestado — entonces no es capital de trading: es capital de supervivencia disfrazado. Operar con capital de supervivencia no es \"arriesgado\": es estructuralmente distinto, porque cada decisión deja de ser una decisión de mercado y pasa a ser una decisión de subsistencia, y el cuerpo lo sabe antes que la cabeza. El estrés resultante fuerza exactamente los comportamientos que el Módulo 10 catalogará como tilt, revancha y sobrerriesgo.\n\n**La regla de no financiar la vida con trading en formación.** Si necesitas ingresos mensuales ahora — sea porque no tienes empleo, porque tus ingresos son insuficientes o porque sostienes a otros — el trading en formación NO es el vehículo para generarlos: un negocio con esperanza aún no demostrada no puede ser tu plan A de subsistencia. La arquitectura correcta es de **doble carril**: Carril A — cualquier fuente de ingreso estable (empleo, oficio, freelance, emprendimiento) que paga tus meses mientras te formas; Carril B — la formación de trading con presupuesto fijo de tiempo y dinero. La urgencia financiera no es un rasgo de carácter que se domina con voluntad: es una condición que viola sistemáticamente todo protocolo de riesgo, porque transforma cada pérdida normal en una crisis y cada crisis en una decisión desesperada. Quien \"necesita\" que el trading funcione este mes ya perdió antes de abrir el gráfico — no por talento, sino por estructura de incentivos. Esta regla no expira al aprobar el programa: se revisa solo con 12 meses de datos reales que la contradigan.\n\n**Presupuesto de expectativas.** El presupuesto existe para que la varianza negativa no te expulse del juego antes de que tu esperanza madure. El concepto clave es el **runway**: los meses de \"caja\" (de vida y de formación) que puedes sostener sin que el dinero te obligue a decisiones. Y su inverso, la **ruina del jugador** (*gambler's ruin*): aunque un sistema tenga $E > 0$, apostar demasiado tamaño respecto al capital hace matemáticamente probable caer a cero por una racha normal antes de cobrar la esperanza. La racha normal no es hipotética: en un sistema sano de WR 40 %, la probabilidad de sufrir 8 pérdidas seguidas **en algún punto de 100 operaciones** ronda el 80 % (cálculo propio por aproximación de ventanas independientes) — no es mala suerte, es el camino estadístico esperado hacia el +26R del período. El presupuesto (tamaño por operación, matrícula máxima, runway) existe para que ese camino sea transitable.\n\n## Analogía\n\nEl restaurante y la caja. La mayoría de los restaurantes nuevos no quiebran por mala comida: quiebran por quedarse sin caja antes de que lleguen los clientes suficientes — el buen cocinero con capital de seis meses cierra en el mes cinco con reseñas excelentes. El trader sin runway hace lo mismo: su \"cocina\" (el sistema) puede ser correcta, pero su caja (matrícula, capital de vida) se agota antes de que la esperanza tenga tiempo de cobrarse. La diferencia entre el restaurante que sobrevive y el que cierra rara vez está en el plato: está en cuántos meses de caja puso el dueño sobre la mesa antes de abrir la puerta. Tu Carta de Expectativas — la misión de este módulo — es exactamente ese cálculo de caja, firmado antes de abrir el negocio.\n\n## Cómo se hace: construir tu presupuesto de expectativas\n\nCinco líneas, números cerrados, media hora de honestidad. Ejemplo completo *(ilustrativo)* con un estudiante con 1 000 de capital quemable y 8 h/semana:\n\n| Línea | Pregunta | Ejemplo cerrado |\n|---|---|---|\n| 1. Tiempo | ¿Cuántas horas reales/semana y en qué ventanas? | 8 h: 60 min/noche + 2 h el domingo |\n| 2. Capital quemable | ¿Cuánto perderías sin que cambie tu vida? (test del sueño) | 1 000 — verificado: duermo tranquilo |\n| 3. Matrícula máxima | ¿Cuánto de ese capital autorizo a perder en la FASE de formación (F4 real micro)? | 100 (10 % del quemable) — y NO se recarga |\n| 4. Riesgo por operación | ¿Qué fracción arriesgo por trade cuando llegue a real micro? | 0,5 % = 5 por operación (el programa exige 0,25–0,5 % en F4) |\n| 5. Runway | ¿Cuántos meses de vida paga mi Carril A sin tocar el capital de trading? | 12 meses de ingresos del empleo — el trading no paga nada aún |\n\nCon este presupuesto, el peor año posible del estudiante del ejemplo es: pierde 100 de matrícula en real micro, gasta 400–500 h de formación y conserva 900 — más un sistema validado, un journal con cientos de operaciones y una ejecución medida. El mejor año de quien no presupuesta es un mes verde seguido de una cuenta a cero y la historia de que \"el trading es una estafa\". El presupuesto no garantiza el éxito: garantiza que el fracaso, si llega, sea **barato e instructivo** en lugar de catastrófico.\n\n## Error común\n\nEl error más común es el del capital \"casi quemable\": empezar con lo que se puede perder… y cuando se pierde, recargar \"una última vez\". El dinero que se recarga no era quemable — y su segunda entrega sale del capital de supervivencia, exactamente la categoría prohibida. El segundo error es pedir prestado o apalancar la formación: convierte una racha normal en una crisis de deuda con fecha de vencimiento. El tercero, más sutil, es medir el año 1 en dinero ganado: te hace abandonar procesos correctos por rachas frías y abrazar atajos por rachas calientes — la métrica correcta ya la conoces de la Lección 1.5: ejecución conforme al plan. El antídoto para los tres es el mismo y no es psicológico: es un presupuesto escrito, firmado y guardado donde lo puedas releer — la Carta de Expectativas que redactarás en la misión de este módulo.\n\n## Conexión cuantitativa\n\nEl presupuesto fija las cotas dentro de las cuales la esperanza — aún negativa durante tu formación — no puede dañar tu vida. Formalmente: la matrícula máxima es un **drawdown presupuestado** (pérdida máxima autorizada antes del STOP total de formación y regreso a demo), y el riesgo por operación del 0,5 % mantiene la probabilidad de ruina del jugador cerca de cero pese a rachas de 8–10 pérdidas (una racha de 10 con 0,5 % por operación consume el 5 % de la cuenta: doloroso y transitable; la misma racha con 5 % por operación consume el 40 %: incapacitante). La estructura completa del programa de riesgo del Módulo 8 se apoya en esta aritmética — pero la decisión de tener un presupuesto, a diferencia de la matemática, no se puede calcular: se toma. Se toma ahora, antes del primer gráfico.\n\n---\n\n## 🎯 Puntos clave\n\n1. El costo de formación se paga en tiempo (400–500 h *(heurística)*) y matrícula de mercado presupuestada (5–10 % del capital de formación) — no en herramientas.\n2. Techo de referencia honesto: los mejores profesionales rinden 15–30 % anual sostenido *(heurística)*; el objetivo del año 1 es sobrevivir con proceso documentado, no ganar X %.\n3. Dinero quemable = su pérdida total no cambia tu vida; el test del sueño es la única admisión válida.\n4. Regla de doble carril: ingreso estable (Carril A) paga la vida; la formación de trading (Carril B) tiene presupuesto propio — jamás al revés.\n5. La racha de 8 pérdidas con WR 40 % tiene ~80 % de probabilidad en 100 operaciones: el presupuesto existe para que sea transitable, y el riesgo del 0,5 % por operación es lo que la hace transitable.\n\n## 🔄 Autoevaluación rápida\n\n1. Un conocido quiere empezar con 500 \"que no necesito\" — pero al perderlos pide otros 500 prestados \"para recuperar\". ¿Qué regla rompió y en qué orden?\n2. ¿Por qué un sistema con $E > 0$ demostrada puede aun así arruinar a quien lo opere con demasiado tamaño por operación?\n3. Tu presupuesto fija matrícula máxima de 100 y riesgo de 0,5 % por operación. Tras una racha mala la cuenta de formación muestra −95. ¿Qué haces exactamente?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Primero rompió el test del dinero quemable: si recarga, el capital inicial no era quemable de verdad (o dejó de serlo en la segunda entrega, que salió de dinero prestado). Segundo, y más grave, motivó la recarga con \"recuperar\": es la definición operativa de revancha — apostar para deshacer una pérdida, no para ejecutar un sistema. El contrato anti-ludopatía del módulo existe exactamente para cortar esto por escrito.\n2. Por la ruina del jugador: la esperanza se cobra \"en promedio y a largo plazo\", pero el camino pasa por rachas; con tamaño excesivo, una racha normal consume toda la caja antes de que el promedio llegue a cobrarse. E > 0 garantiza dirección, no supervivencia — la supervivencia la garantiza el tamaño.\n3. PARAR: la matrícula máxima está a 5 unidades de agotarse y el STOP de formación existe para respetarse — se deja de operar real, se vuelve a demo/backtest, se audita el journal de la racha (¿las pérdidas fueron en plan?) y solo se reanuda real micro cuando el criterio de la fase vuelva a cumplirse. Lo que NO se hace: subir el riesgo para \"recuperar\" la matrícula — eso convierte un límite de formación en una espiral.\n\n</details>\n"},{"i":12,"g":"🧱 M2 · El Motor del Precio","t":"M2 · Hub del módulo","f":"docs/02-modulos/mod-02-motor-del-precio/README.md","md":"# Módulo 2 · El Motor del Precio\n\n> [!WARNING]\n> **Contenido educativo.** La mayoría de los traders minoristas pierde dinero (estudios de reguladores estiman entre 70 % y 90 %). Nada en este repositorio constituye asesoría financiera.\n\n| Campo | Detalle |\n|---|---|\n| 🧱 Nivel | 1 · Fundamentos |\n| 📦 Módulo | 2 de 12 (FIT-12) |\n| 🔬 Trazabilidad | 003 · M1.4–1.5 · 004 · M2.4 · **Aporte propio:** calendario macro aplicado (ventanas rojas en hora local) y correlación intermercados con matices de régimen (vacíos 4 y 5 del informe) |\n| ⏱️ Duración estimada | 4 h de teoría + 3–4 h de laboratorio/misión/quiz |\n| 📋 Estado | 🟢 Publicado (Sprint 2) |\n\n---\n\n## 🎯 Objetivo del Módulo\n\nEntender **por qué se mueve el precio** — no solo dónde mirar. Al terminar este módulo sabrás cómo nace cada tick en la subasta (bid/ask, taker/maker, spread como costo), qué motor genera tendencias y rangos (oferta/demanda y desequilibrio), por qué los grandes operadores necesitan y \"cazan\" liquidez, cómo funcionan las sesiones del forex con TU huso horario (UTC-4), qué personalidad tiene cada mercado que vas a operar (EUR/USD, oro, índices) y qué hace el calendario macro con todos ellos a la vez. Este módulo existe porque el Módulo 3 te enseñará a leer el gráfico, pero un gráfico bien leído por quien no entiende la subasta que lo genera es un mapa de un territorio que no conoce: aquí pones el motor antes del mapa.\n\n## 📚 Lecciones\n\n| # | Lección | Esencia | Tiempo |\n|---|---|---|---|\n| 2.1 | [La mecánica de subasta](leccion-2-1.md) | Bid/ask, taker vs maker, cómo nace cada tick; el spread como peaje y el viaje asimétrico del trade | 35–45 min |\n| 2.2 | [Oferta y demanda](leccion-2-2.md) | Urgencia (no \"número de compradores\"), desequilibrio → expansión, equilibrio → rango; oferta/demanda residual como futuras zonas | 40–50 min |\n| 2.3 | [Liquidez](leccion-2-3.md) | Qué es, quién la provee, por qué los stops del retail son su materia prima y qué es una barrida; defensa: SL por estructura | 40–50 min |\n| 2.4 | [Forex y sus sesiones](leccion-2-4.md) | Pares, pips, lotes; las 4 sesiones convertidas a hora Bolivia; el ciclo diario y tu ventana de oro | 45–60 min |\n| 2.5 | [Personalidad de cada mercado](leccion-2-5.md) | Las 5 dimensiones de auditoría; perfiles de EUR/USD, XAU/USD e índices; tamaño recalculado por mercado; concentración vs coleccionismo | 40–50 min |\n| 2.6 | [Calendario macro e intermercados](leccion-2-6.md) | NFP/IPC/FOMC en tu hora; la cadena causal tasas → DXY → oro/acciones/cripto; la regla macro de formación (ventanas rojas) | 45–60 min |\n\n> [!TIP]\n> **Cómo estudiar este módulo:** dile a tu agente *\"Siguiente lección\"* y sigue el protocolo de sesión de estudio (§ 5.3 de `agents.md`): repaso activo → lección → quiz rápido → misión. Intenta responder las autoevaluaciones ANTES de abrir las respuestas.\n>\n> **Puente con la [Receta de tu Primera Operación](../../03-recursos/laboratorio/receta-primera-operacion.md):** los pasos 0–2 (cuenta demo, tour de plataforma, observación de sesiones) son seguros hacerlos YA — esta lección te da justo el vocabulario (sesiones, spread, lote) que esos pasos piden. Los pasos 3–11 esperan al Módulo 4.\n\n## 🧪 Laboratorio · Tu Reloj de Sesiones y tu Mapa Macro\n\n**Materiales:** tu auditoría personal de M1 (bloques de tiempo y energía), un calendario económico con filtro de impacto y huso configurable, hoja de papel o plantilla digital.\n\n**Procedimiento paso a paso:**\n\n1. **Construye tu reloj de sesiones.** Dibuja un eje horizontal de 00:00 a 24:00 **en hora Bolivia**. Marca encima las 4 sesiones (Sídney, Tokio, Londres, NY) con sus rangos aproximados, y sombrea el solapamiento Londres–NY (≈ 08:00–12:00). Recuerda: los horarios se mueven ±1 h con el horario de verano del norte — deja una nota que lo recuerde. Encima del reloj, marca tus bloques reales de energía alta de la auditoría M-1. La intersección de ambos es tu **ventana operativa candidata**: escríbela en una frase.\n2. **Cruza con el calendario.** Abre el calendario económico de la semana ENTRANTE, filtra alto impacto (USD y la moneda de tu par principal) y anota los **5 primeros eventos** con: día, nombre, consenso, **hora Bolivia**. Marca cada ventana roja (15 min antes/después; FOMC 30/30).\n3. **Pega el reloj y el mapa donde los veas.** Captura o fotografía ambos y déjalos junto a tu pantalla de estudio. Este es el \"semáforo\" de la Lección 2.6 en tu pared.\n4. **Prueba de fuego (opcional, 20 min):** el día del mayor evento de la semana, a las H-20 minutos abre el gráfico de tu par y observa el spread en la ventana roja (ensánchalo visualmente con la ventana de orden). Verás en vivo el peaje ×10 de la Lección 2.6. **Sin operar.**\n\n**Entregable:** `journal/reloj-sesiones-m2.md` con: el reloj dibujado (o su descripción), la ventana operativa candidata justificada en 3 frases, y la tabla de 5 eventos macro de la semana con horas Bolivia.\n\n## 🎯 Misión\n\n> [!IMPORTANT] Misión M-2 · Observación Pura de 3 Sesiones\n> **Objetivo:** fabricar el reconocimiento en vivo del ciclo diario (Asia → Londres → NY) y del comportamiento del spread/volumen — sin dinero, sin órdenes, sin la tentación.\n> **Entregable:** `journal/observacion-m2.md` con 3 sesiones completas del solapamiento Londres–NY (≈ 08:00–12:00 Bolivia) observadas en días distintos, cada una con la ficha de abajo.\n> **Criterio de aceptación:** 3 fichas completas en 3 días distintos + una comparación final entre las tres sesiones (¿qué se repite? ¿qué fue distinto? ¿cuál fue la hora de mayor energía?).\n> **Etiqueta en journal:** `mision-2-observacion` · **Tiempo estimado:** 3 × 2–4 h en vivo (puede fraccionarse por tramos de 1 h con nota de tramos).\n> **Regla de oro:** **cero órdenes.** Esta misión se aprueba por la calidad de la observación, no por ningún resultado — es el entrenamiento de \"estar en el mercado sin estar en él\".\n\n**Ficha por sesión (copiar por cada día):**\n\n```text\nSesión #N — fecha — EUR/USD (o tu par principal)\n1. Apertura de Londres (≈ 09:00 Bolivia): ¿qué hizo el precio en la primera hora?\n   (rompió el rango asiático / lo barrió y volvió / siguió dormido)\n2. Spread: ¿cómo era a las 08:55 vs a las 10:30? (ventana de orden, sin enviar nada)\n3. Eventos macro del día: ¿cuál salió y qué hizo el precio en los 15 min siguientes?\n4. Volumen/energía: ¿en qué hora hubo velas más grandes y más rápidas?\n5. Si tuvieras que operar HOY: ¿en qué tramo habrías tenido la mejor relación\n   señal/ruido? (observación, no recomendación)\n6. Estado del régimen (pre-M3, en palabras): ¿día de tendencia clara, de rango, o mixto?\n```\n\n## ✅ Evaluación / Criterio de Graduación\n\n- **Misión M-2 completa:** 3 fichas + comparación, con la regla de cero órdenes respetada (si enviaste alguna orden \"solo para probar\", reinicia la misión: la tentación es parte del material de estudio).\n- **Quiz de graduación:** 10 preguntas (subasta, liquidez, sesiones, macro) con ≥ 8/10.\n- **Laboratorio entregado:** reloj de sesiones + 5 eventos con hora Bolivia en `journal/`.\n- Al aprobar todo: el módulo queda marcado ✅ en el README raíz y se abre el [Módulo 3 · Anatomía del Gráfico](../mod-01-negocio-trading/README.md) (se publica en el Sprint 3).\n\n## 📝 Quiz de Graduación\n\n1. Completa: compras al ______, vendes al ______, y la diferencia entre ambos es el ______.\n2. ¿Quién \"paga\" el spread y quién lo \"cobra\"? Nómbralos con sus dos roles (urgencia vs paciencia).\n3. ¿Por qué la frase \"el precio sube porque hay más compradores que vendedores\" es imposible? ¿Cuál es la explicación correcta?\n4. Compras EUR/USD con SL de 30 pips y TP de 30 pips, con un spread de 2 pips. ¿Cuántos pips debe recorrer el mercado hacia arriba para darte el TP y hacia abajo para darte el SL? ¿Qué se llama este efecto?\n5. Define liquidez en una frase y explica por qué el conjunto de stops del retail bajo un mínimo obvio ES liquidez para un institucional.\n6. Son las 13:00 UTC de un martes. ¿Qué hora es en Bolivia y qué sesión(es) están activas? ¿Cómo se llama ese tramo y por qué importa?\n7. Operas 0,05 lotes de EUR/USD y el precio recorre 40 pips a tu favor. ¿Cuántos dólares ganaste? (1 lote = 10 $/pip)\n8. ¿Cuándo sale el NFP (día y hora del Este) y qué le pasa al spread dentro de la ventana roja del evento?\n9. El IPC de EE. UU. sorprende al alza. Recorre la cadena: ¿qué hacen típicamente los rendimientos de los bonos, el DXY y el oro? ¿Con qué palabra se califica todo el pronóstico?\n10. Enuncia la regla macro de formación (ventanas rojas) completa: cuánto antes/después de un evento de alto impacto, y qué se hace con una posición abierta si el evento es inminente.\n\n<details>\n<summary>Ver clave de respuestas</summary>\n\n1. Ask · bid · spread. (Compras al ask, vendes al bid: el peaje de entrada/salida.)\n2. Paga el **taker** (urgencia, orden market, consume el libro); lo cobra el **maker** (paciencia, orden limit, provee liquidez). Toda transacción tiene al menos un taker y al menos un maker.\n3. En toda transacción hay exactamente un comprador y un vendedor — nunca puede haber \"más\" de unos que de otros. Lo correcto: el precio sube cuando los compradores son **más urgentes** (dispuestos a pagar asks más altos, Lección 2.1) y los vendedores suben precios o retiran órdenes.\n4. Arriba: 32 pips (30 + spread); abajo: 28 pips (30 − spread). Se llama el **viaje asimétrico** — el spread acorta el camino a la pérdida y alarga el camino a la ganancia (asimetría total = 2 × spread).\n5. Liquidez = capacidad de ejecutar tamaño inmediato sin mover el precio. Los stops son órdenes reales esperando: cuando el precio los alcanza se convierten en ventas/compras a mercado — un depósito concentrado de contrapartida que un institucional puede usar para llenar una orden grande (la barrida, Lección 2.3).\n6. 13:00 UTC = **09:00 Bolivia** (UTC−4). Están activas Londres (07:00–16:00 UTC) y Nueva York (12:00–21:00 UTC): es el **solapamiento Londres–NY** — el tramo de mayor volumen y menores spreads del día; ahí está la mejor relación señal/costo del forex.\n7. 0,05 lotes × 40 pips × 10 $/pip/lote = **20 $**. (El orden de la multiplicación no importa; importa no confundir pip con pipette.)\n8. **Primer viernes del mes, 08:30 ET** (≈ 08:30 Bolivia en horario de verano del norte; +1 h en invierno). Dentro de la ventana roja el spread se multiplica (de ~1,5 pips a 10–20, ilustrativo) y el slippage puede ejecutar tu SL peor que su nivel exacto.\n9. Típicamente: **rendimientos suben** (se descuentan tasas más altas por más tiempo), **DXY sube** (dólar más atractivo), **oro cae** (no paga interés, más caro en dólares). Todo se califica con **\"típicamente\"**: las correlaciones cambian de signo por régimen (en pánicos todo se vende junto) — contexto, no ley.\n10. Sin posiciones abiertas desde **15 minutos antes hasta 15 minutos después** de cada evento de alto impacto (FOMC: 30/30 incluyendo la rueda de prensa). Posición inminente: **cerrarla** o — solo si el plan lo contempla — asegurar el SL y reducir tamaño, nunca tamaño completo con SL apretado. Nunca se \"opera el dato\".\n\n</details>\n\n## 📖 Glosario del Módulo\n\n| Término | Inglés | Definición |\n|---|---|---|\n| Bid | *bid* | Precio al que el mercado te compra (tu salida de un long) |\n| Ask | *ask/offer* | Precio al que el mercado te vende (tu entrada en un long) |\n| Spread | *spread* | Diferencia bid-ask; el costo fijo por operación que cobran los proveedores de liquidez |\n| Libro de órdenes | *order book / DOM* | Fila de órdenes de compra y venta por nivel de precio con sus cantidades |\n| Taker | *taker* | Participante agresivo con orden market: consume el libro y paga el spread |\n| Maker | *maker* | Participante pasivo con orden limit: provee liquidez y cobra el spread |\n| Liquidez | *liquidity* | Capacidad de ejecutar tamaño inmediato sin mover el precio (spread + profundidad) |\n| Impacto de mercado | *market impact* | Desplazamiento de precio que produce tu propia orden al consumir el libro |\n| Slippage | *slippage* | Diferencia entre el precio de tu orden/stop y el de ejecución real; crece en ventanas de baja liquidez |\n| Pip | *pip* | Unidad mínima convencional de movimiento: 0,0001 (pares con yen: 0,01) |\n| Pipette | *pipette* | Décima de pip (quinta decimal); fuente clásica de errores ×10 en SL/TP |\n| Lote | *lot* | Tamaño de posición: estándar 100 000 u. (10 $/pip en EUR/USD), mini 0,1, micro 0,01 |\n| Oferta/demanda residual | *unfilled orders* | Interés que no se llenó en un movimiento previo y espera al retorno del precio (futuras zonas) |\n| Desequilibrio | *imbalance* | Estado en que un lado del mercado es más urgente; produce expansión |\n| Expansión | *expansion* | Salida rápida del precio de un nivel/rango hasta la próxima zona con órdenes |\n| Barrida de stops | *liquidity sweep / stop hunt* | Rotura breve de un nivel obvio para detonar stops y llenar órdenes grandes antes de revertir |\n| ADR | *average daily range* | Recorrido medio diario de un instrumento; calibra SL/TP realistas |\n| Sesiones | *sessions* | Turnos del día forex: Sídney, Tokio, Londres, Nueva York (horarios ±1 h por DST) |\n| Solapamiento | *London–NY overlap* | Tramo Londres+NY (≈ 12:00–16:00 UTC ≈ 08:00–12:00 Bolivia): máximo volumen, mínimo spread |\n| Gap | *gap* | Salto de precio sin negociación entre un cierre y la apertura siguiente (fines de semana, índices) |\n| NFP | *non-farm payrolls* | Dato de empleo de EE. UU.; primer viernes del mes, 08:30 ET |\n| IPC | *CPI* | Inflación al consumidor de EE. UU.; ~mediados de mes, 08:30 ET |\n| FOMC | *FOMC* | Comité de la Fed: decisión de tasas 14:00 ET + rueda de prensa 14:30 ET, 8 veces/año |\n| DXY | *dollar index* | Índice del dólar frente a una cesta (EUR ~58 %); termómetro del apetito por USD |\n| Ventana roja | *high-impact window* | Perímetro sin posición alrededor de un evento macro: 15/15 min (FOMC 30/30) |\n| Correlación | *correlation* | Co-movimiento típico entre activos; válida por régimen, no como ley |\n\n## 🔗 Referencias\n\n- [SYLLABUS.md § 5 — N1, Módulo 2](../../01-syllabus/SYLLABUS.md)\n- [analisis_cursos.md](../../00-analisis/analisis_cursos.md) — vacíos curriculares 4 y 5 (calendario aplicado e intermercados)\n- [La Receta de tu Primera Operación](../../03-recursos/laboratorio/receta-primera-operacion.md) — pasos 0–2 activos con este módulo\n- [Módulo 1 · El Trading como Negocio y Ciencia](../mod-01-negocio-trading/README.md) — anterior\n- Módulo 3 · Anatomía del Gráfico — siguiente (se publica en el Sprint 3)\n"},{"i":13,"g":"🧱 M2 · El Motor del Precio","t":"2.1 · La mecánica de subasta","f":"docs/02-modulos/mod-02-motor-del-precio/leccion-2-1.md","md":"# Lección 2.1 · La mecánica de subasta\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 35–45 min de estudio |\n| 🧱 Módulo | [M2 · El Motor del Precio](README.md) |\n| ⬅️ Anterior | — (primera lección del módulo) |\n| ➡️ Siguiente | [Lección 2.2 · Oferta y demanda](leccion-2-2.md) |\n\n---\n\n## Por qué importa\n\nCada vez que pulsas \"comprar\" o \"vender\", tu orden entra en una subasta electrónica que funciona igual en Tokio, Londres o Nueva York. Quien no entiende esa subasta no entiende tres cosas que le cuestan dinero desde la primera operación: por qué compró a un precio y el gráfico muestra otro un poco peor, por qué cerrar inmediatamente una posición implica una pérdida pequeña aunque el precio no se movió, y por qué el mismo setup cuesta menos de operar a las 10 de la mañana que a las 11 de la noche. El spread no es un detalle técnico: es el alquiler de tu local comercial, se paga en cada operación y aquí vas a ver exactamente quién lo cobra y por qué.\n\n## Concepto\n\nEn cualquier mercado hay dos precios simultáneos, no uno:\n\n- **Bid** (*bid*): el precio más alto al que alguien, ahora mismo, te **compra** — cuando tú vendes, vendes al bid.\n- **Ask** (*ask / offer*): el precio más bajo al que alguien, ahora mismo, te **vende** — cuando tú compras, compras al ask.\n\nLa diferencia entre ambos es el **spread** (*spread*): la distancia mínima entre compradores y vendedores dispuestos a operar. Dentro del libro de órdenes (*order book*, o DOM — *depth of market*) hay una fila de precios con cantidades: arriba del precio actual los vendedores esperando (ask), debajo los compradores esperando (bid).\n\nY hay dos formas de participar en la subasta:\n\n1. **Taker (comprador agresivo).** Envía una orden *market*: no espera, **come** las órdenes que están en el libro y paga el spread. Aporta urgencia, quita liquidez.\n2. **Maker (vendedor pasivo).** Envía una orden *limit*: espera en una fila a un precio concreto, **provee** liquidez y es quien vende el spread. No mueve el precio hasta que alguien con urgencia paga su precio.\n\n**Cómo nace cada tick:** el \"precio\" que ves en el gráfico es el registro del último acuerdo. Sube cuando una orden taker de compra consume todos los lotes disponibles al mejor ask y tiene que pagar el siguiente nivel — es decir, cuando la urgencia de comprar supera la paciencia de los que venden. Baja por el espejo: urgencia de vender contra paciencia de los que compran. El precio no \"es\" nada en un instante dado: es la huella que dejan las órdenes agresivas al chocar contra el muro pasivo.\n\n**Visual — así nace un tick** (taker de 80 lotes contra el libro):\n\n```mermaid\nflowchart TD\n    T[\"🧨 Taker agresivo envía<br/>compra market de 80 lotes\"] --> L1[\"Nivel ask 1,0850 — 50 lotes<br/>consumidos por el taker\"]\n    L1 --> L2[\"Nivel ask 1,0852 — 30 lotes<br/>consumidos también: 50 + 30 = 80\"]\n    L2 --> P[\"📈 El mejor ask ahora es 1,0854<br/>→ el precio subió: así nació el tick\"]\n    P -.-> M[\"🧊 Los makers vendieron en cada nivel:<br/>proveen liquidez y cobran el spread\"]\n```\n\n## Analogía\n\nPiensa en el mostrador de cambio de divisas de un aeropuerto. La pizarra dice: \"Compra EUR 1,05 — Vende EUR 1,10\". Esos dos números son el bid y el ask del cambista. Si cambias dólares por euros y enseguida te arrepientes y los vuelves a cambiar, saldrás con menos dinero **aunque el euro no se haya movido un centavo**: pagaste el bid-ask del mostrador dos veces. El cambista no especuló con tu dinero — cobró por *estar ahí* con liquidez lista a las tres de la madrugada. Un bróker de forex hace exactamente eso, solo que con spreads de fracciones de centavo en lugar de 5 %. Y como en el aeropuerto: a las 3 a. m. hay un solo mostrador abierto (spread enorme); a mediodía hay veinte compitiendo (spread mínimo). La hora del día cambia el peaje.\n\n## Cómo se hace: ver el spread como costo con números cerrados\n\nCotización típica de EUR/USD en sesión líquida *(ilustrativo)*: bid 1,0850 / ask 1,0852 → spread de 2 pips (un pip en EUR/USD = 0,0001).\n\nCompras 1 lote al ask (1,0852) y el precio **no se mueve**. Cierras al instante: vendes al bid (1,0850). Resultado: **−2 pips** (−20 $ con un lote estándar). El mercado no hizo nada; el peaje sí.\n\n**El viaje asimétrico.** Tu entrada long quedó en ask 1,0852 y tu SL/TP se miden sobre el bid (el precio donde te ejecutan al cerrar):\n\n- Para que el TP a +30 pips se ejecute, el bid debe subir desde 1,0850 hasta 1,0882: el mercado debe **recorrer 32 pips**.\n- Para que el SL a −30 pips se ejecute, el bid debe bajar desde 1,0850 hasta 1,0822: al mercado le basta con **recorrer 28 pips**.\n\nMismo trade, mismo riesgo nominal de 30 pips: el camino hacia la ganancia es 4 pips más largo que el camino hacia la pérdida (2 × spread). En un objetivo de 30 pips, el spread se come $2/30 \\approx 6{,}7\\%$ del recorrido bruto. Con el mismo spread y un objetivo de 8 pips (scalping), sería $2/8 = 25\\%$ — la razón estructural por la que el programa desaconseja el scalping hasta tener estadística propia (conecta con el impuesto del ruido de la [Lección 1.4](../mod-01-negocio-trading/leccion-1-4.md)).\n\n**Taker vs maker en la práctica:** la entrada *limit* de tu receta de primera operación es un intento de operar como maker (esperas el precio en tu zona); la salida por SL es inevitablemente taker (cuando salta, alguien te está comprando la posición con urgencia). No puedes ser maker en las salidas de emergencia — por eso el costo total por operación se calcula con el spread completo, ida y vuelta.\n\n## Error común\n\nEl error clásico del principiante es creer que \"el precio\" es uno y que comprar y vender es gratis. De ahí salen dos consecuencias caras: **(1)** mirar el gráfico, ver 1,0850 y no entender por qué su compra se ejecutó en 1,0852 (\"¡me robaron!\": no te robaron, pagaste el ask); **(2)** elegir horarios y mercados por comodidad y no por costo — el mismo setup a las 23:00 en un par exótico puede pagar 5–10 pips de spread *(ilustrativo)* frente a 1–2 en el solapamiento de Londres-NY, lo que destruye la esperanza antes de que el análisis importe. El segundo error, primo del primero, es pensar que ser siempre maker (\"pongo limit y espero\") es gratis: el maker paga en otro cambio — se queda sin la operación justo cuando el mercado corre sin él. Taker y maker son dos formas de pagar; no existe el asiento gratis en la subasta.\n\n## Conexión cuantitativa\n\nEl spread entra directo en la ecuación del programa: $E_{neto} = E_{bruto} - \\text{costos por operación}$. Con la fórmula de la [Lección 1.4](../mod-01-negocio-trading/leccion-1-4.md), un sistema con $E_{bruto} = +0{,}10R$ y un costo de 0,08R queda en $+0{,}02R$ — marginal; el mismo sistema con el doble de spread queda en pérdida. Esta es la primera palanca cuantitativa que controlas como negocio: **elegir cuándo y dónde operas determina el costo fijo de cada venta**, antes de acertar o fallar nada. En la Lección 2.4 verás que la hora del día no es un detalle: es una variable de costos tanto como el bróker elegido.\n\n---\n\n## 🎯 Puntos clave\n\n1. Hay dos precios, no uno: compras al **ask**, vendes al **bid**; la diferencia es el **spread** — el peaje de cada operación.\n2. **Taker** = urgencia, come el libro, paga el spread. **Maker** = paciencia, provee liquidez, vende el spread. Toda operación tiene al menos un taker.\n3. Cada tick es la huella de órdenes agresivas consumiendo el libro: urgencia compradora mueve el precio arriba; urgencia vendedora, abajo.\n4. El viaje del long es asimétrico: para ganar 30 pips el mercado debe recorrer 32; para perder 30 basta con 28 (spread × 2 de diferencia).\n5. El spread es proporcionalmente más grave cuanto más corto es tu objetivo: 2 pips sobre 30 = 6,7 %; sobre 8 = 25 %.\n6. $E_{neto} = E_{bruto} - \\text{costos}$: elegir cuándo y dónde operar es elegir tu costo fijo antes de acertar nada.\n\n## 🔄 Autoevaluación rápida\n\n1. La cotización muestra bid 1,0900 / ask 1,0903. Compras market y cierras 5 segundos después sin que el precio se mueva. ¿Cuánto perdiste en pips y quién lo cobró?\n2. Tu sistema apunta a objetivos de 20 pips con un spread de 2 pips ida y vuelta. ¿Qué porcentaje del objetivo se lleva el peaje? ¿Y si el objetivo fuera de 10 pips?\n3. Tu amigo dice: \"siempre pongo órdenes limit, así no pago spread y soy más inteligente que los takers\". ¿Qué le falta a su razonamiento?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Perdiste 3 pips (el spread). Lo cobró el lado maker del mercado / el proveedor de liquidez: compraste al ask 1,0903 y vendiste al bid 1,0900. Es el costo de haber estado en la mesa, aunque el precio no se moviera.\n2. $2/20 = 10\\%$ del objetivo con 20 pips; $2/10 = 20\\%$ con 10 pips. Cuanto más corto el objetivo, más pesa el costo fijo — mismo efecto del impuesto de ruido de la Lección 1.4, y motivo para no encoger objetivos sin encoger también el mercado donde se paga el spread.\n3. Le falta el otro lado del cambio: ser maker implica **no participating cuando el mercado corre** — tus limit se quedan sin llenar en los movimientos buenos (riesgo de oportunidad) y llenan justo cuando el precio te alcanza en los malos (selección adversa). No existe el asiento gratis: el maker no paga el spread en dinero, lo paga en qué operaciones consigue. Un sistema honesto calcula su E asumiendo el spread de ida y vuelta, entre o con limit.\n\n</details>\n"},{"i":14,"g":"🧱 M2 · El Motor del Precio","t":"2.2 · Oferta y demanda","f":"docs/02-modulos/mod-02-motor-del-precio/leccion-2-2.md","md":"# Lección 2.2 · Oferta y demanda\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 40–50 min de estudio |\n| 🧱 Módulo | [M2 · El Motor del Precio](README.md) |\n| ⬅️ Anterior | [Lección 2.1 · La mecánica de subasta](leccion-2-1.md) |\n| ➡️ Siguiente | [Lección 2.3 · Liquidez](leccion-2-3.md) |\n\n---\n\n## Por qué importa\n\n\"¿Por qué sube el precio?\" parece una pregunta de respuesta obvia, y la respuesta obvia — \"porque hay más compradores que vendedores\" — es **falsa**, y esa falsedad produce errores operativos concretos: perseguir movimientos creyendo que \"hay mucha gente comprando\", confundir volumen con dirección, y no entender por qué el precio a veces se dispara al volver a una zona donde \"no había nada\". La oferta y demanda reales explican tendencias, rangos, expansiones y el comportamiento de las zonas que marcarás en tu gráfico desde el Módulo 3. Esta lección te da el modelo mental correcto del motor: todo lo demás (liquidez, sesiones, estructura) es este motor funcionando a distintas escalas.\n\n## Concepto\n\n**El precio es el único punto donde la oferta y la demanda acuerdan.** No \"empujan\" el precio desde fuera: se encuentran en él. Dos hechos elementales generan todo movimiento:\n\n1. **Exceso de demanda a un precio** (hay más órdenes de compra dispuestas que de venta): el precio sube hasta encontrar vendedores suficientes — el equilibrio se restablece **más arriba**.\n2. **Exceso de oferta a un precio**: el precio baja hasta encontrar compradores — el equilibrio se restablece **más abajo**.\n\nLa frase trampa: en toda transacción hay **exactamente un comprador y un vendedor** — siempre se intercambian las mismas cantidades de compradores y vendedores por contrato. Lo que cambia no es el *número* de participantes sino su **urgencia**: el precio sube cuando los compradores están dispuestos a pagar más (takers agresivos, Lección 2.1) y los vendedores suben sus ask o retiran sus órdenes. \"Hay más compradores que vendedores\" es imposible; \"los compradores son más urgentes que los vendedores\" es lo que pasa en toda tendencia.\n\n**Desequilibrio y expansión.** Cuando un lado del mercado recibe un motivo nuevo (un dato, un flujo institucional grande, un cambio en expectativas de tasas), el lado contrario no puede absorberlo al precio actual: el precio **se expande** con velocidad hasta la próxima zona donde haya órdenes esperando. Esas zonas donde quedó \"pedido sin servir\" — interés de compra que no se llenó en la caída previa, o de venta que no se llenó en la subida previa — son la **demanda residual** y la **oferta residual** que luego verás como soportes y resistencias (M3). El precio vuelve a ellas como el agua vuelve al hueco: ahí está el pedido pendiente.\n\n**Equilibrio y rango.** Cuando ningún lado tiene urgencia dominante, el precio oscila en un rango: cada excursión arriba encuentra vendedores que recortan el movimiento; cada excursión abajo encuentra compradores. El rango no es \"el mercado sin energía\": es dos bandos equilibrados aceptando el precio actual — y su rotura (cuando un lado finalmente cede) es la señal de que el desequilibrio llegó para quedarse, al menos temporalmente.\n\n**Visual — el bucle motor del precio:**\n\n```mermaid\nflowchart LR\n    EQ[\"⚖️ EQUILIBRIO<br/>rango: dos bandos aceptan el precio\"] -- \"un evento cambia la urgencia<br/>dato · flujo institucional\" --> DE[\"🔥 DESEQUILIBRIO<br/>un bando ya no puede<br/>absorber al otro\"]\n    DE --> EX[\"🚀 EXPANSIÓN<br/>velas grandes, cierres en extremos,<br/>hasta la próxima zona con órdenes\"]\n    EX -- \"la urgencia se descarga<br/>o se agota la munición contraria\" --> NZ[\"🎯 NUEVO EQUILIBRIO<br/>rango más arriba o más abajo<br/>= las futuras zonas (M3.3)\"]\n    NZ -.-> EQ\n```\n\n## Analogía\n\nEl caso del mercado agrícola — el de los melocotones, actualizado. Un pueblo compra melocotones cada semana; hay un precio donde la fila de compradores y los cajones de vendedores se equilibran. Una helada arrasa media cosecha: a ese precio ahora hay más compradores con dinero que cajones con fruta — no \"más personas\": las mismas, con más urgencia y menos producto. El precio sube hasta que algunos compradores desisten (demanda destruida por precio) y algunos productores de zonas vecinas meten camiones extra (oferta atraída por precio). Nuevo equilibrio, más alto. Ahora el detalle operativo: los productores de la zona vecina que **quisieron vender a los nuevos precios pero ya llegaron tarde** — cajones que se quedaron sin plaza — son tu demanda/oferta residual: cuando la helada se repite, el precio ni siquiera necesita una helada fuerte para dispararse de nuevo, porque arriba hay camiones esperando a ese precio. En el gráfico, esos \"camiones esperando\" son las zonas que marcarás con rectángulos. La lección del caso para tu operativa: los movimientos fuertes nacen de **desequilibrios** (eventos que cambian la urgencia de un lado), no de \"mucho volumen\" — un volumen enorme en rango puede ser pura rotación sin dirección.\n\n## Cómo se hace: leer un movimiento con el modelo correcto\n\n**Escenario con números cerrados *(ilustrativo)*.** EUR/USD en rango entre 1,0800 y 1,0860 durante tres semanas. Observa tres estados:\n\n1. **Rango (equilibrio):** el precio toca 1,0860 y retrocede; toca 1,0800 y retrocede. Interpretación correcta: en 1,0860 hay vendedores dispuestos (oferta residual del quiebre anterior) y en 1,0800 hay compradores dispuestos. Ningún bando tiene urgencia superior. El volumen puede ser alto: es rotación, no dirección.\n2. **Desequilibrio (evento):** el BCE anuncia algo que cambia expectativas de tasas. Los compradores nuevos no aceptan el rango: en dos sesiones el precio atraviesa 1,0860 con velas de cuerpo completo y cierres arriba. Interpretación: la oferta residual de 1,0860 **se consumió** (alguien se llevó todos los \"cajones\" que esperaban ahí); lo que queda arriba es camino libre hasta la siguiente zona con órdenes (1,0940, el máximo del quiebre de hace dos meses).\n3. **Retorno a la zona:** semanas después el precio regresa a 1,0860 **desde arriba**. La pregunta operativa del Módulo 3 será: ¿hay demanda residual nueva que defienda la zona (que ahora funciona como soporte) o el nivel ya está gastado? Esto se responde observando **cómo** vuelve el precio (rápido y con energía = el desequilibrio sigue vivo; lento y con velas pequeñas = no queda nadie).\n\n**El error que este modelo corrige:** un principiante ve el volumen alto del punto 1 y compra \"porque hay mucha actividad\". El modelo correcto le dice: actividad ≠ urgencia direccional; lo que marca el desequilibrio es **dónde falla el precio** (no logra avanzar en una zona) y **cómo se expande** (velas grandes, cierres en extremos, retrocesos mínimos). Estos síntomas serán tu \"radar de expansión\" en M3.\n\n## Error común\n\nEl error clásico es razonar con la frase falsa: \"sube porque hay más compradores que vendedores, entonces si el volumen sube, seguirá subiendo\". Consecuencias operativas: comprar tardíos en el clímax de un movimiento (la urgencia ya se descargó en el precio), y no distinguir el volumen de rotación (en rango) del volumen de expansión (con dirección). El segundo error es ignorar **dónde** queda la orden pendiente: marcar soportes/resistencias por \"líneas que se ven bonitas\" en vez de preguntarse qué interés sin servir quedó en esa zona y de qué lado. La prueba rápida: si no puedes explicar en una frase *quién tiene pedidos pendientes en esta zona y por qué no los sirvió todavía*, no tienes una zona — tienes una línea decorativa.\n\n## Conexión cuantitativa\n\nTodo sistema del programa explota una de las dos caras de este motor: los sistemas de continuación (ruptura, tendencia) operan la **expansión** — necesitan desequilibrio sostenido, y por eso dependen del régimen (M3: el mercado pasa la mayor parte del tiempo en rango *(aproximación)*); los sistemas de reversión operan el **retorno a zonas** de oferta/demanda residual — necesitan que el desequilibrio se agote. En términos de la ecuación del programa: el régimen determina qué lado de $P_w \\times W$ estás alimentando. Operar un sistema de expansión en un mercado en rango es cobrar el seguro de un incendio que no ocurre: cada falso rompimiento te cobra 1R. Por eso la primera pregunta de tu análisis diario en la [receta de primera operación](../../03-recursos/laboratorio/receta-primera-operacion.md) es exactamente esta: **¿tendencia o rango?** — el régimen antes que la dirección.\n\n---\n\n## 🎯 Puntos clave\n\n1. El precio es el punto donde oferta y demanda acuerdan; sube/baja solo cuando un lado es **más urgente** que el otro.\n2. En cada transacción hay un comprador y un vendedor: \"más compradores que vendedores\" es imposible; urgencia desigual es lo real.\n3. **Desequilibrio → expansión:** el precio corre hasta la próxima zona con órdenes esperando. **Equilibrio → rango:** dos bandos aceptando el precio.\n4. Las órdenes que no se llenaron quedan como oferta/demanda **residual**: el precio vuelve a buscarlas — son tus futuras zonas (M3).\n5. Volumen alto ≠ dirección: en rango es rotación; la señal de expansión es *cómo* falla o avanza el precio, no cuánto se opera.\n6. Tu primera decisión operativa siempre es el **régimen** (tendencia vs rango): decide qué tipo de sistema tiene derecho a ganar hoy.\n\n## 🔄 Autoevaluación rápida\n\n1. Un colega analiza: \"el EUR/USD subió 100 pips con volumen récord — claramente hay más compradores que vendedores, seguirá subiendo\". Corrige su frase y da la interpretación correcta.\n2. El precio queda 10 minutos \"clavado\" en 1,0860 sin avanzar pese a llegar muchas órdenes de compra. ¿Qué te dice eso sobre la zona y sobre el desequilibrio?\n3. En un rango largo, ¿por qué un volumen alto NO es argumento para anticipar la rotura? ¿Qué sí lo sería?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Frase falsa: en toda transacción hay un comprador y un vendedor — nunca hay \"más\" de unos que de otros. Interpretación correcta: hubo compradores **más urgentes** (pagaron asks sucesivos, Lección 2.1) que consumieron la oferta disponible en el camino. El volumen récord mide actividad, no garantiza continuación: si ese volumen apareció en velas de clímax con retrocesos grandes, puede ser descarga de urgencia (clímax) en vez de expansión sostenida. Lo que dice \"sigue subiendo\" es si la oferta residual arriba ya se consumió y quedan zonas vacías.\n2. Que lleguen muchas órdenes de compra y el precio no avance significa que en ese nivel hay **oferta esperando en cantidad** (vendedores pasivos absorbiendo a los takers). La zona tiene oferta residual activa; el desequilibrio comprador de hoy no fue suficiente para consumirla. Síntoma de rango/rechazo en 1,0860 — no de acumulación para romper (eso se infiere del comportamiento posterior, no del estancamiento).\n3. Porque el volumen en rango es rotación entre bandos equilibrados: puede subir semanas sin producir rotura. Argumento válido para anticipar rotura: (a) disminución del recorrido en cada oscilación (los retrocesos se acortan: la oferta/ demanda del lado contrario se agota), (b) el precio vuelve cada vez menos veces a la zona contraria, (c) velas de expansión contra el borde del rango con cierre fuera + confirmación (eso ya es M3.4). Aun así, la estadística del programa recuerda: la mayoría de las roturas de rango fallan en el primer intento — por eso se opera con confirmación y no por anticipación.\n\n</details>\n"},{"i":15,"g":"🧱 M2 · El Motor del Precio","t":"2.3 · Liquidez","f":"docs/02-modulos/mod-02-motor-del-precio/leccion-2-3.md","md":"# Lección 2.3 · Liquidez\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 40–50 min de estudio |\n| 🧱 Módulo | [M2 · El Motor del Precio](README.md) |\n| ⬅️ Anterior | [Lección 2.2 · Oferta y demanda](leccion-2-2.md) |\n| ➡️ Siguiente | [Lección 2.4 · Forex y sus sesiones](leccion-2-4.md) |\n\n---\n\n## Por qué importa\n\nHay una pregunta que todo principiante se hace tarde o temprano: \"¿por qué el precio siempre barre mi Stop Loss y DESPUÉS gira a mi favor?\". La respuesta no es mala suerte, ni un algoritmo que te vigila personalmente: es **liquidez** — la propiedad del mercado que los grandes operadores necesitan y que tu Stop Loss, colocado donde los coloca todo el mundo, fabrica gratis para ellos. Entender liquidez transforma tu operativa en tres niveles: dónde colocas el SL (estructura, no número redondo), por qué los quiebres de mínimos/máximos obvios a veces son \"barridas\" que se revierten, y por qué el volumen de tu cuenta no mueve el mercado pero el de una mesa institucional sí necesita buscar contrapartida. Esta lección explica al depredador antes de que conozcas sus mapas (M5).\n\n## Concepto\n\n**Liquidez** (*liquidity*) es la capacidad de ejecutar un tamaño grande de forma inmediata, a un precio justo y sin mover el mercado. Tiene dos caras:\n\n- **Liquidez de costo:** qué tan ancho es el spread (Lección 2.1). Mercado líquido = spread mínimo.\n- **Liquidez de profundidad:** cuánto volumen puede absorberse cerca del precio actual sin desplazamiento (*slippage*). Un libro con 500 lotes en cada nivel absorbe una orden grande; un libro con 5 lotes la dispara.\n\n**Quién la provee.** Los *market makers* (creadores de mercado) y los grandes participantes pasivos ponen órdenes limit a ambos lados del precio, cobrando el spread a cambio de estar siempre disponibles. Los institucionales — fondos, mesas de bancos — son en su mayoría **consumidores** de liquidez: necesitan ejecutar tamaños que el libro suelto no puede absorber sin impacto.\n\n**El problema del grande.** Para comprar 2 000 lotes de EUR/USD, comprarlos de golpe \"a mercado\" los sube él mismo: paga peores precios en cada nivel que consume (impacto de mercado). La solución institucional es **fragmentar** la orden y llenarla donde haya mucha contrapartida concentrada. ¿Dónde se concentra la contrapartida? Exactamente donde el retail coloca sus órdenes:\n\n1. **Stops:** los SL de los compradores viven bajo los mínimos recientes; los de los vendedores, sobre los máximos. Miles de cuentas independientes ponen sus stops en niveles parecidos (\"justo debajo del mínimo de ayer\", \"en el número redondo\") — una reserva concentrada de órdenes de venta esperando ser ejecutadas.\n2. **Órdenes pendientes:** limit de compra acumulados bajo zonas visibles, limit de venta sobre zonas visibles.\n\n**La barrida (*stop hunt / liquidity sweep*).** Un institucional que quiere COMPRAR en tamaño necesita a alguien vendiéndole. Bajo un mínimo obvio hay una mina: stops de venta + quiebres que atraen vendedores agresivos. Empujar el precio un poco bajo ese mínimo **detona esa liquidez**: los stops se convierten en ventas a mercado, los quiebres atraen más ventas cortas — y toda esa venta tiene un comprador paciente que la está absorbiendo en fragmentos. Cuando el libro se vacía de vendedores, el precio gira con energía sobrante. El mínimo \"se respetó a medias\": se rompió lo justo para llenar al comprador grande, y esa rotura falsa queda en el gráfico como *sweep* o *falso rompimiento* (M3.4 le pondrá nombre de patrón; M5 lo integrará en estructura).\n\n**Nota de honestidad:** no toda rotura de mínimo es una barrida institucional deliberada — a veces es simplemente un quiebre real que se confirma. La lección operativa no es \"todos los mínimos son cebo\": es que **los mínimos/máximos obvios concentran liquidez, y eso cambia las probabilidades de qué pasa ahí**. Tu ventaja es colocarte del lado estadístico, no adivinar la intención de nadie.\n\n**Visual — la anatomía de una barrida, segundo a segundo:**\n\n```mermaid\nsequenceDiagram\n    participant R as Retail\n    participant P as Precio\n    participant I as Institucional\n    R->>P: Coloca SL justo bajo el mínimo obvio (1,0800)\n    Note over I: Quiere COMPRAR 2 000 lotes<br/>y necesita vendedores que se los entreguen\n    I->>P: Empuja el precio bajo el mínimo\n    P->>R: Barrida: los stops se ejecutan<br/>(cada stop es una venta a mercado)\n    I->>P: Absorbe esas ventas en fragmentos<br/>llena sus 2 000 lotes sin impacto\n    P->>P: El libro se queda sin vendedores\n    P->>R: Giro al alza con energía sobrante\n    R->>R: \"El mercado me caza\" — no:<br/>tu stop era la mercancía buscada\n```\n\n## Analogía\n\nLa ballena y el estanque. Un pez pequeño puede girar en cualquier dirección sin levantar una ola: el agua no se entera (tu cuenta de 2 000 $). Una ballena que quiere virar necesita **agua profunda**: si gira en un estanque de medio metro, se quedará encallada en el fondo (tu orden de 2 000 lotes a mercado en un libro fino). ¿Y cómo consigue profundidad la ballena? Va a donde el agua se acumula. En los mercados, el \"agua\" se acumula en los lugares que todo el mundo mira: mínimos y máximos recientes, números redondos, bordes de rango — porque ahí es donde millones de decisiones independientes convergen sin coordinarse. La ballena no \"odia\" a los peces pequeños ni los persigue: simplemente necesita nadar donde hay agua, y el agua se junta donde los pequeños ponen sus órdenes. Si tú conoces el mapa de dónde se junta el agua, dejas de poner tu casa (SL) justo en la orilla por donde la ballena pasa a respirar.\n\n## Cómo se hace: el cálculo del institucional, con números cerrados\n\n**Escenario *(todas las cifras ilustrativas, mecánica real)*.** Una mesa quiere comprar 2 000 lotes de EUR/USD. El libro alrededor del precio muestra profundidad típica de 40–80 lotes por nivel en el ask.\n\n- **Opción A — comprar a mercado ahora:** consumiría ~25–50 niveles. Impacto estimado: el precio sube ~10–15 pips solo por su propia compra. Costo de impacto: si el recorrido medio que quería capturar es 40 pips, se comió un cuarto de su beneficio antes de empezar.\n- **Opción B — esperar el retroceso a la zona de liquidez:** bajo el mínimo de la semana en 1,0800 hay (estimado) 3 000 lotes en stops de venta + vendedores por quiebre. El precio barre 1,0802 → 1,0795: la rotura detona los stops (ventas a mercado), la mesa absorbe los 2 000 lotes **entre 1,0800 y 1,0793** sin mover el precio más allá del propio barrido. El stop de esa mesa: 1,0778 (bajo la nueva estructura del barrido), y el objetivo: 1,0860.\n- **Resultado del barrido:** en 15 minutos el precio toca 1,0793 y gira. El retail que compró el quiebre pierde; el retail que tenía el SL \"justo debajo del mínimo de ayer\" perdió la posición; la mesa entró donde había vendedores que pagar por su compra.\n\n**Lo que tú aprendes del escenario:** el SL bajo el mínimo obvio de ayer fue la mercancía. Un SL colocado por **estructura del barrido** (bajo 1,0778, el nuevo mínimo del impulso de venta) no estaba en la zona de la ballena — estaba detrás de ella. La diferencia entre ambos SL son 5 pips y una idea de liquidez. En el Módulo 8 esto se formaliza como colocación por estructura, y la [receta de primera operación](../../03-recursos/laboratorio/receta-primera-operacion.md) ya lo insinúa en su Paso 4: la invalidación va donde *tu idea muere*, no donde *duele un número redondo*.\n\n## Error común\n\nEl primero es el victimismo: \"el mercado me caza los stops, alguien me espía la cuenta\". Nadie ve tu cuenta de 2 000 $; lo que ven es la **estadística de miles de cuentas** que ponen stops donde los pones tú. El antídoto no es esconderse: es dejar de colocar stops en los depósitos de liquidez obvios (números redondos exactos, 3–5 pips bajo el mínimo obvio que todo el gráfico ve) y colocarlos donde tu análisis de estructura diga que la idea está muerta — aunque eso signifique arriesgar 28 pips en vez de 15 (y calcular el lote en consecuencia, Paso 5 de la receta). El segundo error es el espejo: \"entonces TODO quiebre es falso, vendo siempre las roturas\". Falso y peligroso: los quiebres reales existen y son los que alimentan las tendencias (Lección 2.2). La diferencia observacional — barrida y vuelta rápida con energía vs quiebre con cierre sostenido fuera del nivel y retroceso que respeta el nivel roto — es contenido del Módulo 3.4. Antes de tener ese criterio, la regla del programa es simple: **sin posición en la ventana de datos macro y sin anticipar quiebres**.\n\n## Conexión cuantitativa\n\nLa liquidez no entendida destruye $E$ por dos puertas. **Puerta 1 — el WR real cae respecto al backtest:** stops colocados en zonas de liquidez elevan la frecuencia de \"SL tocado y giro a favor\" — cada uno es una pérdida de 1R que el backtest contaba como ganadora (el histórico no siempre distingue tu nivel exacto de stop). **Puerta 2 — el slippage agranda $L$:** cuando tu SL ejecuta dentro de una barrida (mucho movimiento, libro desbalanceado), puedes salir 3–10 pips peor que tu nivel *(ilustrativo)*: una pérdida de 1R se vuelve 1,2R–1,5R. En la ecuación $E = (P_w \\times W) - (P_l \\times L)$, ambos efectos empujan hacia abajo y no aparecen en el backtest ingenuo. El programa los neutraliza con: colocación por estructura (M8), tamaño que sobreviva el slippage, y la regla de no estar en el mercado en ventanas de datos (Lección 2.6) — donde las barridas y los saltos se concentran.\n\n---\n\n## 🎯 Puntos clave\n\n1. Liquidez = ejecutar tamaño inmediato sin mover el precio; se mide en ancho de spread y profundidad de libro.\n2. Los institucionales son consumidores de liquidez: fragmentan sus órdenes y van a donde hay contrapartida concentrada.\n3. La contrapartida se concentra donde el retail pone sus órdenes: stops bajo mínimos/sobre máximos obvios y números redondos.\n4. La **barrida** detona esa liquidez para llenar una orden grande — es ingeniería de ejecución, no conspiración contra tu cuenta.\n5. Tu defensa: SL por **estructura** (donde tu idea muere), nunca en el depósito de liquidez obvio ni en números redondos.\n6. No todo quiebre es barrida: los quiebres reales alimentan tendencias. Sin criterio de confirmación (M3.4), la regla es no anticipar.\n\n## 🔄 Autoevaluación rápida\n\n1. ¿Por qué un fondo con 2 000 lotes que comprar NO puede simplemente apretar \"comprar a mercado\", aunque el mercado sea el más líquido del mundo?\n2. Tu SL está en 1,0800 (exacto) y el mínimo visible de ayer fue 1,0802. ¿Qué dos problemas tiene esa colocación y qué le preguntarías a tu análisis antes de moverlo?\n3. El precio rompe un mínimo importante y en 20 minutos vuelve por encima de él. ¿Qué dos lecturas son posibles y qué las distingue?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Porque su propia orden consumiría decenas de niveles del libro: pagaría peores precios en cada nivel (impacto de mercado, ~10–15 pips en el ejemplo) y se comería una parte del beneficio antes de estar posicionado. Los grandes fragmentan y llenan donde hay contrapartida concentrada — que es justo donde el retail acumula stops y pendientes.\n2. Problema 1: está en un **número redondo** (nivel psicológico con liquidez extra). Problema 2: está a 2 pips del mínimo obvio de ayer — el depósito clásico de stops de la masa; su stop es parte de la mina que la barrida viene a detonar. La pregunta a tu análisis: ¿dónde muere realmente mi idea? Si tu escenario era \"compra en soporte, invalidada si pierde la zona\", el SL va **bajo la estructura del barrido potencial** (bajo el mínimo del impulso que rompería), no pegado al nivel visible — y el lote se recalcula con el Paso 5 de la receta para que el riesgo siga siendo 1 %.\n3. Lectura 1 — barrida: rotura que detona liquidez bajo el mínimo, el comprador institucional llena ahí, el precio gira con energía (vuelta rápida, velas de reacción fuertes). Lectura 2 — quiebre real con *throwback*: el precio rompe, retrocede a retestear el nivel roto (ahora resistencia→soporte por polaridad) y continúa. Lo que distingue: el **cierre** y el comportamiento del retesteo — barrida = cierre vuelve rápido dentro + giro con impulso; quiebre sano = cierre sostenido fuera del nivel, retroceso lento que respeta el nivel y continuación. El criterio de confirmación en 3 pasos (M3.4) formaliza esta lectura; sin él, no se anticipa nada.\n\n</details>\n"},{"i":16,"g":"🧱 M2 · El Motor del Precio","t":"2.4 · Forex y sus sesiones","f":"docs/02-modulos/mod-02-motor-del-precio/leccion-2-4.md","md":"# Lección 2.4 · Forex y sus sesiones\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 45–60 min de estudio (incluye construir tu reloj de sesiones en el laboratorio) |\n| 🧱 Módulo | [M2 · El Motor del Precio](README.md) |\n| ⬅️ Anterior | [Lección 2.3 · Liquidez](leccion-2-3.md) |\n| ➡️ Siguiente | [Lección 2.5 · Personalidad de cada mercado](leccion-2-5.md) |\n\n---\n\n## Por qué importa\n\nEl forex abre domingo por la tarde y cierra viernes por la tarde — pero no es un mercado uniforme de 120 horas: es cuatro turnos de fábrica que se pasan la posta alrededor del planeta, con un pico de actividad cuando Londres y Nueva York coinciden. Para tu operativa esto no es cultura general: **la hora del día determina el spread que pagas, la volatilidad que puedes capturar y el ruido que te confunde**. El mismo setup ejecutado en el solapamiento Londres-NY y a las 11 de la noche son dos negocios distintos con el mismo nombre. Y hay una ventaja geográfica que casi nadie te cuenta: tu huso horario (Bolivia, UTC-4) coincide con el de Nueva York durante la mayor parte del año — el turno más importante del mercado pasa en tus horas normales de vigilia, no de madrugada.\n\n## Concepto\n\n**Los pares.** En forex siempre compras una moneda vendiendo otra: EUR/USD a 1,0850 significa 1 euro cuesta 1,0850 dólares. La primera moneda es la **base**, la segunda la **cotización** (*quote*). Familias:\n\n- **Majors:** el dólar con las grandes economías (EUR/USD, USD/JPY, GBP/USD, USD/CHF, USD/CAD, AUD/USD, NZD/USD) — máxima liquidez, spreads mínimos.\n- **Minors/crosses:** sin dólar (EUR/GBP, EUR/JPY, GBP/JPY) — líquidos, spreads algo mayores.\n- **Exóticos:** mayor + moneda emergente (USD/MXN, USD/TRY) — spreads anchos, movimientos violentos, costos que devoran sistemas *(el programa los evita durante la formación)*.\n\n**El pip** (*pip, percentage in point*): la unidad mínima convencional de movimiento. En EUR/USD y la mayoría de pares es la cuarta decimal (0,0001); en los pares con yen, la segunda (0,01). Ojo con la **pipette** (la quinta decimal que muestran los brókeres: 0,00001 = décima de pip) — no confundas 15 pips con 15 pipettes al fijar tu SL: un error de ×10 en el riesgo.\n\n**El lote.** 1 lote estándar = 100 000 unidades de la base → en EUR/USD, 1 pip = 10 $. Mini (0,1) = 1 $/pip. Micro (0,01) = 0,10 $/pip. La receta de tu primera operación ya usó esto en su Paso 5: el lote no se elige, **se calcula**.\n\n**Las sesiones** (horarios aproximados en UTC; se mueven ±1 h con el horario de verano del norte):\n\n| Sesión | UTC (aprox.) | Bolivia UTC-4 (aprox.) | Carácter |\n|---|---|---|---|\n| 🇦🇺 Sídney | 21:00–06:00 | 17:00–02:00 | Apertura de la semana; volumen fino, spreads anchos |\n| 🇯🇵 Tokio | 00:00–09:00 | 20:00–05:00 | Rangos más definidos; JPY y AUD protagonistas |\n| 🇬🇧 Londres | 07:00–16:00 | 03:00–12:00 | La apertura (≈ 09:00 Bolivia) dispara el volumen del día; expansiones y barridas de la sesión asiática |\n| 🇺🇸 Nueva York | 12:00–21:00 | 08:00–17:00 | Datos de EE. UU. (08:30 Bolivia); continua el impulso o invierte el de Londres |\n\n**El solapamiento Londres–NY (≈ 12:00–16:00 UTC = 08:00–12:00 Bolivia)** es el turno estrella: el mayor volumen y los menores spreads del día. Los datos del BIS (encuesta trienal 2022 *(snapshot)*) lo explican: Reino Unido concentra ≈ 38 % del volumen global de divisas y EE. UU. ≈ 19 % — cuando ambos turnos coinciden, el libro está más lleno. Después del cierre de Londres (≈ 16:00 UTC), el volumen se desinfla: los movimientos de última hora son trampas frecuentes para principiantes.\n\n**Visual — tu día forex, en tu reloj (Bolivia, UTC-4):**\n\n```mermaid\ntimeline\n    title El día forex en hora Bolivia (aproximado — se mueve ±1 h con el DST del norte)\n    17h–02h : Sídney — apertura de la semana, volumen fino, spreads anchos\n    20h–05h : Tokio — rangos más definidos, JPY y AUD protagonistas\n    03h–12h : Londres — la apertura (≈ 09h) dispara el volumen del día\n    08h–17h : Nueva York — datos 08h30, extiende o invierte a Londres\n    08h–12h : Solapamiento Londres–NY — el turno estrella · máxima energía, mínimo spread\n    12h–17h : Tarde — Londres recoge puestos · volumen menguante, trampas frecuentes\n```\n\n**El ciclo típico del día** (patrón, no ley): la sesión asiática construye un rango → la apertura de Londres lo rompe o barre sus extremos (liquidez, Lección 2.3) → la dirección de Londres se extiende o se invierte en Nueva York con los datos → el cierre de Londres sella el recorrido y la tarde se aplaca. Conocer este guion no te da señales: te da **expectativas correctas** sobre qué tipo de comportamiento puede ocurrir a cada hora.\n\n## Analogía\n\nEl mercado global de divisas es una feria permanente de cuatro turnos. El turno de madrugada (Sídney-Tokio) es un mercado de barrio: pocos puestos, precios que solo se mueven si llevas el carro lleno, y el vendedor te cobra más margen porque no hay competencia al lado (spreads anchos, rangos finos). A las 09:00 hora Bolivia abren los almacenes grandes de Londres: entran camiones, el pasillo se llena, los precios empiezan a moverse de verdad y el margen del vendedor se encoge a fuerza de competencia (volumen máximo, spreads mínimos). A las 08:00–12:00 Bolivia coinciden los almacenes de Londres y los de Nueva York: la feria entera en pie — ese es tu horario de oro. A las 13:00 hora Bolivia, Londres empieza a recoger puestos: la feria sigue abierta pero vaciándose, y los últimos remates a veces se pagan caros. Operar fuera de tu horario de oro no es imposible — es **pagar alquiler más alto por un local con menos clientes**.\n\n## Cómo se hace: tu reloj de sesiones y el valor del pip, con números cerrados\n\n**1. Ancla tu reloj.** Bolivia es UTC-4 todo el año (sin horario de verano). Nueva York es UTC-4 en su horario de verano y UTC-5 en invierno boreal; Londres oscila entre UTC+0 y UTC+1. Consecuencia práctica: durante la mayor parte del año tu reloj y el de NY coinciden; en invierno del norte todo el bloque de EE. UU. se desfasa una hora. Regla del programa: **las horas se confirman en el calendario económico cada semana**, no se memorizan de una vez para siempre.\n\n**2. El valor del pip en dinero.** EUR/USD comprado con 1 lote estándar: 1 pip = 10 $. Ejemplo cerrado: entras long en 1,0850 y el TP está en 1,0890 — 40 pips de recorrido:\n- 0,01 lote (micro): 40 × 0,10 $ = **4 $**\n- 0,10 lote: 40 × 1 $ = **40 $**\n- 1 lote: 40 × 10 $ = **400 $**\n\nCon riesgo fijo del 1 % sobre 2 000 $ (20 $) y un SL de 25 pips: $20 / (25 \\times 10) = 0{,}08$ lotes — el mismo cálculo del Paso 5 de la receta. En pares con yen la cuarta decimal no existe: USD/JPY en 150,00 → 1 pip = 0,01 → con 1 lote (100 000 unidades), 1 pip ≈ 100 000 × 0,01 / 150 ≈ **6,67 $** *(el valor del pip en pares no-USD-quoted depende del tipo de cambio; tu plataforma lo calcula — tú solo debes saber que NO es siempre 10 $)*.\n\n**3. Elegir ventana de operativa.** Con la agenda del laboratorio (auditoría personal de M1) sobre la mesa: si tus bloques de energía alta son 08:00–12:00 Bolivia, tu ventana natural ES el solapamiento Londres-NY — capital y horario coinciden. Si solo tienes noches, tu ventana real es Tokio (rangos) o el final de NY — y eso condiciona el estilo: los sistemas de ruptura de rango asiático tienen su hábitat en la apertura de Londres; los de rango puro, en Asia. Tu reloj personal no es una limitación estética: es una **variable del diseño de tu sistema** (M7).\n\n## Error común\n\nEl primero: **operar horas muertas por disponibilidad** — el spread de EUR/USD en la madrugada puede duplicarse o triplicarse *(ilustrativo)* y el rango se encoge: pagas más peaje por recorridos más cortos, la combinación exacta que hunde $E$ (Lección 2.1). El segundo: **confundir pipette con pip** al fijar SL/TP — un SL \"de 15\" que en realidad son 15 pipettes (1,5 pips) muere con el primer respiro del mercado; uno \"de 15\" que en realidad son 150 pips multiplica ×10 tu riesgo real. Verifica siempre con el calculador de tamaño de tu plataforma ANTES de enviar la orden. El tercero: creer que \"forex cierra a medianoche\" y quedar atrapado en los fines de semana (el mercado cierra viernes ≈ 18:00 Bolivia y reabre domingo ≈ 18:00 Bolivia, con **gap** de apertura: el precio de lunes puede saltar respecto al de viernes — riesgo *overnight* que la receta y el M8 gestionan con reglas de no-permanencia).\n\n## Conexión cuantitativa\n\nLa hora del día entra en la ecuación como costo y como varianza. **Como costo:** mismo sistema, objetivo 30 pips — en el solapamiento paga ~1,5 pips de spread (5 % del objetivo); en la madrugada paga ~4 pips (13 %) *(ilustrativo)*: la diferencia de horario cuesta 8 puntos porcentuales de $E$ bruto sin tocar un solo parámetro técnico. **Como varianza:** fuera de las sesiones líquidas, los movimientos finos y sin energía alimentan el *whipsaw* (el vaivén que mata sistemas de ruptura). Esta es la segunda palanca de negocio que controlas sin tocar el sistema: **mercado líquido + sesión líquida + ejecución disciplinada** — y es gratis, solo exige respetar el reloj. En el laboratorio de este módulo construyes tu reloj personal y lo dejas pegado junto a la pantalla; en la misión lo validas con observación en vivo.\n\n---\n\n## 🎯 Puntos clave\n\n1. En forex compras una moneda vendiendo otra: base/quote; majors, minors y exóticos se diferencian por liquidez y costo.\n2. Pip = 0,0001 (pares con yen: 0,01); lote estándar = 10 $/pip en EUR/USD, micro = 0,10 $/pip — el lote **se calcula**, nunca se elige a ojo.\n3. Cuatro sesiones alrededor del sol; el solapamiento Londres–NY (08:00–12:00 Bolivia aprox.) concentra el mayor volumen y los menores spreads.\n4. Londres ≈ 38 % y NY ≈ 19 % del volumen global *(BIS 2022, snapshot)* — por eso su coincidencia es el turno estrella.\n5. Ciclo típico: Asia construye rango → Londres lo rompe o lo barre → NY extiende o invierte → cierre de Londres desinfla la tarde.\n6. Tu huso (UTC-4) coincide con NY la mayor parte del año: tu horario de oro está en tu vigilia normal. Las horas se verifican cada semana por DST.\n\n## 🔄 Autoevaluación rápida\n\n1. Compras USD/JPY con 1 lote en 150,00 y cierras en 150,35. ¿Cuántos pips ganaste y aproximadamente cuántos dólares (con el valor de pip aproximado de la lección)?\n2. Tu agenda solo da bloques de estudio de 21:00 a 23:00 Bolivia. ¿Qué sesión estás viendo, qué carácter tiene, y qué implicación tiene para el tipo de sistema que podría funcionar ahí?\n3. El viernes a las 17:30 Bolivia tienes una posición long en EUR/USD con +25 pips. ¿Qué riesgo corres si la mantienes durante el fin de semana y cuál es la práctica del programa?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. 150,35 − 150,00 = 0,35 → en USD/JPY 1 pip = 0,01 → **35 pips**. Valor del pip: 100 000 × 0,01 / 150 ≈ 6,67 $ → ganancia ≈ 35 × 6,67 ≈ **233 $** (aproximación; el valor exacto varía con el tipo de cambio y lo calcula la plataforma).\n2. 21:00–23:00 Bolivia ≈ fin de Nueva York / inicio de Sídney–Tokio: volumen decreciente, spreads que se ensanchan, rangos finos. Implicación: los sistemas de ruptura y expansión están fuera de su hábitat (necesitan el motor de Londres-NY); un sistema de rango/reversión es más coherente con esa ventana — o mejor: usar esos bloques para estudio/análisis y journal, y ejecutar en los 2-4 h del solapamiento si tu vida lo permite. La ventana horaria es una variable de diseño del sistema (M7), no un detalle.\n3. Riesgo *overnight* de fin de semana: el mercado cierra viernes ≈ 18:00 Bolivia y no puedes salir hasta el domingo por la noche; noticias del fin de semana (geopolítica, decisiones de bancos centrales, quiebras) se descuentan en el **gap** de apertura — tu SL no te protege dentro del gap: puedes abrir lunes 40 pips por debajo de tu stop y perder 2R por una posición \"de 1R\". Práctica del programa: no mantener posiciones durante el fin de semana durante toda la formación (y después, solo si el plan lo contempla explícitamente con tamaño reducido).\n\n</details>\n"},{"i":17,"g":"🧱 M2 · El Motor del Precio","t":"2.5 · Personalidad de cada mercado","f":"docs/02-modulos/mod-02-motor-del-precio/leccion-2-5.md","md":"# Lección 2.5 · Personalidad de cada mercado\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 40–50 min de estudio |\n| 🧱 Módulo | [M2 · El Motor del Precio](README.md) |\n| ⬅️ Anterior | [Lección 2.4 · Forex y sus sesiones](leccion-2-4.md) |\n| ➡️ Siguiente | [Lección 2.6 · Calendario macro e intermercados](leccion-2-6.md) |\n\n---\n\n## Por qué importa\n\nUn sistema no se opera \"en el mercado\" en abstracto: se opera en UN mercado concreto, con su horario, su volatilidad, sus costos y sus drivers. El EUR/USD de la madrugada y el NAS100 a la apertura de Nueva York son dos deportes distintos con la misma pelota. El principiante que cambia de instrumento cada día no está \"diversificando\": está estrenando un mercado nuevo sin conocer sus reglas locales, y pagando la matrícula de cada uno. Esta lección te da el perfil operativo de los tres mercados que el programa usa como coordenada principal (forex, oro, índices, según tu mapa del Módulo 1), con la lógica para auditar cualquier otro que te tiente más adelante. Y cierra con la regla de concentración del programa: **un mercado dominado vale más que seis medianamente conocidos** — en formación, la profundidad bate a la amplitud.\n\n## Concepto\n\nCada mercado tiene una **microestructura** — el conjunto de reglas y comportamientos que lo distinguen — organizada en cinco dimensiones. Las dos primeras ya las tienes (Lecciones 2.1–2.4); aquí añadimos las tres restantes:\n\n| Dimensión | Qué pregunta | Dónde se vio |\n|---|---|---|\n| Costo | ¿Cuánto spread/comisión pago por operar? | 2.1 |\n| Energía | ¿Cuánto se mueve y en qué horas? (volatilidad, ADR) | 2.2, 2.4 |\n| Liquidez | ¿Puede ejecutarse tamaño sin impacto? | 2.3 |\n| **Estructura de horario** | ¿Abre/cierra? ¿Hay gaps? ¿24/7 o sesiones? | esta lección |\n| **Drivers** | ¿Qué mueve el precio aquí? ¿Quién decide? | esta lección |\n\n**Perfil de los tres mercados de la coordenada del programa** *(rangos ilustrativos — se verifican en vivo en el laboratorio)*:\n\n**FX majors (EUR/USD como representante).** Horario: 24/5, sin gaps salvo fin de semana. Volatilidad: moderada; ADR (recorrido medio diario) típicamente 50–90 pips. Costo: el más bajo de todos. Drivers: diferencial de tasas entre las dos economías del par, flujos comerciales, riesgo sistémico. Personalidad: el buey de labranza — lento, fuerte, predecible en su cansancio; las tendencias grandes tardan semanas.\n\n**Oro (XAU/USD).** Horario: 24/5 como forex, pero su energía se concentra en el horario de EE. UU. (datos, FOMC). Volatilidad: alta — ADR típicamente de decenas de dólares (un 1 %–1,5 % del precio por día *(ilustrativo)*). Costo: spread notablemente mayor que EUR/USD y tamaño de lote distinto (1 lote = 100 oz). Drivers: tasas reales de EE. UU. (relación inversa típ
