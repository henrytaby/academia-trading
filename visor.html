LLABUS y el de la lección 1.3):\n  1. receta-primera-operacion.md — flowchart TD de los 12 pasos con nodos de decisión (¿hay setup? / ¿6 de 6 procesada?) y bucle de corrección\n  2. leccion-2-1 — flowchart TD: nacimiento de un tick (taker de 80 lotes consumiendo los niveles ask)\n  3. leccion-2-2 — flowchart LR circular: equilibrio → desequilibrio → expansión → nuevo equilibrio\n  4. leccion-2-3 — sequenceDiagram: anatomía de la barrida de stops (Retail / Precio / Institucional)\n  5. leccion-2-4 — timeline: el día forex completo en hora Bolivia con el solapamiento destacado\n  6. leccion-2-6 — flowchart TD: cadena causal macro (dato → expectativas → rendimientos → DXY → oro/EUR/acciones/cripto) reemplazando el esquema ASCII\n  7. leccion-3-1 — flowchart TD: método de lectura de vela en 4 preguntas\n  8. leccion-3-2 — flowchart LR: la rueda de 4 ciclos con los 2 errores del retail marcados\n  9. leccion-3-4 — flowchart TD con decisiones: protocolo de confirmación en 3 pasos completo\n  10. leccion-3-6 — flowchart TD: clasificador de régimen (3 marcas → tendencia/rango/transición → conducta)\n- Criterio de inserción: solo donde el diagrama añade información que el texto no muestra bien (procesos, bucles, decisiones, secuencias); no se diagramaron tablas ni gradientes que ya funcionan como tablas\n- Sintaxis Mermaid verificada: etiquetas entre comillas, <br/> para saltos, sin identificadores reservados (end), compatible con el render nativo de GitHub (mermaid v10+)\n- Creado visor.html autocontenido en la raíz del repo: renderiza los 30 archivos md con marked + mermaid vía CDN, navegación lateral por grupos, enlaces internos .md reescritos a anclas del visor\n- Empaquetado el repo completo en download/academia-trading.zip\n\nStage Summary:\n- Artefactos: 10 diagramas Mermaid nuevos distribuidos en la receta y 9 lecciones; visor.html; academia-trading.zip\n- Decisiones: Mermaid sobre imágenes porque GitHub lo renderiza nativamente, es versionable y editable; el visor.html es solo una capa de lectura (en GitHub los .md ya se ven completos); KaTeX no incluido en el visor por riesgo de manglar los $ de costos en el texto (en GitHub la notación $...$ sí se renderiza como matemática)\n- Estado: N1 completo y visual. Siguiente: Sprint 4 (M4 + examen N1) cuando el estudiante lo pida\n\n---\nTask ID: sprint-4\nAgent: Z.ai (Mentor Trading + Pedagogical Coach + Chief Risk Officer + Knowledge Architect)\nTask: Construcción completa del Módulo 4 · Plataforma y Primera Ejecución + Examen integrador N1\n\nWork Log:\n- Leído SYLLABUS §5 M4 (6 lecciones + lab + misión + 🏆 evaluación N1) y PLANTILLA_MODULO; replicada la voz/formato §6.2 de M1-M3\n- Redactadas las 6 lecciones: 4.1 layout profesional (D1/H4/H1/M15, watchlist ≤5, alertas, Bar Replay, atajos; 29 h/año devueltas por plantilla), 4.2 tipos de órdenes (tabla de garantías market/limit/stop/stop-limit/OCO, mermaid de decisión, OCO de la receta con buy limit 1,0824 + SL 1,0794 + TP 1,0884; stop-limit prohibido como SL), 4.3 los 4 costos (spread/comisión/slippage/swap con triple miércoles; mermaid de anatomía del costo con 1 lote: 39 $ ≈ 0,12R; tabla en 0,06 lote: 2,6 pips ≈ 0,09R; E_neto = E_bruto − c), 4.4 largos y cortos (sequenceDiagram del short en 5 pasos, borrow fee, squeeze GameStop, escalera vs ascensor; riesgo ilimitado del corto), 4.5 cuenta demo (qué simula y qué no, configuración realista no negociable, lectura del panel con margen ≈ 217 $, circuito demo → demo-forward → real micro), 4.6 el SL como ley (3 propiedades, mermaid de colocación por estructura, orden sagrado estructura→SL→lote, checklist 6/6, swing 1,0798 → SL 1,0794 = 30 pips → lote 0,06 → riesgo 18 $ = 0,9 %)\n- Auditoría aritmética del sprint: detectado y corregido valor de pip de 0,06 lotes (0,6 $, no 6 $) en tabla de costos de 4.3 (total 1,92 $ ≈ 2,6 pips), factura mensual (38 $), Puntos clave (2,6 pips = 4,3 % del TP de 60, 26 % de un TP de 10), swaps de 4.4 (short +0,36 $/2 noches, ventaja 1,20 $, +36 $ por 60 pips), peor caso del long (≈ −6 500 $ nominal) y desglose del B8 del examen (75 pips × 0,6 $/pip = 45 $ = 2,5R)\n- Construido README del módulo: hub con tabla de lecciones, puente con la receta (pasos 3-11 habilitados), laboratorio de las 4 órdenes (market, limit, OCO, stop de ruptura con capturas), misión M-4 (10 operaciones demo 6/6 con formato de fila y cero violaciones de SL), quiz de 10 preguntas con clave oculta, glosario de 23 términos, referencias\n- Creado docs/03-recursos/evaluaciones/examen-n1.md: 30 preguntas cerradas (bloques A M1×7 / B M2×8 / C M3×8 / D M4×7) con umbral ≥ 24/30, 5 preguntas socráticas en vivo, checklist de ejecución de 6 casillas, tabla de registro y clave oculta en details\n- Actualizado glosario maestro: +23 términos M4, total 111 entradas\n- Actualizado README raíz (M4 🟢, M5 🔜 Sprint 5, árbol con mod-04 y evaluaciones/, nota Sprint 4, Inicio Rápido), SYLLABUS v1.2 (roadmap Sprints 2-4 ✅ + registro de versiones) y navegación del M3 (enlaces a M4 y examen N1)\n\nStage Summary:\n- Artefactos: mod-04-plataforma-y-primera-ejecucion/ completo (README + 6 lecciones) + examen-n1.md + glosario maestro 111 entradas + README raíz + SYLLABUS v1.2 + M3 README actualizado\n- Decisiones: el examen N1 vive en evaluaciones/ (no dentro del módulo) porque cubre los 4 módulos del nivel; el checklist de ejecución 6/6 de la lección 4.6 queda como estándar transversal (lo citarán M8 gestión y M9 journal); el circuito demo → demo-forward → real micro se mantiene coherente con la receta y el veto CRO del \"primer dólar\"; el costo en R (0,09R) presentado como tamaño-invariante para preparar M8/M9\n- Estado: N1 COMPLETO (M1 🟢 M2 🟢 M3 🟢 M4 🟢 + Examen N1 listo). El estudiante estudia M1→M4, ejecuta la misión M-4 y rinde el examen; la certificación 🏆 del nivel exige los tres umbrales (misiones, examen ≥ 80 %, checklist sin violaciones)\n- Siguiente: Sprint 5 (M5 · Estructura de Mercado y Liquidez — N2) cuando el estudiante lo pida\n"}]</script>
<script>
(function(){
  var statusEl = document.getElementById('status');
  function setStatus(msg, isErr){
    statusEl.textContent = msg;
    statusEl.style.color = isErr ? '#ff9a8a' : '';
  }
  try{

  var DATA = JSON.parse(document.getElementById('course-data').textContent);
  var nav = document.getElementById('nav');
  var main = document.getElementById('main');
  setStatus('renderizando ' + DATA.length + ' documentos\u2026');

  // ---------- utilidades ----------
  function escHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function cellsOf(row){
    var r = row.replace(/^\s*\|/, '').replace(/\|\s*$/, '');
    return r.split('|').map(function(c){ return c.trim(); });
  }

  // ---------- respaldo markdown (si el CDN no carga, el visor sigue funcionando) ----------
  function inlineMd(s){
    var t = escHtml(s);
    t = t.replace(/`([^`]+)`/g, function(m,c){ return '<code>' + c + '</code>'; });
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[\s(>])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, txt, href){
      return '<a href="' + href + '">' + txt + '</a>';
    });
    return t;
  }

  function miniMd(src){
    var lines = String(src).replace(/\r\n/g,'\n').split('\n');
    var out = [];
    var i = 0;
    var para = [];

    function flushPara(){
      if(para.length){
        out.push('<p>' + para.map(inlineMd).join('<br>') + '</p>');
        para = [];
      }
    }

    while(i < lines.length){
      var ln = lines[i];

      // bloque de codigo vallado
      var fence = ln.match(/^\s*```\s*(\S*)\s*$/);
      if(fence){
        flushPara();
        var lang = fence[1] || '';
        var buf = [];
        i++;
        while(i < lines.length && !/^\s*```\s*$/.test(lines[i])){
          buf.push(lines[i]); i++;
        }
        i++;
        if(lang === 'mermaid'){
          out.push('<pre class="mermaid">' + escHtml(buf.join('\n')) + '</pre>');
        } else {
          out.push('<pre><code>' + escHtml(buf.join('\n')) + '</code></pre>');
        }
        continue;
      }

      // tabla markdown
      if(ln.indexOf('|') >= 0 && (i + 1) < lines.length &&
         lines[i+1].indexOf('-') >= 0 && /^\s*\|?[\s:|\-]+\|?\s*$/.test(lines[i+1])){
        flushPara();
        var head = cellsOf(ln);
        i += 2;
        var body = [];
        while(i < lines.length && lines[i].indexOf('|') >= 0 && lines[i].trim() !== ''){
          body.push(cellsOf(lines[i])); i++;
        }
        var tb = '<table><thead><tr>';
        head.forEach(function(c){ tb += '<th>' + inlineMd(c) + '</th>'; });
        tb += '</tr></thead><tbody>';
        body.forEach(function(row){
          tb += '<tr>';
          head.forEach(function(_, ci){ tb += '<td>' + inlineMd(row[ci] || '') + '</td>'; });
          tb += '</tr>';
        });
        tb += '</tbody></table>';
        out.push(tb);
        continue;
      }

      // titulos
      var h = ln.match(/^(#{1,6})\s+(.*)$/);
      if(h){
        flushPara();
        var lvl = h[1].length;
        out.push('<h' + lvl + '>' + inlineMd(h[2]) + '</h' + lvl + '>');
        i++; continue;
      }

      // linea horizontal
      if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){
        flushPara();
        out.push('<hr>');
        i++; continue;
      }

      // citas
      if(/^\s*>/.test(ln)){
        flushPara();
        var q = [];
        while(i < lines.length && /^\s*>/.test(lines[i])){
          q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push('<blockquote>' + miniMd(q.join('\n')) + '</blockquote>');
        continue;
      }

      // listas
      var li = ln.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
      if(li){
        flushPara();
        var ordered = /\d+\./.test(li[2]);
        var items = [];
        while(i < lines.length){
          var m2 = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
          if(!m2) break;
          var txt = m2[3]
            .replace(/^\[ \]\s*/, '\u2610 ')
            .replace(/^\[[xX]\]\s*/, '\u2611 ');
          items.push('<li>' + inlineMd(txt) + '</li>');
          i++;
        }
        out.push(ordered ? '<ol>' + items.join('') + '</ol>' : '<ul>' + items.join('') + '</ul>');
        continue;
      }

      // linea vacia
      if(ln.trim() === ''){
        flushPara();
        i++; continue;
      }

      // parrafo
      para.push(ln);
      i++;
    }
    flushPara();
    return out.join('\n');
  }

  // ---------- render con respaldo ----------
  function render(src){
    try{
      if(window.marked && typeof window.marked.parse === 'function'){
        return window.marked.parse(src);
      }
    }catch(e){}
    return miniMd(src);
  }

  // ---------- índice de enlaces internos ----------
  // byPath: ruta completa normalizada (resolución correcta de rutas relativas)
  // byBase: nombre de archivo, como último recurso cuando la ruta no resuelve
  var byPath = {}, byBase = {};
  DATA.forEach(function(d){
    var f = String(d.f).replace(/^\.\//, '');
    byPath[f] = 'doc-' + d.i;
    var base = f.split('/').pop().toLowerCase();
    if(!byBase[base]) byBase[base] = 'doc-' + d.i;
    var sinExt = base.replace(/\.md$/, '');
    if(!byBase[sinExt]) byBase[sinExt] = 'doc-' + d.i;
  });

  function rewriteLinks(html, docPath){
    var dir = String(docPath || '').split('/').slice(0, -1);
    return html.replace(/href="([^"]*)"/g, function(m, href){
      if(href.charAt(0) === '#') return m;
      var hashIdx = href.indexOf('#');
      var path = hashIdx >= 0 ? href.slice(0, hashIdx) : href;
      path = path.split('?')[0];
      if(!path || /^(https?:|mailto:)/i.test(path)) return m;
      // resolver la ruta relativa respecto a la carpeta del documento actual
      var stack = dir.slice();
      path.replace(/^\.\//, '').split('/').forEach(function(p){
        if(p === '' || p === '.') return;
        if(p === '..') stack.pop(); else stack.push(p);
      });
      var resolved = stack.join('/');
      if(byPath[resolved]) return 'href="#' + byPath[resolved] + '"';
      var base = path.split('/').pop().toLowerCase().replace(/\.md$/, '');
      if(byBase[base]) return 'href="#' + byBase[base] + '"';
      return m;
    });
  }

  // ---------- navegacion lateral ----------
  var groups = [];
  DATA.forEach(function(d){ if(groups.indexOf(d.g) < 0) groups.push(d.g); });
  var navHtml = '';
  groups.forEach(function(g){
    navHtml += '<div class="group">' + escHtml(g) + '</div>';
    DATA.forEach(function(d){
      if(d.g !== g) return;
      navHtml += '<a href="#doc-' + d.i + '" id="nav-doc-' + d.i + '">' + escHtml(d.t) + '</a>';
    });
  });
  nav.innerHTML = navHtml;

  // ---------- render de secciones ----------
  var mermaidCount = 0;
  DATA.forEach(function(d){
    var sec = document.createElement('section');
    sec.className = 'doc';
    sec.id = 'doc-' + d.i;
    var html;
    try { html = render(d.md); }
    catch(e){ html = '<p><strong>error de render</strong></p><pre>' + escHtml(String(e)) + '</pre>'; }
    html = rewriteLinks(html, d.f);
    // callouts de GitHub ([!WARNING], [!NOTE]...) -> blockquote con estilo de alerta
    html = html.replace(/<blockquote>\s*<p>\[!(WARNING|CAUTION)\]/gi,
      '<blockquote class="gfm-alert"><p><strong>\u26a0\ufe0f $1:</strong>');
    html = html.replace(/<blockquote>\s*<p>\[!(NOTE|TIP|IMPORTANT)\]/gi,
      '<blockquote class="gfm-alert" style="border-left-color:#0e7c66;background:#e3f2ee"><p><strong>\ud83d\udca1 $1:</strong>');
    html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, function(m, code){
      mermaidCount++;
      return '<pre class="mermaid">' + code + '</pre>';
    });
    sec.innerHTML = html;
    main.appendChild(sec);
  });

  // ---------- diagramas mermaid: renderizado único al inicio ----------
  // mermaid necesita elementos MEDIBLES (ninguno display:none) durante el render.
  // Estrategia: poner todas las secciones offscreen-visible (.measuring), renderizar
  // los 18 diagramas en UNA pasada, y devolver todo a su estado. Una sola ruta de
  // código, sin carreras con la navegación.
  var diagramTotal = mermaidCount;
  var mermaidInited = false;

  var styleFix = document.createElement('style');
  styleFix.textContent = 'section.doc.measuring{display:block!important;position:absolute!important;visibility:hidden!important;top:-10000px!important;left:-10000px!important;width:900px;margin:0!important;box-shadow:none!important}';
  document.head.appendChild(styleFix);

  function paintStatus(msg){
    statusEl.textContent = msg;
  }

  function countSvgs(){
    return document.querySelectorAll('section.doc pre.mermaid svg').length;
  }

  function renderAllDiagrams(){
    if(!window.mermaid){
      if(diagramTotal > 0){
        paintStatus('\u2705 ' + DATA.length + ' documentos \u00b7 los ' + diagramTotal + ' diagramas se ven como c\u00f3digo sin internet (en GitHub se dibujan solos)');
      } else {
        paintStatus('\u2705 ' + DATA.length + ' documentos');
      }
      return;
    }
    if(diagramTotal === 0){
      paintStatus('\u2705 ' + DATA.length + ' documentos');
      return;
    }
    paintStatus('\u2705 ' + DATA.length + ' documentos \u00b7 dibujando ' + diagramTotal + ' diagramas\u2026');
    if(!mermaidInited){
      mermaid.initialize({ startOnLoad:false, theme:'neutral', securityLevel:'loose', flowchart:{useMaxWidth:true}, sequence:{useMaxWidth:true} });
      mermaidInited = true;
    }
    var secs = document.querySelectorAll('section.doc');
    secs.forEach(function(s){
      if(s.querySelector('pre.mermaid')) s.classList.add('measuring');
    });
    function finish(){
      document.querySelectorAll('section.doc.measuring').forEach(function(s){ s.classList.remove('measuring'); });
      var hechos = countSvgs();
      if(hechos >= diagramTotal){
        paintStatus('\u2705 ' + DATA.length + ' documentos \u00b7 ' + diagramTotal + ' diagramas');
      } else {
        paintStatus('\u2705 ' + DATA.length + ' documentos \u00b7 ' + hechos + '/' + diagramTotal + ' diagramas (alg\u00fan diagrama no se pudo dibujar)');
      }
    }
    mermaid.run({ querySelector: 'pre.mermaid' }).then(finish, finish);
  }
  renderAllDiagrams();

  // ---------- visibilidad por hash ----------
  function show(hash){
    var id = (hash || '').replace('#','');
    var sec = id ? document.getElementById(id) : null;
    document.querySelectorAll('section.doc').forEach(function(s){ s.classList.toggle('show', s === sec); });
    document.querySelectorAll('nav a').forEach(function(a){ a.classList.toggle('active', a.getAttribute('href') === hash); });
    if(sec){ window.scrollTo({top:0}); }
  }
  window.addEventListener('hashchange', function(){ show(location.hash); });
  show(location.hash || '#doc-0');

  // teclado: [ y ] saltan entre documentos
  document.addEventListener('keydown', function(ev){
    if(ev.key !== ']' && ev.key !== '[') return;
    var cur = parseInt((location.hash || '#doc-0').replace('#doc-',''), 10) || 0;
    var next = ev.key === ']' ? Math.min(cur + 1, DATA.length - 1) : Math.max(cur - 1, 0);
    location.hash = '#doc-' + next;
  });

  }catch(err){
    setStatus('\u274c error del visor: ' + err.message + ' (abre la consola F12 para m\u00e1s detalle)', true);
  }
})();
</script>
</body>
</html>
