ica), DXY (inversa), aversión al riesgo (directa en pánicos). Personalidad: el gallo de pelea — reacciona a todo, amplifica lo que toca; premia mucho y castiga mucho más.\n\n**Índices (US30/US100/US500 como CFD).** Horario: sesión de *cash* centrada en NY + sesiones extendidas; **gaps** de apertura frecuentes y de tamaño variable. Volatilidad: alta en apertura (primeros 30–60 min) y cierre; ADR de cientos de puntos según el período y el VIX *(ilustrativo)*. Costo: spread en puntos + valor del tick que **varía por bróker** (obligación: leer la especificación del contrato antes de calcular nada). Drivers: tasas, ganancias corporativas (*earnings*), apetito de riesgo, flujo pasivo indexado. Personalidad: caballo de carreras con salida en caja — arrastra fuerte desde el portalazo y odia el estancamiento.\n\n**Cripto (por contraste, mercado de referencia):** 24/7 sin sesiones — sin \"turno de oro\" horario pero con fines de semana de liquidez fina y spreads engordados, donde los movimientos repentinos (*flash moves*) son más violentos. Drivers: ciclo propio, flujos de ETF, financiamiento de futuros perpetuos. El programa lo deja fuera de la coordenada de formación por costo relativo y régimen de volatilidad; el criterio de auditoría que aprendiste aquí sirve si algún día lo incorporas.\n\n## Analogía\n\nPiensa en climas, no en animales. EUR/USD es clima templado: puedes planificar la semana con sombrilla pequeña; rara vez hay tormenta, pero casi nunca hay cosecha rápida. El oro es clima de montaña: amanece helado y a mediodía asa — el que se viste como en el valle (SL de forex sobre precios de oro) termina tiritando. Los índices son clima tropical de tarde: mañanas de portalazo eléctrico y tardes donde todo se calma de golpe; el que sale a las 11:00 buscando la tormenta de las 09:30 llega tarde. La cripto es el monzón: llueve cuando quiere, incluidos domingos. El punto pedagógico: **tu sistema es tu vestimenta**. El mismo outfit (SL fijo, tamaño fijo, expectativas fijas) no funciona en los cuatro climas — y por eso el programa te pide dominar UNO antes de coleccionar los otros.\n\n## Cómo se hace: comparar mercados con la misma vara, números cerrados\n\nLa comparación honesta se hace con **el mismo riesgo y el mismo tipo de idea** en cada mercado. Riesgo fijo: 1 % de 2 000 $ = 20 $ por operación (como siempre):\n\n| Variable | EUR/USD | XAU/USD | US30 (CFD) |\n|---|---|---|---|\n| ADR típico *(ilustrativo)* | ~70 pips | ~30 $ | ~350 puntos |\n| SL estructural típico | 25 pips | 4,00 $ | 80 puntos |\n| Valor por unidad de movimiento | 10 $/pip por lote | 100 $/1 $ por lote (100 oz) | según bróker — p. ej. 1 $/punto por contrato *(ilustrativo)* |\n| Lote para arriesgar 20 $ | $20/(25 \\times 10) = 0{,}08$ | $20/4 = 5$ oz = 0,05 lotes | $20/80 = 0{,}25$ contratos *(según especificación)* |\n| Spread típico *(ilustrativo)* | ~1–2 pips | ~0,20–0,40 $ | ~2–5 puntos |\n| Costo como % del SL | ~6–8 % | ~5–10 % | ~3–6 % |\n| Ventana de energía | Solapamiento Londres–NY | Horario de NY + datos | Apertura y cierre de NY |\n\nTres lecturas del cuadro:\n\n1. **El riesgo es el mismo; el transporte cambia.** 20 $ de riesgo se implementan con tamaños completamente distintos — por eso el Paso 5 de la receta es una fórmula, no una cifra memorizada. Si mañana cambias de mercado, el riesgo no cambia: cambia el cálculo.\n2. **El costo relativo se compara contra el SL, no contra el precio del activo.** Un spread de 0,30 $ en oro no es \"barato\" ni \"caro\" en abstracto: es ~7 % de un SL de 4 $ — comparable al 6-8 % de EUR/USD. La pregunta siempre es: *¿qué porcentaje de mi recorrido típico se lleva el peaje?*\n3. **La ventana de energía dicta tu horario.** Tres mercados, tres ventanas distintas — y tu agenda (laboratorio de M1) solo puede estar en una a la vez con calidad. Otra razón para la concentración: **tu reloj ya elige tu mercado** aunque no lo sepas.\n\n## Error común\n\nEl primero: **transplantar parámetros entre mercados** — SL de 25 pips \"funcionará\" en oro (allí 25 pips = 0,0025 $: el ruido del spread te saca), TP de índice \"adaptado\" a EUR/USD (objetivo imposible para el ADR del par). Cada mercado se recalcula desde cero: ADR observado, SL por estructura, lote por fórmula. El segundo: **coleccionar instrumentos en formación** — operar lunes EUR/USD, martes oro, miércoles NAS100 \"para ver qué gusta\". Cada cambio reinicia tu curva de aprendizaje de ese instrumento (sesiones, personalidad, niveles relevantes) y fragmenta tus N operaciones: 30 trades repartidos en 3 mercados no son estadística de NINGUNO (N ≥ 100 por sistema, Lección 1.4). El programa fija la regla: un mercado principal durante toda la formación; los otros existen para observar y para la ficha de variación de tu receta, no para alternar por aburrimiento.\n\n## Conexión cuantitativa\n\nEl mercado elegido modifica los tres términos de tu ecuación. **$W$ y $L$:** el ADR determina cuánto recorrido estructural cabe en tu timeframe — un SL estructural de 25 pips en EUR/USD y otro de 80 puntos en US30 son proporcionalmente similares; un TP diseñado fuera del ADR típico es un deseo, no un objetivo. **$P_w$:** la personalidad del mercado interactúa con tu sistema — un sistema de ruptura gana $P_w$ donde hay expansión real (aperturas de NY) y la pierde en rangos finos de madrugada. **Costos:** ya visto — el spread relativo al SL es un impuesto por mercado. La suma cuantitativa: el \"mejor mercado\" no existe en abstracto; existe el mercado cuya **energía, costo y horario** encajan con tu sistema y tu vida — y eso se audita con el cuadro de esta lección, no con la impresión de un fin de semana. En la Lección 2.6 añadirás la última capa: los eventos macro que sacuden a los tres a la vez.\n\n---\n\n## 🎯 Puntos clave\n\n1. Todo mercado se audita en 5 dimensiones: costo, energía, liquidez, estructura de horario y drivers.\n2. FX majors: buey de labranza — 24/5, bajo costo, volatilidad moderada, driver = diferencial de tasas.\n3. Oro: gallo de pelea — energía en horario de EE. UU., volatilidad alta, drivers = tasas reales (inversa), DXY (inversa), pánico (directa).\n4. Índices: caballo con salida en caja — gaps, apertura violenta, valor del tick variable por bróker, drivers = tasas + earnings + apetito de riesgo.\n5. El mismo riesgo (1 %) se implementa con tamaños totalmente distintos por mercado: la fórmula manda, no la cifra.\n6. Un mercado principal en formación: los N ≥ 100 se necesitan POR sistema Y mercado; repartir trades fragmenta tu estadística.\n\n## 🔄 Autoevaluación rápida\n\n1. Tu colega usa su SL \"estándar\" de 25 pips en oro porque \"le funcionó en EUR/USD\". Calcula cuánto arriesga en realidad si 25 pips de oro = 0,0025 $ de movimiento y el spread es de 0,30 $.\n2. Con riesgo 20 $, SL de 80 puntos en US30 y especificación de 1 $/punto por contrato: ¿qué tamaño operas? ¿Y qué debes verificar ANTES de confiar en ese 1 $/punto?\n3. ¿Por qué el programa prohíbe alternar de mercado cada día durante la formación, si \"diversificar es bueno\"?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Los \"25 pips\" de oro son 25 × 0,01 $ = 0,25 $ por onza de recorrido... en el mejor caso: el spread solo (0,30 $) ya supera ese SL — el stop quedaría DENTRO del costo de entrada/salida normal. En la práctica: el stop se ejecuta con el primer respiro del spread (slippage incluido), y como el lote se calculó con un SL ficticio de 25 \"pips de forex\", el tamaño real queda multiplicado por 40 respecto al correcto (4 $ vs 0,10 $ de unidad). Resultado: riesgo real ≈ 40× el previsto o pérdida inmediata por spread. Moraleja: cada mercado recalcula SL por estructura ADR + lote por fórmula.\n2. Tamaño = 20 $ / 80 puntos = 0,25 contratos. Antes de confiar: verificar en la **especificación del contrato** de tu bróker el valor real del tick/punto, el tamaño del contrato, el margen exigido y los horarios — el valor \"1 $/punto\" era ilustrativo y en CFD de índices varía entre brókeres; calcular con el valor equivocado multiplica tu riesgo por el factor de error.\n3. Porque \"diversificar\" con 30 trades en 3 mercados no es estadística de ninguno (N ≥ 100 por sistema-mercado, Lección 1.4), y porque cada mercado exige su curva de aprendizaje local (sesiones, ADR, niveles). En formación, la profundidad en UN mercado produce la validación que la amplitud fragmentada nunca alcanza. La diversificación real de cartera llega en M8 — con correlaciones medidas, no con aburrimiento.\n\n</details>\n"},{"i":18,"g":"🧱 M2 · El Motor del Precio","t":"2.6 · Calendario macro e intermercados","f":"docs/02-modulos/mod-02-motor-del-precio/leccion-2-6.md","md":"# Lección 2.6 · Calendario macro e intermercados\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 45–60 min de estudio |\n| 🧱 Módulo | [M2 · El Motor del Precio](README.md) |\n| ⬅️ Anterior | [Lección 2.5 · Personalidad de cada mercado](leccion-2-5.md) |\n| ➡️ Siguiente | — (cierra el módulo; vuelve al [README](README.md) para laboratorio, misión y quiz) |\n\n---\n\n## Por qué importa\n\nHay días en que tu análisis, tu zona y tu setup importan menos que un número que se publica en Filadelfia a las 08:30. Los datos macro (empleo, inflación, decisiones de tasas) cambian en minutos las expectativas que sostienen TODOS los precios a la vez — y un trader que no mira el calendario es un conductor que cruza cruces sin mirar el semáforo: puede salir ileso diez veces y perderlo todo en la undécima. Esta lección te da las tres piezas: **qué** eventos mueven el mercado y cuándo salen (en tu hora), **cómo** se encadenan entre activos (la cadena causal que une tasas, DXY, oro, acciones y cripto), y **qué hacer** tú durante esos eventos — que, durante toda la formación, es la misma respuesta: no estar dentro.\n\n## Concepto\n\n**La cadena causal — el gráfico eléctrico del mundo.** El motor último de casi todo es la **tasa de interés** (el precio del dinero) y su expectativa:\n\n```mermaid\nflowchart TD\n    D[\"📊 Dato macro sale<br/>NFP · IPC · actividad · discurso\"] --> E[\"🧠 Cambian las expectativas<br/>¿tasas más altas o más bajas, por más tiempo?\"]\n    E --> T[\"📈 Rendimientos de los bonos<br/>la gravedad del dinero\"]\n    T --> DXY[\"💵 DXY — el dólar se aprecia o se deprecia\"]\n    DXY --> ORO[\"🥇 Oro<br/>típicamente INVERSO a DXY y a tasas reales\"]\n    DXY --> EUR[\"💶 EUR/USD<br/>inverso al DXY por construcción\"]\n    T --> ACC[\"🏢 Acciones<br/>descuento + financiamiento: presión inversa típica\"]\n    ACC --> CRY[\"🪙 Cripto<br/>activo de riesgo: típicamente directa al apetito\"]\n    E --> F[\"🗣️ FOMC — el evento que HABLA<br/>decisión 14:00 ET + rueda de prensa 14:30 ET\"]\n```\n\nUn dato de inflación más alta de lo esperado → el mercado espera tasas más altas por más tiempo → los rendimientos suben → el dólar se aprecia → el oro (que no paga interés y se cotiza en dólares) típicamente cae → las acciones (más caras de financiar, descuento a tasas mayores) típica presión a la baja → la cripto (activo de riesgo y liquidez) típicamente cae. La palabra operativa es **típicamente**: estas son correlaciones de régimen normal, no leyes físicas.\n\n**Los tres eventos que mueven la semana** (hora del Este de EE. UU.; durante el horario de verano del norte, la hora de Bolivia coincide con la del Este; en invierno boreal, +1 h — verifica cada semana):\n\n| Evento | Qué es | Cuándo | Hora de salida | Comportamiento típico |\n|---|---|---|---|---|\n| **NFP** (*Non-Farm Payrolls*) | Empleo no agrícola de EE. UU.: el termómetro de la economía más importante | Primer viernes del mes | 08:30 ET | Movimientos de decenas de pips en segundos *(ilustrativo)*; spread se multiplica; zigzag violento antes de definir dirección |\n| **IPC/CPI** (*Consumer Price Index*) | Inflación al consumidor: el dato que la Fed dijo que mira | Mensual, ~mediados de mes | 08:30 ET | Igual de violento que NFP; su sorpresa recalibra la ruta completa de tasas |\n| **FOMC** (decisión de la Fed) | Tasa de interés + comunicado + rueda de prensa de Powell | 8 veces al año (calendario oficial) | Decisión 14:00 ET · rueda de prensa 14:30 ET | Doble evento: el número y luego el matiz verbal; whipsaw clásico — el primer movimiento suele corregirse mientras se digiere el comunicado |\n\n**Intermercados — el mapa de correlaciones típicas** *(régimen normal, no leyes)*:\n\n| Par de activos | Correlación típica | Lógica |\n|---|---|---|\n| DXY ↔ oro | Inversa | El oro se cotiza en dólares: dólar fuerte = oro más caro para el resto del mundo |\n| Rendimientos bonos ↔ oro | Inversa | El oro no paga interés: tasas reales altas suben el costo de oportunidad de tenerlo |\n| DXY ↔ EUR/USD | Inversa (por construcción) | El EUR pesa ~58 % en el índice |\n| Tasas esperadas ↔ acciones | Inversa (típica) | Mayor tasa de descuento + costo de financiamiento = valoraciones bajo presión |\n| Apetito de riesgo ↔ cripto | Directa (típica) | La cripto opera como activo de riesgo/liquidez en regímenes normales |\n\n**Los dos avisos de honestidad que hacen profesional a esta lección:** (1) las correlaciones **cambian de signo por régimen** — en pánicos de liquidez \"todo se vende a la vez\" (oro y acciones caen juntos porque todos necesitan dólares/caja); (2) en ciertos regímenes, \"mala noticia económica = buenas noticias para acciones\" (si implica tasas antes/bajas). Por eso el programa usa el calendario para **protección** (no estar dentro) y para **contexto** (entender el día), jamás para adivinar el número.\n\n## Analogía\n\nEl mercado es una flota de barcos amarrados al mismo muelle — el muelle es la tasa de interés. Las amarras son las expectativas. Cada dato macro es un mar de fondo que levanta o baja el muelle entero: no importa cuán firme esté tu barco (tu análisis técnico de XAU/USD) — si el muelle sube, todos los barcos suben con él; si se hunde, todos bajan. El trader que ignora el calendario elige su barco mirando solo el casco, sin preguntarse qué hará el agua esta tarde. Y el FOMC es el almirante hablando por megafono a la flota entera: no solo importa QUÉ dice, importa CÓMO lo dice — por eso los piratas prudentes sacan las velas (cierran o reducen posición) mientras habla, en vez de apostar a adivinar la frase.\n\n## Cómo se hace: el protocolo de semana con eventos, paso a paso\n\n**Lunes, 10 minutos — armar el mapa de la semana:**\n\n1. Abre un calendario económico (cualquiera con filtros de impacto y conversión a tu huso).\n2. Filtra **alto impacto** para USD (y la moneda de tu par principal). Anota en tu journal: día, evento, **hora Bolivia**, consenso esperado.\n3. Marca en tu reloj de sesiones (laboratorio de este módulo) las ventanas rojas: **15 minutos antes y después** de cada evento de alto impacto — mínimo. Para FOMC: desde 30 min antes de la decisión hasta 30 min después de la rueda de prensa.\n\n**Protocolo de cada evento (la regla del programa):**\n\n```text\nREGLA MACRO DE FORMACIÓN — no negociable\n1. Sin posiciones abiertas dentro de la ventana roja del evento.\n2. Si hay posición: cerrarla o (solo si el plan de M8 lo permite y falta poco)\n   asegurar el SL y REDUCIR tamaño — nunca dejar tamaño completo con SL apretado.\n3. No se \"opera el dato\": no adivinas el número ni compras el primer spike.\n4. El spread en la ventana roja está multiplicado (de ~1,5 pips a 10–20\n   *(ilustrativo)*): entrar ahí es pagar ×10 el peaje con la visibilidad ×0.\n5. Después del evento: dejar pasar el zigzag de digestión y leer el gráfico\n   CON el dato ya dentro — el setup de post-evento llega con confirmación (M3.4).\n```\n\n**Ejemplo cerrado del costo de ignorar la regla** *(ilustrativo, mecánica real)*: posición long de 0,08 lotes en EUR/USD con SL de 25 pips = 20 $ de riesgo. NFP a las 08:30 Bolivia. El dato sorprende: el precio salta 60 pips en 40 segundos **sin tocar tu SL exacto** — el salto pasa por encima (gap intra-vela) y tu SL ejecuta con *slippage* a 38 pips: −30,4 $ en vez de −20 $ (1,5R por una posición de 1R). Dos minutos después el precio vuelve a tu entrada original: la pérdida no era necesaria — era la matrícula de no mirar el calendario. El mismo trade, cerrado el martes a las 08:15, habría tenido las mismas probabilidades sin el semáforo en rojo.\n\n## Error común\n\nEl primero: **operar el dato por adrenalina** — \"el NFP va a ser malo, vendo antes de que salga\". Ese trade tiene esperanza negativa estructural: el consenso ya está en el precio, la sorpresa es 50/50, el spread de la ventana te cobra ×10 y el zigzag posterior puede barrer ambas direcciones. Es la lotería con peaje. El segundo: **el \"ya pasó\" prematuro** — cerrar la ventana 30 segundos después del número: el FOMC tiene DOS eventos (decisión y rueda de prensa) y el post-NFP tiene reversión de digestión; la ventana cerrada tarde es la barata. El tercero, más sutil: **usar el intermercados como señal de trading** — \"el DXY sube, entonces vendo oro AHORA\". Las correlaciones típicas son contexto probabilístico, no gatillos: se usan para entender el día y para cuestionar tu setup (\"¿mi long de oro tiene sentido si los rendimientos están subiendo con fuerza?\"), nunca como sistema en sí mismo. La regla que ata todo: en formación, el calendario solo autoriza dos acciones — **alejarte del mercado** y **explicarte lo que ya pasó**.\n\n## Conexión cuantitativa\n\nLos eventos macro atacan los tres términos de $E$ a la vez. **$L$:** el slippage intra-vela puede convertir 1R en 1,3R–1,5R — tu pérdida media deja de ser la presupuestada. **Costos:** el spread de ventana multiplica el peaje (Lección 2.1) justo cuando tu visibilidad es mínima. **$P_w$:** el zigzag de digestión convierte la dirección \"correcta\" en moneda al aire en el minuto 2 — tu acierto deja de depender del análisis. Sumadas: operar ventanas rojas es operar con $E$ confiscado. En cambio, la semana con calendario revisado protege la distribución completa de resultados por cero costo: es la única mejora de $E$ del programa que se consigue **sin operar**. Cuando en M8 construyas los frenos en cascada, la ventana macro será un freno automático más; cuando en M9 audites tu journal, verás cuántas de tus peores operaciones nacieron en una ventana roja que no miraste.\n\n---\n\n## 🎯 Puntos clave\n\n1. La cadena causal: dato → expectativas de tasas → rendimientos → DXY → oro/acciones/cripto. \"Típicamente\", no siempre: las correlaciones cambian por régimen.\n2. Los tres eventos que mueven la semana: NFP (primer viernes, 08:30 ET), IPC (~mediados de mes, 08:30 ET), FOMC (8 al año, 14:00 ET + rueda 14:30 ET). En verano del norte, hora del Este = hora de Bolivia.\n3. La regla macro de formación: sin posiciones en la ventana roja (15 min antes/después; FOMC: 30/30 con rueda incluida).\n4. Nunca se opera el dato: consenso ya en precio, sorpresa 50/50, spread ×10, zigzag de digestión.\n5. El intermercados es contexto, no señal: explica y cuestiona setups; no dispara entradas.\n6. La revisión del calendario es la única mejora de $E$ del programa que se logra sin operar — 10 minutos de lunes protegen la semana.\n\n## 🔄 Autoevaluación rápida\n\n1. El IPC de EE. UU. sale muy por encima del consenso. Recorre la cadena causal completa y nombra el efecto típico en: rendimientos, DXY, oro, EUR/USD y acciones. ¿Qué palabra califica todo ese pronóstico y por qué?\n2. Tienes un long de oro con +15 pips \"de seguridad\" (SL a −20) y a las 08:25 Bolivia sale el NFP. ¿Qué ordena la regla macro del programa y qué riesgo corre tu SL exacto durante el evento?\n3. Tu amigo operó el FOMC \"y le fue bien: adivinó la dirección\". ¿Qué le responderías con la lógica de esperanza (no con la moralina)?\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. IPC > consenso → expectativa de tasas más altas/más tiempo altas → rendimientos de bonos suben → DXY se aprecia → oro típicamente cae (no paga interés, más caro en dólares), EUR/USD típicamente cae (dólar fuerte), acciones con presión a la baja (descuento y financiamiento). Todo el pronóstico se califica con **típicamente**: en regímenes anómalos (pánico de liquidez, Fedhawk invertida) los signos pueden cambiar — por eso es contexto de protección, no sistema de señales.\n2. La regla ordena: cerrar la posición antes de la ventana (15 min antes = 08:15) o, si el plan lo permite, asegurar SL y reducir tamaño — con posición de +15 pips lo limpio es salir y dejar el evento pasar. Riesgo del SL exacto durante NFP: el precio puede saltar en gap intra-vela SIN ejecutar en tu nivel exacto (slippage de 5–15 pips) → pérdida de 1,5R o más; y el spread de ventana hace que el \"SL de 20\" se dispare peor en la ejecución. La protección del SL no es absoluta en saltos: solo el no-estar-dentro lo es.\n3. Que su resultado es una observación de varianza, no una estrategia: con sorpresa 50/50, spread ×10 y zigzag post-dato, la $E$ de operar el dato es negativa ANTES de su suerte; una muestra de 1 (o de 20) no estima nada (N ≥ 100, Lección 1.4). Con suficientes amigos operando FOMC, siempre habrá alguno que lo adivine 3 veces seguidas (igual que el bot de la Lección 1.4): es fotografía del ganador, no evidencia de esperanza. Y el día que su suerte se agote, operará el dato con el mismo convencimiento y el doble de tamaño — el final clásico de la estrategia sin E.\n\n</details>\n"},{"i":19,"g":"🧱 M3 · Anatomía del Gráfico","t":"M3 · Hub del módulo","f":"docs/02-modulos/mod-03-anatomia-del-grafico/README.md","md":"# Módulo 3 · Anatomía del Gráfico\n\n> [!WARNING]\n> **Contenido educativo.** La mayoría de los traders minoristas pierde dinero (estudios de reguladores estiman entre 70 % y 90 %). Nada en este repositorio constituye asesoría financiera.\n\n| Campo | Detalle |\n|---|---|\n| 🧱 Nivel | 1 · Fundamentos |\n| 📦 Módulo | 3 de 12 (FIT-12) |\n| 🔬 Trazabilidad | 003 · M2.1–2.6 · 004 · M1.5, M3.3–3.4 · **Aporte propio:** catálogo de patrones con fiabilidad evidenciada y protocolo de confirmación unificado |\n| ⏱️ Duración estimada | 4,5 h de teoría + 4–6 h de laboratorio/misión/quiz |\n| 📋 Estado | 🟢 Publicado (Sprint 3) |\n\n---\n\n## 🎯 Objetivo del Módulo\n\nLeer el **gráfico desnudo** — velas, ciclos, zonas, confirmaciones y régimen — sin indicadores todavía: primero el precio. Al terminar este módulo descompondrás cualquier vela en cuerpo/mechas/cierre y sabrás qué subasta la produjo (M3.1), ubicarás el mercado en su ciclo de 4 fases (M3.2), marcarás zonas — no líneas — con gradiente de fortaleza honesto (M3.3), ejecutarás el protocolo de confirmación en 3 pasos que filtra la mayoría de los falsos rompimientos (M3.4), reconocerás los patrones elementales como firmas de procesos y no como oráculos (M3.5), y clasificarás el régimen — tendencia, rango o transición — ANTES de buscar setup, entendiendo por qué la mayoría del tiempo la respuesta correcta es observar (M3.6). Este módulo existe porque el M5 te enseñará la estructura institucional sobre estas mismas bases: quien no lee el precio desnudo no puede auditar lo que encima se dibuja.\n\n## 📚 Lecciones\n\n| # | Lección | Esencia | Tiempo |\n|---|---|---|---|\n| 3.1 | [Velas japonesas](leccion-3-1.md) | OHLC, cuerpo vs mechas, el cierre como veredicto; fractalidad literal (cada vela contiene un gráfico); lectura en 4 preguntas; Dojima y Homma | 40–50 min |\n| 3.2 | [Los 4 ciclos del mercado](leccion-3-2.md) | Acumulación → markup → distribución → markdown; Dow (impulso+pullback, HH/HL); Weinstein Stages; clasificar el ciclo en 3 preguntas | 40–50 min |\n| 3.3 | [Soportes y resistencias](leccion-3-3.md) | Zonas, no líneas; estáticos/diagonales/dinámicos; memoria de mercado y polaridad; gradiente de fortaleza (muchos toques CONSUMEN); protocolo de marcado | 45–60 min |\n| 3.4 | [Confirmación en 3 pasos](leccion-3-4.md) | Ruptura → cierre fuera → retesteo que se sostiene; pullback/throwback; el falso rompimiento como mecanismo; caso con R:B 3,1 y lote calculado | 45–60 min |\n| 3.5 | [Patrones elementales](leccion-3-5.md) | Vela (envolvente, martillo, estrella, doji) y figura (doble techo/suelo, triángulo, cuña, bandera) como firmas de procesos; checklist de 5 preguntas; fiabilidad honesta | 45–60 min |\n| 3.6 | [Rangos vs tendencias](leccion-3-6.md) | Régimen como permiso operativo; ~70 % del tiempo en rango *(aproximación)*; el whipsaw como mecanismo de cobro; test de 3 marcas; transición = operativa cero | 40–50 min |\n\n> [!TIP]\n> **Cómo estudiar este módulo:** dile a tu agente *\"Siguiente lección\"* y sigue el protocolo de sesión de estudio (§ 5.3 de `agents.md`). Este módulo es el más visual del N1: cada lección pide abrir TradingView (o equivalente) y VER lo que se describe — el gráfico es el libro de ejercicios.\n>\n> **Puente con la [Receta de tu Primera Operación](../../03-recursos/laboratorio/receta-primera-operacion.md):** con M3 completado, el Paso 3 de la receta (análisis mínima: régimen + zonas + dirección) ya tiene todo su método. Los pasos 4–11 siguen esperando al Módulo 4.\n\n## 🧪 Laboratorio · Ciclos y Zonas en 10 Gráficos\n\n**Materiales:** TradingView (o plataforma equivalente) con **Bar Replay** (reproducción histórica) — el M4.1 lo formalizará; aquí solo lo usas como máquina del tiempo. 5 instrumentos: tu par principal (EUR/USD), XAU/USD, un índice (US30/US100), y 2 más a elección (otro major, otro índice).\n\n**Procedimiento paso a paso:**\n\n1. **Elige 10 episodios históricos** (2 por instrumento) en D1/H4: elige tramos con giro claro (una expansión tras rango, una reversión tras tendencia) — con Bar Replay retrocede hasta ANTES del giro, en un punto donde el futuro no sea visible.\n2. **Por episodio, clasifica el ciclo** (M3.2, test de 3 preguntas): ¿acumulación, markup, distribución o markdown? Anótalo ANTES de avanzar el replay.\n3. **Marca 2–4 zonas por episodio** (protocolo M3.3: extremos de swing, orígenes de expansión, rectángulos con cuerpo, solo H4/D1) y gradúalas (fresca/consumida, origen expansivo o no).\n4. **Avanza el replay vela a vela** y anota: ¿el precio respetó, retesteó o rompió cada zona? ¿Hubo confirmación en 3 pasos en las roturas? ¿Apareció el whipsaw?\n5. **Audítate:** de tus 20–40 zonas marcadas, ¿qué porcentaje respetó tu marcado? ¿Dónde fallaste: extremo vs cuerpo, marco mezclado, o zona-consumida tratada como fresca?\n\n**Entregable:** capturas de los 10 episodios con tus anotaciones + el mini-informe de autoauditoría, guardados en `journal/laboratorio-m3.md`. La honestidad del informe vale más que el porcentaje de acierto: el error identificado es la técnica adquirida.\n\n## 🎯 Misión\n\n> [!IMPORTANT] Misión M-3 · Bitácora de 20 Niveles\n> **Objetivo:** construir tu primera base de datos personal de zonas: 20 niveles reales anotados ANTES de conocer su desenlace, con el resultado posterior documentado — el primer contacto con la estadística visual propia.\n> **Entregable:** `journal/bitacora-niveles-m3.md` con la tabla de 20 niveles (formato abajo) + un análisis final (¿qué tipo de zona respetó más: fresca o visitada? ¿con origen expansivo o sin él? ¿en qué marco?).\n> **Criterio de aceptación:** 20 filas completas con: fecha de marcado, instrumento, marco, tipo (soporte/resistencia), coordenadas de la zona (borde superior e inferior), clasificación de fortaleza (gradiente M3.3), régimen del día (M3.6), y resultado posterior (respetado / retesteado y roto / barrida y revertido) verificado en el gráfico.\n> **Etiqueta en journal:** `mision-3-bitacora` · **Tiempo estimado:** 20 niveles × 15–20 min de seguimiento, repartidos en 2–3 semanas de mercado real (o acelerado con Bar Replay si el calendario aprieta).\n> **Regla de oro:** el nivel se anota ANTES del desenlace. Ajustar la zona después de ver dónde giró el precio es curvar la regla tras medir — invalida la fila y, si se repite, la misión entera.\n\n**Formato de fila (copiar en la bitácora):**\n\n```text\n#N — fecha_marcado — instrumento — marco — tipo (S/R)\nZona: [borde_sup – borde_inf] — fortaleza: [fresca/consumida · origen: expansivo/ruido · confluencias]\nRégimen al marcar: [tendencia/rango/transición — test de 3 marcas]\nResultado (a completar después): [respetado / retesteado y roto / barrida y revertido] — fecha_resolución\nNota (1 línea): qué aprendió este nivel sobre tu marcado\n```\n\n## ✅ Evaluación / Criterio de Graduación\n\n- **Laboratorio entregado:** 10 episodios clasificados con zonas marcadas y autoauditoría honesta.\n- **Misión M-3 completa:** 20 niveles anotados antes del desenlace + análisis final por clasificación de zona.\n- **Análisis en vivo:** un gráfico actual (tu instrumento principal, H4/D1) leído con el agente siguiendo la rúbrica: ciclo (3 preguntas), 2–4 zonas con gradiente, régimen (test de 3 marcas) y — si existe — el estado de cualquier rotura según el protocolo de 3 pasos.\n- **Quiz de graduación:** ≥ 8/10.\n- Al aprobar todo: el módulo queda marcado ✅ en el README raíz y se abre el [Módulo 4 · Plataforma y Primera Ejecución](../mod-04-plataforma-y-primera-ejecucion/README.md) — donde la [Receta de tu Primera Operación](../../03-recursos/laboratorio/receta-primera-operacion.md) ejecuta sus pasos 3–11 y cierra el nivel con el [Examen N1](../../03-recursos/evaluaciones/examen-n1.md).\n\n## 📝 Quiz de Graduación\n\n1. Descompón una vela en sus dos componentes y di qué mide cada uno. ¿Cuál de los cuatro precios (OHLC) es el veredicto del período y por qué el programa evalúa confirmaciones sobre él?\n2. Nombra los 4 ciclos en orden y describe en una frase cada uno. ¿En qué fase compra en fragmentos el institucional sin mover el precio?\n3. ¿Qué secuencia de máximos/mínimos define una tendencia alcista sana según Dow, y qué evento marca su muerte?\n4. ¿Por qué el programa marca ZONAS y no líneas? Da las dos razones (macroestructura de las órdenes + qué implica en la práctica del marcado).\n5. Una zona acumula 7 toques recientes. ¿Más fuerte o más débil? ¿Por qué, con la lógica de órdenes pendientes (M2.2)?\n6. Enuncia el protocolo de confirmación en 3 pasos completo. ¿Qué fenómeno de la Lección 2.3 es el que el paso 2 (cierre fuera) filtra?\n7. ¿Qué es la polaridad y por qué el retesteo de un nivel confirmado es la entrada con mejor estadística del protocolo?\n8. ¿Qué es un falso rompimiento, qué proceso del mercado lo genera (no es mala suerte), y cuál es la única conducta permitida ante él durante la formación?\n9. Aplica el test de 3 marcas al caso: \"US30 lleva 9 sesiones solapadas entre dos bordes; las roturas intra-vela vuelven siempre; cuerpos pequeños alternados\". ¿Clasificación y qué se prohíbe en ese régimen?\n10. ¿Qué es el whipsaw, a quién cobra y qué dos reglas del programa lo neutralizan?\n\n<details>\n<summary>Ver clave de respuestas</summary>\n\n1. **Cuerpo** (apertura→cierre): quién ganó la subasta del período y con cuánta determinación. **Mechas** (cuerpo→extremos): dónde fue rechazada la urgencia. El **Close** es el veredicto: es el último acuerdo con toda la información del período; un toque intra-vela puede ser una barrida que se revierte, mientras el cierre implica que la urgencia sobrevivió al período entero — evaluar en cierres filtra falsos rompimientos.\n2. **Acumulación** (los grandes compran en fragmentos en un rango post-caída, sin mover el precio) → **markup** (la oferta local se consumió y el precio expande con cuerpo pleno) → **distribución** (los grandes venden su inventario al retail eufórico en un rango alto) → **markdown** (inventario vendido, urgencia de miedo, caída rápida). Compran sin mover el precio en la **acumulación**.\n3. Tendencia alcista sana: **máximos y mínimos ascendentes sucesivos (HH/HL)** con impulsos y pullbacks que respetan la estructura. Muere cuando la secuencia se rompe — el precio falla en hacer HH y hace un LL (mínimo más bajo) con cierre decidido: ruptura de estructura.\n4. (a) Macroestructura: los grandes fragmentan y ningún nivel reacciona en un precio exacto — el interés vive en un área con cuerpo; una línea de píxel es falsa precisión. (b) Práctica: marcar rectángulos define dónde entra, dónde muere la idea (SL tras el cuerpo) y dónde está el objetivo (borde de la zona opuesta) — la línea no permite ninguno de los tres cálculos.\n5. **Más débil.** Cada reacción consume órdenes pendientes: los que querían comprar/vender en la zona ya lo hicieron. A la séptima visita el almacén está casi vacío — la zona tiene fama pero poca munición real, y es hábitat clásico de barrida final.\n6. **Ruptura** (el precio atraviesa el nivel) → **cierre fuera** (la vela del marco cierra decididamente más allá) → **confirmación** (retesteo del nivel roto que se sostiene, con reacción del lado nuevo). El paso 2 filtra la **barrida de stops/liquidez** (Lección 2.3): la rotura momentánea que detona órdenes y vuelve — el cierre fuera implica que la urgencia sobrevivió al período.\n7. Polaridad: el nivel roto y confirmado **cambia de bando** (resistencia rota → soporte; soporte roto → resistencia). El retesteo es la entrada con mejor estadística porque (a) el filtro del cierre ya está descontado, (b) hay documentación del nuevo bando (compradores que esperaban el retesteo + cubrimiento de atrapados), y (c) el SL va tras la estructura del retesteo, no en el depósito obvio de stops.\n8. Falso rompimiento: rotura que no logra cierre decidido fuera (o vuelve con fuerza tras lograrlo) y gira. Lo genera el **mecanismo de recolección de liquidez**: detrás de todo nivel obvio hay stops y entradas del retail, y atravesarlo unas velas los detona (M2.3). Conducta en formación: dejar que el protocolo te filtre a TI (no operar roturas sin los 3 pasos) — operar el falso como setup del lado contrario llega después, con criterio y estadística propia.\n9. Test: estructura sin progresión (solapamiento) ✓ · recorridos que vuelven al corredor ✓ · cuerpos pequeños alternados ✓ → **rango confirmado** (3/3). Prohibido: anticipar roturas de los bordes; el centro del rango es tierra de nadie; lo operable es solo el rechazo confirmado en bordes (y suspender la lógica si un borde rompe con cierre H4 fuera: el régimen puede estar cambiando).\n10. Whipsaw: el vaivén de roturas falsas de rango que cobra 1R a cada comprador de rompimiento (atracción de tardíos + barrida + retorno, repetido). Lo neutralizan: (1) clasificar el régimen ANTES de buscar setups — en rango, las roturas anticipadas no existen como setup; (2) operar roturas solo con el protocolo de 3 pasos (cierre fuera + retesteo sostenido), dejando que el filtro rechace las primeras roturas.\n\n</details>\n\n## 📖 Glosario del Módulo\n\n| Término | Inglés | Definición |\n|---|---|---|\n| OHLC | *open/high/low/close* | Los cuatro precios de una vela: apertura, máximo, mínimo, cierre |\n| Cuerpo | *candle body* | Distancia apertura-cierre; mide la determinación del bando ganador |\n| Mecha | *wick/shadow* | Extensión del cuerpo al máximo/mínimo; mide el viaje rechazado |\n| Doji | *doji* | Vela con apertura ≈ cierre; empate de la subasta, pausa — nunca señal de dirección |\n| Martillo | *hammer* | Mecha inferior ≥ 2× cuerpo; venta absorbida abajo — señal solo EN contexto de zona |\n| Envolvente | *engulfing* | Vela que envuelve el cuerpo de la anterior en sentido contrario; reemplazo de bando |\n| Ciclo | *market cycle* | Acumulación → markup → distribución → markdown; el mapa de fases de todo mercado |\n| Impulso | *impulse* | Pierna de expansión en la dirección dominante con energía |\n| Pullback | *pullback* | Retroceso de una tendencia que respeta la estructura; andén de continuación |\n| Throwback | *throwback* | Retorno al origen de una rotura para retestear antes de continuar |\n| HH/HL | *higher high / higher low* | Secuencia de máximos y mínimos ascendentes: firma de tendencia alcista sana |\n| LL/LH | *lower low / lower high* | Secuencia descendente: firma de tendencia bajista |\n| Soporte/Resistencia | *support/resistance* | Zona con interés comprador/vendedor pendiente capaz de detener o invertir |\n| Zona | *zone* | Área (rectángulo con cuerpo) donde el precio reaccionó — la forma correcta de marcar niveles |\n| Polaridad | *polarity* | El nivel roto y confirmado cambia de bando: soporte↔resistencia |\n| Retesteo | *retest* | Vuelta del precio a un nivel roto para probarlo antes de continuar; paso 3 del protocolo |\n| Falso rompimiento | *false breakout* | Rotura sin cierre decidido fuera (o revertida tras lograrlo); mecanismo de recolección de liquidez |\n| Cuello | *neckline* | Línea de decisión de una figura (valle del doble techo); su rotura confirmada activa el patrón |\n| Régimen | *market regime* | Estado estructural: tendencia, rango o transición; el permiso operativo de cada sistema |\n| Transición | *transition* | Régimen mezclado (señales de dos estados); protocolo: operativa reducida o cero |\n| Whipsaw | *whipsaw* | Vaivén de roturas falsas de rango que cobra 1R por intento a los impacientes |\n| Bar Replay | *bar replay* | Reproducción vela a vela del histórico para practicar sin ver el futuro |\n\n## 🔗 Referencias\n\n- [SYLLABUS.md § 5 — N1, Módulo 3](../../01-syllabus/SYLLABUS.md)\n- [analisis_cursos.md](../../00-analisis/analisis_cursos.md) — aporte propio del módulo: catálogo de patrones con fiabilidad evidenciada\n- [La Receta de tu Primera Operación](../../03-recursos/laboratorio/receta-primera-operacion.md) — su Paso 3 (análisis mínima) se completa con este módulo\n- [Módulo 2 · El Motor del Precio](../mod-02-motor-del-precio/README.md) — anterior\n- [Módulo 4 · Plataforma y Primera Ejecución](../mod-04-plataforma-y-primera-ejecucion/README.md) — siguiente (cierra el N1 con el [Examen N1](../../03-recursos/evaluaciones/examen-n1.md); el N2 arranca con M5 en el Sprint 5)\n"},{"i":20,"g":"🧱 M3 · Anatomía del Gráfico","t":"3.1 · Velas japonesas","f":"docs/02-modulos/mod-03-anatomia-del-grafico/leccion-3-1.md","md":"# Lección 3.1 · Velas japonesas\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 40–50 min de estudio |\n| 🧱 Módulo | [M3 · Anatomía del Gráfico](README.md) |\n| ⬅️ Anterior | — (primera lección del módulo) |\n| ➡️ Siguiente | [Lección 3.2 · Los 4 ciclos del mercado](leccion-3-2.md) |\n\n---\n\n## Por qué importa\n\nEl gráfico de velas es el alfabeto del trader: toda la técnica posterior — ciclos, zonas, patrones, estructura (M5) — se escribe con estas letras. Leerlas mal produce los dos errores fundacionales del principiante: ver \"señales\" en velas sueltas sin contexto, y no entender que una vela NO es un instante sino un **resumen de una subasta completa**. Una vela diaria es la fotografía comprimida de 24 horas de órdenes; saber qué comprime — cuerpo, mechas, posición del cierre — es lo que convierte un dibujo bonito en información operativa. Y hay una promesa que esta lección cumple mejor que cualquier otra: después de ella, tu gráfico desnudo (sin indicadores) empezará a hablarte.\n\n## Concepto\n\n**Anatomía.** Cada vela resume cuatro precios de su período: **OHLC** — *Open* (apertura), *High* (máximo), *Low* (mínimo), *Close* (cierre). De ahí salen sus dos componentes:\n\n- **Cuerpo:** de la apertura al cierre. Mide **quién ganó la subasta** del período: cuerpo alcista (verde/hueco) = el cierre quedó arriba de la apertura; cuerpo bajista (rojo/lleno) = al revés. El tamaño del cuerpo mide la **determinación**: cuerpo grande = un bando dominó todo el período; cuerpo pequeño = equilibrio.\n- **Mechas** (o sombras): del cuerpo al máximo y al mínimo. Miden **el viaje rechazado**: dónde la urgencia de un bando fue a buscar precio y fue devuelta. Mecha inferior larga = los vendedores empujaron abajo y los compradores los devoraron (la compra agresiva devolvió el precio); mecha superior larga = el espejo. La mecha es la cicatriz del rechazo.\n\n**El cierre es el precio más importante de los cuatro.** Es el veredicto final del período: el último acuerdo con toda la información disponible. Por eso casi todos los niveles y confirmaciones del programa se evalúan en **cierres**, no en toques intra-vela (un toque del nivel que luego cierra dentro puede ser una barrida, Lección 2.3; un cierre fuera del nivel es un acuerdo del mercado entero).\n\n**Fractalidad real.** El mercado es fractal y las velas lo demuestran con matemática literal: **cada vela contiene a su vez un gráfico completo**. Abre la vela diaria de ayer en H1 y tendrás 24 velas con su propia historia de subasta; la vela H1 se abre en M15 y hay otras 4 dentro; y así hasta los segundos. Esto tiene una consecuencia operativa dura que ya conoces de la [Lección 1.4](../mod-01-negocio-trading/leccion-1-4.md): el patrón \"encajona\" pero el ruido y los costos **no se encajonan proporcionalmente** — la misma formación visual paga peajes relativos mayores cuanto más bajo el marco. Las velas te dejan ver lo mismo en todas las escalas; la estadística te dice en cuáles conviene operar.\n\n**Historia mínima** (contexto, no adorno): las velas nacieron en el Japón del siglo XVIII para arroz en el mercado de Dojima (Osaka) — considerado el primer mercado de futuros organizado del mundo. Munehisa Homma, comerciante de arroz de Sakata, sistematizó la lectura de patrones de precio y sentimiento; su manual es el ancestro directo de lo que haces tú hoy con EUR/USD. La tradición llegó a Occidente con Steve Nison (1991). La lección de fondo: el análisis de precio lleva 300 años funcionando sobre el mismo motor — la subasta que estudiaste en M2.\n\n**Visual — el método de lectura en 4 preguntas (siempre en este orden):**\n\n```mermaid\nflowchart TD\n    V[\"🕯️ La vela delante de ti\"] --> Q1{\"1 · ¿Qué tamaño tiene el cuerpo?<br/>→ quién ganó la subasta y con cuánta determinación\"}\n    Q1 --> Q2{\"2 · ¿Dónde están las mechas y cuánto miden?<br/>→ dónde fue rechazada la urgencia\"}\n    Q2 --> Q3{\"3 · ¿Dónde quedó el cierre dentro del rango?<br/>→ cerca del extremo = veredicto claro<br/>en el medio = indecisión\"}\n    Q3 --> Q4{\"4 · ¿Qué hay AROUND la vela?<br/>zona · ciclo · sesión · evento macro\"}\n    Q4 --> R[\"✅ Lectura completa:<br/>la vela EN contexto — nunca la vela sola\"]\n    R -.-> A[\"⚠️ El contexto va último en el orden de lectura<br/>y PRIMERO en la decisión\"]\n```\n\n## Analogía\n\nCada vela es el **acta de un partido** comprimida en una línea. El cuerpo es el marcador final (quién ganó y por cuánto); las mechas son los momentos en que el perdedor estuvo ganando y el público se levantó de la silla antes de que el resultado volviera a su cauce. Una vela con cuerpo enorme y mechas mínimas: partido aplastante, dominio de principio a fin. Una vela doji (apertura ≈ cierre, cuerpo casi nulo): empate con prórroga — la subasta quedó en tablas y el veredicto se posterga al siguiente período. Y como en el fútbol, **el acta sin contexto no dice nada**: un 2-1 puede ser un triunfo cómodo, una remontada heroica o un partido aburrido decidido en el descuento. La misma vela alcista es \"confirmación\" en un nivel de demanda con expansión y \"nada\" a mitad de rango sin energía. Primero el contexto (ciclos, zonas — esta lección y las siguientes), después la vela: nunca al revés.\n\n## Cómo se hace: leer una vela en 4 preguntas, con el día real descompuesto\n\nEl método del programa para leer CUALQUIER vela, en orden fijo:\n\n1. **¿Qué color/tamaño tiene el cuerpo?** → quién ganó el período y con cuánta determinación.\n2. **¿Dónde están las mechas y cuánto miden respecto al cuerpo?** → dónde fue rechazada la urgencia. Mechas en la parte inferior = reacción compradora abajo (protección de demanda); arriba = reacción vendedora.\n3. **¿Dónde quedó el cierre dentro del rango?** → cerca del extremo = veredicto claro; en el medio = indecisión (el cierre es el 60 % de la lectura).\n4. **¿Qué hay AROUND la vela?** (nivel, tendencia, sesión, evento) → el contexto que decide si la vela significa algo.\n\n**Descomposición con números cerrados.** Vela diaria de XAU/USD: Open 4 000,0 · High 4 024,0 · Low 3 994,0 · Close 4 020,0. Cuerpo: 4 020 − 4 000 = **+20 $** (alcista, determinación media-alta). Mecha superior: 4 024 − 4 020 = 4 $ (rechazo leve arriba). Mecha inferior: 4 000 − 3 994 = **6 $** (rechazo abajo). Cierre a 26/30 del rango (cerca del máximo): veredicto comprador claro. Lectura completa: el día abrió, los vendedores probaron 3 994 y fueron absorbidos (mecha inferior 6 $), el precio expandió al alza y **cerró pegado al máximo**: los compradores aún tenían urgencia al cierre — la subasta no se descargó dentro del día. Para el sesgo del día siguiente, esa vela pesa más que tres señales de indicador; y si además cerró sobre una zona de demanda H4 marcada (Lección 3.3), las preguntas del análisis diario de tu [receta](../../03-recursos/laboratorio/receta-primera-operacion.md) ya tienen respuesta: régimen + zona + dirección.\n\n**El ejercicio fractal (hazlo, no lo leas):** abre la misma vela diaria en M15. Mira cómo el \"cuerpo\" se desarma en horas de compra, un tramo de mecha inferior se vuelve la caída de las 09:30 (¿un dato? — revisa tu calendario de M2), y el cierre pegado al máximo es la sesión de Nueva York acumulando. La vela D1 es la sinopsis; las velas internas son la película.\n\n## Error común\n\nEl error rey: **la vela aislada como señal** — \"martillo = compro\". Un martillo (mecha inferior larga, cuerpo pequeño arriba) en una zona de demanda H4 después de una expansión bajista que se agota: tiene sentido probabilístico (rechazo documentado donde había compradores esperando). El mismo martillo en medio de un rango, sin zonas cerca, en sesión muerta: es ruido con forma bonita. La regla del programa: **nunca se opera una vela; se opera una vela EN un contexto**. El segundo error: olvidar que la vela cierra cuando cierra — operar \"el momento\" intra-vela (ver el precio tocar un nivel y anticipar el cierre) es apostar al resultado de una subasta en curso; las confirmaciones del programa trabajan en cierres (Lección 3.4). El tercero, herencia de M1: saltar a M1/velas de 5 minutos a \"ver mejor la entrada\" — el micro-marco muestra más velas y más ruido; tu marco de análisis (H4/D1 en esta formación) es una decisión tomada, no un capricho de zoom.\n\n## Conexión cuantitativa\n\nLas velas alimentan directamente tu ecuación vía $P_w$: leer bien cuerpo/mechas/cierre en contexto es lo que separa entradas con confirmación de entradas por antojo — y cada entrada confirmada frente a anticipada es, estadísticamente, menos barridas sufridas (Lección 2.3) y menos falsos arranques pagados. Además, la vela te da la **estructura de invalidación**: tu SL va tras el extremo de la vela de reacción (bajo la mecha inferior de un martillo en demanda, con margen), no tras un número redondo — SL que muere donde tu idea muere, calculado con la fórmula del Paso 5 de la receta. Y el tamaño del rango de la vela (High − Low) es la semilla de la noción de volatilidad por período que usarás como ADR (Lección 3.6 y M8): la vela que lees es también el dato que dimensiona.\n\n---\n\n## 🎯 Puntos clave\n\n1. Toda vela resume OHLC: el **cuerpo** mide quién ganó la subasta del período; las **mechas**, dónde fue rechazada la urgencia.\n2. El **cierre** es el veredicto del período: las confirmaciones del programa se evalúan en cierres, no en toques.\n3. Fractalidad literal: cada vela contiene un gráfico completo de marco menor — pero el ruido y los costos relativos crecen al bajar (Lección 1.4): el marco de análisis H4/D1 ya está decidido.\n4. Lectura en 4 preguntas: cuerpo → mechas → posición del cierre → contexto alrededor. El contexto va último en el orden de lectura y primero en la decisión.\n5. Nunca se opera una vela suelta: la misma formación es señal en una zona y ruido en el vacío.\n6. Historia: Dojima y Homma (siglo XVIII) — el análisis de precio opera sobre el mismo motor desde hace 300 años.\n\n## 🔄 Autoevaluación rápida\n\n1. Vela: Open 1,0850 · High 1,0855 · Low 1,0820 · Close 1,0823 en EUR/USD. Descompón cuerpo, mechas, veredicto del cierre y qué te dice sobre el día.\n2. ¿Por qué el programa evalúa rupturas y confirmaciones en el CIERRE de la vela y no en el toque del nivel? Conéctalo con la Lección 2.3.\n3. Tu compañero opera \"martillos\" en velas de 5 minutos sin mirar nada más. Nombra los tres problemas de su método con lo que sabes hasta aquí.\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Cuerpo: 1,0823 − 1,0850 = **−27 pips** (bajista, determinación alta). Mecha superior: 1,0855 − 1,0850 = 5 pips (rechazo leve arriba). Mecha inferior: 1,0823 − 1,0820 = 3 pips (casi nula). Cierre a 3/35 del rango = pegado al mínimo: veredicto vendedor claro, la urgencia bajista NO se descargó en el día (cerró en el extremo). Sesgo operativo: presión vendedora vigente al cierre — buscar largos \"porque ya cayó mucho\" sería pelear contra el veredicto; el precio aspira a la siguiente zona de demanda por debajo.\n2. Porque el toque intra-vela puede ser una **barrida de liquidez** (Lección 2.3): la rotura momentánea detona stops y vuelve. El cierre, en cambio, es el acuerdo final de la subasta completa: un cierre fuera del nivel implica que la urgencia superó al nivel Y sobrevivió al período. Evaluar en cierres filtra exactamente los falsos rompimientos que el retail paga; el detalle de ruptura → cierre fuera → confirmación es la Lección 3.4.\n3. (a) Sin contexto: una vela no es señal; el mismo martillo es probable en demanda y ruido en el vacío — su $P_w$ no existe sin el \"dónde\". (b) Marco de 5 minutos: maximiza el impuesto del ruido y del spread relativo (Lección 1.4/2.1) — su ganancia típica por operación es la más pequeña frente a un costo fijo constante. (c) Sin invalidación estructural ni estadística: vela a vela sin journal ni N ≥ 100, su \"funciona\" es la memoria de los aciertos — la varianza hablando, no el sistema.\n\n</details>\n"},{"i":21,"g":"🧱 M3 · Anatomía del Gráfico","t":"3.2 · Los 4 ciclos del mercado","f":"docs/02-modulos/mod-03-anatomia-del-grafico/leccion-3-2.md","md":"# Lección 3.2 · Los 4 ciclos del mercado\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 40–50 min de estudio |\n| 🧱 Módulo | [M3 · Anatomía del Gráfico](README.md) |\n| ⬅️ Anterior | [Lección 3.1 · Velas japonesas](leccion-3-1.md) |\n| ➡️ Siguiente | [Lección 3.3 · Soportes y resistencias](leccion-3-3.md) |\n\n---\n\n## Por qué importa\n\n\"¿Por dónde empiezo a mirar un gráfico?\" es la pregunta operativa más frecuente del principiante, y la respuesta profesional no es un indicador: es **ubicar el mercado en su ciclo**. Todo mercado financiero — desde el arroz de Dojima hasta el NAS100 — recorre los mismos cuatro estados: acumula, expande, distribuye, colapsa. Saber en cuál estás cambia absolutamente todo: qué setups existen hoy, qué lado tiene la urgencia (M2.2), cuánto dura la prórroga para entrar y — sobre todo — **cuándo la respuesta correcta es no operar**. Esta lección te da el mapa de vuelo del gráfico; sin él, cada vela es un aviso de excursión; con él, sabes si estás despegando, crucero, turbulencia o aterrizaje.\n\n## Concepto\n\n**Los cuatro ciclos** (la secuencia se repite en todos los marcos y en todos los mercados):\n\n1. **Acumulación** (*accumulation*): rango lateral tras una caída. Los grandes compran en fragmentos (Lección 2.3) sin mover el precio: absorben la venta que llega, manteniendo el precio \"aburrido\" a propósito. El retail ve un mercado muerto; el institucional ve un almacén llenándose. Síntomas: rango angosto tras tendencia bajista, volumen que no cesa, rechazos repetidos en la misma zona baja.\n2. **Markup** (*markup/expansión*): la acumulación se termina — alguien quemó toda la oferta disponible a ese precio (M2.2) — y el precio expande con velas de cuerpo pleno y retrocesos mínimos. Es la fase que el retail reconoce tarde (\"ya subió mucho\") y el profesional opera desde el inicio con confirmaciones.\n3. **Distribución** (*distribution*): el espejo de la acumulación, arriba. Los grandes venden su inventario en fragmentos absorbiendo la compra del retail que llega tarde al festival. El precio oscila en rango alto con movimientos nerviosos; el sentimiento público está en su máximo (\"nunca baja\"). El institucional ya no es comprador: es el vendedor del techo.\n4. **Markdown** (*markdown/colapso*): el inventario se vendió y el precio baja con urgencia — más rápido que subió, porque la urgencia del miedo supera a la de la codicia (asimetría conocida: \"suben en escalera, caen en ascensor\"). La fase termina donde el precio ya es \"tan barato que alguien vuelve a comprar en tamaño\" — y el ciclo reinicia en acumulación.\n\n**Dow y el impulso + pullback.** Charles Dow (la base de todo el análisis técnico moderno) describió la tendencia no como una línea recta sino como una secuencia de **impulsos y correcciones**: el precio avanza en empujones con retrocesos que respetan la estructura. En tendencia alcista sana: máximos y mínimos ASCENDENTES sucesivos (HH/HL — *higher high / higher low*). La tendencia muere cuando esa secuencia se rompe (el precio falla en hacer HH y hace un LL — *lower low*): la primera ruptura de estructura es la señal del cambio de ciclo, mucho antes de que el \"gráfico bonito\" lo admita. Esta es la gramática que el M5 (estructura de mercado) formalizará con nombres como BOS/CHoCH.\n\n**Weinstein: el mismo mapa con etapas.** Stan Weinstein llamó a las cuatro fases **Stage 1** (acumulación), **Stage 2** (markup), **Stage 3** (distribución), **Stage 4** (markdown), y añadió la regla operativa que el programa hereda: *opera Stage 2, quédate fuera de Stage 1, y sal antes de Stage 4*. La concordancia entre Dow, Weinstein y la microestructura de M2 no es casualidad: es el mismo fenómeno (urgencia, inventario, liquidez) visto desde tres alturas.\n\n**Visual — la rueda del mercado (gira sin parar, en todos los marcos):**\n\n```mermaid\nflowchart LR\n    A[\"📦 ACUMULACIÓN · Stage 1<br/>los grandes compran en fragmentos<br/>rango tras caída — el retail dice: aburrido\"] --> B[\"🚀 MARKUP · Stage 2<br/>la oferta local se agota<br/>HH/HL con cuerpo pleno<br/>→ LA FASE QUE SE OPERA\"]\n    B --> C[\"🏦 DISTRIBUCIÓN · Stage 3<br/>los grandes venden al eufórico<br/>rango arriba — el retail dice: nunca baja\"]\n    C --> D[\"📉 MARKDOWN · Stage 4<br/>urgencia de miedo<br/>sube en escalera, cae en ascensor\"]\n    D --> A\n    B -.-> E1[\"❌ Error retail: entrar tarde aquí<br/>= comprar la distribución\"]\n    D -.-> E2[\"❌ Error retail: pescar cuchillos aquí<br/>= comprar porque ya bajó mucho\"]\n```\n\n## Analogía\n\nLa vida de un espectáculo. **Acumulación:** los organizadores llenan la sala a precio de preventa — silenciosamente, sin que nadie hable del evento. **Markup:** se agota, las entradas revenden a precio creciente, la fila empuja. **Distribución:** los primeros organizadores/vendedores salen vendiendo su inventario al público eufórico que llegó tarde — cada comprador nuevo paga a un vendedor viejo que sale. **Markdown:** se acaba el show, la gente sale de golpe por la misma puerta, y el precio de reventa colapsa hasta que alguien vuelve a ver \"oportunidad\" y empieza a acumular para el próximo evento. El retail pierde comprando en distribución — cuando el evento es portada de prensa — y vendiendo en markdown — cuando la sala se vacía. El profesional hace lo aburrido: compra cuando la sala está vacía y nadie habla del tema, y vende cuando hay fila de eufóricos a quien dársela.\n\n## Cómo se hace: clasificar el ciclo en 3 preguntas, con un caso cerrado\n\nAntes de cualquier análisis, tres preguntas en orden:\n\n1. **¿Hay tendencia definida en H4/D1, o rango?** (secuencia HH/HL vs LL/LH — *lower high* — o solapamiento).\n2. **¿Desde dónde viene el precio?** (¿tras una caída larga? → acumulación posible; ¿tras una subida larga con sentimiento eufórico? → distribución posible).\n3. **¿Qué está haciendo la ESTRUCTURA ahora mismo?** (¿respeta mínimos ascendentes? ¿acaba de romperlos? ¿lleva N sesiones sin progresar en un rango?).\n\n**Caso cerrado (EUR/USD, ilustrativo con mecánica real).** Tras caer de 1,10 a 1,05 en seis semanas (markdown), el precio pasa tres semanas entre 1,0480 y 1,0540 (rango del 1,2 % — acumulación). El sentimiento en redes: \"el euro está muerto\". En la semana 4, una vela D1 cierra en 1,0565 **fuera** del rango (Lección 3.4 le pondrá criterio de confirmación) y las siguientes dos semanas construyen HH/HL hasta 1,0680: markup iniciado. Tu operativa por ciclo: en acumulación → observar y marcar zonas (la misión de este módulo); en markup temprano → buscar largos en retrocesos a demanda (el setup por excelencia del programa); en distribución → recoger beneficios y no renovar largos aunque \"parezca que sigue\"; en markdown → no pescar cuchillos (no comprar \"porque ya bajó mucho\"). La mayoría de las pérdidas del principiante no vienen de leer mal una vela: vienen de **comprar distribuciones** (entrada tarde del markup, cuando el institucional ya vende) y de **no distinguir acumulación de continuo debilitamiento**.\n\n**Y el anti-error más rentable:** si las tres preguntas no tienen respuesta clara, el ciclo es **indeterminado** — y ese es un resultado válido y frecuente. La receta de tu primera operación lo dice en su Paso 3: \"no hay setup y hoy no se opera\" es una respuesta con nombre. En cuatro ciclos, solo dos (markup temprano, markdown en reversión) ofrecen setups con ventaja para tu estilo de formación; los otros dos son de observación. No operar ES operar el ciclo.\n\n## Error común\n\nEl primero: **querer capturar el giro exacto** — entrar en la rotura del rango de acumulación \"porque en algún momento explotará\", sin confirmación, pagando los falsos arranques (el retail paga la mayoría de las primeras roturas: el estadístico de roturas fallidas de la Lección 3.4 lo cuantificará). El antídoto del programa: confirmación en cierres + expectativa de retesteo. El segundo: **confundir duración con fase** — \"lleva subiendo 3 semanas, está maduro para caer\" (las tendencias duran más de lo que la intuición tolera; el ciclo se lee por estructura y comportamiento, no por cronómetro). El tercero: **aplicar el ciclo al marco equivocado** — ver \"distribución\" en un rango de H1 dentro de un markup D1 impecable: sin definir primero tu marco de análisis (H4/D1 en esta formación), el ciclo se vuelve un espejismo fractal (Lección 3.1). Primero el marco, después el ciclo, después la vela.\n\n## Conexión cuantitativa\n\nEl ciclo es la máquina que genera los regímenes que tu $E$ necesita. Un sistema de continuación (comprar retrocesos en markup) tiene su $P_w$ alimentada SOLO en Stage 2: operado en acumulación, produce una serie de falsos arranques de 1R cada uno; operado en distribución, compra exactamente donde el institucional vende — el peor vecindario posible. Esto explica estadísticamente por qué el mismo setup \"funciona unas semanas y luego deja de funcionar\": no se rompió el sistema, cambió el ciclo — y es la razón por la que el M9 auditará tu journal POR REGÍMEN, separando tus operaciones según el estado del mercado en que nacieron. En formación, la consecuencia práctica es inmediata: tu bitácora de 20 niveles (misión de este módulo) exige clasificar el ciclo de cada nivel ANTES de anotarlo — estás entrenando el músculo que protegerá tu esperanza entera.\n\n---\n\n## 🎯 Puntos clave\n\n1. Todo mercado recorre 4 ciclos: **acumulación → markup → distribución → markdown** — en todos los marcos y mercados.\n2. Acumulación = los grandes compran en fragmentos sin mover el precio; distribución = los grandes venden al público que llega tarde.\n3. Dow: la tendencia es impulso + pullback con HH/HL (alcista) o LL/LH (bajista); muere cuando la secuencia se rompe.\n4. Weinstein = el mismo mapa con regla heredada: opera Stage 2, evita Stage 1, sal antes de Stage 4.\n5. Clasifica el ciclo con 3 preguntas: ¿tendencia o rango? ¿desde dónde viene? ¿qué hace la estructura ahora? — y acepta \"indeterminado\" como respuesta válida.\n6. \"No operar\" es la respuesta correcta en la mitad del ciclo: la mayoría de pérdidas del principiante son compras de distribución y cuchillos de markdown.\n\n## 🔄 Autoevaluación rápida\n\n1. Un amigo te dice: \"EUR/USD lleva 3 semanas subiendo, ya está muy estirado — seguro cae\". ¿Qué error de esta lección está cometiendo y qué debería mirar en su lugar?\n2. El precio rompe AL ALZA el rango de una posible acumulación por primera vez. ¿Por qué el programa no entra inmediatamente en esa rotura? ¿Qué esperaría su protocolo?\n3. En tu marco H4, el mercado lleva 10 sesiones entre 1,0840 y 1,0880 tras una caída de 3 semanas. Nombra el ciclo candidato, los dos síntomas que lo confirmarían y la actitud operativa correcta.\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Confunde **duración con fase**: el ciclo no se lee por cronómetro (\"lleva mucho, toca caer\") sino por estructura y comportamiento — las tendencias duran más que la intuición. Debería mirar: ¿la secuencia HH/HL sigue intacta en H4/D1? ¿hay señales de distribución (rango nervioso arriba, roturas de mínimos que se recuperan, sentimiento eufórico)? Mientras los impulsos sigan con pullbacks ordenados y sin ruptura de estructura, el supuesto \"estiramiento\" no es argumento para cortos — es argumento para no renovar largos tardíos, como mucho.\n2. Porque la primera rotura de un rango falla con frecuencia (el retail la paga: es donde el precio busca liquidez y donde la urgencia puede agotarse justo en el nivel obvio — Lecciones 2.3 y 3.4). El protocolo del programa: esperar el **cierre fuera del nivel** (acuerdo del período entero) + la **confirmación/retesteo** posterior; solo entonces el setup de continuación tiene su estadística a favor. Entrar en la primera mecha roturadora es apostar al resultado de una subasta en curso.\n3. Ciclo candidato: **acumulación** (rango angosto tras markdown). Síntomas confirmatorios: (a) rechazos repetidos con mechas en la zona baja del rango y sin progresión bajista, (b) volumen sostenido sin ceder + sentimiento público negativo (\"ya está muerto\"). Actitud operativa correcta: **observar y marcar** — esta es fase de la misión, no de entrada; los largos por confirmación llegan si se produce rotura con cierre fuera + retesteo sano (Stage 2 incipiente). Comprar \"porque es barato\" dentro del rango sería anticipar sin confirmación.\n\n</details>\n"},{"i":22,"g":"🧱 M3 · Anatomía del Gráfico","t":"3.3 · Soportes y resistencias","f":"docs/02-modulos/mod-03-anatomia-del-grafico/leccion-3-3.md","md":"# Lección 3.3 · Soportes y resistencias\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 45–60 min de estudio |\n| 🧱 Módulo | [M3 · Anatomía del Gráfico](README.md) |\n| ⬅️ Anterior | [Lección 3.2 · Los 4 ciclos del mercado](leccion-3-2.md) |\n| ➡️ Siguiente | [Lección 3.4 · Confirmación en 3 pasos](leccion-3-4.md) |\n\n---\n\n## Por qué importa\n\nSi tuvieses que resumir la técnica de este programa en un elemento, sería la **zona**: el lugar del gráfico donde el interés sin servir (M2.2) y la memoria del mercado (esta lección) hacen que el precio tenga **mayores probabilidades de reaccionar**. Toda tu operativa futura — entradas, stops, objetivos, el análisis del Paso 3 de tu receta — se construye sobre zonas bien marcadas. Y aquí está la diferencia entre el que gana su matrícula y el que la pierde: el principiante dibuja líneas exactas que el precio \"respeta o no\"; el profesional mapea **áreas** donde la subasta tiene historia, y piensa en probabilidades de reacción, no en predicciones. Esta lección te enseña a marcarlas, a graduar su fuerza y a distinguir los tres tipos que existen — con la disciplina de pocas zonas y bien elegidas.\n\n## Concepto\n\n**Soporte** (*support*): zona donde ha habido interés comprador suficiente para detener/invertir caídas — demanda residual esperando (M2.2). **Resistencia** (*resistance*): el espejo con vendedores. Y la regla de lectura número uno:\n\n> **Zonas, no líneas.** El precio no reacciona en un precio exacto: reacciona en un **área** donde hay órdenes, porque los grandes fragmentan sus entradas (Lección 2.3) y ningún participante sabe cuál es \"el\" precio del nivel. Dibuja rectángulos con cuerpo, no rayos de un píxel. Un nivel es donde el precio *pasó*; una zona es donde el precio *reaccionó*.\n\n**Los tres tipos:**\n\n1. **Estáticos** (horizontales): máximos/mínimos previos, zonas de consolidación, huecos de oferta/demanda. Son los reyes del programa: legibles a ojo, auditables, sin parámetros ocultos. Se marcan desde la **estructura del swing**: máximos y mínimos que giraron el precio, bordes de rangos (Lección 3.2), el origen de una expansión (donde nació el desequilibrio).\n2. **Diagonales** (trendlines/canales): conectan máximos o mínimos sucesivos en tendencia. Útiles para visualizar el ritmo, pero más subjetivos: una línea diagonal depende de QUÉ dos puntos conectes — el mismo gráfico admite tres líneas \"válidas\". Regla del programa: la diagonal se dibuja con **tres toques como mínimo** y se interpreta como guía de ritmo, no como nivel de entrada por sí sola.\n3. **Dinámicos** (medias móviles, M6): zonas que se recalculan cada vela. Se mencionan aquí por completitud y se estudian en el Módulo 6, con el radar de evidencia correspondiente.\n\n**La memoria de mercado.** ¿Por qué funciona un mínimo de hace tres meses? No por magia técnica: por **memoria** — los participantes que vieron ese nivel lo recuerdan (los que compraron ahí y ganaron quieren recomprar; los que lo vieron fallar a otros lo respetan; los stops sin servir siguen ahí). Un nivel es la huella de decisiones tomadas; cuando el precio vuelve, esas decisiones se reactivan. Esto explica el comportamiento clásico: nivel respetado → más participantes lo ven → siguiente visita reacciona más fuerte... **hasta que se agota**: cada reacción consume parte del interés pendiente, y cuando la zona falla (cierre decidido más allá), la memoria se invierte — el soporte roto tiende a actuar como resistencia (principio de **polaridad**, que la Lección 3.4 formaliza).\n\n**Fortaleza de una zona — el gradiente del programa:**\n\n| Factor | Más fuerte | Más débil |\n|---|---|---|\n| Reacciones previas | 2–3 reacciones limpias con tiempo entre ellas | 5+ toques recientes (la zona se está consumiendo) |\n| Tiempo transcurrido | \"fresca\": el interés que no se llenó sigue pendiente | \"vieja y visitada\": muchas visitas = muchas órdenes ya servidas |\n| Origen | Nació de una expansión/desequilibrio claro (M2.2) | Nació de ruido lateral sin energía |\n| Marco temporal | D1/H4 | M15 y abajo (más órdenes visibles = más barridas) |\n| Confluencia | Coincide con otro nivel/marco/estructura | Aislada |\n\nEl contraintuitivo que separa al profesional: **muchos toques no fortalecen — consumen**. Cada visita llena órdenes; la zona con siete toques es un almacén vacío esperando su barrida final. Las mejores zonas del programa: 1–3 reacciones, frescas, con origen expansivo, en D1/H4.\n\n## Analogía\n\nEl nivel es el **bar de la esquina donde todo el barrio hizo historia**. La primera vez que hubo pelea (el precio reaccionó), la gente lo recuerda; a la segunda y tercera, los vecinos ya lo citan: \"como aquella vez en el bar\". Entre más historia reciente y más gente que la vivió, más probabilidad de que el siguiente incidente se parezca. Pero el bar tiene capacidad finita: cada pelea (visita del precio) llena el local y gasta la anécdota — al séptimo episodio, ya no reacciona nadie y la historia se rompe a la primera avalancha. Dibujar el nivel como línea de un píxel es como creer que la pelea ocurre EXACTAMENTE en la barra: ocurre en el bar entero — el salón, la terraza, la puerta (la zona, con su cuerpo). Y la polaridad es el vecino que fue el epicentro de las peleas y ahora, reformado, es el portero que las impide: soporte roto que se vuelve resistencia.\n\n## Cómo se hace: marcar zonas con el protocolo de 4 reglas, con ejemplo cerrado\n\n**Protocolo de marcado (el del laboratorio de este módulo):**\n\n1. **Zoom out primero:** H4/D1. Las zonas que solo existen en M15 no entran (son hábitat de barridas, Lección 2.3).\n2. **Marca solo donde el precio GIRO** — extremos de swings y bordes de rango — y donde **nació una expansión** (la última vela pequeña antes de la escapada: ahí quedó pedido sin servir).\n3. **Dibuja rectángulos con cuerpo:** del extremo del mecha/cierre al cuerpo de las velas de reacción. Si tu rectángulo es más fino que el spread del instrumento, no es una zona.\n4. **Pocas:** 2–4 zonas en el marco de análisis. Un gráfico lleno de rectángulos es un gráfico sin información (todo vale = nada vale).\n\n**Ejemplo cerrado (XAU/USD, ilustrativo).** El oro expandió de 3 980 a 4 024 en dos días (markup, M3.2), retrocedió a 4 002–4 006 y rebotó de nuevo a 4 018. La zona de demanda se dibuja de **4 000 a 4 006** (cuerpo de las velas de reacción, incluyendo el extremo 3 998 con margen): no una línea en 4 002. Fortaleza: 1 reacción, fresca, origen expansivo, H4 → zona A de la lista. El TP del siguiente long en zona usa el **borde cercano de la resistencia** (4 020–4 024) como objetivo, no \"un número bonito\": R:B = (4 020 − 4 006)/(4 006 − 3 998) ≈ 14/8 ≈ 1,75 — y si el R:B no llega a 1:2 con SL estructural, el setup se rechaza (regla del programa, Lección 1.4: $WR_{equilibrio} = \\frac{1}{1+R}$ te dice cuánto margen te queda; con 1,75 necesitas acertar más del 36 % — posible, pero el protocolo exige 1:2 mínimo para no depender de un WR fino).\n\n**El retesteo como auditoría en vivo:** cuando el precio vuelve a tu zona, no la re-dibujes para que \"encaje\". Si reaccionó donde dijiste → la zona suma evidencia. Si atravesó tu rectángulo y giró 15 puntos más abajo → tu zona estaba mal anclada: bórrala y estudia por qué (¿marcaste el extremo en vez del cuerpo? ¿marcaste en M15 lo que era ruido de D1?). La bitácora de la misión de este módulo existe exactamente para esto: **20 niveles anotados con su resultado posterior (respetado/roto)** — tu primera base de datos personal sobre la calidad de tu propio marcado.\n\n## Error común\n\nEl primero: **el perfeccionismo retrospectivo** — mirar el histórico y ajustar la zona para que TODAS las reacciones pasadas hayan encajado al píxel. Eso es curvar la regla después de medir: en vivo nunca lo acertarías igual, y tu estadística se infla con zonas fantasma. Se marca con la información disponible ANTES de la reacción, punto. El segundo: **el césped de rectángulos** — 12 zonas en un gráfico H4. Si cada nivel es importante, nada lo es: el protocolo pide 2–4, elegidas por el gradiente de fortaleza. El tercero: **mezclar marcos** — un soporte de M15 dentro de tu análisis D1 no es confluencia, es ruido escalado (y suele estar exactamente donde viven los stops que la barrida del M2.3 viene a recoger). Marco de análisis fijo: H4/D1; solo las zonas del mismo marco (o superior) participan. El cuarto, ya anunciado: creer que \"más toques = más fuerte\" — es más consumida, no más fuerte.\n\n## Conexión cuantitativa\n\nLa zona es el factor que más mueve tu $P_w$ dentro de tu control técnico: la misma vela de confirmación tiene estadística distinta dentro de una zona fresca con origen expansivo que en el vacío. Pero la zona también define tus otros dos términos: el **SL estructural** va más allá del cuerpo de la zona (donde la idea muere de verdad: giró el precio y cerró decidido más allá del extremo), y el **TP** va en la siguiente zona opuesta — ambos salen del mapa, no de la emoción. Con $L$ y $W$ anclados a zonas reales, tu R:B deja de ser un deseo y se vuelve un cálculo verificable ANTES de entrar (Paso 4 de la receta). Y hay un regalo estadístico: al registrar 20 niveles con resultado (misión), empiezas a acumular TU frecuencia de \"zona respetada\" — el primer dato propio del programa, base del diseño de sistema del M7 y de la validación del M9.\n\n---\n\n## 🎯 Puntos clave\n\n1. **Zonas, no líneas**: el precio reacciona en áreas con historia; dibuja rectángulos con cuerpo, nunca rayos de un píxel.\n2. Tres tipos: estáticos (los reyes del programa), diagonales (guía de ritmo, mínimo 3 toques) y dinámicos (M6).\n3. La **memoria de mercado** reactiva decisiones pasadas; la **polaridad** invierte el nivel roto (soporte↔resistencia).\n4. Fortaleza = frescura + pocas reacciones + origen expansivo + marco D1/H4 + confluencia. **Muchos toques consumen la zona, no la fortalecen.**\n5. Protocolo: zoom out → marcar giros y orígenes de expansión → rectángulos con cuerpo → solo 2–4 zonas por gráfico.\n6. R:B verificado antes de entrar (mínimo 1:2 del programa); si el mapa no lo da, el setup se rechaza.\n\n## 🔄 Autoevaluación rápida\n\n1. ¿Por qué una zona con 7 toques recientes es MÁS débil que una con 2, siendo que \"resistió 7 veces\"? Explica con la lógica de órdenes pendientes (M2.2).\n2. Tienes una zona de demanda 4 000–4 006 (oro), entras long en 4 005 con SL bajo la zona en 3 996 y la resistencia más próxima está en 4 018–4 022. Calcula el R:B con TP en el borde cercano (4 018). ¿Aprueba el protocolo de 1:2?\n3. Tu compañero marca 11 zonas en un H4 de EUR/USD y \"todas respetan en el histórico\". Nombra los dos errores y el antídoto del protocolo.\n\n<details>\n<summary>Ver respuestas</summary>\n\n1. Porque cada reacción **consume** parte del interés pendiente: los que querían comprar en esa zona ya compraron (sus órdenes se sirvieron) en las visitas anteriores. A la séptima visita, el almacén de órdenes sin servir está casi vacío: el nivel tiene historia y fama, pero poca munición real. Las zonas fuertes son las frescas — pocos toques con órdenes aún pendientes — no las célebres.\n2. Riesgo: 4 005 − 3 996 = 9 $ por onza. Recompensa: 4 018 − 4 005 = 13 $. R:B = 13/9 ≈ **1,44**. No aprueba: el protocolo exige mínimo 1:2. Opciones legítimas: esperar mejor precio en la zona (entrar cerca de 4 002–4 003 baja el riesgo), esperar un SL estructural más corto si la estructura lo permite, o **rechazar el setup** — nunca \"estirar\" el TP más allá de la resistencia real para fabricar el ratio (eso es maquillar el mapa para aprobar tu propio examen).\n3. Error 1 — **césped de rectángulos**: con 11 zonas, todo es importante y nada lo es; el protocolo pide 2–4 elegidas por fortaleza. Error 2 — **perfeccionismo retrospectivo**: ajustar cada rectángulo al histórico para que \"respeten\" curva la regla después de medir; en vivo no habrían encajado así. Antídoto: protocolo de 4 reglas (zoom out, giros/orígenes, rectángulos con cuerpo, pocas) y la bitácora de 20 niveles con resultado EN VIVO (respetado/roto) como auditoría honesta de tu marcado.\n\n</details>\n"},{"i":23,"g":"🧱 M3 · Anatomía del Gráfico","t":"3.4 · Confirmación en 3 pasos","f":"docs/02-modulos/mod-03-anatomia-del-grafico/leccion-3-4.md","md":"# Lección 3.4 · Confirmación en 3 pasos\n\n| Campo | Detalle |\n|---|---|\n| ⏱️ Duración estimada | 45–60 min de estudio |\n| 🧱 Módulo | [M3 · Anatomía del Gráfico](README.md) |\n| ⬅️ Anterior | [Lección 3.3 · Soportes y resistencias](leccion-3-3.md) |\n| ➡️ Siguiente | [Lección 3.5 · Patrones elementales](leccion-3-5.md) |\n\n---\n\n## Por qué importa\n\nEl nivel está marcado. El precio lo alcanza. Y ahora — ¿entras o esperas? Esta es la bifurcación donde el principiante paga su matrícula más cara: entrar en el primer toque sin criterio significa comprar exactamente donde la liquidez se barrida (M2.3) y donde la mayoría de las roturas fallan. La **confirmación en 3 pasos** es el protocolo del programa para convertir \"el precio llegó a mi zona\" en \"el mercado me está mostrando que el interés de mi zona sigue vivo\": ruptura del nivel → cierre fuera → confirmación con reacción. Cuesta entrar un poco más tarde y algo peor de precio; a cambio filtra la mayoría de los falsos rompimientos — y en la ecuación del programa, un $P_w$ unos puntos mayor vale infinitamente más que 2 pips de entrada. Esta lección también formaliza el falso rompimiento como fenómeno, no como mala suerte.\n\n## Concepto\n\n**El protocolo de 3 pasos** (para una rotura de resistencia; el espejo vale para soporte):\n\n1. **Ruptura:** el precio atraviesa el nivel. Paso necesario, insuficiente: aquí todavía puede ser una barrida (Lección 2.3) — el toque intra-vela no decide nada.\n2. **Cierre fuera del nivel:** la vela (o mejor, el H4/D1 según tu marco) **cierra** más allá del nivel con cuerpo decidido. El cierre es el acuerdo final de la subasta completa (M3.1): un cierre fuera implica que la urgencia superó al nivel y **sobrevivió al período**. Este es el filtro que elimina la mayoría de las mechas roturadoras.\n3. **Confirmación — el retesteo:** tras el cierre fuera, el precio suele volver al nivel roto (polaridad) y **reacciona desde él**: en el caso alcista, la RESISTENCIA rota se convierte en SOPORTE — el precio vuelve abajo, toca la zona y NO la pierde (mínimo del retroceso por encima del nivel, con reacción compradora visible). Esa reacción es la luz verde: el mercado probó el nuevo suelo y lo sostuvo.\n\n**El principio de polaridad** (*polarity*): un nivel roto con confirmación **cambia de bando**. La resistencia que cedió y se sostuvo en el retesteo opera como soporte (ahí están los compradores que \"se perdieron\" el tren esperando el retesteo + los vendedores que quedaron atrapados y cubren en la zona, generando compra). El soporte que cedió con cierre decidido opera como resistencia para los rebotes (los compradores tardíos atrapados venden para salir en el empate). Esta simetría es la razón por la que los mejores retesteos son entradas con estadística superior: **el nivel ya demostró funcionar en ambas direcciones**.\n\n**Los nombres del retorno:** al retroceso tras la rotura se le llama **pullback** (en tendencia) o **throwback** (al origen de la rotura). No es un defecto del mercado: es la digestión — los stops de los primeros rompedores se ejecutan, los impacientes salen, y el institucional llena lo que faltaba en la zona (M2.3). Un mercado que no retrocede tras romper (expansión pura) existe, pero no lo perseguimos: sin retesteo, tu entrada queda sin el paso 3 y la receta lo prohíbe.\n\n**El falso rompimiento** (*false breakout / fake*): el precio atraviesa el nivel, **no logra el cierre decidido fuera** (o cierra fuera y en la siguiente vela vuelve dentro con fuerza), y gira al otro lado. No es un error del mercado — es su mecanismo de recolección: detrás de todo nivel obvio hay stops y entradas del retail (M2.3), y atravesar el nivel unas velas es la forma más eficiente de detonarlos. Tres datos operativos: (a) son la mayoría de las primeras roturas de un rango; (b) el antídoto EXACTO es el protocolo de 3 pasos — el falso no sobrevive al paso 2 ni al paso 3; (c) cuando el falso se confirma como tal (vuelta decidida al interior del rango), ES un setup del lado contrario con estadística excelente — el barrido que se revierte es precisamente la huella del comprador grande (Lección 2.3). Con el tiempo aprenderás a operar el falso; en formación, la regla es solo dejar que te filtre a ti.\n\n**Visual — el árbol de decisión completo del protocolo:**\n\n```mermaid\nflowchart TD\n    Z[\"🎯 Zona de calidad marcada M3.3<br/>fresca · origen expansivo · H4/D1\"] --> R[\"PASO 1 · Ruptura<br/>el precio atraviesa el nivel<br/>aún no decide nada\"]\n    R --> C{\"PASO 2 · ¿La vela del marco cierra<br/>FUERA del nivel, con cuerpo decidido?\"}\n    C -- \"No\" --> FB[\"🚫 Falso rompimiento o barrida<br/>SIN entrada — el nivel sigue siendo el nivel<br/>y el falso confirmado avisa del lado contrario\"]\n    C -- \"Sí\" --> RT[\"PASO 3 · Esperar el retesteo<br/>pullback / throwback hacia la zona rota\"]\n    RT --> S{\"¿El retesteo se SOSTIENE?<br/>no pierde la zona + reacción del lado nuevo\"}\n    S -- \"No\" --> OUT[\"🚫 Setup no ejecutado<br/>se anota en el journal y se espera el siguiente nivel\"]\n    S -- \"Sí\" --> IN[\"✅ ENTRADA<br/>SL tras la estructura del retesteo<br/>TP en la zona siguiente · R:B mínimo 1:2\"]\n    IN --> W[\"🧾 Journal: ¿entré con protocolo 3 de 3?<br/>campo clave de la auditoría M9\"]\n```\n\n## Analogía\n\nEl protocolo de 3 pasos es el **control de aeropuerto en tres filtros**. Paso 1 — el pasaporte existe (el precio tocó/cruzó el nivel): cualquiera puede mostrar un pasaporte; no vuela por eso. Paso 2
