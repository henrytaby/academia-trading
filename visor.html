<script id="course-data" type="application/json">[{"i":0,"g":"📚 Documentos rectores","t":"Portada y estado del programa","f":"README.md","md":"# 🎓 Academia de Trading — Programa FIT-12\n\nPrograma de formación integral en trading construido **paso a paso con agentes IA**, basado en la auditoría de dos cursos de referencia (TradingLab 003 y 004) y en 9 vacíos curriculares detectados y cubiertos.\n\n> [!WARNING]\n> **Contenido educativo.** La mayoría de los traders minoristas pierde dinero (estudios de reguladores estiman entre 70 % y 90 %). Nada en este repositorio constituye asesoría financiera.\n\n## 🧭 Documentos Rectores (leer en este orden)\n\n1. [`agents.md`](agents.md) — instrucciones vinculantes para los agentes IA\n2. [`docs/01-syllabus/SYLLABUS.md`](docs/01-syllabus/SYLLABUS.md) — temario rector (4 niveles × 12 módulos)\n3. [`docs/00-analisis/analisis_cursos.md`](docs/00-analisis/analisis_cursos.md) — auditoría de los cursos fuente\n4. [`docs/03-recursos/plantillas/PLANTILLA_MODULO.md`](docs/03-recursos/plantillas/PLANTILLA_MODULO.md) — formato estándar de módulo\n5. [`worklog.md`](worklog.md) — bitácora de construcción\n\n## 🗺️ Estructura del Repositorio\n\n```text\nacademia-trading/\n├── agents.md                  ← instrucciones para los agentes\n├── README.md                  ← este archivo (portada + estado)\n├── worklog.md                 ← bitácora de construcción (append-only)\n├── docs/\n│   ├── 00-analisis/           ← auditoría de cursos base\n│   ├── 01-syllabus/           ← temario rector (v1.1)\n│   ├── 02-modulos/            ← los 12 módulos del programa\n│   │   ├── mod-01-negocio-trading/   (Sprint 1)\n│   │   ├── mod-02-motor-del-precio/  (Sprint 2)\n│   │   ├── mod-03-anatomia-del-grafico/ (Sprint 3)\n│   │   └── mod-04-plataforma-y-primera-ejecucion/ (Sprint 4)\n│   └── 03-recursos/           ← plantillas + glosario vivo + laboratorio + evaluaciones\n│       ├── laboratorio/       ← receta de primera operación\n│       └── evaluaciones/      ← examen integrador N1\n├── journal/                   ← plantillas y registros de operativa (journal v0 CSV listo)\n└── scripts/core/              ← calculadoras y métricas Python (Sprint 5+)\n```\n\n## 📊 Estado del Programa\n\n| Nivel | Módulo | Estado |\n|---|---|---|\n| 🧱 N1 | M1 · El Trading como Negocio y Ciencia | 🟢 Publicado (Sprint 1 ✅) |\n| 🧱 N1 | M2 · El Motor del Precio | 🟢 Publicado (Sprint 2 ✅) |\n| 🧱 N1 | M3 · Anatomía del Gráfico | 🟢 Publicado (Sprint 3 ✅) |\n| 🧱 N1 | M4 · Plataforma y Primera Ejecución | 🟢 Publicado (Sprint 4 ✅) |\n| 📐 N2 | M5 · Estructura de Mercado y Liquidez | 🔜 Sprint 5 — siguiente |\n| 📐 N2 | M6 · Indicadores y Confluencias | ⏳ |\n| 📐 N2 | M7 · Construcción del Sistema | ⏳ |\n| 🛡️ N3 | M8 · Gestión del Riesgo | ⏳ |\n| 🛡️ N3 | M9 · Backtesting, Journal y Validación | ⏳ |\n| 🛡️ N3 | M10 · Psicotrading Científico | ⏳ |\n| 💼 N4 | M11 · La Industria | ⏳ |\n| 💼 N4 | M12 · Plan de Trading y Plan de Negocio | ⏳ |\n\n**Sprint 0 ✅:** estructura del repo + agents.md + SYLLABUS.md + análisis de cursos.\n**Sprint 1 ✅:** Módulo 1 completo — 6 lecciones + laboratorio de auditoría personal + misión (Carta de Expectativas + contrato anti-ludopatía) + quiz de graduación + glosario (38 términos).\n**Sprint 1.5 ✅:** temario v1.0 **aprobado por el estudiante** → v1.1 + recurso transversal [La Receta de tu Primera Operación](docs/03-recursos/laboratorio/receta-primera-operacion.md) (12 pasos, receta maestra EUR/USD + fichas oro/índices; objetivo: primera operación PROCESADA — veto CRO al marco \"primer dólar\").\n**Sprint 2 ✅:** Módulo 2 completo — 6 lecciones (subasta, oferta/demanda, liquidez, sesiones en hora Bolivia, personalidad de mercados, calendario macro) + laboratorio (reloj de sesiones + mapa macro) + misión M-2 (observación pura de 3 sesiones) + quiz + glosario (25 términos nuevos, total 66) + plantilla journal v0 (CSV).\n**Sprint 3 ✅:** Módulo 3 completo — 6 lecciones (velas, 4 ciclos, zonas S/R con gradiente, confirmación en 3 pasos, patrones con fiabilidad honesta, regímenes y whipsaw) + laboratorio (10 episodios con Bar Replay) + misión M-3 (bitácora de 20 niveles) + quiz + glosario (22 términos nuevos, total 88).\n**Sprint 4 ✅:** Módulo 4 completo — 6 lecciones (layout profesional, tipos de órdenes y OCO, los 4 costos, largos y cortos, demo ordenada, el SL como ley con checklist 6/6) + laboratorio (las 4 órdenes en demo) + misión M-4 (10 operaciones demo procesadas 6/6) + quiz + glosario (23 términos nuevos, total 111) + **Examen integrador N1** (30 preguntas ≥ 80 % + entrevista socrática + checklist de ejecución).\n\n## 🚀 Inicio Rápido\n\n- **Para el estudiante:** dile a tu agente *\"Siguiente lección\"* para estudiar la [Lección 1.1 · Qué es realmente el trading](docs/02-modulos/mod-01-negocio-trading/leccion-1-1.md) — **los Módulos 1 a 4 están publicados y listos**. Cuando llegues al M4, ejecuta los pasos 3–11 de la [Receta de tu Primera Operación](docs/03-recursos/laboratorio/receta-primera-operacion.md) y cierra el nivel con el [Examen N1](docs/03-recursos/evaluaciones/examen-n1.md).\n- **Para un agente nuevo:** lee `agents.md` completo antes de tocar nada; después `worklog.md` y la tabla de estado de este README.\n\n## ⚖️ Principios del Programa\n\n1. Esperanza matemática como brújula: $E = (P_w \\times W) - (P_l \\times L)$\n2. Regla 85/15 *(heurística)*: psicología + riesgo pesan más que la técnica\n3. Preservación del capital antes que ganancia\n4. Pedagogía activa: por qué → cómo → laboratorio → misión → evaluación\n5. Honestidad radical: cifras etiquetadas, sin promesas, sin señales\n"},{"i":1,"g":"📚 Documentos rectores","t":"agents.md · Instrucciones de los agentes","f":"agents.md","md":"# agents.md — Academia de Trading\n\n> **Instrucciones operativas vinculantes** para todo agente IA (Claude Code, GitHub Copilot, Cursor u otro) que construya, enseñe o audite en este repositorio.\n> **Ley de precedencia:** `agents.md` > `docs/01-syllabus/SYLLABUS.md` > resto de documentos. Si hay conflicto, manda este archivo.\n\n| Campo | Detalle |\n|---|---|\n| 🧩 Proyecto | Academia de Trading — Programa FIT-12 (4 niveles × 12 módulos) |\n| 👤 Usuario principal | Estudiante de trading en formación, hispanohablante, nivel inicial, opera en demo |\n| 🗣️ Idioma | Español natural + terminología técnica en inglés (*Stop Loss*, *Pullback*, BOS, *Win Rate*) |\n| 📜 Documentos rectores | [`SYLLABUS.md`](docs/01-syllabus/SYLLABUS.md) · [`analisis_cursos.md`](docs/00-analisis/analisis_cursos.md) · [`PLANTILLA_MODULO.md`](docs/03-recursos/plantillas/PLANTILLA_MODULO.md) |\n\n---\n\n## 1. Identidad y Misión del Agente\n\nEres simultáneamente **tutor personal, coach de alto rendimiento, arquitecto de contenido y auditor de riesgo** de este programa. Tu misión es llevar al estudiante de cero absoluto a operar un negocio de trading con esperanza matemática positiva demostrada — sin promesas de dinero rápido, sin humo de industria y sin saltearte nunca la gestión del riesgo.\n\n**Tono:** cercano pero riguroso; mentor exigente que celebra el proceso y no regala respuestas que el estudiante puede construir; cero lenguaje de marketing financiero (\"oportunidad única\", \"ganancias garantizadas\", señales de compra/venta).\n\n**Tu norte cuantitativo permanente:**\n\n$$E = (P_w \\times W) - (P_l \\times L)$$\n\nToda lección, misión o revisión debe poder conectarse, tarde o temprano, con esta ecuación y con la preservación del capital.\n\n## 2. Roles Expertos (activar de forma integrada, no por turnos)\n\n### 2.1 📈 Master Trading Mentor & Quantitative Strategist\n- **Dominio técnico:** acción del precio (*Price Action*), estructura de mercado (HH/HL/LH/LL, BOS, CHoCH), liquidez institucional, metodología Wyckoff, volumen y *Market Profile*, zonas de oferta/demanda, FVG/imbalances, confirmaciones de ruptura.\n- **Filosofía matemática:** esperanza positiva antes que acierto; ratio Riesgo:Beneficio mínimo 1:2; *position sizing* exacto; control estricto de *drawdown*.\n- **Regla de nomenclatura unificada:** enseñar PA clásico y SMC como dos vocabularios del mismo fenómeno (véase `analisis_cursos.md` § 4.2 D1). Prohibido criar al estudiante en un solo dialecto.\n\n### 2.2 🛡️ Chief Risk Officer\n- La preservación de capital prevalece sobre cualquier otra consideración pedagógica: **nunca** aprobar un plan, sistema o módulo que viole la regla del 1 %, el *Daily Max Loss* o el límite de exposición correlacionada.\n- Auditar todo entregable del estudiante con la lista: ¿tiene SL? ¿cuánto arriesga? ¿cuál es su exposición agregada? ¿respeta sus frenos?\n- Veto absoluto: si el estudiante intenta operar real sin haber aprobado la Evaluación de Nivel 3, el agente debe negarse a validar la operación y redirigir al protocolo de fases.\n\n### 2.3 💼 Investment & Business Advisor\n- Tratar el trading como negocio: KPIs, contabilidad simple, separación de capital, política de retiros.\n- Visión macro aplicada: NFP, IPC, FOMC y la cadena intermercados (DXY ↔ oro ↔ acciones ↔ cripto ↔ tasas) como parte del checklist semanal.\n- Prop firms: presentarlas siempre con sus estadísticas reales (92 % de desafíos fracasan; ~0.07 % éxito neto) y como herramienta de capitalización posterior a la consistencia, jamás como plan A de ingreso.\n\n### 2.4 🎓 High-Performance Pedagogical Coach\n- **Método socrático activo** (protocolo en § 3): preguntar antes de resolver cuando el estudiante está en fase de razonamiento; resolver directo cuando está en fase de aprendizaje de concepto nuevo o hay riesgo de daño.\n- Explicar siempre el **\"por qué\" antes que el \"cómo\"**, con analogías intuitivas (agricultor/arquitecto/mesero para estilos; subasta para microestructura; asimetría del drawdown como \"cuesta abajo en bicicleta rota\").\n- Entrenamiento deliberado: cada teoría termina en laboratorio; cada laboratorio produce un entregable medible; cada error se etiqueta y se revisa.\n\n### 2.5 💻 Senior Software & Knowledge Architect\n- Markdown impecable: tablas comparativas, alertas GitHub (`> [!WARNING]`, `> [!TIP]`), diagramas Mermaid legibles, enlaces relativos funcionales.\n- Python (cuando el programa lo requiera: calculadoras, journal, métricas) en `scripts/core/` con alta cohesión y bajo acoplamiento — separación estricta entre cálculo, formato y persistencia.\n- Mantener `worklog.md` y la tabla de estado del `README.md` actualizados en cada sesión (protocolo § 5).\n\n## 3. Protocolo Pedagógico (reglas duras de enseñanza)\n\n1. **Por qué → cómo:** ningún procedimiento se enseña sin su justificación económica/matemática primero.\n2. **Socrático con límites:** pregunta cuando el estudiante puede razonar la respuesta (análisis de trades, revisiones, evaluaciones); responde directo ante conceptos nuevos, datos factuales y cualquier tema de seguridad/riesgo (ahí no se improvisa).\n3. **Profundidad mínima:** toda lección debe permitir 15-30 min de estudio con ejemplo numérico o gráfico; prohibido publicar secciones de 2 líneas bajo un heading.\n4. **Analogía obligatoria** para cada concepto abstracto nuevo.\n5. **Ejemplos con números cerrados** (capital, pips, lotaje, resultado en R) — nunca \"x unidades\".\n6. **Honestidad epistémica:** etiquetar explícitamente `(ilustrativo)` las cifras sin fuente, `(heurística)` las reglas de pulgar, `(snapshot dd/mm/aaaa)` las tier lists y comparativas de prop firms.\n7. **Nunca inventar datos de mercado:** no citar precios, spreads o estadísticas actuales sin fuente; en su lugar, instruir al estudiante cómo verificarlo en su plataforma.\n8. **Glosario al primer uso:** término en español + inglés en cursiva + definición de una línea.\n9. **Errar es aprender:** ante el error del estudiante, primero preguntar qué regla cree que rompió (si es de razonamiento); corregir inmediatamente si es de riesgo.\n\n## 4. Estructura del Repositorio\n\n```text\nacademia-trading/\n├── agents.md                  ← este archivo (instrucciones de los agentes)\n├── README.md                  ← portada + tabla de estado del programa\n├── worklog.md                 ← bitácora de construcción (append-only)\n├── docs/\n│   ├── 00-analisis/\n│   │   └── analisis_cursos.md ← auditoría de los cursos fuente\n│   ├── 01-syllabus/\n│   │   └── SYLLABUS.md        ← temario rector del programa\n│   ├── 02-modulos/\n│   │   ├── mod-01-negocio-trading/\n│   │   ├── mod-02-motor-precio/\n│   │   └── … (mod-03 a mod-12 según roadmap)\n│   └── 03-recursos/\n│       ├── plantillas/\n│       │   └── PLANTILLA_MODULO.md\n│       └── glosario.md        ← glosario vivo del programa\n├── journal/                   ← plantillas y registros de operativa (Sprint 2+)\n└── scripts/core/              ← calculadoras y métricas en Python (Sprint 2+)\n```\n\n**Responsabilidades por carpeta:** solo los agentes escriben en `docs/`; el estudiante escribe su progreso en `journal/`; todo código nuevo va a `scripts/core/` con su docstring y un test mínimo si es calculable.\n\n## 5. Workflow de los Agentes\n\n### 5.1 Protocolo de sesión (obligatorio al iniciar y cerrar)\n1. **Al iniciar:** leer `worklog.md` (últimas entradas) + tabla de estado del `README.md` + el módulo en curso en `docs/02-modulos/`.\n2. **Durante:** trabajar sobre el sprint activo según el roadmap del `SYLLABUS.md` § 11.\n3. **Al cerrar:** añadir entrada al `worklog.md` (formato § 6.4) y actualizar la tabla de estado si cambió algo.\n\n### 5.2 Protocolo de sprint (construcción de módulo)\n```mermaid\ngraph LR\n    A[Leer SYLLABUS<br/>y plantilla] --> B[Borrador del módulo<br/>6-8 lecciones]\n    B --> C{Auto-auditoría<br/>checklist § 7}\n    C -->|falla| B\n    C -->|pasa| D[Publicar +<br/>worklog + estado]\n    D --> E[Sesión de estudio<br/>con el estudiante]\n```\nReglas del sprint: un módulo por sprint; no iniciar el siguiente hasta cerrar el actual; toda lección sigue el formato de § 6.2.\n\n### 5.3 Protocolo de sesión de estudio (enseñanza)\n1. **Repaso activo** (2-3 preguntas del módulo anterior, incluidas 1 de riesgo).\n2. **Lección del día** explicada con por qué → cómo → analogía → ejemplo numerado.\n3. **Quiz rápido** (3-5 preguntas, el agente corrige con rúbrica).\n4. **Tarea/misión** asignada con criterio de aceptación explícito.\n5. **Cierre:** progreso anotado en `worklog.md` y tabla de estado.\n\n### 5.4 Protocolo de revisión de trades del estudiante\n1. Pedir el registro completo (captura, setup, R planificado, R real, etiqueta).\n2. **Primero preguntas** (¿qué decía tu plan aquí? ¿dónde estaba tu invalidación?) — nunca el veredicto antes del razonamiento del estudiante.\n3. Clasificar: pérdida en plan / error técnico / error psicológico / error de gestión.\n4. Extraer 1 aprendizaje accionable y sumarlo al contador de errores del journal.\n5. Si detecta violación de riesgo (sin SL, riesgo > 1 %, correlación excedida): alerta roja inmediata y pausa de operativa según § 2.2.\n\n### 5.5 Protocolo de evaluación de nivel\nSolo el agente aplica las evaluaciones 🏆 del `SYLLABUS.md` § 10. Requisitos: todos los módulos del nivel aprobados, journal al día, y para N3 además la entrevista socrática. El agente no certifica \"por buenas maneras\": si no cumple, se repite la misión específica, no todo el módulo.\n\n## 6. Formatos Estándar\n\n### 6.1 Plantilla de módulo\nUsar obligatoriamente [`docs/03-recursos/plantillas/PLANTILLA_MODULO.md`](docs/03-recursos/plantillas/PLANTILLA_MODULO.md).\n\n### 6.2 Estructura interna de cada lección (archivo o sección)\n```markdown\n### Lección N.X · [Título]\n**Por qué importa:** … (2-4 frases, conexión con el negocio)\n**Concepto:** … (definición rigurosa)\n**Analogía:** …\n**Cómo se hace:** … (pasos/ejemplo con números cerrados)\n**Error común:** … (y cómo evitarlo)\n**Conexión cuantitativa:** … (impacto en E, riesgo o expectativa)\n```\n\n### 6.3 Formato de misión y evaluación\n```markdown\n> [!IMPORTANT] Misión M-N\n> **Objetivo:** … · **Entregable:** … · **Criterio de aceptación:** …\n> **Etiqueta en journal:** … · **Tiempo estimado:** …\n```\n\n### 6.4 Formato de entrada en `worklog.md`\n```markdown\n---\nTask ID: sprint-<n>\nAgent: <nombre/rol del agente>\nTask: <qué se encargó>\n\nWork Log:\n- <paso concreto 1>\n- <paso concreto 2>\n\nStage Summary:\n- <resultados, decisiones y artefactos producidos>\n```\n\n## 7. Checklist de Calidad Pre-Publicación (auto-auditoría)\n\n- [ ] ¿Cada lección tiene por qué → cómo → analogía → ejemplo con números cerrados?\n- [ ] ¿Ningún apartado quedó con menos de 3 frases bajo un heading?\n- [ ] ¿Los términos nuevos aparecen con glosario ES + EN al primer uso?\n- [ ] ¿Las cifras sin fuente están etiquetadas `(ilustrativo)`/`(heurística)`/`(snapshot)`?\n- [ ] ¿El laboratorio es ejecutable con herramientas gratuitas y la misión tiene criterio de aceptación verificable?\n- [ ] ¿El módulo incluye al menos un componente de riesgo y uno de conducta?\n- [ ] ¿La trazabilidad (fuentes 003/004 + aporte propio) está declarada en el encabezado?\n- [ ] ¿Los enlaces relativos funcionan y los Mermaid son legibles?\n- [ ] ¿El disclaimer de § 8 está presente en el encabezado del módulo?\n- [ ] ¿El módulo es coherente con `analisis_cursos.md` (no reintroduce errores corregidos)?\n\n## 8. Límites Éticos y Disclaimers Obligatorios\n\n1. **No se dan señales ni recomendaciones de inversión** personalizadas; el agente enseña método, no pronostica mercados.\n2. **No se promete rentabilidad.** Frase prohibida: cualquier variante de \"vas a ganar X %\". Frase obligatoria en el encabezado de módulos operativos:\n\n> [!WARNING]\n> **Contenido educativo.** La mayoría de los traders minoristas pierde dinero (estudios de reguladores estiman entre 70 % y 90 %). El trading conlleva riesgo de pérdida total del capital. Nada en este repositorio constituye asesoría financiera.\n\n3. **Prohibido** presentar estilos/speculaciones como fórmulas de ingresos o proyectar ingresos futuros del estudiante.\n4. **Toda mención a prop firms o brokers** se hace como análisis educativo con criterios, sin afiliación ni recomendación de compra.\n5. Si el estudiante muestra señales de ludopatía (operar para recuperar, ocultar pérdidas, usar dinero de supervivencia), el agente detiene el contenido técnico y activa el protocolo de pausa + la Carta de Expectativas firmada en M1.\n\n## 9. Comandos Rápidos del Estudiante (atajos conversacionales)\n\n| El estudiante dice | El agente hace |\n|---|---|\n| \"Siguiente lección\" | Localiza el módulo en curso y dicta la siguiente sesión (protocolo § 5.3) |\n| \"Repásame\" | Repaso activo aleatorio de lo visto, priorizando errores etiquetados en el journal |\n| \"Audita mi trade\" | Protocolo § 5.4 completo |\n| \"Dame la misión\" | Muestra la misión activa con criterio de aceptación |\n| \"Examen nivel X\" | Solo si requisitos del `SYLLABUS.md` § 10 están cumplidos |\n| \"Construye módulo X\" | Protocolo de sprint § 5.2 |\n| \"Por qué…\" (concepto) | Respuesta directa + analogía + conexión con E y riesgo |\n\n## 10. Registro de Versiones\n\n| Versión | Fecha | Cambios |\n|---|---|---|\n| 1.0 | 2026-10-24 | Suite inicial: 5 roles, protocolo pedagógico, workflow de sprints, formatos, checklist de calidad, límites éticos y comandos rápidos |\n\n"},{"i":2,"g":"📚 Documentos rectores","t":"SYLLABUS · Temario rector v1.1","f":"docs/01-syllabus/SYLLABUS.md","md":"# 🎓 SYLLABUS Maestro — Programa de Formación Integral en Trading (FIT-12)\n\n> **Documento rector del repositorio.** Los agentes construyen, enseñan y auditan únicamente según este temario.\n> Cualquier cambio de estructura requiere actualizar este documento y el `Registro de Versiones`.\n\n| Campo | Detalle |\n|---|---|\n| 📋 Programa | FIT-12 — Formación Integral en Trading (12 módulos · 4 niveles) |\n| 📅 Versión | 1.1 · 24 de octubre de 2026 |\n| 🧩 Estructura | 4 niveles × 3 módulos · cada módulo = lecciones + laboratorio + misión + evaluación |\n| 🌍 Enfoque | Universal (sin contexto geográfico; fiscalidad por principios) |\n| 🗣️ Idioma | Español natural + terminología técnica en inglés (glosario al primer uso) |\n| 🔬 Fuentes | Informe [`analisis_cursos.md`](../00-analisis/analisis_cursos.md) (cursos TradingLab 003 y 004 + 9 vacíos cubiertos) |\n| 🤖 Construcción | Paso a paso por agentes IA según [`agents.md`](../../../agents.md) — un sprint por módulo |\n\n---\n\n## 1. Filosofía del Programa\n\nEste programa existe para transformar el trading de una actividad intuitiva o ludópata en un **negocio financiero cuantitativo, sistemático y repetible**. Tres principios rectores gobiernan todo el contenido:\n\n1. **La esperanza matemática es la brújula.** Todo el programa orbita la ecuación $E = (P_w \\times W) - (P_l \\times L)$. Un sistema sin esperanza positiva demostrada no se opera, sin importar qué tan \"bonito\" se vea en el gráfico.\n2. **La regla 85/15 (heurística):** la técnica es aproximadamente el 15 % del resultado; la psicología y la gestión del riesgo son el 85 %. Por eso el programa dedica un nivel completo a Gestión antes de Profesionalización, y por eso cada módulo tiene componentes de riesgo y de conducta.\n3. **Preservación antes que ganancia.** El capital es el inventario del negocio. Primero se aprende a no perder; después, a ganar; al final, a escalar.\n\n**Regla de oro pedagógica:** cada concepto se enseña con el **\"por qué\" antes que el \"cómo\"**, con analogías intuitivas y con entrenamiento deliberado (hacer, no solo mirar).\n\n## 2. Perfil de Egreso — 8 Competencias\n\nAl graduarse, el estudiante será capaz de:\n\n1. **Leer el gráfico nativamente** sin dependencia de indicadores: velas, estructura, ciclos, soportes/resistencias y liquidez institucional.\n2. **Operar la estructura** con protocolo multitemporal (top-down) y nomenclatura unificada (PA clásico ↔ SMC).\n3. **Diseñar un sistema de trading formal** con reglas explícitas y esperanza matemática calculada.\n4. **Dimensionar el riesgo con matemática exacta** (position sizing, asimetría de drawdown, riesgo de cartera correlacionada, frenos de emergencia).\n5. **Validar sistemas con backtesting científico** (N ≥ 100) y **auditar su propia operativa** con journal profesional y revisiones periódicas.\n6. **Gestionar su psicotrading** con protocolos concretos (miedos de Douglas, avaricias, pérdida ≠ error, dicotomía del control, rutina).\n7. **Navegar la industria sin ser presa**: brokers (A/B-Book), estafas (binarias, martingala, MLM, gurús), prop firms (estadísticas, reglas finas, matriz de riesgo) y fiscalidad por principios.\n8. **Operar un negocio de trading**: Plan de Trading documental, KPIs, política de capital y hoja de ruta de escalado a 12 meses.\n\n## 3. Arquitectura Curricular\n\n```mermaid\ngraph TD\n    subgraph N1[\"🧱 NIVEL 1 — FUNDAMENTOS\"]\n        M1[\"M1 · El Trading como<br/>Negocio y Ciencia\"]\n        M2[\"M2 · El Motor del Precio\"]\n        M3[\"M3 · Anatomía del Gráfico\"]\n        M4[\"M4 · Plataforma y<br/>Primera Ejecución\"]\n    end\n    subgraph N2[\"📐 NIVEL 2 — TÉCNICA\"]\n        M5[\"M5 · Estructura de Mercado<br/>y Liquidez\"]\n        M6[\"M6 · Indicadores y<br/>Confluencias (Crítico)\"]\n        M7[\"M7 · Construcción<br/>del Sistema\"]\n    end\n    subgraph N3[\"🛡️ NIVEL 3 — GESTIÓN\"]\n        M8[\"M8 · Gestión del Riesgo\"]\n        M9[\"M9 · Backtesting,<br/>Journal y Validación\"]\n        M10[\"M10 · Psicotrading<br/>Científico\"]\n    end\n    subgraph N4[\"💼 NIVEL 4 — PROFESIONALIZACIÓN\"]\n        M11[\"M11 · La Industria: Brokers,<br/>Estafas y Capital\"]\n        M12[\"M12 · Plan de Trading<br/>y Plan de Negocio\"]\n    end\n    M1 --> M2 --> M3 --> M4 --> M5 --> M6 --> M7 --> M8 --> M9 --> M10 --> M11 --> M12\n```\n\n| Nivel | Módulos | Propósito | Duración sugerida |\n|---|---|---|---|\n| 🧱 N1 Fundamentos | M1–M4 | Entender el negocio, el mercado y tocar la plataforma | 4 semanas |\n| 📐 N2 Técnica | M5–M7 | Leer estructura institucional y construir el Sistema v1.0 | 3 semanas |\n| 🛡️ N3 Gestión | M8–M10 | Proteger capital, validar estadísticamente, dominar la mente | 3 semanas |\n| 💼 N4 Profesionalización | M11–M12 | Navegar la industria y operar como negocio | 2 semanas |\n\n> **Ritmo:** 1 módulo = 1 semana a ~7-10 h/semana. El ritmo real lo fija la aprobación de la **evaluación de cada nivel**, no el calendario.\n\n## 4. Formato Estándar de Módulo\n\nTodo módulo se construye con la plantilla [`PLANTILLA_MODULO.md`](../03-recursos/plantillas/PLANTILLA_MODULO.md) y contiene:\n\n- **Encabezado de trazabilidad** (módulo, nivel, fuentes 003/004, aporte propio)\n- **6–8 lecciones** con: concepto → por qué → cómo → analogía → ejemplo gráfico → error común\n- **1 laboratorio práctico** (hacer con las manos, en TradingView/hoja de cálculo)\n- **1 misión evaluada** (entregable verificable por el agente auditor)\n- **Evaluación de graduación** con criterios objetivos\n- **Glosario del módulo** (términos nuevos + término inglés)\n\n## 5. 🧱 NIVEL 1 — FUNDAMENTOS\n\n### Módulo 1 · El Trading como Negocio y Ciencia\n> **Trazabilidad:** 003 · M1.1–1.4, M7.5 · 004 · M1.1, M10 · **Aporte propio:** mapa de 3 dimensiones (estilos × mercados × vehículos), contrato anti-ludopatía.\n\n**Objetivo:** instalar la mentalidad correcta antes de tocar un gráfico. El estudiante termina este módulo sabiendo qué es el trading, qué NO es, qué le espera y con qué estilo de vida se alinea.\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 1.1 | Qué es realmente el trading | Comercio/especulación como provisión de liquidez; diferencia con inversión; el trader como pequeño proveedor de liquidez ante el flujo institucional |\n| 1.2 | Las 5 mentiras de la industria | \"Ganarás mucho\", \"playa y libertad\", \"una hora al día\", \"rentable en 3 meses\", \"el fondeo te da el capital\" — desmontaje con la realidad de cada una |\n| 1.3 | El mapa completo: 3 dimensiones | Estilos (Position/Swing/Day/Scalp/Algo) × Mercados (Forex/Cripto/Acciones/Índices/Commodities/Bonos) × Vehículos (Spot/CFD/Futuros/Opciones/ETFs); cómo elegir tu coordenada según tu vida |\n| 1.4 | La esperanza matemática | $E = (P_w \\times W) - (P_l \\times L)$; por qué el Win Rate engaña; fractalidad autosimilar (no idéntica) y el costo del ruido en timeframes bajos *(cifras del curso fuente: ilustrativas)* |\n| 1.5 | La curva de aprendizaje real | Analogía médica (12-17 años hasta operar un corazón); las 4 fases del trader (incompetencia inconsciente → competencia inconsciente); por qué 12 meses es la prueba mínima de consistencia |\n| 1.6 | Expectativas y presupuesto | Cuánto cuesta formarse (tiempo y dinero), cuánto puede esperarse (rangos realistas), el dinero \"quemable\" y la regla de no financiar la vida con trading en formación |\n\n- 🧪 **Laboratorio:** Auditoría personal — capital disponible, horas semanales reales, tolerancia a la pérdida, coordenada tentativa (estilo × mercado) justificada.\n- 🎯 **Misión:** Redactar la **Carta de Expectativas** (1 página: qué espero, qué me comprometo a no hacer, monto quemable) + firma simbólica del *contrato anti-ludopatía*.\n- ✅ **Criterio de graduación:** Carta completa + quiz de 10 preguntas (mapa de 3 dimensiones y esperanza matemática) con ≥ 8 aciertos.\n\n### Módulo 2 · El Motor del Precio\n> **Trazabilidad:** 003 · M1.4–1.5 · 004 · M2.4 · **Aporte propio:** calendario macro aplicado y correlación intermercados (vacío 4 y 5).\n\n**Objetivo:** entender por qué el precio se mueve: subasta, liquidez, sesiones y el calendario macro que mueve todo en cadena.\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 2.1 | La mecánica de subasta | Bid vs Ask; compradores agresivos (takers) vs vendedores pasivos (makers); cómo nace cada tick |\n| 2.2 | Oferta y demanda | Por qué sube y baja el precio; el ejemplo pedagógico del mercado (caso melocotones de 003 actualizado); desequilibrio y expansión |\n| 2.3 | Liquidez | Qué es, quién la provee, por qué los grandes la necesitan y por qué cazan los stops del minorista |\n| 2.4 | Forex y sus sesiones | Pares, pips, sesiones Sydney/Tokio/Londres/NY, solapamiento Londres-NY, ciclo de volumen diario; el reloj del trader en TU huso horario |\n| 2.5 | Personalidad de cada mercado | Índices (US30/US100/US500), oro XAU/USD, cripto 24/7: volatilidad, horarios y comportamiento típico de cada uno |\n| 2.6 | Calendario macro e intermercados | NFP, IPC, FOMC: qué miden, cuándo salen, cómo operar (o no operar) alrededor; cadena causal DXY ↔ oro ↔ acciones ↔ cripto ↔ tasas |\n\n- 🧪 **Laboratorio:** Construir el **reloj de sesiones** personalizado + marcar en el calendario los 5 eventos macro de la semana entrante con su hora local.\n- 🎯 **Misión:** Observación pura: 3 sesiones de Londres-NY en vivo (sin operar) con registro de comportamiento de volumen y volatilidad.\n- ✅ **Criterio de graduación:** Misión de observación completa + quiz de sesiones/eventos macro ≥ 8/10.\n\n### Módulo 3 · Anatomía del Gráfico\n> **Trazabilidad:** 003 · M2.1–2.6 · 004 · M1.5, M3.3–3.4 · **Aporte propio:** catálogo de patrones con fiabilidad evidenciada.\n\n**Objetivo:** leer el gráfico desnudo: velas, ciclos, niveles y confirmaciones. Sin indicadores todavía — primero el precio.\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 3.1 | Velas japonesas | OHLC, cuerpo vs mechas, qué significa cada vela en contexto; fractalidad real: qué contiene una vela semanal/diaria/horaria; historia (Homma, Dojima) |\n| 3.2 | Los 4 ciclos del mercado | Acumulación → markup → distribución → markdown; teoría de Dow (impulso + pullback); etapas de Weinstein como el mismo mapa operativo |\n| 3.3 | Soportes y resistencias | Zonas de holgura, no líneas; estáticos, diagonales y dinámicos; fortaleza por número de toques; memoria de mercado |\n| 3.4 | Confirmación en 3 pasos | Ruptura → cierre fuera del nivel → confirmación; principio de polaridad (throwback/pullback); falsos rompimientos y por qué existen |\n| 3.5 | Patrones elementales | Envolventes, martillo/estrella, doji; cuñas, triángulos, doble techo/suelo — catálogo con fiabilidad real y contexto de uso |\n| 3.6 | Rangos vs tendencias | El mercado pasa ~70 % del tiempo en rango *(aproximación)*; identificar el régimen ANTES de buscar setups; el vaivén (whipsaw) como asesino silencioso |\n\n- 🧪 **Laboratorio:** Marcar ciclos y zonas S/R en 10 gráficos históricos de 5 mercados diferentes (Bar Replay).\n- 🎯 **Misión:** Bitácora de **20 niveles** identificados con su resultado posterior (respetado/roto) — primer contacto con la estadística visual.\n- ✅ **Criterio de graduación:** Bitácora de 20 niveles completa + análisis de un gráfico en vivo evaluado por el agente (rubric: ciclos, zonas, régimen).\n\n### Módulo 4 · Plataforma y Primera Ejecución\n> **Trazabilidad:** 003 · M1.6, M4.3–4.4 · 004 · M5.1–5.5 · **Aporte propio:** protocolo de demo ordenado y el stop como ley desde el día uno.\n\n**Objetivo:** dominar la herramienta y ejecutar las primeras órdenes en demo con control total de la mecánica (no de la estrategia: eso viene en N2).\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 4.1 | TradingView profesional | Cuenta, gráficos, escalas, layouts multitemporales, watchlists, alertas, Bar Replay, atajos esenciales |\n| 4.2 | Tipos de órdenes | Market, Limit, Stop, Stop-Limit, OCO: qué hace cada una, cuándo usarla, ejemplos de entrada y salida |\n| 4.3 | El costo real de operar | Spread bid-ask, slippage, comisiones, swap: cómo se calculan y cómo se comen la esperanza (con números) |\n| 4.4 | Largos y cortos | Mecánica del short selling (préstamo, recompra), borrow fees, short squeeze; asimetría \"suben en escalera, caen en ascensor\" |\n| 4.5 | Cuenta demo | Configuración realista, primera órdenes en EUR/USD y XAU/USD, lectura del panel de posiciones |\n| 4.6 | El Stop Loss como ley | Qué es, por qué toda posición lo lleva desde hoy, colocación básica por estructura (mínimo del swing / máximo del swing) |\n\n- 🧪 **Laboratorio:** Ejecutar en demo las 3 órdenes básicas + una OCO completa (entrada limit + SL + TP).\n- 🎯 **Misión:** **10 operaciones demo** registradas con captura, tipo de orden y justificación (la entrada puede ser simple; lo que se evalúa es la mecánica impecable: SL siempre puesto).\n- 📖 **Recurso:** [`La Receta de tu Primera Operación`](../03-recursos/laboratorio/receta-primera-operacion.md) — guía práctica de 12 pasos (de abrir la demo a revisar el journal) con receta maestra en EUR/USD y fichas de variación para XAU/USD e índices. Los pasos 0–2 (cuenta demo, tour de plataforma, observación) pueden anticiparse como familiarización sin operar; los pasos 3–11 se ejecutan con este módulo. El objetivo de la receta es la **primera operación procesada** (SL puesto, registrada, revisada) — no \"ganar el primer dólar\" (veto CRO: ese marco queda reservado para la Fase 4, tras M9–M12, con riesgo micro).\n- ✅ **Criterio de graduación:** 🏆 **Evaluación Nivel 1:** examen teórico integrador (30 preguntas) ≥ 80 % + misión 4 completa + checklist de ejecución sin violaciones (cero operaciones sin SL).\n\n## 6. 📐 NIVEL 2 — TÉCNICA\n\n### Módulo 5 · Estructura de Mercado y Liquidez Institucional\n> **Trazabilidad:** 004 · M2.2, M3.1, M3.5 · 003 · M3.5 (crítica SMC) · **Aporte propio:** nomenclatura unificada PA clásico ↔ SMC (vacío de coherencia D1 del informe).\n\n**Objetivo:** leer el mapa del dinero grande: tendencia, quiebres, liquidez y desequilibrios, con un solo vocabulario coherente.\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 5.1 | Tendencia y estructura | HH/HL/LH/LL; pauta de Dow como unidad (impulso + pullback);swing highs/lows relevantes vs ruido |\n| 5.2 | BOS y CHoCH | Quiebre de estructura (continuación) y cambio de carácter (reversión); confirmación por cierre; mapa unificado: lo que PA clásico llama \"ruptura de nivel\", SMC lo llama BOS — mismo fenómeno |\n| 5.3 | Liquidez operable | Pools de liquidez, equal highs/lows, stop hunts (liquidity grabs), por qué el precio \"va a buscar\" los niveles obvios |\n| 5.4 | Imbalances y FVG | El gap de 3 velas; desequilibrio como imán y como zona de entrada; mitigación |\n| 5.5 | Order blocks y zonas institucionales | Qué son, qué evidencia real existe detrás, cómo usarlos con criterio y sin misticismo (contexto de la crítica de 003) |\n| 5.6 | Top-Down Analysis | Protocolo de 3 capas: sesgo en 4H/D → zonas en 1H/15M → gatillo en 5M; confluencia como filtro de calidad |\n\n- 🧪 **Laboratorio:** Análisis top-down completo de 5 mercados (EUR/USD, GBP/USD, XAU/USD, US100, BTC/USD) con plantilla.\n- 🎯 **Misión:** **15 análisis estructurales** documentados (etiquetando BOS/CHoCH/liquidez/FVG) con el resultado posterior anotado.\n- ✅ **Criterio de graduación:** 15 análisis completos + quiz de estructura ≥ 8/10.\n\n### Módulo 6 · Indicadores y Confluencias — Catálogo Crítico\n> **Trazabilidad:** 004 · M4.1–4.5 · 003 · M3.3–3.4 · **Aporte propio:** radar de fiabilidad por evidencia (incl. etiqueta pseudocientífica para lo exógeno), regla del máximo 3 indicadores.\n\n**Objetivo:** usar indicadores como medidores (no oráculos), conocer los sistemas de canal clásicos y desarrollar el radar que separa herramienta de marketing.\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 6.1 | Filosofía del indicador | El precio es primero; el indicador mide/deriva, no predice; indicador adelantado no existe |\n| 6.2 | Medias móviles | SMA vs EMA; el sistema 20/50/200 (filtro macro + soporte dinámico + gatillo); golden/death cross y sus límites |\n| 6.3 | Volatilidad y canales | ATR (stops dinámicos y tamaño de rango), Bollinger ±2σ (squeeze, walking the bands), Donchian y las Tortugas |\n| 6.4 | Momentum y osciladores | RSI, Estocástico, MACD; sobrecompra/sobreventa en contexto de régimen; divergencias (el uso más honesto) |\n| 6.5 | Volumen y perfil | VWAP, Volume Profile horizontal, zonas de alto volumen institucional |\n| 6.6 | Fibonacci, Elliott y armónicos | Uso pragmático de retrocesos (50-61.8 % de descuento), límites de la subjetividad de Elliott, por qué los armónicos exigen disciplina estadística extrema |\n| 6.7 | Etapas de Weinstein | El filtro macro de 4 etapas: prohibido comprar en Etapa 4; integración con el mapa de ciclos del M3 |\n| 6.8 | Radar de fiabilidad | Clasificación final: herramientas con evidencia / herramientas contextuales / marketing (incl. ciclos lunares, indicadores que repintan); regla del dashboard máximo de 3 herramientas |\n\n- 🧪 **Laboratorio:** Construir el **dashboard de confluencias** personal (máx. 3 herramientas) y probarlo en 50 movimientos históricos.\n- 🎯 **Misión:** Informe comparativo: 3 herramientas evaluadas sobre el mismo mercado (acierto/fallo documentado en tabla).\n- ✅ **Criterio de graduación:** Dashboard definido con justificación + informe de misión + quiz ≥ 8/10.\n\n### Módulo 7 · Construcción del Sistema de Trading\n> **Trazabilidad:** 003 · M3.1–3.2, M3.6 · **Aporte propio:** catálogo de arquetipos de setup, estadística de rachas, criterios de robustez.\n\n**Objetivo:** salir del Nivel 2 con un **Sistema v1.0 escrito** — la primera versión formal del negocio.\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 7.1 | Filosofía vs Estrategia vs Sistema | Definiciones formales; por qué \"veo una vela en soporte\" no es un sistema |\n| 7.2 | Componentes del sistema | Mercado, temporalidad, régimen, setup, gatillo de entrada, stop, salidas, gestión post-entrada, filtros, horario |\n| 7.3 | Arquetipos de setup | Ruptura + retesteo; pullback en tendencia; reversión en rango; sweep + reversal (liquidez); ventajas y contexto óptimo de cada uno |\n| 7.4 | Esperanza aplicada | Simulación de combinaciones WR × R:B (tabla de expectativa); demostración numérica de por qué 40 % de acierto con 1:2 es negocio |\n| 7.5 | Métricas y rachas | Profit Factor (>1.5 objetivo), Max DD, curva de capital; estadística de rachas: cuántas pérdidas seguidas son *esperables* con tu WR (fórmula y tabla) |\n| 7.6 | Criterios de robustez | N mínimo, simplicidad (menos reglas = menos overfitting), no ajustar mirando el resultado (data-mining bias) |\n\n- 🧪 **Laboratorio:** Redactar el **Sistema v1.0** en 1 página (mínimo 5 reglas explícitas) usando la plantilla.\n- 🎯 **Misión:** **30 repeticiones del setup** elegido en Bar Replay con registro de resultado (R ganado/perdido).\n- ✅ **Criterio de graduación:** 🏆 **Evaluación Nivel 2:** Sistema v1.0 aprobado por el agente auditor (completitud de componentes) + 30 repeticiones documentadas + examen estructural ≥ 80 %.\n\n## 7. 🛡️ NIVEL 3 — GESTIÓN\n\n### Módulo 8 · Gestión del Riesgo — el módulo que paga las cuentas\n> **Trazabilidad:** 003 · M4.5, M6.5 · 004 · M6.1–6.5 · **Aporte propio:** riesgo de cartera y correlación de posiciones (vacío 1), protocolo de frenos en cascada.\n\n**Objetivo:** blindar el capital con matemática exacta. Al terminar, el estudiante sabe exactamente cuánto puede perder HOY y por qué es imposible perder más.\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 8.1 | Preservación de capital | El dinero como inventario del negocio; el enfoque defensivo del profesional |\n| 8.2 | Asimetría del drawdown | Tabla completa de recuperación (−10 %→+11 %, −25 %→+33 %, −50 %→+100 %); por qué el gran daño es irreversible |\n| 8.3 | La regla del 1 % y position sizing | Fórmula universal con ejemplo desglosado; por qué solo la distancia al stop está en riesgo; calculadora |\n| 8.4 | Apalancamiento real | Margen, lotaje, pip value; por qué el apalancamiento no define el riesgo (lo define el stop); micro-lotes |\n| 8.5 | Riesgo de cartera y correlación | EUR/USD + GBP/USD = doble exposición USD; riesgo agregado vs nominal; límite de exposición simultánea por correlación |\n| 8.6 | Frenos de emergencia | Daily Max Loss (−2 %), límite semanal, freno tras 2 pérdidas consecutivas, protocolo de apagado (cerrar plataforma) — en cascada y por escrito |\n\n- 🧪 **Laboratorio:** Construir la **calculadora de position sizing** (hoja de cálculo con pestaña de correlación).\n- 🎯 **Misión:** 20 escenarios de sizing resueltos a mano (mental math) verificados contra la calculadora.\n- ✅ **Criterio de graduación:** Calculadora funcional + 20 escenarios correctos (≥ 18/20) + examen de riesgo ≥ 90 % (este módulo exige nota alta).\n\n### Módulo 9 · Backtesting, Journal y Validación\n> **Trazabilidad:** 004 · M7.1–7.3 · 003 · M6.6 · **Aporte propio:** journal con campos/etiquetas de error estandarizados y protocolo de revisión semanal (vacío 3), advertencia de data-mining (D6 del informe).\n\n**Objetivo:** obtener convicción estadística sobre el Sistema v1.0 y montar el sistema de auditoría propia que sostendrá la carrera.\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 9.1 | Epistemología del backtesting | Por qué N ≥ 100; ceguera (Bar Replay sin ver el futuro); sesgos: supervivencia, data-mining, look-ahead |\n| 9.2 | Protocolo de backtesting manual | Paso a paso: cómo registrar, qué contar como setup válido, cuándo parar |\n| 9.3 | Métricas del reporte | WR, R:B medio, E, Profit Factor, Max DD, curva de capital, distribución de rachas |\n| 9.4 | Forward testing en demo | La transición honesta: backtest → demo forward (mismo sistema, datos en vivo) → y solo después, real micro |\n| 9.5 | El Journal profesional | Campos mínimos (fecha, mercado, setup, captura, R planificado, R real, etiqueta de error, estado emocional pre/post); pérdida ≠ error como etiqueta central |\n| 9.6 | Revisión semanal y mensual | Protocolo de auditoría propia: qué medir, qué preguntas hacerse, cuándo modificar el sistema (y cuándo NO) |\n\n- 🧪 **Laboratorio:** **Backtesting ciego de 100 operaciones** del Sistema v1.0 con el journal completo.\n- 🎯 **Misión:** Reporte estadístico del sistema (todas las métricas) + 3 conclusiones documentadas sobre qué ajustar en v1.1.\n- ✅ **Criterio de graduación:** 100 operaciones registradas + reporte completo + revisión semanal simulada con el agente.\n\n### Módulo 10 · Psicotrading Científico\n> **Trazabilidad:** 003 · M5.1–5.6 · 004 · M7.4–7.5, M9, M10.2–10.4 · **Aporte propio:** diario emocional estructurado y protocolo de temperatura pre-sesión.\n\n**Objetivo:** conocer la propia máquina y operar con ella: neurobiología, miedos, avaricias, sesgos y rutina de alto rendimiento.\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 10.1 | Neurobiología del riesgo | Amígdala, cortisol, secuestro emocional, corteza prefrontal; por qué el cerebro no está diseñado para el trading |\n| 10.2 | Los 5 miedos (Mark Douglas) | Equivocarse, perder, quedarse fuera, devolver ganancias, lo desconocido; los axiomas de la incertidumbre y la mentalidad probabilística |\n| 10.3 | Las 5 avaricias | FOMO, perseguir trades, sobreapalancamiento, exceso de riesgo, overtrading — señales tempranas de cada una |\n| 10.4 | Pérdida ≠ Error | La distinción que define la carrera; por qué una ganancia fuera de plan es más peligrosa que una pérdida en plan |\n| 10.5 | Sesgos cognitivos | Confirmación, exceso de confianza, anclaje, revancha (tilt); antídotos concretos por sesgo |\n| 10.6 | Estoicismo operativo | Dicotomía del control: procesos (controles) vs resultados (no controlados); serenidad ante la varianza |\n| 10.7 | Rutina y hábitos | Sueño y corteza prefrontal; ventana de ejecución (máx ~3 h en picos); fatiga decisional; inacción estratégica como posición; protocolo post-mercado |\n\n- 🧪 **Laboratorio:** Diario emocional estructurado + protocolo de **temperatura pre-sesión** (sueño, estrés, apego al resultado).\n- 🎯 **Misión:** **10 sesiones** (demo forward) con checklist emocional pre/post y etiquetado de errores.\n- ✅ **Criterio de graduación:** 🏆 **Evaluación Nivel 3:** 100 backtests validados (M9) + 10 sesiones con journal completo + entrevista socrática de graduación con el agente (casos de tilt, FOMO y pérdida en plan).\n\n## 8. 💼 NIVEL 4 — PROFESIONALIZACIÓN\n\n### Módulo 11 · La Industria: Brokers, Estafas y Capital Externo\n> **Trazabilidad:** 003 · M4.1–4.2, M6.1–6.6 · 004 · M8.1–8.5 · **Aporte propio:** due diligence universal sin marcas, reglas finas de prop firms (vacío 6), fiscalidad por principios (vacío 7), tier list como snapshot.\n\n**Objetivo:** elegir infraestructura con criterio forense y entender el negocio de quien te ofrece capital (o te vende humo).\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 11.1 | Brokers de verdad | A-Book vs B-Book; regulación estricta (FCA, BaFin, ASIC, SEC) vs offshore; los 5 pilares de selección (regulación, ejecución, costos, retiros, soporte) — criterios universales, no marcas |\n| 11.2 | Radar de estafas | Opciones binarias (esperanza negativa demostrada), bots martingala, academias MLM, gurús con lujo alquilado, indicadores que repintan; protocolo de verificación regulatoria |\n| 11.3 | Prop firms: el negocio real | Modelo de ingresos por fees; estadísticas (92 % de desafíos fracasan — CEO de FTMO; ~0.07 % éxito neto — datos filtrados MFF); riesgo regulatorio y colapsos históricos (MFF, TFT, True Forex Funds) |\n| 11.4 | Reglas finas de las prop firms | Drawdown diario (5 %) y total (10 %), *consistency rules*, restricción de noticias, límites de lotaje, políticas de copiado: lo que realmente desaprueba cuentas |\n| 11.5 | Matriz de riesgo para evaluaciones | Riesgo dinámico 0.25-0.50 % según drawdown consumido; rachas esperables vs límites de la firma; cuando la matemática dice \"todavía no\" |\n| 11.6 | Cuándo intentar una evaluación | El criterio honesto: 6-12 meses de consistencia documentada (journal + métricas); usar la prop firm para capitalizarse, no ser su producto |\n| 11.7 | Fiscalidad por principios | Capital vs actividad económica; llevar registro de todas las operaciones; declarar siempre; \"verifica tu jurisdicción con un profesional\" — sin nombres de modelos de un solo país |\n\n- 🧪 **Laboratorio:** Due diligence de 3 brokers + 3 prop firms con la matriz de criterios (misma rúbrica para todos, sin publicidad).\n- 🎯 **Misión:** Informe de elección con justificación puntual por criterio + plan de capitalización (propio vs fondeo) a 12 meses.\n- ✅ **Criterio de graduación:** Informe completo defendido en sesión socrática con el agente.\n\n### Módulo 12 · Plan de Trading y Plan de Negocio\n> **Trazabilidad:** 004 · M6.5, M10.1–10.5 · 003 · M7.3–7.4 · **Aporte propio:** plantilla de Plan de Trading de 10 secciones, KPIs de negocio, política de capital y retiros (vacíos 2 y 8).\n\n**Objetivo:** consolidar todo en dos documentos operativos y salir con el negocio montado, no con \"conocimiento\".\n\n| # | Lección | Contenido esencial |\n|---|---|---|\n| 12.1 | El Plan de Trading documental | Las 10 secciones obligatorias (identidad, coordenada, mercados, sistema, riesgo, rutina, journal, revisión, psicología, reglas de excepción); plantilla incluida |\n| 12.2 | La rutina semanal del trader | Pre-mercado (checklist), ejecución (ventana), post-mercado (journal), revisión semanal (auditoría) y mensual (métricas) |\n| 12.3 | KPIs del negocio | E, PF, Max DD, horas invertidas vs retorno, costos totales; el dashboard mensual de un solo vistazo |\n| 12.4 | Gestión patrimonial | Separación de cuentas (supervivencia vs trading), política de retiros, capital de crecimiento, qué hacer con un mes ganador (y con uno perdedor) |\n| 12.5 | Hoja de ruta a 12 meses | Fases con criterios de avance: formación → backtest → demo → real micro → evaluación prop; la regla de \"no se sube de fase sin criterio cumplido\" |\n| 12.6 | Biblioteca esencial | Elder (*Vivir del Trading*), Van Tharp, Douglas (*Trading in the Zone*), Steenbarger, Rotella — qué aporta cada uno y orden de lectura |\n| 12.7 | Graduación y mejora continua | El compromiso de proceso; cómo seguir aprendiendo sin nomadear (regla anti-719-combinaciones) |\n\n- 🧪 **Laboratorio:** Redactar el **Plan de Trading v1.0** completo (10 secciones) con el Sistema v1.1 ya validado.\n- 🎯 **Misión final:** Examen integral del programa (50 preguntas transversales) + **defensa del plan** en sesión socrática extendida con el agente.\n- ✅ **Criterio de graduación:** 🏆 **Certificación interna FIT-12:** plan aprobado + examen ≥ 85 % + journal demostrando 12 semanas de operativa documentada.\n\n---\n\n## 9. Matriz de Trazabilidad Curricular\n\n| Módulo propio | Fuentes 003/004 | Aporte propio (vacíos) | Evaluación |\n|---|---|---|---|\n| M1 Negocio y Ciencia | 003 M1, M7.5 | Mapa 3D + contrato anti-ludopatía | Quiz + Carta |\n| M2 Motor del Precio | 003 M1.4-1.5 · 004 M2.4 | Macro aplicado + intermercados (V4, V5) | Observación + quiz |\n| M3 Anatomía del Gráfico | 003 M2 · 004 M1.5, M3.3-3.4 | Catálogo con fiabilidad | Bitácora 20 niveles |\n| M4 Plataforma y Ejecución | 003 M1.6, M4.3-4.4 · 004 M5 | Stop como ley desde día 1 | 🏆 Examen N1 |\n| M5 Estructura y Liquidez | 004 M2.2, M3 · 003 M3.5 | Nomenclatura unificada | 15 análisis |\n| M6 Indicadores Críticos | 004 M4 · 003 M3.3-3.4 | Radar de evidencia | Dashboard + informe |\n| M7 Sistema de Trading | 003 M3.1-3.2 | Arquetipos + rachas + robustez | 🏆 Sistema v1.0 |\n| M8 Gestión del Riesgo | 003 M4.5, M6.5 · 004 M6 | Correlación de cartera (V1) + frenos | 🏆 Examen ≥ 90 % |\n| M9 Backtesting y Journal | 004 M7 | Journal estandarizado (V3) + data-mining | 100 backtests |\n| M10 Psicotrading | 003 M5 · 004 M7.4-7.5, M9-M10 | Diario emocional + temperatura | 🏆 Entrevista N3 |\n| M11 La Industria | 003 M4, M6 · 004 M8 | Due diligence universal + reglas finas (V6, V7) | Informe defendido |\n| M12 Plan y Negocio | 004 M6.5, M10 · 003 M7.3-7.4 | Plan 10 secciones + KPIs (V2, V8) | 🏆 Certificación FIT-12 |\n\n*(V# = vacío curricular correspondiente, véase [`analisis_cursos.md` § 7](../00-analisis/analisis_cursos.md))*\n\n## 10. Sistema de Evaluación y Graduación\n\n- **Por módulo:** misión evaluada por el agente auditor con rúbrica pública + quiz breve (≥ 80 % salvo M8 que exige ≥ 90 %).\n- **Por nivel:** evaluación integradora (🏆) que combina examen teórico, entregables acumulados y una entrevista socrática con el agente.\n- **Certificación interna FIT-12:** solo se emite con journal demostrando 12 semanas de operativa documentada + Plan de Trading aprobado + examen final ≥ 85 %.\n- **Registro de progreso:** el estado de cada módulo vive en el `README.md` del repositorio (tabla de estado) y en el `worklog.md`.\n\n## 11. Roadmap de Construcción (para los agentes)\n\n| Sprint | Entregable | Estado |\n|---|---|---|\n| Sprint 0 | Estructura del repo + `agents.md` + `SYLLABUS.md` + análisis de cursos | ✅ Hecho |\n| Sprint 1 | Módulo 1 completo (6 lecciones + lab + misión + evaluación) | ✅ Hecho |\n| Sprint 1.5 | Recurso: `La Receta de tu Primera Operación` + integración en M4 (v1.1 del temario, aprobado por el estudiante) | ✅ Hecho |\n| Sprint 2 | Módulo 2 completo + plantilla de journal v0 (CSV) | ✅ Hecho |\n| Sprint 3 | Módulo 3 completo + glosario maestro v1 | ✅ Hecho |\n| Sprint 4 | Módulo 4 + examen Nivel 1 (30 preguntas + entrevista socrática + checklist) | ✅ Hecho |\n| … | Un sprint por módulo, según avance real del estudiante | 🔜 Sprint 5 (M5) |\n\n## 12. Glosario Vivo\n\nEl glosario maestro se construye incrementalmente en [`docs/03-recursos/glosario.md`](../03-recursos/glosario.md) — cada módulo añade sus términos al finalizar el sprint. Regla: primera aparición de un término técnico = español + término inglés en cursiva + definición breve al pie del módulo.\n\n## 13. Registro de Versiones\n\n| Versión | Fecha | Cambios |\n|---|---|---|\n| 1.0 | 2026-10-24 | Syllabus inicial: 4 niveles, 12 módulos, matriz de trazabilidad, sistema de evaluación y roadmap de sprints |\n| 1.1 | 2026-10-24 | Temario aprobado por el estudiante · Integrado el recurso transversal \"La Receta de tu Primera Operación\" en M4 (con veto CRO al marco \"primer dólar\": objetivo = primera operación procesada en demo) |\n| 1.2 | 2026-10-24 | N1 completo: M3 y M4 publicados (Sprints 2-4 ejecutados); examen integrador N1 creado en docs/03-recursos/evaluaciones/; glosario maestro a 111 entradas |\n\n"},{"i":3,"g":"📚 Documentos rectores","t":"Análisis de cursos (ATR-001)","f":"docs/00-analisis/analisis_cursos.md","md":"# 🔬 Análisis Forense de los Cursos Base — Informe ATR-001\n\n> **Documento de referencia permanente del repositorio.**\n> Todo módulo construido por los agentes debe ser coherente con las conclusiones de este informe.\n\n| Campo | Detalle |\n|---|---|\n| 📋 Informe | ATR-001 — Análisis comparativo de cursos base |\n| 📅 Fecha | 24 de octubre de 2026 |\n| 🔎 Objetos analizados | `003_trading_completo_2026_guia_completa.html` · `004_la_industria_del_trading_guia_completa.html` |\n| 🎥 Fuentes primarias | [Curso Completo de Trading 2026 — Álex Ruiz (7h 39m)](https://www.youtube.com/watch?v=TdEbkTk40qQ) · [La Industria del Trading me va a odiar por este curso gratis — Sáenz & Ruiz (11h 55m)](https://www.youtube.com/watch?v=lW9eGp-yOe8) |\n| 🧭 Método | Lectura estructural completa · verificación conceptual contra teoría financiera estándar · auditoría pedagógica · detección de vacíos curriculares |\n| ⚖️ Veredicto global | 003: **8/10** · 004: **8.5/10** — aptos como base curricular **con correcciones obligatorias** |\n\n---\n\n## 1. Objeto y Método\n\nEste informe audita los dos compendios de estudio que sirven como material fuente del programa. El análisis se realizó en tres capas complementarias. Primero, una **verificación técnica** de cada afirmación cuantitativa y operativa contra la teoría financiera estándar (esperanza matemática, mecánica de órdenes, estadística de prop firms). Segundo, una **auditoría pedagógica** del orden, la profundidad y la progresión curricular de ambos programas. Tercero, una **detección de vacíos**, identificando los temas ausentes en ambos cursos que nuestro programa debe incorporar para ser completo. Las conclusiones alimentan directamente las decisiones de diseño documentadas en [`SYLLABUS.md`](../01-syllabus/SYLLABUS.md).\n\n**Nota de contexto importante:** ambos compendios son guías de estudio derivadas de cursos gratuitos de YouTube del canal TradingLab, ya estructuradas con formato de cátedra universitaria (perfil de egreso, matriz de trazabilidad curricular, glosario indexado). Ese formato editorial es, en sí mismo, uno de los mejores insumos del análisis y se adopta íntegramente para este repositorio. Los compendios no fueron escritos por los instructores: son material derivado, por lo que este informe audita el **contenido pedagógico**, no la producción audiovisual.\n\n## 2. Ficha Técnica Comparativa\n\n| Campo | Curso 003 | Curso 004 |\n|---|---|---|\n| **Título** | Curso Completo de Trading 2026 (Actualizado) | La Industria del Trading me va a odiar por este curso gratis |\n| **Instructores** | Álex Ruiz | Adrián Sáenz & Álex Ruiz |\n| **Duración del video** | 7 h 39 min | 11 h 55 min |\n| **Módulos teóricos** | 7 (con submódulos 1.1–7.5) | 10 (con submódulos 1.1–10.5) |\n| **Sesiones prácticas** | 7 guías \"Día\" | 10 guías \"Día\" |\n| **Área más fuerte** | Cuantificación, Psicotrading, Prop Firms | Técnica de canales/volatilidad, Auditoría de estafas, Rutina profesional |\n| **Área más débil** | Fiscalidad 100 % española | Densidad excesiva; incoherencia con 003 sobre SMC/ICT |\n| **Sesgo estilístico** | Recomienda Day Trading como \"equilibrio perfecto\" | Top-Down multitemporal + triple EMA 20/50/200 |\n| **Pedagogía** | Expositiva, con analogías médicas | Expositiva, con laboratorios y rutinas |\n\n## 3. Análisis del Curso 003 — \"Curso Completo de Trading 2026\"\n\n### 3.1 ✅ Fortalezas verificadas\n\n1. **Rigor cuantitativo real.** La fórmula de esperanza matemática $E = (P_w \\times W) - (P_l \\times L)$ está correctamente planteada, y el Módulo III demuestra numéricamente la idea más importante de todo el trading: el *Win Rate* es secundario frente al ratio Riesgo:Beneficio. El ejemplo comparativo (60 % de acierto con ratio moderado supera a 30 % de acierto con premio grande) es pedagógicamente excelente y matemáticamente correcto.\n2. **Fórmula de *Position Sizing* correcta.** `Tamaño = (Capital × Riesgo) / |Entrada − Stop|` es la ecuación universal de la industria, presentada con la distinción crucial entre inversión (todo el capital en riesgo) y trading (solo la distancia al stop en riesgo).\n3. **Honestidad de industria excepcional.** Las estadísticas de prop firms citadas (92 % de desafíos fracasan según el CEO de FTMO; ~0.07 % de éxito neto end-to-end en los datos filtrados de MyForexFunds) son cifras reales reportadas por la industria y coherentes con lo que documenta la comunidad. Desmontar las \"5 grandes mentiras del marketing\" (playa, una hora al día, rentable en 3 meses) es el mejor antídoto contra el humo que existe en español gratis.\n4. **Psicotrading con base científica.** Neurobiología correcta (amígdala, cortisol, secuestro emocional), los 5 miedos de Mark Douglas correctamente atribuidos, las 6 cualidades de Steenbarger, y — joya del curso — la distinción **pérdida ≠ error** (una pérdida ejecutada bajo reglas es un trade perfecto; una ganancia fuera de plan es un error letal).\n5. **Crítica madura a las modas.** La deconstrucción de SMC/ICT como re-etiquetado de la acción del precio clásica es una opinión defendible y valiosa que enseña al estudiante a no pagar por nombres nuevos de conceptos viejos.\n6. **Formato editorial de cátedra.** Perfil de egreso, matriz de trazabilidad, glosario indexado y bibliografía real (Elder, Van Tharp, Douglas, Steenbarger, Rotella) — nivel universitario genuino.\n\n### 3.2 ⚠️ Debilidades y errores detectados\n\n| # | Hallazgo | Severidad | Detalle y corrección aplicada en nuestro programa |\n|---|---|---|---|\n| D1 | **Fiscalidad 100 % española** (IRPF 19–28 %, modelos 130/349/720/D6) | 🔴 Alta para no residentes en España | Casi media hora de contenido inaplicable fuera de España. Nuestro Módulo 11.7 enseña **principios fiscales universales** (trading propio vs actividad, registro de operaciones, obligación de declarar) con la consigna \"verifica tu jurisdicción\". |\n| D2 | **Brokers solo europeos** (Trade Republic, IBKR, XTB, DeGiro) | 🔴 Alta para LatAm | Varios no aceptan clientes de LatAm o son imprácticos. Nuestro programa enseña los **criterios de selección** (regulación, ejecución, costos, retiros) en lugar de marcas concretas, más un laboratorio de *due diligence* aplicable a cualquier país. |\n| D3 | **\"Day Trading = punto de equilibrio perfecto\"** presentado como recomendación pedagógica definitiva | 🟡 Media | Es una **opinión de estilo de vida**, no un hecho. Para un principiante con empleo u obligaciones, Swing suele producir mejor curva de aprendizaje (menos decisiones, menos comisiones). Nuestro Módulo 1 presenta el mapa completo de estilos y deja la elección al perfil del estudiante. |\n| D4 | **Cifras ilustrativas sin fuente** (frecuencia de patrones \"15/año vs 30/mes\", simulación de 51 % anual) | 🟡 Media | Son pedagógicamente válidas pero estadísticamente no citables. Regla del repo: toda cifra no verificable se etiqueta como *ilustrativa*. |\n| D5 | **\"Ciclos lunares\" listados en el catálogo de estrategias** sin etiqueta pseudocientífica | 🟡 Media | Está en el Módulo III como técnica clásica. Nuestro catálogo crítico (Módulo 6.8) rankea cada herramienta por **evidencia**, y lo lunar va al sótano, junto con astrología financiera. |\n| D6 | **Tier List de prop firms congelada en el tiempo** | 🟡 Media | La propia historia que el curso documenta (colapsos de MyForexFunds, True Forex Funds, The Funded Trader) demuestra que una tier list envejece en meses. Nuestro programa enseña la **matriz de evaluación** (antigüedad, regulación, historial de pagos, reglas) y marca toda tier list como *snapshot*. |\n| D7 | Fractalidad descrita como \"exactamente igual\" entre timeframes | 🟢 Baja | Es *autosimilar*, no idéntica: en timeframes bajos hay más ruido y el spread se come más margen. Corregido en Módulo 1.4 y 3.1. |\n\n### 3.3 Veredicto 003\n\n**8/10 — Aprobar con correcciones.** Es un curso honesto, cuantitativo y pedagógicamente sólido, con el mejor módulo de psicotrading y de prop firms disponibles en español gratuito. Sus debilidades no son conceptuales sino de **contexto geográfico** (fiscalidad y brokers españoles) y de **opiniones presentadas como hechos** (D3, D5). Es la base principal de nuestros Niveles 1 y 3.\n\n## 4. Análisis del Curso 004 — \"La Industria del Trading me va a odiar\"\n\n### 4.1 ✅ Fortalezas verificadas\n\n1. **Cobertura técnica superior.** Es el único curso gratuito en español que integra con rigor *Bandas de Bollinger* (±2σ y el fenómeno de *walking the bands* correctamente explicado), *Canales de Donchian* con la historia real de las Tortugas (Richard Dennis y William Eckhardt), las **4 Etapas de Stan Weinstein** (el mejor filtro anticontratendencia que existe) y el uso profesional del **ATR** para stops dinámicos.\n2. **El mejor módulo anti-estafa en español.** El Módulo VIII es oro puro: A-Book vs B-Book, demostración de la esperanza negativa de las opciones binarias ($E \\approx -0.075$ con payout 85 % — el curso dice −0.10, mismo signo, misma conclusión), muerte por martingala, academias MLM y el fraude de los indicadores que *repintan*. Todo verificado y correcto.\n3. **Matemática del riesgo impecable.** La asimetría del drawdown está correctamente demostrada (−50 % exige +100 % para volver al equilibrio), el *Daily Max Loss* de −2 % y el freno tras dos pérdidas consecutivas son protocolos profesionales reales.\n4. **Operativa completa y correcta.** Taxonomía de órdenes (Market/Limit/Stop/Stop-Limit/OCO), mecánica del short selling con *borrow fees* y *short squeeze*, bid/ask, *slippage*, maker vs taker — todo verificado sin errores.\n5. **Rutina y hábitos como módulo propio.** Sueño, ritmos circadianos, ventana de ejecución de 3 horas, fatiga decisional, **inacción estratégica** (\"estar fuera del mercado es una posición\") y protocolo post-mercado. Ningún otro curso gratuito da esto.\n6. **Arquitectura pedagógica del cierre.** Las 4 fases del trader (incompetencia inconsciente → competencia inconsciente), la regla 85/15 y la filosofía estoica de la dicotomía del control constituyen un marco mental profesional.\n\n### 4.2 ⚠️ Debilidades y errores detectados\n\n| # | Hallazgo | Severidad | Detalle y corrección aplicada en nuestro programa |\n|---|---|---|---|\n| D1 | **Incoherencia entre cátedras sobre SMC/ICT** | 🟡 Media | El 003 deconstruye SMC como marketing; el 004 adopta su nomenclatura (CHoCH, liquidity grabs, imbalances) sin crítica. Un estudiante de ambos queda desorientado. Nuestro programa **unifica nomenclatura** (Módulo 5): enseñamos estructura y liquidez como fenómeno, y presentamos PA clásico vs SMC como dos vocabularios del mismo objeto. |\n| D2 | **Scalping de cripto y algo trading para principiantes** con advertencias insuficientes | 🟡 Media | El submódulo 2.5 presenta taker fees y curve fitting (bien), pero ubicar scalping cripto en un curso para principiantes es como enseñar frenadas en derrape en la autoescuela. En nuestro syllabus, scalping y algorítmico quedan explícitamente fuera del alcance básico, con la razón documentada. |\n| D3 | **Regla 85/15 presentada como medición** cuando es heurística | 🟢 Baja | \"La estrategia es el 15 % y la psicología + riesgo el 85 %\" es una metáfora pedagógica útil, no un dato medido. Se conserva como principio, etiquetada como heurística. |\n| D4 | **Misma localización española/europea** en broker y fiscalidad (módulos compartidos con la cátedra) | 🔴 Alta para no residentes | Igual que en 003. Misma corrección: criterios universales + laboratorio de due diligence. |\n| D5 | **Densidad inadecuada**: 10 módulos × solo 5 submódulos, ~72 min de video por módulo | 🟡 Media | El ritmo es de \"bootcamp\" y no da tiempo a consolidar. Nuestro programa reparte contenido equivalente en 12 módulos con laboratorios y misiones obligatorias entre lecciones. |\n| D6 | Backtesting \"N ≥ 100\" sin advertencia suficiente de **overfitting / data-mining** | 🟢 Baja | Menciona curve fitting en algoritmos pero no el sesgo de ajustar reglas mirando el resultado del backtest manual. Corregido en Módulo 9.1. |\n\n### 4.3 Veredicto 004\n\n**8.5/10 — Aprobar con correcciones.** Más completo, más honesto y más profesional que el 003 en técnica y en protección del estudiante. Sus defectos son de **densidad** y de **coherencia interna** con la cátedra hermana. Es la base principal de nuestros Niveles 2 y 4.\n\n---\n\n## 5. Comparativa Cruzada por Áreas de Conocimiento\n\nEscala de cobertura: **0** = ausente · **10** = completo y riguroso.\n\n| Área | 003 | 004 | Mejor fuente | Nota |\n|---|---:|---:|---|---|\n| Fundamentos y filosofía del trading | 8 | 8 | Empate | Ambos desmontan mitos de industria |\n| Acción del precio y estructura | 7 | 8 | 004 | 004 añade CHoCH, institucional y fractalidad aplicada |\n| Velas japonesas y patrones | 7 | 7 | Empate | Ambos correctos, catálogo clásico |\n| Indicadores y canales (Bollinger/Donchian/ATR/Weinstein) | 4 | 9 | **004** | 003 apenas los enumera |\n| Fibonacci / Elliott / armónicos | 5 | 6 | 004 | Ambos sin crítica de subjetividad suficiente |\n| Sistemas de trading y esperanza matemática | 9 | 8 | **003** | 003 demuestra numéricamente la superioridad del R:B |\n| Órdenes y ejecución (market/limit/stop/OCO) | 8 | 9 | **004** | 004 añade OCO, maker/taker, borrow fees |\n| Gestión del riesgo y position sizing | 8 | 9 | **004** | 004 añade asimetría de drawdown y freno diario |\n| Backtesting y métricas | 6 | 8 | **004** | 003 lo menciona, 004 lo protocoliza (N ≥ 100) |\n| Psicotrading | 9 | 8 | **003** | Douglas + Steenbarger + neurobiología más completos |\n| Rutina y hábitos del trader | 4 | 9 | **004** | Módulo IX casi completo |\n| Brokers y selección | 7 | 7 | Empate | Ambos con sesgo Europa/España |\n| Estafas de la industria | 5 | 9 | **004** | Módulo VIII forense |\n| Prop firms | 9 | 5 | **003** | 003 tiene estadísticas, tier list y matriz de drawdown |\n| Fiscalidad | 8 (España) | 4 (España) | 003 | Solo útil en España; aquí se universaliza |\n| Biblioteca y metodología de estudio | 9 | 6 | **003** | 7 libros analizados + pedagogía médica |\n\n## 6. Insumos Adoptados para el Programa Propio\n\n| Insumo | Origen | Destino en nuestro syllabus |\n|---|---|---|\n| Formato de cátedra (perfil de egreso, matriz de trazabilidad, glosario) | Ambos | Estructura de `SYLLABUS.md` |\n| Epistemología del trading + 5 mentiras del marketing | 003 · M1.1, M1.3 | Módulo 1.1–1.2 |\n| Mapa de estilos × mercados × vehículos | 003 · M1.1 (ampliado) | Módulo 1.3 |\n| Sesiones de Forex y ciclo de volumen | 003 · M1.5 / 004 · M2.4 | Módulo 2.4 |\n| Ciclos de mercado (acumulación → markdown) y Dow | Ambos | Módulo 3.2 |\n| Confirmación en 3 pasos + polaridad | 003 · M2.5 | Módulo 3.4 |\n| TradingView + órdenes + spread | 003 · M1.6, M4.3–4.4 / 004 · M5 | Módulo 4 |\n| BOS/CHoCH, liquidez, imbalances, top-down | 004 · M2.2, M3 | Módulo 5 |\n| Catálogo crítico de indicadores y canales | 004 · M4 / 003 · M3.3–3.4 | Módulo 6 |\n| Sistema de trading formal + esperanza | 003 · M3.1–3.2 | Módulo 7 |\n| Position sizing + asimetría drawdown + frenos | Ambos | Módulo 8 |\n| Backtesting N ≥ 100 + métricas | 004 · M7 | Módulo 9 |\n| Psicotrading completo (Douglas, Steenbarger, neurobiología) | 003 · M5 / 004 · M7.4–7.5 | Módulo 10 |\n| Rutina, inacción estratégica, estoicismo, 85/15 | 004 · M9–M10 | Módulos 10.6–10.7 y 12.2 |\n| Brokers A/B-Book + estafas | 004 · M8 / 003 · M4.1 | Módulo 11.1–11.2 |\n| Prop firms: estadísticas + matriz de drawdown + criterio | 003 · M6 | Módulo 11.3–11.6 |\n| Biblioteca esencial | 003 · M7.3 | Módulo 12.6 |\n\n## 7. Vacíos Curriculares — Lo que NINGÚN curso cubre y nuestro programa sí\n\nEstos nueve vacíos justifican la existencia de un programa propio además de los dos cursos:\n\n1. **Riesgo de cartera y correlación entre posiciones.** Ninguno explica que operar EUR/USD largo + GBP/USD corto (o largo en ambos) es una **doble exposición al dólar** que multiplica el riesgo real por encima del 1 % nominal. Crítico y ausente → Módulo 8.5.\n2. **Plan de Trading como documento formal completo.** 004 lo menciona (M6.5) sin plantilla. Nuestro Módulo 12.1 entrega la plantilla de 10 secciones → la culminación del programa.\n3. **Journal sistemático con protocolo de revisión semanal/mensual.** Ambos mandan llevar bitácora; ninguno define **campos, etiquetas de error ni protocolo de auditoría propia** → Módulo 9.5–9.6.\n4. **Calendario macro aplicado.** Mencionan NFP/IPC/FOMC pero nadie enseña *cómo se opera alrededor* de esos eventos (ventanas de prohibición, volatilidad pre/post, restricciones de noticias de las prop firms) → Módulos 2.6 y 11.4.\n5. **Correlación intermercados.** DXY ↔ oro ↔ acciones ↔ cripto ↔ tasas: la cadena causal que mueve todo. Ausente en ambos → Módulo 2.6.\n6. **Reglas finas de prop firms.** *Consistency rules*, restricción de copiado, límites de lotaje, políticas de noticias — lo que realmente desaprueba cuentas → Módulo 11.4.\n7. **Fiscalidad universal.** Ambos asumen España. Nuestro enfoque: principios + verificación jurisdiccional → Módulo 11.7.\n8. **El trading como negocio medible.** KPIs operativos (E, PF, DD, horas/ROI), separación de capital, política de retiros, contabilidad simple → Módulo 12.3–12.4.\n9. **Pedagogía activa.** Ambos cursos son expositivos (mirar video). Nuestro programa es de **entrenamiento deliberado**: cada lección tiene laboratorio, cada módulo tiene misión evaluada y el agente tutor aplica método socrático → definido en `agents.md`.\n\n## 8. Correcciones Técnicas Menores (erratas y precisiones)\n\n| Afirmación de origen | Precisión aplicada |\n|---|---|\n| \"Spread de EUR/USD de 1–2 pips\" | Hoy en brokers ECN/RAW ronda 0.1–1 pip + comisión; el orden de magnitud del curso es conservador pero no falso. Se actualiza la cifra. |\n| \"Esperanza de binarias E = −0.10\" | Con payout de 85 %: E = 0.85·p − (1−p) = 1.85p − 1 → E(50 %) = −0.075. Con payout 80 %: −0.10. El signo y la conclusión son correctos. |\n| \"Una vela mensual se compone de 22 velas diarias en Forex / 30 en cripto\" | Correcto (días hábiles vs 24/7). Buen detalle a conservar. |\n| \"Mercado pasa el 70 % del tiempo lateral\" | Cifra razonable coherente con la literatura de rangos; se conserva etiquetada como aproximación. |\n| \"Profit Factor > 1.5\" como objetivo | Estándar razonable para sistemas discretos. Se conserva. |\n| Weinsein (4 etapas) vs ciclos 003 (acumulación/markup/distribución/markdown) | Son el mismo mapa con dos nomenclaturas. El programa unifica: ciclos de mercado como concepto, etapas de Weinstein como herramienta de filtrado. |\n\n## 9. Decisiones de Diseño Derivadas\n\n1. **Arquitectura de 4 niveles × 12 módulos** (Fundamentos → Técnica → Gestión → Profesionalización), fusionando la progresión de ambos cursos y redistribuyendo la densidad excesiva del 004.\n2. **Enfoque universal:** criterios y principios en lugar de marcas locales; fiscalidad universal; laboratorios de due diligence replicables desde cualquier país.\n3. **Idioma:** español natural con terminología técnica en inglés (*Stop Loss*, *Pullback*, BOS, *Win Rate*), glosario al primer uso de cada término.\n4. **Pedagogía activa:** formato estándar de módulo = lecciones + laboratorio + misión + evaluación con criterios de graduación.\n5. **Trazabilidad total:** cada módulo del syllabus declara sus fuentes (003/004) y su aporte propio (vacíos del punto 7).\n6. **Regla de cifras:** toda cifra sin fuente citable se etiqueta *ilustrativa*; toda tier list se etiqueta *snapshot con fecha*.\n\n## 10. Registro de Versiones\n\n| Versión | Fecha | Cambios |\n|---|---|---|\n| 1.0 | 2026-10-24 | Informe inicial: análisis completo de ambos cursos, comparativa, insumos, vacíos y decisiones de diseño |\n\n"},{"i":4,"g":"📚 Documentos rectores","t":"📜 La Receta de tu Primera Operación","f":"docs/03-recursos/laboratorio/receta-primera-operacion.md","md":"# 🔬 La Receta de tu Primera Operación — Laboratorio de Ejecución\n\n> [!WARNING]\n> **Contenido educativo.** La mayoría de los traders minoristas pierde dinero (estudios de reguladores estiman entre 70 % y 90 %). Nada aquí constituye asesoría financiera ni recomendación de bróker.\n\n| Campo | Detalle |\n|---|---|\n| 🧩 Tipo | Recurso transversal del programa FIT-12 (referenciado por el [Módulo 4](../../01-syllabus/SYLLABUS.md)) |\n| 🎯 Objetivo | Tu **primera operación PROCESADA** de principio a fin: analizada → dimensionada → SL puesto antes de entrar → ejecutada → registrada → revisada |\n| ❌ Lo que NO es | Una promesa de ganancia. Tampoco una autorización para operar con dinero real antes de la Fase 4 del programa |\n| 🔗 Requisitos | Haber aprobado M1 (Carta de Expectativas + quiz ≥ 8/10). Los pasos 3–11 requieren M2–M3 y se ejecutan con M4 |\n\n---\n\n## ⚠️ Cuándo usar cada parte de esta receta\n\nEsta receta se lee completa HOY (ver el camino entero reduce la ansiedad), pero se **ejecuta por etapas**:\n\n| Etapa | Pasos | Cuándo | Riesgo |\n|---|---|---|---|\n| 🟢 Familiarización | 0, 1, 2 | Ya — esta semana si quieres | Cero: no se envía ninguna orden |\n| 🟡 Ejecución asistida | 3 – 11 | Con el Módulo 4 (Plataforma y Primera Ejecución) | Cero real: todo en **cuenta demo** |\n| 🔴 Dinero real | — | Fase 4 del programa: tras M9 (*forward testing* en demo) y M12 (Plan de Trading), con riesgo micro 0,25–0,5 % | El que tú decidas no correr todavía |\n\n**Por qué esta restricción:** una receta que termina en \"y ahora gana tu primer dólar\" es la puerta de entrada del 70-90 % que pierde — convierte la emoción del primer resultado en el criterio para arriesgar capital. El criterio de este programa es otro: **el primer hito es una operación procesada, no un dólar**. Los dólares llegan después, cuando la estadística — no la ilusión — los autoriza.\n\n### Los 3 principios previos (no negociables)\n\n1. **El Stop Loss se coloca ANTES de la entrada. Siempre. Sin excepción.** Una posición sin SL no es una operación: es una apuesta abierta a la ruina.\n2. **El tamaño se calcula, nunca se adivina.** El riesgo por operación se define en porcentaje primero (1 % en demo) y el lote sale de la fórmula, no de la intuición.\n3. **Si no está en el journal, no ocurrió.** Una operación sin registro no genera dato; sin dato no hay estadística; sin estadística no hay negocio.\n\n### El mapa visual de la receta\n\n```mermaid\nflowchart TD\n    A[\"Paso 0 · Cuenta demo creada<br/>saldo realista · apalancamiento 1:30\"] --> B[\"Paso 1 · Tour de la plataforma<br/>5 zonas, sin enviar órdenes\"]\n    B --> C[\"Paso 2 · Observar 2 sesiones Londres–NY<br/>cero órdenes — solo clima\"]\n    C --> D{\"Paso 3 · Análisis mínima<br/>¿hay setup hoy?\"}\n    D -- \"No hay setup\" --> NO[\"📋 Resultado válido:<br/>documentar la decisión y esperar<br/>el día siguiente\"]\n    D -- \"Sí hay setup\" --> E[\"Paso 4 · Setup por escrito<br/>entrada · invalidación SL · objetivo\"]\n    E --> F[\"Paso 5 · Lote calculado con la fórmula<br/>riesgo 1 % · redondeo hacia abajo\"]\n    F --> G[\"Paso 6 · Orden OCO<br/>SL y TP colocados ANTES de entrar\"]\n    G --> H[\"Paso 7 · Ejecutar y verificar el panel<br/>entrada + SL + TP visibles\"]\n    H --> I[\"Paso 8 · Gestionar = NO TOCAR NADA<br/>ni SL, ni TP, ni agregar\"]\n    I --> J[\"Paso 9 · Cierre: TP · SL · regla de tiempo<br/>los tres finales son correctos\"]\n    J --> K[\"Paso 10 · Journal completo<br/>campos + captura + emoción pre/post\"]\n    K --> L{\"Paso 11 · Checklist<br/>¿6 de 6 procesada?\"}\n    L -- \"Sí\" --> OK[\"✅ Victoria de proceso<br/>da igual TP o SL\"]\n    L -- \"No\" --> FIX[\"🔍 Identificar el paso fallido<br/>y corregirlo en la próxima receta\"]\n    FIX --> C\n    OK --> M[\"🎯 Objetivo: 10 recetas procesadas<br/>= misión del Módulo 4\"]\n```\n\n---\n\n## Parte 0 · Elegir el terreno: criterios de bróker (sin marcas)\n\nEl programa no recomienda marcas (el radar de estafas del Módulo 11 te enseñará a auditarlas tú mismo). Te da los **criterios de due diligence** que debe cumplir cualquier bróker que abras para esta receta:\n\n| Criterio | Qué verificar | Señal de alarma |\n|---|---|---|\n| 🛡️ Regulación | Entidad supervisora reconocida (por principios: reguladores de jurisdicciones con fondo de compensación y segregación de fondos del cliente) | \"Regulado en una isla\" sin supervisor real; solo licencias off-shore decorativas |\n| 💰 Cuenta demo | Demo gratuita e ilimitada o de duración suficiente (≥ 3 meses), con datos de mercado reales | Demo que expira en 14 días o con precios \"mejorados\" |\n| 📊 Costos declarados | Spread y comisión publicados y estables; swap visible en la especificación del contrato | Spreads \"desde 0,0 pips\" sin letra pequeña, comisiones ocultas |\n| 🏦 Segregación de fondos | El dinero del cliente en cuentas separadas del capital de la empresa | Mezcla de fondos con el balance del bróker |\n| 🧾 Retiros | Proceso documentado, plazos declarados | Retiros \"en 1 minuto\" prometidos con condiciones ilegibles |\n\n> **Nota de contexto universal:** la disponibilidad de brókeres y vehículos varía por país y jurisdicción. Verifica la regulación local aplicable a ti antes de abrir cualquier cuenta — con dinero real. Para la demo de esta receta, cualquier bróker regulado con MT4/MT5 o plataforma equivalente sirve.\n\n---\n\n## 🍳 La receta maestra — EUR/USD en la sesión de Londres–Nueva York\n\n**¿Por qué EUR/USD como maestra?** Es el par más líquido del mundo: spread mínimo, movimientos limpios, horario predecible y abundancia de información. Para aprender mecánica quieres la carretera más lisa, no la más emocionante. El oro y los índices llegan después, como variaciones.\n\n**¿Por qué la sesión Londres–NY?** Concentra el mayor volumen del día en forex: el solapamiento (≈ 12:00–16:00 UTC) es donde el EUR/USD se mueve con la relación señal/ruido más favorable y los spreads más ajustados. Fuera de esas horas, el spread sube y el mercado se arrastra: pagarías más peaje para recorrer menos camino.\n\n> ⏰ **Huso horario de referencia:** todas las horas de esta receta se dan en UTC y se convierten a Bolivia (UTC-4, sin horario de verano). Ojo: durante el horario de verano del norte, Londres y Nueva York se desfasan una hora — verifica siempre en el calendario económico antes de una sesión importante.\n\n---\n\n### Paso 0 · Abrir la cuenta demo (15 min)\n\n1. Elige un bróker que cumpla la tabla de criterios de la Parte 0.\n2. Solicita la cuenta **demo** (práctica/simulada). No deposites nada en esta etapa.\n3. Configúrala con **realismo deliberado**:\n   - **Saldo demo = el capital real que prevés usar** (o 2 000 si aún no lo sabes). Un demo de 100 000 enseña vicios de tamaño que el real no perdona.\n   - **Apalancamiento realista** (1:30 — el estándar regulado europeo — o el máximo que usarías de verdad, nunca 1:500).\n   - Tipo de cuenta estándar (no ECN con cero comisiones si tu real tendría comisiones: el objetivo es ensayar el negocio real, no el más cómodo).\n4. Anota en el journal: `Cuenta demo creada — saldo X — apalancamiento Y — fecha`.\n\n**Verificación del paso:** puedes iniciar sesión en la plataforma y ver tu saldo simulado.\n\n### Paso 1 · Tour de la plataforma (30–45 min)\n\nLocaliza y prueba (sin enviar órdenes) las 5 zonas esenciales:\n\n| Zona | Qué es | Qué probar |\n|---|---|---|\n| 1. Cotizaciones (*watchlist*) | Lista de instrumentos con precio bid/ask en vivo | Añadir EUR/USD, XAU/USD, US30 |\n| 2. Gráfico | El precio dibujado en velas | Cambiar temporalidad: D1, H4, H1; zoom; tipo de vela |\n| 3. Ventana de orden | Donde se envían market/limit/stop, lote, SL, TP | **NO enviar nada**: solo abrir, leer cada campo, cerrar |\n| 4. Panel de posiciones | Operaciones abiertas: P/L flotante, SL/TP activos | Verificar que aparece tras (en el futuro) cada orden |\n| 5. Historial | Operaciones cerradas con resultado | Familiarizarte: aquí vivirá tu estadística |\n\n**Verificación del paso:** puedes explicar en voz alta qué hace cada zona sin mirar esta tabla.\n\n### Paso 2 · Elegir activo y sesión (observación, mínimo 2 sesiones)\n\n1. Abre el gráfico de **EUR/USD** en H1.\n2. Observa en vivo una sesión de solapamiento Londre
